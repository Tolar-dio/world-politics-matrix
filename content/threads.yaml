      Israel's 27 October election left Netanyahu's bloc short of a majority, and President Herzog gave the mandate to
      former army chief Gadi Eisenkot. Whoever governs inherits a fragile Gaza ceasefire with more than 1,500 killed
      since it began, Israeli troops deep in south Lebanon, a possible new strike on Iran, and Trump's statement that
      US military aid will end this year.
    watch: >-
