  - id: sahel-new-order
    title: "The Sahel's new order"
    dek: "Military juntas, Russia's Africa Corps and jihadist blockades are remaking the Sahel, and the violence is moving toward the coast."
    status: grinding
    why: >-
      Mali, Burkina Faso and Niger expelled French and US forces, left ECOWAS and turned to Russia. Jihadists from
      JNIM and Islamic State now besiege towns and roads across all three, a coup attempt in Niger was put down with
      Russian help, and Algeria has broken with its old caution by sending troops into Niger. Attacks are spreading
      into Benin, Togo and Nigeria.
    watch: >-
      JNIM's blockades around Bamako, Algeria's deployment in Niger, and attacks in northern Benin and Togo.
    links:
      - {from: RUS, to: MLI, label: "Africa Corps fights alongside Mali's army"}
      - {from: RUS, to: NER, label: "Russian forces helped crush the August coup attempt"}
