# Storylines: the big threads that connect countries. Each one is drawn on the globe as arcs
# between the countries involved, and pulls in matching news automatically.
# See UPDATING.md ("Storylines") for how the daily update maintains these.
#
# - id: kebab-case-id
#   title: "Short title"
#   dek: "One sentence: what this storyline is."
#   status: escalating | grinding | talks | shifting | cooling
#   why: >-      Two to four sentences on why it matters and how the pieces connect.
#   watch: >-    What to watch next.
#   links:       arcs on the globe: {from: ISO3, to: ISO3, label: "what connects them"}
#   conflicts:   conflict ids from content/military/*.yaml
#   match:       news is pulled in when it is tagged `thread: <id>`, or touches one of these
#                conflicts, or names one of `countries` AND contains one of `keywords`
#   key:         milestones: {date, text, and one of conflict: id | news: "YYYY-MM-DD headline start" | sources: [...]}

threads:
  - id: hormuz-shock
    title: "The Hormuz shock"
    dek: "Iran's near-closure of the Strait of Hormuz is rippling through oil prices, shipping and politics far beyond the Gulf."
    status: escalating
    why: >-
      About a fifth of the world's oil and much of its liquefied gas normally pass through the Strait of Hormuz.
      Since the US-Israeli war on Iran began in February, Iran has mined and attacked shipping there while a US
      blockade chokes Iran's own exports, so the strait is shut to most traffic. That one choke point now links
      tanker crews off Oman, fuel prices in Pakistan and Kenya, gas supplies in Japan and Korea, Qatar's role as
      mediator and Trump's political fortunes at home.
    watch: >-
      Whether Qatar's mediation produces a reopening deal, or Washington and Israel resume strikes. Iran says the
      strait stays shut until its seven conditions are met.
    links:
      - {from: IRN, to: USA, label: "At war since February 2026; US blockade of Iranian ports"}
      - {from: IRN, to: OMN, label: "Mines and attacks on tankers off Oman"}
      - {from: IRN, to: ARE, label: "Ships hit off Ras al-Khaimah and in UAE waters"}
      - {from: QAT, to: IRN, label: "Qatar mediates between Tehran and Washington"}
      - {from: IRN, to: CHN, label: "China is the biggest buyer of Gulf oil"}
      - {from: IRN, to: IND, label: "India imports most of its oil, much of it via Hormuz"}
      - {from: IRN, to: JPN, label: "Japan and Korea depend on Gulf oil and gas"}
      - {from: IRN, to: BHR, label: "Iran claims strikes on US sites in Bahrain"}
    conflicts: [iran-war-2026, strait-of-hormuz-shipping-war]
    match:
      countries: [IRN, OMN, QAT]
      keywords: [Hormuz, tanker, blockade, oil]
    key:
      - {date: "2026-02-28", text: "The US and Israel launch war on Iran.", conflict: iran-war-2026}
      - {date: "2026-10-16", text: "CENTCOM says the blockade has cost Iran 25 billion dollars in oil exports.", news: "2026-10-16 CENTCOM says blockade"}
      - {date: "2026-10-22", text: "Seven tankers are hit in the war's worst single day for shipping.", news: "2026-10-22 Seven tankers hit"}
      - {date: "2026-11-09", text: "Trump calls the war 'effectively over' militarily but keeps the blockade.", news: "2026-11-09 Trump calls the Iran war"}
      - {date: "2026-11-11", text: "Iran says Hormuz stays shut until its conditions are met.", news: "2026-11-11 Iran rejects moving"}

  - id: ukraine-talks
    title: "Talking while fighting in Ukraine"
    dek: "US-brokered talks between Russia and Ukraine have restarted, while the air war on power grids and refineries hits new peaks."
    status: talks
    why: >-
      For the first time since February, Russia and Ukraine are meeting face to face, with US envoys Witkoff and
      Kushner shuttling between Kyiv, Moscow and Abu Dhabi and Europe pushing to join. At the same time both sides
      are firing record numbers of drones: Russia at Ukraine's power stations as winter starts, Ukraine at Russian
      refineries and Baltic ports. Every strike is also a message to the negotiators, and the talks now reach into
      US-China-Russia summitry.
    watch: >-
      The prisoner exchange agreed in Abu Dhabi, whether Russia accepts Europe at the next round outside Moscow,
      whether Kushner's claim that Moscow accepts Article 5-style guarantees holds, and how far Russia's
      retaliation for the Crimean Bridge strikes goes, including into Poland.
    links:
      - {from: USA, to: RUS, label: "Witkoff and Kushner carry US proposals to Putin"}
      - {from: USA, to: UKR, label: "US mediates and sells Patriot missiles to Kyiv"}
      - {from: RUS, to: UKR, label: "Full-scale war since 2022"}
      - {from: ARE, to: UKR, label: "Abu Dhabi hosts the three-way talks"}
      - {from: CHN, to: RUS, label: "Trump, Xi and Putin to meet in Shenzhen"}
      - {from: FRA, to: UKR, label: "Europeans push to join the talks"}
    conflicts: [russia-ukraine-war, russia-ukraine-strike-war]
    match:
      countries: [UKR, RUS]
      keywords: [talks, Abu Dhabi, Witkoff, Kushner, ceasefire, prisoner, Shenzhen, NATO, Donbas, truce]
    key:
      - {date: "2026-10-21", text: "Putin agrees with Witkoff to restart three-way talks.", news: "2026-10-21 Putin agrees with Witkoff"}
      - {date: "2026-10-23", text: "A local humanitarian ceasefire begins in occupied Oleshky.", news: "2026-10-23 Melania Trump brokers"}
      - {date: "2026-11-10", text: "The first three-way round since February opens in Abu Dhabi.", news: "2026-11-10 US-mediated Russia-Ukraine talks open"}
      - {date: "2026-11-11", text: "The talks end with a prisoner exchange deal but no ceasefire.", news: "2026-11-11 Abu Dhabi talks end"}
      - {date: "2026-11-13", text: "Zelensky says US negotiators floated NATO membership in exchange for leaving Donbas.", news: "2026-11-13 Zelensky says US negotiators"}
      - {date: "2026-11-17", text: "Ukraine strikes the Crimean Bridge two nights running before the Shenzhen summit.", news: "2026-11-17 Ukraine strikes the Crimean Bridge"}
      - {date: "2026-11-19", text: "Putin rules out an energy and sea truce after a third bridge strike, as Europe's allies meet US envoys in Berlin.", news: "2026-11-19 Ukraine hits the Crimean Bridge"}
      - {date: "2026-11-20", text: "Russia's retaliatory barrage hits three Kyiv bridges and sends a missile into Poland.", news: "2026-11-20 Russia answers the Crimean Bridge"}

  - id: gulf-realignment
    title: "The Gulf rearms and realigns"
    dek: "Houthi missiles on Riyadh, a new Saudi-Pakistani-Turkish defence pact and wavering US support are redrawing Gulf security."
    status: escalating
    why: >-
      Saudi Arabia is at war with Yemen's Houthis again, with missiles hitting Riyadh's financial district and
      airports. Unsure how far Washington will go, Riyadh has built its own coalition: the Mecca defence pact with
      Pakistan and Turkey, Egyptian promises of support and British jets. These deals tie Pakistan's army and
      Turkey's arms industry to Gulf wars, and they could outlast this crisis.
    watch: >-
      Whether the Houthis move into Dhubab and the ground over Bab al-Mandeb after the government pullback, whether
      their offensive through Lahj reaches Aden, and whether Pakistan or Egypt send forces.
    links:
      - {from: YEM, to: SAU, label: "Houthi missiles and drones on Saudi cities; Saudi air strikes on Yemen"}
      - {from: SAU, to: PAK, label: "Mecca defence pact"}
      - {from: SAU, to: TUR, label: "Mecca defence pact, ratified by Turkey on 5 November"}
      - {from: EGY, to: SAU, label: "Egypt's parliament authorises military support"}
      - {from: GBR, to: SAU, label: "RAF Typhoons help defend Saudi airspace"}
      - {from: IRN, to: YEM, label: "Iran arms the Houthis"}
    conflicts: [yemen-civil-war]
    match:
      countries: [SAU, YEM]
      keywords: [Houthi, Riyadh, Aramco, Mecca, pact, Saudi]
    key:
      - {date: "2026-10-20", text: "Britain sends RAF Typhoons to defend Saudi Arabia.", news: "2026-10-20 UK sends RAF Typhoons"}
      - {date: "2026-10-26", text: "Egypt's parliament authorises military support for Saudi Arabia.", news: "2026-10-26 Egypt's parliament authorises"}
      - {date: "2026-11-05", text: "Turkey ratifies the Mecca defence pact with Saudi Arabia and Pakistan.", news: "2026-11-05 Turkey's parliament ratifies"}
      - {date: "2026-11-08", text: "Houthi missiles damage Aramco's tower in Riyadh.", news: "2026-11-08 Aramco's tower in Riyadh"}
      - {date: "2026-11-12", text: "Houthis open an offensive in Lahj aimed at the Mokha-Aden road.", news: "2026-11-12 Houthis open an offensive"}
      - {date: "2026-11-15", text: "Government forces pull back from Dhubab and the Bab al-Mandeb area to defend Aden.", news: "2026-11-15 Yemen's southern government forces pull back"}

  - id: horn-of-africa
    title: "The Horn of Africa's linked wars"
    dek: "Sudan's civil war, renewed fighting in Ethiopia and an Ethiopia-Eritrea standoff are bleeding into each other."
    status: escalating
    why: >-
      Sudan accuses Ethiopia of letting drones be launched against it from Ethiopian soil; Ethiopia and Eritrea have
      cut relations after war returned to Tigray; Egypt has built a bloc with Eritrea, Somalia and Sudan against
      Ethiopia; and the UAE is widely reported to back Sudan's RSF. A strike on a market in disputed Abyei dragged
      South Sudan in. Each war feeds the others, and together they make the region the world's largest humanitarian
      crisis.
    watch: >-
      The army's push from Al-Khuwei toward En Nahud in West Kordofan, drone strikes across the Sudan-Ethiopia border, and any Ethiopian move
      toward Eritrea's port of Assab.
    links:
      - {from: SDN, to: ETH, label: "Drone accusations and expelled consular staff"}
      - {from: ETH, to: ERI, label: "Relations cut on 1 October; troops face off at the border"}
      - {from: ARE, to: SDN, label: "Reported backing for the RSF"}
      - {from: EGY, to: ERI, label: "Egypt's bloc with Eritrea, Somalia and Sudan"}
      - {from: SDN, to: SSD, label: "Abyei market strike kills at least 153"}
      - {from: ETH, to: KEN, label: "50,000 flee clashes in Moyale into Kenya"}
    conflicts: [sudan-saf-rsf, ethiopia-tigray-war, ethiopia-amhara-fano, ethiopia-oromia-ola, ethiopia-eritrea-standoff, south-sudan-civil-conflict]
    match:
      countries: [SDN, ETH, ERI, SSD]
      keywords: [drone, Tigray, Abyei, RSF, Eritrea, Kordofan, Darfur]
    key:
      - {date: "2026-10-01", text: "Ethiopia and Eritrea cut diplomatic relations.", conflict: ethiopia-eritrea-standoff}
      - {date: "2026-10-19", text: "A drone strike on Abyei's Amiet market kills at least 153.", news: "2026-10-19 Drone strike on Abyei"}
      - {date: "2026-10-29", text: "Sudan accuses Ethiopia of letting 162 drone attacks be launched from its soil.", news: "2026-10-29 Sudan accuses Ethiopia"}
