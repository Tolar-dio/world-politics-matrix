    conflicts: [sahel-jihadist-insurgency, northern-mali-fla-rebellion, coastal-west-africa-spillover]
    match:
      countries: [MLI, BFA, NER]
      keywords: [junta, JNIM, jihad, Africa Corps, gunmen, attack, coup, villagers]
    key:
