  - id: congo-war
    title: "Congo's war turns political"
    dek: "Former president Kabila has joined the M23 rebels in a bid to topple Tshisekedi, as Ebola spreads in the same region."
    status: escalating
    why: >-
      The Rwandan-backed M23 already holds Goma and Bukavu. In October former president Joseph Kabila launched a
      coalition with it, aimed at toppling President Tshisekedi, turning a regional war into a fight for Kinshasa
      itself. US-brokered peace deals between Congo and Rwanda have not stopped the fighting, and an Ebola outbreak
      has passed 5,000 deaths in the same eastern provinces.
    watch: >-
      Whether the FRN pushes south toward Uvira and Kalemie, and whether Washington leans on Rwanda.
    links:
      - {from: RWA, to: COD, label: "UN experts say Rwanda backs and commands M23"}
      - {from: UGA, to: COD, label: "Ugandan troops fight the ADF in Ituri"}
