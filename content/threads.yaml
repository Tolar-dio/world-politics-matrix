  - id: europe-incumbents
    title: "Europe's incumbents under pressure"
    dek: "From Budapest to Brussels, long-serving leaders and coalitions are losing power, majorities or the street."
    status: shifting
    why: >-
      Orbán lost Hungary in April, Vučić conceded defeat in Serbia in October, Czech governing parties were shut out
      of the Senate, Slovakia's Fico lost his majority, Belgium's government nearly fell over its budget, and Poland's
      president and prime minister are locked in a constitutional standoff. Behind it are the cost of living, the
      war next door and anger at entrenched elites, which also drive the protests in France, Germany, Spain and
      Albania.
    watch: >-
