      The US calls its campaign against drug cartels an armed conflict. It has sunk scores of boats, seized
      Venezuela's president in a raid in January, helped Venezuela strike Colombian guerrillas, and Trump now says he
      wants to 'get Cuba done'. Governments across the region are choosing sides, from El Salvador sending troops to
      Haiti to Colombia's new government ending peace talks with armed groups.
