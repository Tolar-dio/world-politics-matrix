  summary: "Ukraine's air force said Russia launched 123 long-range drones, 73 of them jet-powered, plus Iskander-M, Zircon and other missiles overnight into 12 November, and that 89 drones and five Banderol missiles were stopped while drones hit 17 locations. Regional officials reported at least four killed in a strike on a market in Chornomorsk, Odesa region, one killed and seven injured in Kyiv, two each in Donetsk and Kharkiv regions and one in Kherson region, for 10 dead and 40 injured over the day; more than 160 settlements in Rivne region lost power. Russia said it downed 71 Ukrainian drones. It matters because the strike war has not slowed for the diplomacy, and Zelensky said disruption to the Starshield satellite network was weakening Ukraine's interception of jet drones."
