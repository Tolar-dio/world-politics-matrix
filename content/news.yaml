  summary: "Public broadcaster KAN reported that the security cabinet chaired by caretaker Prime Minister Benjamin Netanyahu ordered the military to increase readiness for a possible strike on Iran, directives KAN said 'could trigger a war'; the scope and timing were not disclosed. The report surfaced after Gadi Eisenkot, who holds the mandate to form the next government, wrote to Netanyahu, as reported by Ynet, that only 46 members of the Knesset still back him and urging him not to deploy forces without 'a direct and immediate threat'. Iran's security chief Mohsen Rezaei warned that any base used in a new war would be a legitimate target. It matters because a lame-duck government could restart the war just as Washington says it no longer needs major combat."
