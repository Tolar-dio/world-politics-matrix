  summary: Student protests over school conditions and living costs turned violent on 13 October, with the education
    ministry attacked; on 14 October rioters hit government buildings and banks, injuring 23 police, and 35 people
    were detained. The unrest, part of the broader 'Flamingo Revolution' that began in 2026 over resort projects
