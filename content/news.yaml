  summary: "Khyber Pakhtunkhwa police said 10 officers were killed and 12 wounded when gunmen opened fire on a police convoy returning from an operation against illegal gold mining in the Gumbat area of Kohat district, and that 18 attackers were killed; an official told AFP two police vehicles were burned. The Pakistani Taliban (TTP) claimed the attack, and officials separately said 10 TTP fighters were killed in an operation in Orakzai. It matters because Islamabad blames such attacks on sanctuaries in Afghanistan, which Kabul denies, and a September attack in Kohat restarted Pakistan's air war across the border."
