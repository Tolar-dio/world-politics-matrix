  summary: Saudi jets struck a fuel depot near Sanaa, and the Houthis answered with missiles at several Saudi cities
    including Riyadh and Dammam; an intercepted missile set fire to an Aramco administrative building in Dhahran.
    Riyadh's King Khalid airport stayed shut after a week of attacks. It matters because the Houthi-Saudi war, revived
