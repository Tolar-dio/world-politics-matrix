  summary: "A presidential decree read on state radio on 9 November called legislative and municipal elections for 7 February 2027, the first votes since Paul Biya, 93, was declared winner of a contested eighth term in October 2025; they had been postponed twice. A government reshuffle and the appointment of a vice president, a post restored by an April constitutional reform, are still pending, and last month the authorities suspended the party of exiled runner-up Issa Tchiroma Bakary. It matters because the vote will shape the parliament that would oversee any succession to Africa's oldest head of state."
