  headline: Joseph Kabila launches armed coalition with M23 to topple Tshisekedi
  summary: Former president Joseph Kabila announced in Goma a political-military coalition, the Front for the Refoundation
    of the Nation, uniting the M23, Corneille Nangaa's Congo River Alliance and Twirwaneho, with the stated aim
    of ending Felix Tshisekedi's rule 'by all means, including force'. M23 commander Sultani Makenga was named army
    chief. It matters because it gives the Rwanda-backed rebellion a national political figurehead and complicates
