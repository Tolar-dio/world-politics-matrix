  headline: "US envoys Witkoff and Kushner fly to Moscow to put new proposals to Putin after the Abu Dhabi round"
  summary: "Steve Witkoff and Jared Kushner landed at Moscow's Vnukovo airport on 12 November and were met by Kremlin envoy Kirill Dmitriev before talks with Vladimir Putin; they are due to brief Zelensky in Dublin afterwards. Kushner said Washington had aligned its proposals with Ukraine and its European partners but that 'significant differences remain', while Russian negotiator Vladimir Medinsky said the sides had 'moved closer to peace' and Ukraine's Davyd Arakhamia spoke of momentum toward a deal by the New Year. It matters because the shuttle tests whether the prisoner-exchange deal from Abu Dhabi can grow into talks on territory, where Kyiv rejects Moscow's demand for all of Donbas."
