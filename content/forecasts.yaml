# Forecast questions shown on the site, each tied to a live prediction market.
# The browser pulls the current odds from the market; `snapshot` is the fallback shown if
# that fails, and records the odds when the question was added. A question resolves by
# itself when its market closes. See UPDATING.md ("Forecasts").
#
# - id: kebab-case-id
#   question: "Plain-English yes/no question"
#   closes: "YYYY-MM-DD"          when the question is decided
#   countries: [ISO3, ...]
#   thread: storyline-id          optional
#   why: "One sentence on why it matters."
#   market: {source: polymarket, slug: market-slug}
#   snapshot: {prob: 0.12, as_of: "YYYY-MM-DD"}
#   resolution: yes | no          optional; set only if the market can't be read

