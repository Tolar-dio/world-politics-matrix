  society: >-
    Ireland went from one of Western Europe's poorest countries to one of its richest, thanks largely to US multinationals drawn by low corporate tax; Apple, Google and Pfizer have European hubs there. Housing shortages and homelessness are acute. Voters legalised same-sex marriage and abortion in landmark referendums in 2015 and 2018.
