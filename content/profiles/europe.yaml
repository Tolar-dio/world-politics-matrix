    San Marino is surrounded by Italy and uses the euro. Tourism, banking and light industry support a high standard of living. Many Sammarinese work across the border. An association agreement with the EU was concluded to deepen access to the single market.
  baseline: >-
    San Marino is governed by a coalition led by the Christian Democrats. The Great and General Council elects the two Captains Regent every six months.
  leaders: {state: "Two Captains Regent, elected every six months", gov: "Secretary of State for Foreign Affairs Luca Beccari"}
  power: >-
    A parliamentary republic. The 60-member Great and General Council elects the government, the
    Congress of State, and every six months two Captains Regent who serve jointly as heads of state.
  story: steady

SRB:
  pop: 6.6
  religion: Serbian Orthodox about 82%, Catholic and Muslim minorities
  system: parliamentary
  story: election
  snapshot: >-
    Vučić quit the presidency to run for prime minister and lost: the student-led movement born from
    the Novi Sad protests won an outright majority on 25 October 2026.
  tags: [Student List victory, Protest movement, Between EU and Russia, Kosovo dispute]
  culture: >-
    Serbian Orthodox monasteries, the Cyrillic and Latin alphabets used side by side, and slava, the family patron saint's day, define Serbian tradition. Belgrade's nightlife is famous, as are its kafanas, taverns with live folk music. Novak Đoković is a national hero. Guča's trumpet festival draws hundreds of thousands.
  society: >-
    Serbia balances between the EU, which it hopes to join, and Russia and China, which back it on Kosovo and invest in its economy. The 2024 collapse of a railway station canopy in Novi Sad, which killed 16 people, set off the biggest protest movement in decades, led by students. Media freedom has declined under Vučić.
  update: >-
    On 25 October the Student List won 53 percent to 38.8 percent for Vučić's United Serbia list in
    official preliminary results, on a record turnout of 68.9 percent, a projected majority of about
    141 of 250 seats, and Vučić conceded defeat. The new parliament must be formed within 30 days of
    final results, and a presidential election must be held by 27 December.
  update_date: 2026-10-26
  holders: >-
    Acting President Ana Brnabić; a Student List government is expected after its October 2026
    majority, with Ilija Srdanović, a Novi Sad cardiologist, seen as the likeliest prime minister.
  sources_extra:
    - {label: "Al Jazeera: Serbia after Vučić", url: "https://www.aljazeera.com/news/2026/10/26/serbia-after-vucic-who-will-be-pm-and-when-will-a-government-be-formed"}
    - {label: "Euronews: Student List wins", url: "https://www.euronews.com/2026/10/25/vucic-concedes-defeat-in-pivotal-serbian-elections-says-student-movement-has-won"}
    - {label: "Al Jazeera: Vučić concedes", url: "https://www.aljazeera.com/news/2026/10/25/serbia-voter-turnout-highest-in-decades-as-students-oppose-longtime-leader"}

SVK:
  pop: 5.4
  religion: Catholic about 56%, Lutheran about 5%, no religion about 24%
  system: parliamentary
  story: unrest
  snapshot: >-
    Robert Fico's government dismantled the anti-corruption prosecutor, softened the criminal code and targeted NGOs, drawing large protests and EU concern.
  tags: [Fico government, Rule of law concerns, Car manufacturing, Pro-Russian drift]
  culture: >-
    Slovakia's castles, wooden churches and the High Tatras mountains are national treasures. Folk traditions, including the fujara shepherd's flute, are UNESCO-listed. Ice hockey is the biggest sport. Slovaks and Czechs understand each other's languages and remain close since their peaceful 1993 split.
  society: >-
    Slovakia makes more cars per head than any other country, with plants for Volkswagen, Kia, Stellantis and Jaguar Land Rover. Fico survived an assassination attempt in 2024. His government has cut military aid to Ukraine and moved closer to Moscow, while large protests in Bratislava have opposed his course.

SVN:
  pop: 2.1
  religion: Catholic about 55%, many unaffiliated
  system: parliamentary
  story: election
  snapshot: >-
    A near-tie in the March 2026 election ended with populist Janez Janša back as prime minister for a fourth time.
  tags: [Janša returns, Alpine and Adriatic, Prosperous small state, Cycling stars]
  culture: >-
    Slovenia packs Alps, karst caves and a short Adriatic coast into a small country. Beekeeping is a national tradition, with painted hive panels, and the country proposed World Bee Day. Cyclists Tadej Pogačar and Primož Roglič, and basketball's Luka Dončić, are global stars. Lake Bled is a postcard icon.
  society: >-
    Slovenia was the richest Yugoslav republic and the first to join the EU, in 2004, and the euro. It has low inequality and high quality of life. Janša, an ally of Orbán and Trump, has clashed with media and the EU in past terms.

ESP:
  pop: 49.0
  religion: Catholic about 55%, no religion about 40%
  system: const-monarchy
  story: election
  snapshot: >-
    A housing protest movement camped in Madrid's Puerta del Sol, and after parliament rejected his emergency decrees, Pedro Sánchez called a snap election for 29 November.
  tags: [Snap election, Housing crisis, Fast growth, Regional nationalism]
  culture: >-
    Spain's regions have strong identities and languages, including Catalan, Basque and Galician. Flamenco, the Running of the Bulls, Semana Santa and late dinners shape the world's image of it, along with Picasso, Goya and Gaudí. Football rivalries between Real Madrid and Barcelona are fierce, and the national team won Euro 2024 and the 2026 World Cup.
  society: >-
    Spain has been the EU's fastest-growing large economy, driven by tourism, immigration and renewable energy. But rents have soared, especially in Madrid, Barcelona and the islands, and youth unemployment is high. Catalonia's 2017 independence push still shapes politics, and Sánchez depends on Catalan and Basque parties.

SWE:
  pop: 10.6
  religion: Lutheran church members about 52%, largely secular
  system: const-monarchy
  story: election
  snapshot: >-
    Sweden's left-leaning bloc won a narrow majority in September 2026, but forming a government has dragged on, leaving Ulf Kristersson as caretaker.
  tags: [Government formation, NATO's new member, Gang violence, Welfare model]
  culture: >-
    Sweden gave the world ABBA, IKEA, Spotify, Astrid Lindgren and the Nobel Prizes. Midsummer, fika coffee breaks and the concept of lagom, just enough, are cultural touchstones. Allemansrätten, the right to roam, gives everyone access to nature.
  society: >-
    Sweden has a generous welfare state and high equality, but gang shootings and bombings have made it an outlier in Europe for gun violence. Immigration, which changed the country fast, is a central political debate. It joined NATO in 2024, ending two centuries of military non-alignment.
  update: >-
    On 15 October the Riksdag voted down a Social Democratic minority government under Magdalena
    Andersson after the Left and Centre parties refused to back it. Centre leader Elisabeth Thand
    Ringqvist then explored a centrist option and reported on 26 October that it had no majority.
    Four failed votes would force a snap election.
  update_date: 2026-10-26
  sources_extra:
    - {label: "AA: Swedish parliament votes against Andersson as prime minister", url: "https://www.aa.com.tr/en/europe/swedish-parliamet-votes-against-andersson-as-prime-minister-/4089695"}
    - {label: "Wikipedia: 2026 Swedish government formation", url: "https://en.wikipedia.org/wiki/2026_Swedish_government_formation"}

CHE:
  pop: 9.0
  religion: Catholic about 32%, Reformed Protestant about 20%, no religion about 34%
  system: parliamentary
  system_note: "A directorial system: a seven-member Federal Council governs collectively."
  snapshot: >-
    A rich, neutral federation run by consensus and direct democracy, which struck a deal in 2025 to cut punishing US tariffs on its exports.
  tags: [Direct democracy, Neutrality, Finance and pharma, Four languages]
  culture: >-
    Switzerland has four national languages: German, French, Italian and Romansh. Citizens vote several times a year in referendums on everything from taxes to cow horns. Chocolate, cheese, watches and Alpine skiing are national icons, and Geneva hosts many UN agencies and the Red Cross.
  society: >-
    Switzerland is among the world's richest countries, with pharma giants like Roche and Novartis, banking and precision industry. It remains outside the EU but tied to it by bilateral treaties. Neutrality has been tested by sanctions on Russia. Glacier loss from climate change is visible across the Alps.
  baseline: >-
    The seven-member Federal Council is shared among the four largest parties, and Guy Parmelin of
    the Swiss People's Party holds the rotating presidency in 2026. In 2025 the US imposed a 39
    percent tariff on Swiss goods before a deal lowered it. On 14 June 2026 voters rejected, by
    about 55 percent, the Swiss People's Party's initiative to cap the population at 10 million,
    which would have endangered free movement with the EU as a new package of EU treaties heads
    toward a national vote.
  leaders: {state: "Federal Council, with Guy Parmelin as President of the Confederation for 2026", gov: "Federal Council of seven members"}
  power: >-
    A federal directorial republic. Parliament elects a seven-member Federal Council that governs
    collectively; the cantons are powerful, and citizens can force national referendums on almost
    any law.
  story: election
  sources:
    - {label: "Anadolu: voters reject the population cap", url: "https://www.aa.com.tr/en/politics/nearly-55-swiss-voters-reject-10m-population-cap-initiative/3966646"}

UKR:
  pop: 38
  religion: Orthodox Christian about 70%, Greek Catholic about 9%
  system: semi-presidential
  system_note: Under martial law since 2022, which suspends elections.
  story: war
  snapshot: >-
    A brief US-brokered ceasefire in May collapsed within days, and the war ground on along a 745-mile front as both sides escalated long-range strikes.
  tags: [Russian invasion, Martial law, EU candidate, Drone warfare]
  culture: >-
    Ukrainian identity has strengthened sharply since 2014, and especially since 2022, with many people switching from Russian to Ukrainian. Embroidered vyshyvanka shirts, borscht, which is UNESCO-listed, and Cossack history are symbols of pride. Ukraine won Eurovision in 2016 and 2022. Kyiv's Saint Sophia Cathedral dates to the 11th century.
  society: >-
    Russia's full-scale invasion has killed tens of thousands of civilians and soldiers, displaced millions and occupied about a fifth of the country. Ukraine has become a world leader in drone warfare. The economy depends on Western aid. Corruption scandals, including one in the energy sector in 2025, remain sensitive.
  update: >-
    On 21 October Putin told US envoy Steve Witkoff he agreed in principle to resume three-way talks
    with Ukraine on or after 10 November, possibly in Abu Dhabi, and Zelensky backed the format. On
    23 October the two sides agreed a local humanitarian ceasefire in occupied Oleshky, mediated by
    Melania Trump, and swapped 270 prisoners each. Hungary lifted its block on Ukraine's EU
    accession talks on 16 October. On the ground, Ukraine has regained a little territory since
    September, though Russian troops are about 9 km from Kramatorsk.
  update_date: 2026-10-23
  sources_extra:
    - {label: "Reuters: Putin hosts Trump envoy, agrees to new talks", url: "https://www.reuters.com/world/europe/putin-hosts-trump-envoy-new-ukraine-peace-talks-frees-us-citizen-held-russia-2026-10-21/"}
    - {label: "Kyiv Independent: local ceasefire for Oleshky", url: "https://kyivindependent.com/ukraine-war-latest-ukraine-russia-agree-to-local-ceasefire-for-russian-occupied-oleshky-mediated-by-melania-trump/"}
    - {label: "Reuters: Hungary and Ukraine agree to reset ties", url: "https://www.reuters.com/world/hungary-ukraine-agree-reset-ties-magyar-says-2026-10-16/"}

GBR:
  pop: 69.6
  name: United Kingdom
  religion: Christian about 46%, no religion about 37%, Muslim about 7%
  system: const-monarchy
  story: election
  snapshot: >-
    Keir Starmer resigned in June 2026 after a local election rout, and Labour handed the keys to Andy Burnham, Britain's seventh prime minister in ten years.
  tags: [Seventh PM in a decade, Reform UK surge, Post-Brexit, Monarchy]
  culture: >-
    Britain's cultural reach is vast: Shakespeare, the Beatles, the BBC, the Premier League and Harry Potter. The monarchy, now led by Charles III, remains popular. England, Scotland, Wales and Northern Ireland each have distinct identities, languages and sports traditions, and London is one of the world's most diverse cities.
  society: >-
    Since leaving the EU in 2020, the UK has struggled with low growth, stagnant wages and strained public services, especially the NHS. Immigration and small boat crossings are central political issues and fuelled Reform UK's rise. Scotland and Wales have devolved governments, and Northern Ireland's power-sharing is fragile.
