# Culture, society and fact profiles: Europe (including the South Caucasus)

ALB:
  pop: 2.4
  religion: Muslim about 50% (Sunni and Bektashi), Catholic and Orthodox Christian, many non-practising
  system: parliamentary
  snapshot: >-
    Edi Rama won a fourth term in 2025, but in October 2026 student-led protests over corruption
    turned violent and spread from Tirana to other cities.
  tags: ["Student protests", "EU candidate", "Tourism boom", "Emigration", "Religious harmony"]
  culture: >-
    Under Enver Hoxha, Albania became the world's first officially atheist state and the most isolated country in Europe, leaving hundreds of thousands of concrete bunkers. Today Muslims, Catholics and Orthodox Christians live side by side with little friction. Iso-polyphony, a form of folk singing, is UNESCO-listed, and the besa, a code of honour, is part of national identity.
  society: >-
    Around a third of Albanians live abroad, mainly in Italy, Greece and Britain. Tourism along the Riviera has boomed, as have property and cannabis-linked money laundering. Rama has appointed an AI-generated "minister" to oversee public procurement as an anti-corruption gimmick. Organised crime groups have reach across Europe.
  baseline: >-
    Edi Rama's Socialist Party won a fourth consecutive term in May 2025 with a large majority, and
    Albania aims to finish EU accession talks by 2027. In 2026 the mood soured: summer protests
    against a luxury coastal development backed by Jared Kushner gave way in October to student-led
    demonstrations over corruption, jobs and schools, in which government buildings and banks were
    set on fire and hundreds of people were charged. Rama refused to resign, calling the protests a
    threat to EU membership rather than to his government.
  leaders: {state: "President Bajram Begaj, since 2022", gov: "Prime Minister Edi Rama, since 2013"}
  power: >-
    A parliamentary republic. The prime minister leads the majority in the 140-seat Assembly; the
    president is elected by parliament and largely ceremonial.
  story: unrest
  sources:
    - {label: "Reuters via The Star: Rama on the protests", url: "https://www.thestar.com.my/news/world/2026/10/18/albanian-pm-says-mass-protests-a-threat-to-eu-membership-not-government"}
    - {label: "Brussels Signal: government refuses to resign", url: "https://brusselssignal.eu/2026/10/albanian-government-refuses-to-resign-and-says-eu-accession-depends-on-it/"}

AND:
  pop: 0.083
  religion: Catholic about 85%
  system: const-monarchy
  system_note: A co-principality whose co-princes are the French president and a Spanish bishop.
  snapshot: >-
    A Pyrenean microstate with two princes, France's president and the Bishop of Urgell, that is negotiating closer ties with the EU while managing a housing squeeze.
  tags: [Co-principality, Ski and shopping, Low taxes, EU association talks]
  culture: >-
    Andorra is the only country where Catalan is the sole official language. Romanesque churches dot its valleys, and its co-princes reflect a feudal arrangement dating to 1278. Skiing, hiking and duty-free shopping draw millions of visitors a year, many times the resident population.
  society: >-
    Low taxes have attracted wealthy residents, including YouTubers and athletes, pushing up housing costs and prompting limits on foreign investment. Most residents are not Andorran citizens; Spaniards and Portuguese are the largest groups. An EU association agreement has been negotiated but faces a referendum.
  baseline: >-
    Xavier Espot Zamora of the Democrats for Andorra has led the government since 2019. In 2026 an
    association agreement giving Andorra deeper access to the EU single market moved through its
    final EU approvals; under Andorran law it needs a binding referendum and a two-thirds vote in
    parliament before ratification. The next general election is due in 2027.
  leaders: {state: "Co-princes Emmanuel Macron and Bishop Josep-Lluís Serrano Pentinat", gov: "Head of Government Xavier Espot Zamora, since 2019"}
  power: >-
    A parliamentary co-principality. The head of government is elected by the 28-seat General
    Council; the two co-princes, the French president and the Bishop of Urgell, are largely
    ceremonial.
  story: steady
  sources:
    - {label: "Alto.ad: referendum plans", url: "https://www.alto.ad/politics/andorra-eu-association-agreement-referendum-260414"}

ARM:
  pop: 3.0
  religion: Armenian Apostolic Church about 93%
  system: parliamentary
  story: election
  snapshot: >-
    Nikol Pashinyan won a third term outright in June 2026 on the promise of peace with Azerbaijan, after clashing with the Armenian Church.
  tags: [Peace with Azerbaijan, Pivot from Russia, Church clash, Ancient Christian nation]
  culture: >-
    Armenia was the first country to adopt Christianity as a state religion, in 301, and its monasteries and unique alphabet, created in 405, are pillars of identity. Mount Ararat, now in Turkey, dominates the view from Yerevan and the national imagination. Duduk music, lavash bread and a huge global diaspora connect Armenians everywhere. The 1915 genocide is commemorated every 24 April.
  society: >-
    Armenia lost Nagorno-Karabakh to Azerbaijan in 2023, and more than 100,000 Armenians fled. Pashinyan has moved away from Russia, freezing membership of its military alliance. Remittances, IT and re-exports to Russia have powered growth. His feud with the Church's leadership led to arrests of senior clergy.

AUT:
  pop: 9.1
  religion: Catholic about 52%, Muslim about 8%, no religion about 22%
  system: parliamentary
  story: shock
  snapshot: >-
    Austerity in a recession left the centrist coalition deeply unpopular, with the far-right FPÖ polling near 34 percent and its leader Herbert Kickl far ahead as preferred chancellor.
  tags: [FPÖ surge, Three-party coalition, Recession, Classical music, Neutral]
  culture: >-
    Vienna was the capital of the Habsburg empire and of classical music: Mozart, Haydn, Beethoven, Schubert and Strauss all worked there, and the New Year's Concert is watched worldwide. Coffee house culture is UNESCO-listed. Alpine skiing is a national passion. Austria remains militarily neutral, a status it adopted in 1955.
  society: >-
    Austria is wealthy with a strong welfare state and social partnership between unions and employers. Its economy is closely tied to Germany's and has suffered from the industrial slump. Migration and asylum are central political issues. Vienna is consistently rated one of the world's most liveable cities, partly thanks to its huge social housing stock.

AZE:
  pop: 10.4
  religion: Shia Islam about 65%, Sunni about 30%, largely secular
  system: presidential
  system_note: A hereditary autocracy in practice.
  story: steady
  snapshot: >-
    Three years after retaking Karabakh, Ilham Aliyev is finalising a US-brokered peace with Armenia that includes a US-run transit route across Armenian territory.
  tags: [Oil and gas, Aliyev dynasty, Peace with Armenia, Caspian Sea]
  culture: >-
    Azerbaijan is a secular, majority Shia country with Turkic language and close ties to Turkey. Mugham, an improvised classical music, is UNESCO-listed. Baku mixes a medieval walled city with oil-boom architecture like the Flame Towers. Novruz, the spring new year, is the major holiday, with bonfires and sweet pastries.
  society: >-
    Oil and gas exports, including a pipeline to Europe, fund the state. Aliyev succeeded his father Heydar in 2003, and his wife is first vice-president. Independent journalists and activists are routinely jailed. The 2020 war and 2023 offensive returned Nagorno-Karabakh to Azerbaijan, and its ethnic Armenian population fled.

BLR:
  pop: 8.9
  religion: Orthodox Christian about 80%, Catholic about 7%
  system: presidential
  system_note: A personalist dictatorship.
  story: steady
  snapshot: >-
    Alexander Lukashenko has been trading political prisoners for US sanctions relief, while staying firmly in Russia's camp and hosting its nuclear weapons.
  tags: [Lukashenko since 1994, Russian ally, Political prisoners, Prisoner releases]
  culture: >-
    Belarusian culture has long been overshadowed by Russian, and most people speak Russian day to day, though the white-red-white flag and the Belarusian language became symbols of the 2020 protest movement. The country lost about a quarter of its population in the Second World War, which remains central to state identity. Ice hockey is the president's favourite sport and a national passion.
  society: >-
    Lukashenko crushed the 2020 protests after a stolen election, and hundreds of thousands left. More than a thousand political prisoners remained in 2025, though releases have since continued in deals with Washington. The economy relies heavily on Russian subsidies and markets. Belarus served as a launchpad for Russia's 2022 invasion of Ukraine.

BEL:
  pop: 11.8
  religion: Catholic about 50%, Muslim about 7%, no religion about 30%
  system: const-monarchy
  system_note: A federal state divided between Dutch-speaking Flanders and French-speaking Wallonia.
  story: unrest
  snapshot: >-
    Wave after wave of general strikes hit Belgium in 2026 against pension cuts and limits on wage indexation by Bart De Wever's five-party coalition.
  tags: [General strikes, Language divide, EU and NATO capital, Comics and chocolate]
  culture: >-
    Belgium is split between Dutch-speaking Flanders, French-speaking Wallonia and bilingual Brussels, with a small German-speaking community. It gave the world Tintin, the Smurfs, René Magritte, Art Nouveau architecture, and a beer culture that is UNESCO-listed. Cycling, especially the Tour of Flanders, is a religion in Flanders.
  society: >-
    Brussels hosts the EU institutions and NATO. Politics is fragmented along language lines, and forming governments can take more than a year. The economy is rich but carries high public debt, which De Wever's coalition is trying to cut. Flemish nationalism has grown, and Wallonia has struggled since its heavy industry declined.
  update: >-
    Budget talks in Bart De Wever's five-party coalition stalled in October, forcing him to cancel his 13
    October State of the Union address and drop a contested VAT rise in favour of a one-year plan for 2027
    saving about 3 to 4 billion euros, with a proposed 'debt brake' if no multi-year deal is reached by
    December. As of 22 October there was still no agreement, with Vooruit pressing for higher taxes on the
    wealthy and the liberal MR opposing tax rises, while public-sector unions struck again on 12 October.
  update_date: 2026-10-22
  sources_extra:
    - {label: "Brussels Signal: Belgium settles for a one-year budget as full agreement stays out of reach", url: "https://brusselssignal.eu/2026/10/belgium-settles-for-a-one-year-budget-as-full-agreement-stays-out-of-reach/"}
    - {label: "VRT: Noch immer kein Haushalt", url: "https://www.vrt.be/vrtnws/de/2026/10/22/noch-immer-kein-haushalt-die-belgische-regierung-findet-keinen/"}
    - {label: "US News (Reuters): Belgium strike partly shuts public sector as budget deal delayed", url: "https://www.usnews.com/news/world/articles/2026-10-12/belgium-strike-partly-shuts-public-sector-as-budget-deal-delayed"}

BIH:
  pop: 3.1
  religion: Muslim about 51%, Orthodox Christian about 31%, Catholic about 15%
  system: parliamentary
  system_note: A three-member presidency and two semi-autonomous entities under the Dayton peace accords.
  snapshot: >-
    Bosnia's October 2026 election largely kept the same nationalist-led balance, while the Serb entity's former leader Milorad Dodik still pulls strings after being barred from office.
  tags: [Dayton system, Ethnic power-sharing, EU candidate, Secessionist pressure]
  culture: >-
    Bosnia sits where Ottoman and Austro-Hungarian worlds met: Sarajevo's old bazaar, with its coffee and ćevapi, sits a short walk from Habsburg facades. Sevdalinka, melancholy love songs, are shared across communities. The Stari Most bridge in Mostar, destroyed in 1993 and rebuilt, is a symbol of reconciliation. The Sarajevo Film Festival is the region's biggest.
  society: >-
    The 1992 to 1995 war killed about 100,000 people, including 8,000 Bosniak men and boys at Srebrenica. The Dayton accords ended it but created a complex state of two entities, the Federation and Republika Srpska, overseen by an international High Representative. Emigration of young people is high, and politics is dominated by ethnic parties.
  baseline: >-
    Milorad Dodik was stripped of the Republika Srpska presidency in 2025 after a conviction for defying the High Representative; his party's candidate won a snap election to replace him. In the 4 October 2026 general election, preliminary results showed Denis Bećirović and Željka Cvijanović holding the Bosniak and Serb presidency seats and Darijana Filipović of HDZ taking the Croat seat, with Dodik's SNSD again winning Republika Srpska's presidency.
  leaders: {state: "Three-member Presidency (preliminary October 2026 results: Denis Bećirović, Željka Cvijanović, Darijana Filipović)", gov: "Chair of the Council of Ministers Borjana Krišto"}
  power: >-
    A federal state under the Dayton constitution: a three-member presidency, a Council of Ministers
    and a two-chamber parliament, with the Federation and Republika Srpska holding most powers. An
    international High Representative can impose laws and dismiss officials.
  story: election
  sources:
    - {label: "European Western Balkans: preliminary results", url: "https://europeanwesternbalkans.com/2026/10/05/what-are-the-preliminary-results-of-bihs-general-elections/"}

BGR:
  pop: 6.4
  religion: Orthodox Christian about 70%, Muslim about 10%
  system: parliamentary
  story: election
  snapshot: >-
    Former president Rumen Radev won Bulgaria's first single-party majority since 1997 in April 2026, promising to dismantle the "mafia state" after seven elections in four years.
  tags: [End of election cycle, New euro member, Anti-corruption pledge, Black Sea]
  culture: >-
    Bulgaria invented the Cyrillic alphabet, celebrated every 24 May. Its Orthodox monasteries, like Rila, and the rose oil of the Valley of Roses are national treasures. Bulgarian polyphonic choirs and complex folk rhythms are internationally acclaimed. Martenitsi, red and white threads, are worn every March to welcome spring.
  society: >-
    Bulgaria is the EU's poorest member per head and has lost a fifth of its population since 1989 through emigration and low birth rates. It joined Schengen in 2025 and adopted the euro on 1 January 2026. Corruption and oligarchic influence over the courts and media are long-standing grievances that fuelled mass protests.
  update: >-
    The presidential election on 25 October went to a runoff on 1 November between incumbent Iliana
    Iotova, with about 35 percent, and former acting prime minister Andrey Gyurov, with about 32
    percent, on the lowest turnout in Bulgarian history. It came days after drones sank merchant
    ships off the Bulgarian coast, which Sofia blamed on Russia.
  update_date: 2026-10-25
  sources_extra:
    - {label: "Reuters: Bulgaria votes for president in wake of deadly Black Sea drone strikes", url: "https://www.reuters.com/world/bulgaria-votes-president-wake-deadly-black-sea-drone-strikes-2026-10-25/"}
    - {label: "CNN: Bulgaria presidential race heads to runoff", url: "https://www.cnn.com/2026/10/25/europe/bulgaria-presidential-race-heads-to-runoff-latam-intl"}

HRV:
  pop: 3.8
  religion: Catholic about 79%, Orthodox about 3%
  system: parliamentary
  snapshot: >-
    A tourism-driven euro member where the conservative HDZ governs with nationalist partners, while the president, Zoran Milanović, plays a combative opposition role.
  tags: [Adriatic tourism, Euro and Schengen member, Emigration, Football]
  culture: >-
    Croatia's Adriatic coast, Dubrovnik's walls and Split's Roman palace draw millions of visitors. Catholicism and the memory of the 1991 to 1995 independence war shape national identity. The national football team's run to the 2018 World Cup final and third place in 2022 are huge sources of pride. Klapa a cappella singing is UNESCO-listed.
  society: >-
    Tourism is about a fifth of the economy. Croatia joined the euro and Schengen in 2023. Emigration of young people to Germany and Ireland has shrunk the population, and labour shortages are filled by workers from Asia. Debates over the legacy of the Ustaša wartime regime still flare.
  baseline: >-
    Andrej Plenković's HDZ formed a coalition with the nationalist Homeland Movement after the 2024 election. Zoran Milanović, a former Social Democrat prime minister, won re-election as president in January 2025 by a landslide and has clashed with the government over Ukraine and NATO.
  leaders: {state: "President Zoran Milanović, since 2020", gov: "Prime Minister Andrej Plenković, since 2016"}
  power: >-
    A parliamentary republic. The prime minister leads the majority in the 151-seat Sabor; the
    directly elected president commands the armed forces and shares responsibility for foreign
    policy.
  story: steady

CYP:
  pop: 1.4
  religion: Greek Orthodox about 75% in the south, Sunni Muslim in the north
  system: presidential
  story: election
  snapshot: >-
    The far-right ELAM doubled its seats in May 2026's parliamentary election, and a YouTuber's new party got in too, as Cyprus held the EU presidency.
  tags: [Divided island, EU presidency 2026, Far-right rise, Banking and shipping]
  culture: >-
    Cyprus is said to be Aphrodite's birthplace, and its culture blends Greek, Turkish, Venetian and British influences. Halloumi cheese, meze and village festivals are central. The island has been divided since 1974, when Turkey invaded after a Greek-backed coup, and the Green Line runs through Nicosia, the last divided capital in Europe.
  society: >-
    The Republic of Cyprus, in the south, is an EU member with an economy built on tourism, shipping and finance, including a history of hosting Russian money. The north, recognised only by Turkey, depends on Ankara. Reunification talks have been stalled since 2017. Migration across the Green Line has become a political issue.

CZE:
  pop: 10.9
  religion: No religion about 70%, Catholic about 9%
  system: parliamentary
  story: steady
  snapshot: >-
    Billionaire Andrej Babiš returned as prime minister with the hard right, promising "not a crown" of Czech money for Ukraine, while President Petr Pavel acts as a check.
  tags: [Babiš returns, Industrial economy, Beer culture, Least religious in Europe]
  culture: >-
    Prague's medieval centre and Charles Bridge are among Europe's most visited sights. The Czechs are among the world's least religious people and its biggest beer drinkers per head, with Pilsner born in Plzeň. Kafka, Kundera and Havel, the dissident playwright who became president, are literary icons. Ice hockey is the top sport.
  society: >-
    The Czech Republic has one of the EU's lowest unemployment rates and a strong car industry led by Škoda. The 1989 Velvet Revolution and the 1993 peaceful split from Slovakia are points of pride. Babiš, whose companies have faced EU conflict of interest rulings, leads a populist coalition with the SPD and the Motorists.
  update: >-
    In the Senate elections that ended on 17 October, opposition parties won 22 of the 27 seats
    contested, and Babiš's ANO won none. It was the first time governing parties failed to win a
    single seat in a Czech Senate election.
  update_date: 2026-10-17
  sources_extra:
    - {label: "AP: Czech Senate election", url: "https://apnews.com/article/czech-republic-senate-election-babis-d206f3edbc7ea0f73b0dbd07b339820b"}

DNK:
  pop: 6.0
  religion: Lutheran about 72% (church members), largely secular
  system: const-monarchy
  story: election
  snapshot: >-
    Mette Frederiksen's snap election backfired with her party's worst result in 120 years, but she clung on in a third government with Lars Løkke Rasmussen as kingmaker.
  tags: [Greenland pressure, Welfare state, Hygge, Strict immigration policy]
  culture: >-
    Denmark exported hygge, the idea of cosy togetherness, as well as Lego, Danish design and Nordic noir TV. Cycling dominates Copenhagen. The monarchy is Europe's oldest, and King Frederik X succeeded his mother Margrethe in 2024. Hans Christian Andersen and Søren Kierkegaard are national icons.
  society: >-
    Danes pay high taxes for a generous welfare state and are often ranked among the world's happiest people. Novo Nordisk, maker of Ozempic, became Europe's most valuable company. The Social Democrats adopted one of Europe's strictest immigration policies. Trump's demands to take over Greenland, part of the Danish realm, have dominated foreign policy.

EST:
  pop: 1.37
  religion: No religion about 58%, Orthodox about 16%, Lutheran about 8%
  system: parliamentary
  snapshot: >-
    The digital republic on NATO's eastern edge elected a new president, constitutional watchdog Ülle Madise, in 2026, while its governing coalition struggles in the polls.
  tags: [E-government pioneer, NATO frontline, Russian minority, Startups]
  culture: >-
    Estonia's Song Festival, where some 30,000 singers perform together, helped drive the "Singing Revolution" that won independence from the Soviet Union in 1991. Saunas, especially the smoke sauna of the south, are UNESCO-listed. Estonian is related to Finnish, not to its Baltic neighbours' languages. Tallinn's medieval old town is one of Europe's best preserved.
  society: >-
    Estonia runs almost all public services online, including voting, and produced Skype and many startups. About a quarter of the population is ethnic Russian, concentrated in Narva and Tallinn. Defence spending is among NATO's highest, reflecting fear of Russia. Tax rises to fund defence have hurt the government's popularity.
  baseline: >-
    Kristen Michal of the Reform Party became prime minister in 2024 after Kaja Kallas left to become the EU's foreign policy chief. In September 2026, parliament elected Ülle Madise, the chancellor of justice, as president, succeeding Alar Karis. A parliamentary election is due in March 2027.
  leaders: {state: "President Ülle Madise, since October 2026", gov: "Prime Minister Kristen Michal, since 2024"}
  power: >-
    A parliamentary republic. The prime minister leads the majority in the 101-seat Riigikogu; the
    president is elected by parliament or an electoral college and is largely ceremonial.
  story: election
  sources:
    - {label: "ERR: Estonia elects a new president", url: "https://news.err.ee/1610126071/estonia-elects-new-president"}

FIN:
  pop: 5.6
  religion: Lutheran about 63% (church members), no religion about 33%
  system: parliamentary
  snapshot: >-
    NATO's newest frontline state, which joined in 2023 after decades of neutrality, now led by a right-wing coalition cutting spending as unemployment rises.
  tags: [NATO frontline, Sauna culture, Education model, Happiest country rankings]
  culture: >-
    Finland has more saunas than cars, and sauna culture is UNESCO-listed. Its design heritage, from Marimekko and Alvar Aalto to Nokia and Angry Birds, is famous. The Sámi people of Lapland have their own languages and reindeer herding traditions. Finns prize sisu, a stubborn perseverance, and silence is socially comfortable.
  society: >-
    Finland regularly tops world happiness rankings and has a celebrated school system. Its 1,340-kilometre border with Russia, now closed, shapes security policy, and it maintains large reserves through conscription. The economy has stagnated since Nokia's phone business collapsed, and unemployment is among the EU's highest.
  baseline: >-
    Petteri Orpo's National Coalition leads a coalition with the nationalist Finns Party that has cut benefits and spending. Alexander Stubb, a former prime minister, won the presidency in 2024 and has become a prominent voice on Ukraine and a golf partner of Trump. The next parliamentary election is due in April 2027.
  leaders: {state: "President Alexander Stubb, since 2024", gov: "Prime Minister Petteri Orpo, since 2023"}
  power: >-
    A parliamentary republic. The prime minister leads a majority coalition in the 200-seat
    Eduskunta; the directly elected president leads foreign and security policy together with the
    government.
  story: steady

FRA:
  pop: 68.6
  religion: Catholic about 45%, Muslim about 8%, no religion about 35%
  system: semi-presidential
  story: steady
  snapshot: >-
    Sébastien Lecornu survived as prime minister and passed a budget, as the race to succeed Macron in 2027 opened with the far right in its strongest position ever.
  tags: [Hung parliament, 2027 race, Far-right rise, Nuclear power, Laïcité]
  culture: >-
    France has long been a global reference for food, wine, fashion, philosophy and cinema, and it is the world's most visited country. Laïcité, a strict separation of religion and state, shapes debates over headscarves in schools. The Tour de France, Cannes and the restored Notre-Dame, reopened in 2024, are national rituals.
  society: >-
    France has a large welfare state funded by Europe's highest tax burden, and a deficit and debt that markets watch nervously. Pension reform triggered huge protests in 2023. Tensions over immigration, Islam and the banlieues fuel support for the National Rally. It is the EU's only nuclear-armed state and gets most of its power from nuclear reactors.

GEO:
  pop: 3.7
  religion: Georgian Orthodox about 84%, Muslim about 10%
  system: parliamentary
  system_note: Billionaire Bidzina Ivanishvili, the ruling party's founder, is widely seen as the real power.
  story: unrest
  snapshot: >-
    Georgian Dream moved to ban the three biggest opposition parties and jailed protesters, as the country's EU dream receded and it drifted toward Moscow.
  tags: [Democratic backsliding, Frozen EU path, Wine birthplace, Protest movement]
  culture: >-
    Georgia claims to be the birthplace of wine, made for 8,000 years in clay vessels called qvevri, a UNESCO-listed method. The supra, a feast led by a toastmaster called the tamada, is the heart of social life. Polyphonic singing, a unique alphabet and the Orthodox Church shape identity. Khachapuri, cheese bread, is a national dish.
  society: >-
    Georgia fought a short war with Russia in 2008, and Russia occupies about a fifth of its territory in Abkhazia and South Ossetia. Most Georgians support joining the EU, and nightly protests followed the government's 2024 decision to suspend accession talks. Laws on "foreign agents" and LGBT rights mirror Russia's.

DEU:
  pop: 83.5
  religion: Catholic about 24%, Protestant about 22%, Muslim about 6%, no religion about 45%
  system: parliamentary
  story: election
  snapshot: >-
    The far-right AfD won nearly 44 percent in Saxony-Anhalt in September 2026, three seats short of a majority, a heavy blow to Chancellor Friedrich Merz.
  tags: [AfD surge, Economic stagnation, Defence build-up, East-west divide]
  culture: >-
    Germany's culture spans Goethe and Beethoven, the Bauhaus, Berlin's techno clubs and a beer and sausage tradition with regional variations. Football, especially the Bundesliga, is the top sport. Remembrance of the Holocaust is built into schooling and public life. Christmas markets and Oktoberfest are global exports.
  society: >-
    Germany is Europe's largest economy, built on cars, machinery and chemicals, but it barely grew from 2023 to 2025 as cheap Russian gas vanished and Chinese competition rose. It took in more than a million refugees in 2015 to 2016 and again from Ukraine. The east, once communist, is poorer and older, and the AfD is strongest there.
  update: >-
    On 12 October Baerbel Bas resigned as labour minister and SPD co-leader, citing her stepdaughter's death
    and public attacks, including from within the coalition partner. Alexander Schweitzer, former premier of
    Rhineland-Palatinate, took over the ministry, and the SPD will re-elect its whole leadership at a special
    conference at the end of the year. Merz's coalition trails in the polls after September state election losses.
  update_date: 2026-10-30
  sources_extra:
    - {label: "Oman Observer (Reuters): Germany's coalition hit by turmoil as labour minister quits", url: "https://www.omanobserver.om/article/1197678/world/europe/germanys-coalition-hit-by-turmoil-as-labour-minister-quits"}

GRC:
  pop: 10.4
  religion: Greek Orthodox about 90%
  system: parliamentary
  story: unrest
  snapshot: >-
    A fraud scandal over EU farm subsidies, centred on Crete, led to indictments of lawmakers from Mitsotakis's own party and dented his government.
  tags: [Subsidy scandal, Tourism economy, Post-crisis recovery, Ancient heritage]
  culture: >-
    Greece is the cradle of Western philosophy, democracy and theatre, and the Acropolis remains its emblem. The Orthodox Church shapes holidays, with Easter the biggest. Islands like Santorini and Mykonos draw millions of visitors. Rebetiko, the "Greek blues" born in refugee communities, and bouzouki music fill tavernas.
  society: >-
    The 2010s debt crisis cost Greece a quarter of its economy and sent hundreds of thousands of young people abroad. Growth has returned and debt is falling. Tourism is about a fifth of GDP. The 2023 Tempi rail crash, which killed 57, sparked the largest protests in years over corruption and state failure.

VAT:
  pop: 0.0008
  name: Holy See (Vatican City)
  religion: Catholic
  system: religious
  system_note: An elective monarchy in which the pope holds full legislative, executive and judicial power.
  story: steady
  snapshot: >-
    The first American pope, Leo XIV, made artificial intelligence the theme of his first encyclical and declared the traditionalist Society of St Pius X in schism.
  tags: [First American pope, AI encyclical, 1.4 billion Catholics, Smallest state]
  culture: >-
    The Vatican, the world's smallest state, holds St Peter's Basilica, the Sistine Chapel and one of the greatest art collections ever assembled. Latin remains its official language. The Swiss Guard, in uniforms said to have been designed in the Renaissance, has protected the pope since 1506.
  society: >-
