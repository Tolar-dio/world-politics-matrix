  society: >-
    Under Orbán, Hungary became the EU's model of "illiberal democracy", with friendly oligarchs owning most media and billions in EU funds frozen over rule-of-law concerns. Magyar, a former Fidesz insider, has promised to unlock those funds and fight corruption. Hungary has an ageing population and low wages by EU standards.
