# Culture, society and fact profiles: the Americas

ATG:
  pop: 0.094
  religion: Christian, mostly Anglican and other Protestant
  system: const-monarchy
  snapshot: >-
    A twin-island Caribbean state built on tourism, where Gaston Browne won a landslide fourth term
    in April 2026.
  tags: [Tourism economy, Commonwealth realm, Reparations campaign, Cricket]
  culture: >-
    Antigua claims a beach for every day of the year. Carnival, held in late July and early August to mark emancipation from slavery in 1834, is the biggest event of the year, with calypso and steel pan competitions. Cricket is a passion; Sir Viv Richards, one of the game's greatest batsmen, is Antiguan, and the national stadium bears his name.
  society: >-
    Tourism, especially cruise ships and luxury resorts, accounts for most of the economy. Barbuda, the sister island, was devastated by Hurricane Irma in 2017, and a dispute over land rights there has pitted Barbudans against the government. A citizenship-by-investment programme is a big source of revenue.
  baseline: >-
    Gaston Browne's Antigua and Barbuda Labour Party won the 30 April 2026 general election by a
    landslide, giving him a fourth term after a narrower win in 2023. Browne has been a prominent
    voice for climate finance and slavery reparations and has said a referendum on becoming a
    republic could follow.
  leaders: {state: "King Charles III, represented by a governor-general", gov: "Prime Minister Gaston Browne, since 2014, re-elected April 2026"}
  power: >-
    A parliamentary democracy and Commonwealth realm. The prime minister leads the majority in the
    17-seat House of Representatives; a governor-general represents the king.
  story: election
  sources:
    - {label: "One News St Vincent: Browne's fourth term", url: "https://onenewsstvincent.com/2026/05/01/gaston-browne-secures-4th-term-with-landslide-election-victory-in-antigua/"}

ARG:
  pop: 45.9
  religion: Catholic about 63%, growing evangelical and non-religious shares
  system: presidential
  story: steady
  snapshot: >-
    Javier Milei's chainsaw austerity crushed inflation and won him a labour reform in 2026, but factories and shops are shrinking and jobs are now the top worry.
  tags: [Milei's libertarian experiment, Inflation tamed, Football, Tango, Debt history]
  culture: >-
    Argentina is football: Maradona is close to a saint, and Messi's 2022 World Cup brought millions onto the streets. Tango was born in Buenos Aires' port neighbourhoods in the late 1800s. Sunday asado, mate passed around a circle, and Italian and Spanish immigrant roots shape daily life. Borges and Cortázar gave Argentina a towering literary tradition.
  society: >-
    A century ago one of the world's richest countries, Argentina has since defaulted nine times. Poverty rose above 50 percent in early 2024 before falling as inflation eased. Peronism, the movement founded by Juan Perón, still shapes unions and politics. The pampas make it a farm superpower in beef, soy and wheat, and Vaca Muerta shale is a new oil frontier.

BHS:
  pop: 0.40
  religion: Christian, mostly Baptist, Anglican and Catholic
  system: const-monarchy
  snapshot: >-
    A tourism and offshore finance archipelago where Philip Davis won a rare second consecutive term for his party in a May 2026 snap election.
  tags: [Tourism and finance, Commonwealth realm, Hurricane risk, Junkanoo]
  culture: >-
    Junkanoo, a street parade of costumed dancers, cowbells and goatskin drums held on Boxing Day and New Year's Day, is the heart of Bahamian culture and has roots in the festivities of enslaved Africans. Conch, eaten raw in salads or fried, is the national dish. Rake-and-scrape music uses a saw scraped with a knife.
  society: >-
    The 700 islands live mainly from tourism, including mega-resorts and cruise ships, and from offshore banking. Hurricane Dorian in 2019 devastated Abaco and Grand Bahama. Many Haitian migrants live in informal settlements, a sensitive political issue. Most Bahamians live on New Providence, around Nassau.
  baseline: >-
    Philip "Brave" Davis of the Progressive Liberal Party became prime minister in 2021. He called an early election for May 2026 and won a second term, the first time in three decades that a Bahamian government had been re-elected.
  leaders: {state: "King Charles III, represented by a governor-general", gov: "Prime Minister Philip Davis, since 2021"}
  power: >-
    A parliamentary democracy and Commonwealth realm. The prime minister leads the majority in the
    41-seat House of Assembly, elected by first past the post.
  story: election
  sources:
    - {label: "CBC Barbados: Davis guides his party to victory", url: "https://www.cbc.bb/news/caribbean-news/bahamas-prime-minister-davis-guides-ruling-party-to-victory-in-general-elections/"}

BRB:
  pop: 0.28
  religion: Christian, mostly Anglican and Pentecostal
  system: parliamentary
  snapshot: >-
    A republic since 2021, where Mia Mottley, a leading global voice on climate finance, won a third term in February 2026 by sweeping all 30 seats.
  tags: [Republic since 2021, Climate finance leader, Rihanna, Cricket]
  culture: >-
    Barbados, settled by the English in 1627, was a sugar colony built on enslaved African labour, and its Bajan dialect, food and festivals reflect both legacies. Crop Over, a harvest festival revived in 1974, is a summer of calypso and soca ending in the Grand Kadooment parade. Rihanna, declared a National Hero in 2021, is the island's most famous daughter.
  society: >-
    Barbados has high literacy and life expectancy for the region and relies on tourism and international business. It removed Queen Elizabeth II as head of state in 2021. Mottley's Bridgetown Initiative pushes the IMF and World Bank to change lending to climate-vulnerable nations.
  baseline: >-
    Mia Mottley's Barbados Labour Party won all 30 seats in the February 2026 election, as it had in 2018 and 2022, giving her a third term. President Jeffrey Bostic took over as ceremonial head of state in 2025.
  leaders: {state: "President Jeffrey Bostic, since 2025", gov: "Prime Minister Mia Mottley, since 2018"}
  power: >-
    A parliamentary republic since 2021. The prime minister leads the majority in the 30-seat House
    of Assembly; the president, elected by parliament, is ceremonial.
  story: election
  sources:
    - {label: "AP via WTOP: Mottley's third term", url: "https://wtop.com/world/2026/02/barbados-prime-minister-clinches-a-third-term-in-office-after-a-clean-sweep-at-the-polls/"}

BLZ:
  pop: 0.42
  religion: Catholic about 40%, Protestant and other Christian
  system: const-monarchy
  snapshot: >-
    Central America's only English-speaking country, where Johnny Briceño won a landslide second term in 2025 and a border claim by Guatemala is before the World Court.
  tags: [English-speaking Central America, Barrier reef, Guatemala border claim, Kriol and Garifuna]
  culture: >-
    Belize mixes Kriol, Mestizo, Maya, Garifuna, Mennonite, East Indian and Chinese communities. The Garifuna, descended from shipwrecked Africans and Indigenous Caribs, are known for punta music and dance, and their language and music are UNESCO-listed. Ancient Maya cities like Caracol and Xunantunich dot the interior.
  society: >-
    The Belize Barrier Reef, the second-largest in the world, draws divers and underpins tourism, alongside sugar, citrus and bananas. Gang violence in Belize City is a persistent problem. Guatemala claims more than half of Belize's territory, a dispute both countries have taken to the International Court of Justice.
  baseline: >-
    Johnny Briceño's People's United Party won 26 of 31 seats in the March 2025 election, a second big win. The government has been negotiating a debt-for-nature swap and expanding protections for the reef.
  leaders: {state: "King Charles III, represented by a governor-general", gov: "Prime Minister Johnny Briceño, since 2020"}
  power: >-
    A parliamentary democracy and Commonwealth realm. The prime minister leads the majority in the
    31-seat House of Representatives; the Senate is appointed.
  story: steady

BOL:
  pop: 12.6
  religion: Catholic about 70%, evangelical about 20%
  system: presidential
  system_note: A "plurinational state" recognising 36 Indigenous nations.
  story: shock
  snapshot: >-
    The first non-MAS president in two decades scrapped fuel subsidies and turned to the IMF to stop an economic collapse that left queues at petrol stations.
  tags: [End of MAS era, Fuel crisis, Lithium triangle, Indigenous majority, Andean culture]
  culture: >-
    Bolivia has the largest Indigenous share of any South American country, with Quechua and Aymara the biggest groups, and 37 official languages. Cholitas, Aymara women in bowler hats and layered skirts, have reclaimed a once-derided style and even appear as wrestlers in El Alto. The Oruro Carnival and its Diablada devil dance are UNESCO-listed.
  society: >-
    Under Evo Morales, the first Indigenous president, gas revenues cut poverty sharply. As gas output fell, dollars ran out, fuel imports dried up and inflation rose. Bolivia holds some of the world's largest lithium deposits. Coca leaf, chewed and drunk as tea, is legal and culturally central.

BRA:
  pop: 212
  religion: Catholic about 56%, evangelical about 27%
  system: presidential
  story: election
  snapshot: >-
    Lula came from behind to beat Flávio Bolsonaro in the 25 October 2026 runoff and win a record
    fourth term, and Bolsonaro says he will not recognise the result.
  tags: [Lula vs Bolsonaro, Amazon, Agribusiness giant, Football and carnival, Evangelical surge]
  culture: >-
    Brazil is the world's largest Portuguese-speaking country and its culture is a fusion of Indigenous, African and European roots, from samba and bossa nova to funk carioca and sertanejo. Carnival in Rio and Salvador is the world's biggest street party. Football, with five World Cup wins, is a national religion, and telenovelas shape national conversation.
  society: >-
    Brazil is a farm superpower in soy, beef, coffee and sugar, and home to most of the Amazon rainforest, whose deforestation has slowed and sped up with politics. Inequality is among the world's highest. Evangelical churches have grown fast and become a major political force on the right. Gangs like the PCC and Comando Vermelho control parts of major cities.
  update: >-
    On 25 October Lula won the runoff with 51.8 percent to 48.2 percent for Flávio Bolsonaro, on
    80.8 percent turnout, overturning his first-round deficit for a record fourth, non-consecutive
    term that begins on 5 January 2027. Bolsonaro refused to concede, citing a last-minute extension
    of voting hours; the next day the Supreme Court barred him from leaving the country, and media
    reported he flew to the United States anyway.
  update_date: 2026-10-26
  holders: >-
    President Luiz Inácio Lula da Silva (PT), re-elected on 25 October 2026 for a fourth term
    starting on 5 January 2027.
  sources_extra:
    - {label: "Al Jazeera: takeaways from Lula's win", url: "https://www.aljazeera.com/news/2026/10/26/brazil-election-2026-key-takeaways-from-lulas-historic-win"}
    - {label: "CNBC: Lula wins a fourth term", url: "https://www.cnbc.com/2026/10/26/brazil-lula-win-presidential-election-runoff-vote.html"}
    - {label: "AP via PBS: Lula beats Bolsonaro in runoff", url: "https://www.pbs.org/newshour/world/brazil-votes-in-a-tense-lula-vs-bolsonaro-runoff-with-u-s-influence-over-latin-america-at-stake"}
    - {label: "Reuters: Flávio Bolsonaro leaves Brazil for US", url: "https://www.reuters.com/world/americas/flavio-bolsonaro-leaves-brazil-us-after-election-defeat-source-media-say-2026-10-27/"}

CAN:
  pop: 40.1
  religion: Christian about 53%, no religion about 35%
  system: const-monarchy
  story: shock
  snapshot: >-
    Canada walked out of trade talks and hit back with tariffs of its own after Trump imposed 50 percent duties, with three in four Canadians backing the fight.
  tags: [Trade war with the US, Multicultural, Hockey, Resource economy, Bilingual]
  culture: >-
    Canada defines itself by its bilingualism, with French-speaking Quebec a distinct nation within it, and by an official multiculturalism; more than a fifth of residents were born abroad. Hockey is the national passion. First Nations, Inuit and Métis cultures have gained recognition after a reckoning with residential schools. Toronto and Montreal are major hubs for film, music and AI research.
  society: >-
    Canada exports oil, minerals, timber and cars, three-quarters of them to the United States, which makes the trade war an existential threat. Housing costs have soared, especially in Toronto and Vancouver. Public healthcare is a point of national pride, though waiting times are long. Immigration targets were cut in 2024 after a population surge.

CHL:
  pop: 19.9
  religion: Catholic about 45%, evangelical about 15%, no religion about 35%
  system: presidential
  story: election
  snapshot: >-
    José Antonio Kast, a hard-right former congressman, took office in March 2026 promising to seal the northern border and deport irregular migrants.
  tags: [Hard-right turn, Copper and lithium, Pinochet legacy, Constitution debates]
  culture: >-
    Chile stretches 4,300 kilometres from the Atacama, the world's driest desert, to Patagonian glaciers. It produced two Nobel poets, Gabriela Mistral and Pablo Neruda, and the protest songs of Víctor Jara, killed after the 1973 coup. The cueca is the national dance, and Chilean wine is exported worldwide.
  society: >-
    Chile is the world's top copper producer and a lithium giant, and was long held up as Latin America's economic model. Huge 2019 protests over inequality led to two failed attempts to replace Augusto Pinochet's constitution. Rising crime and migration from Venezuela have dominated recent politics.

COL:
  pop: 53.4
  religion: Catholic about 70%, evangelical about 15%
  system: presidential
  story: election
  snapshot: >-
    Colombia swung from its first leftist president to Abelardo de la Espriella, a millionaire lawyer who promised a Bukele-style crackdown on armed groups.
  tags: [Hard-right turn, Armed groups, Coffee and coal, Cumbia and vallenato]
  culture: >-
    Colombia is the land of Gabriel García Márquez's magical realism, vallenato accordion music and cumbia, and global pop stars Shakira, Karol G and J Balvin. Medellín's transformation from cocaine capital to innovation hub is a national story. Coffee culture, salsa in Cali and Barranquilla's carnival are sources of pride.
  society: >-
    A 2016 peace deal disarmed the FARC guerrillas after 50 years of war, but dissident factions, the ELN and the Clan del Golfo cartel still fight over coca and mining areas. Colombia remains the world's largest cocaine producer. It has taken in nearly three million Venezuelans. Inequality and land ownership are long-running grievances.

CRI:
  pop: 5.2
  religion: Catholic about 47%, evangelical about 22%
  system: presidential
  story: election
  snapshot: >-
    Laura Fernández, a protégé of the outgoing populist president, won in the first round in February 2026 on a promise to fight the rising drug violence.
  tags: [No army since 1948, Pura vida, Eco-tourism, Rising drug violence]
  culture: >-
    "Pura vida" is Costa Rica's greeting, farewell and philosophy. The country abolished its army in 1948 and spent the money on schools and hospitals, which it celebrates every December. A quarter of its land is protected, and eco-tourism is central to national identity. Gallo pinto, rice and beans, starts the day.
  society: >-
    Costa Rica has one of Latin America's highest life expectancies and nearly all its electricity comes from renewables. Medical device factories and tourism drive the economy. But homicides have hit record highs as Caribbean ports became transit points for cocaine, unsettling a country used to being the region's safe haven.

CUB:
  pop: 10.9
  religion: Catholic and Afro-Cuban Santería, many non-religious
  system: one-party
  story: shock
  snapshot: >-
    A US oil blockade after the fall of Maduro collapsed Cuba's power grid several times in 2026, leaving millions in the dark and sparking rare protests.
  tags: [Communist state, Energy collapse, Mass emigration, US embargo, Son and salsa]
  culture: >-
    Cuban music, from son and rumba to the Buena Vista Social Club and reggaeton, has shaped Latin sound worldwide. Santería blends Yoruba gods with Catholic saints. Baseball, classic American cars, cigars, and the faded colonial grandeur of Old Havana are global symbols of the island. Its ballet and medical schools are internationally respected.
  society: >-
    The 1959 revolution built free healthcare and education, but the economy has collapsed since the pandemic, with food, medicine and fuel shortages. More than a tenth of the population has emigrated since 2021. Cuba depended on Venezuelan oil, so the US move against Caracas hit it hard. Small private businesses have been allowed since 2021.

DMA:
  pop: 0.066
  religion: Catholic about 60%, Protestant
  system: parliamentary
  snapshot: >-
    The "nature island" of the Caribbean, rebuilt after Hurricane Maria in 2017 with a plan to become the first climate-resilient nation, led by Roosevelt Skerrit since 2004.
  tags: [Nature island, Kalinago territory, Citizenship by investment, Hurricane recovery]
  culture: >-
    Dominica is home to the Kalinago, the last surviving pre-Columbian Caribbean people, with their own territory on the east coast. Its French-based Creole, Kwéyòl, reflects alternating French and British rule. The World Creole Music Festival features bouyon, a local genre. Rainforests, a boiling lake and whale watching anchor tourism.
  society: >-
    Hurricane Maria in 2017 damaged nearly every building and caused losses of more than twice the island's GDP. Citizenship by investment funds much of the reconstruction. Agriculture, especially bananas, has declined. Skerrit's Dominica Labour Party has won every election since 2000.
  baseline: >-
    Roosevelt Skerrit won a sixth term in a 2022 snap election boycotted by the main opposition party. Sylvanie Burton, the first Kalinago head of state, became president in 2023.
  leaders: {state: "President Sylvanie Burton, since 2023", gov: "Prime Minister Roosevelt Skerrit, since 2004"}
  power: >-
    A parliamentary republic. The prime minister leads the majority in the House of Assembly; the
    president is elected by parliament and largely ceremonial.
  story: steady

DOM:
  pop: 11.5
  religion: Catholic about 50%, evangelical about 25%
  system: presidential
  snapshot: >-
    The Caribbean's fastest-growing big economy, run by Luis Abinader, whose hard line on Haitian migrants is popular at home and criticised abroad.
  tags: [Tourism boom, Haiti border, Baseball, Merengue and bachata]
  culture: >-
    Merengue and bachata, once considered lower-class music, are now national treasures and global exports. Baseball is a passion and a pipeline: more Major League players come from the Dominican Republic than from any other country outside the US. Santo Domingo's colonial zone holds the oldest cathedral in the Americas.
  society: >-
    Tourism, free trade zones, remittances and mining have driven decades of strong growth. The country shares Hispaniola with Haiti, and Haitian workers are crucial to construction and farming, but mass deportations of Haitians rose sharply under Abinader. A 2025 nightclub roof collapse in Santo Domingo killed over 200 people.
  baseline: >-
    Luis Abinader won re-election in 2024 with 57 percent and cannot run again in 2028. He has built
    a border wall with Haiti and stepped up deportations, which reached nearly 68,000 in the first
    two months of 2026 alone, and promoted a constitutional reform to stop future presidents from
    changing term limits.
  leaders: {state: "President Luis Abinader, since 2020", gov: "The president heads the government"}
  power: >-
    A presidential republic. The president is directly elected for four years, at most two
    consecutive terms, and heads the government; Congress has a Senate and a Chamber of Deputies.
  story: steady
  sources:
    - {label: "Zol FM: deportations in early 2026", url: "https://zolfm.com/noticia/rd-deporta-casi-68000-haitianos-en-los-primeros-dos-meses-de-2026"}

ECU:
  pop: 18.3
  religion: Catholic about 75%, evangelical about 12%
  system: presidential
  story: war
  snapshot: >-
    Daniel Noboa took his war on gangs across the border, launching joint operations with the US and slapping punishing tariffs on Colombia.
  tags: [War on gangs, Galápagos, Dollarised economy, Banana exports]
  culture: >-
    Ecuador spans Pacific beaches, Andean highlands, the Amazon and the Galápagos Islands, where Darwin observed finches. Quito's colonial centre was among the first UNESCO World Heritage sites. Kichwa communities keep strong Andean traditions, and the Panama hat is actually made in Ecuador, woven from toquilla straw.
  society: >-
    Ecuador uses the US dollar and is the world's largest banana exporter. In a few years, drug gangs turned it from one of the region's safest countries into one of its most violent, with prisons run by cartels. Noboa declared an "internal armed conflict" in 2024. Indigenous movements have led powerful protests against fuel price rises.

SLV:
  pop: 6.4
  religion: Catholic about 45%, evangelical about 35%
  system: presidential
  system_note: Power is concentrated in President Bukele.
  story: unrest
  snapshot: >-
    Nayib Bukele's gang crackdown made El Salvador one of the safest countries in the region, at the cost of mass detention and a near-total concentration of power.
  tags: [Bukele's crackdown, Mass incarceration, Bitcoin experiment, CECOT prison]
  culture: >-
    El Salvador is Central America's smallest country, and pupusas, thick corn tortillas stuffed with cheese or beans, are its national dish, with their own national day. Archbishop Óscar Romero, murdered in 1980 and canonised in 2018, remains a towering figure. Surf Town on the Pacific coast is a tourism showcase.
  society: >-
    A 1980 to 1992 civil war killed some 75,000. Gangs like MS-13, formed among refugees in Los Angeles, then dominated neighbourhoods until Bukele's state of emergency since 2022 jailed more than 80,000 people, over 1 percent of adults. Murders have fallen dramatically, and Bukele's approval is very high. The US has sent deportees to the CECOT mega-prison.

GRD:
  pop: 0.12
  religion: Catholic about 45%, Protestant
  system: const-monarchy
  snapshot: >-
    The "spice isle" of the Caribbean, governed since 2022 by Dickon Mitchell and still rebuilding Carriacou after Hurricane Beryl.
  tags: [Spice isle, Commonwealth realm, Hurricane Beryl, 1983 US invasion]
  culture: >-
    Grenada produces much of the world's nutmeg, which appears on its flag. Spicemas, its carnival, features jab jab revellers covered in black oil and molasses, mocking colonial slaveholders. The country's history includes the 1979 revolution of Maurice Bishop and the US invasion of 1983 after his murder.
  society: >-
    Tourism, nutmeg, cocoa and St George's University, a medical school for mainly American students, drive the economy. Hurricane Beryl in 2024 devastated Carriacou and Petite Martinique. Grenada's citizenship-by-investment programme brings in significant revenue.
  baseline: >-
    Dickon Mitchell, a lawyer, led the National Democratic Congress to victory in 2022, ending Keith Mitchell's long tenure. His government has focused on recovery and climate adaptation.
  leaders: {state: "King Charles III, represented by a governor-general", gov: "Prime Minister Dickon Mitchell, since 2022"}
  power: >-
    A parliamentary democracy and Commonwealth realm. The prime minister leads the majority in the
    15-seat House of Representatives.
  story: steady

GTM:
  pop: 18.7
  religion: Catholic about 40%, evangelical about 40%
  system: presidential
  story: election
  snapshot: >-
    The exit of attorney general Consuelo Porras in May 2026 ended a long siege on Bernardo Arévalo's anti-corruption presidency, with barely a year left before the 2027 election.
  tags: [Anti-corruption fight, Maya majority highlands, Migration to the US, Volcanoes]
  culture: >-
    More than 40 percent of Guatemalans are Maya, speaking over 20 languages, and the woven huipil blouses of each town are a living art form. The ruins of Tikal in the northern jungle were among the greatest Maya cities. Antigua Guatemala, ringed by volcanoes, is a colonial gem. Semana Santa processions over sawdust carpets are spectacular.
  society: >-
    A civil war from 1960 to 1996 killed some 200,000 people, most of them Maya, in what a UN-backed truth commission called genocide. Poverty, malnutrition and violence drive heavy migration to the US, and remittances are about a fifth of GDP. Elites and prosecutors long fought to undo anti-corruption efforts.

GUY:
  pop: 0.84
  religion: Christian about 63%, Hindu about 25%, Muslim about 7%
  system: presidential
  system_note: The executive president is chosen through party list voting.
  snapshot: >-
    An oil boom has made Guyana's economy the world's fastest-growing, and Irfaan Ali won a second term in 2025 promising to share the wealth, while Venezuela claims two-thirds of its land.
  tags: [Oil boom, Essequibo dispute, Indo- and Afro-Guyanese politics, Rainforest]
  culture: >-
    Guyana is South America's only English-speaking country and culturally Caribbean, with Indo-Guyanese and Afro-Guyanese communities, plus Amerindian peoples, Chinese and Portuguese. Phagwah (Holi), Diwali, Eid and Mashramani, the republic day carnival, are all national holidays. Kaieteur Falls, one of the world's highest single-drop waterfalls, lies in pristine rainforest.
  society: >-
    ExxonMobil's offshore discoveries since 2015 turned a poor country into a petro-state, with GDP growth above 30 percent some years. Politics has long split along ethnic lines between the PPP, backed mainly by Indo-Guyanese, and the PNC. Venezuela claims the Essequibo region and held a referendum in 2023 on annexing it.
  baseline: >-
    Irfaan Ali's People's Progressive Party won the September 2025 election, and a new party led by
    Azruddin Mohamed, a businessman sanctioned by the US, came second, displacing the PNC-led
    opposition. Ali has pledged to spend oil revenue on housing, health and cash grants. Even with
    Maduro gone from Caracas, the government says Venezuela's claim to the Essequibo region remains
    a threat.
  leaders: {state: "President Irfaan Ali, since 2020", gov: "Prime Minister Mark Phillips"}
  power: >-
    A presidential republic in which the leader of the winning party list becomes executive
    president for five years, at most two terms, and appoints a prime minister from parliament.
  story: steady
  sources:
    - {label: "AFP via NAMPA: Guyana wary of Venezuela", url: "https://www.nampa.org/text/22852191"}

HTI:
  pop: 11.9
  religion: Catholic about 55%, Protestant about 30%, Vodou widely practised alongside
  system: contested
  system_note: No elected officials; an interim prime minister governs while gangs control most of the capital.
  story: war
  snapshot: >-
    With gangs controlling most of Port-au-Prince and the transitional council's mandate expired, an unelected prime minister became Haiti's sole ruler in 2026.
  tags: [Gang war, No elected leaders, Mass displacement, First Black republic]
  culture: >-
    Haiti became the world's first Black republic in 1804 after a revolution of enslaved people defeated Napoleon's army. Haitian Creole is spoken by everyone, French by a minority. Vodou is a central spiritual tradition that blends West African religion with Catholicism. Haitian painting, especially naive art, and kompa music are internationally loved.
  society: >-
    Haiti is the poorest country in the Americas. Since the assassination of President Jovenel Moïse in 2021, gang coalitions have taken most of the capital and spread to the countryside, and more than a million people have been displaced. A Kenyan-led security mission struggled for lack of funds before the UN approved a new gang suppression force.

HND:
  pop: 11.0
  religion: Evangelical about 45%, Catholic about 35%
  system: presidential
  story: election
  snapshot: >-
    Nasry Asfura, endorsed by Trump days before the vote, took office in January 2026 after a disputed count returned the National Party to power.
  tags: [Election dispute, Migration, Maquila factories, Garifuna coast]
  culture: >-
    Honduras is home to the Maya ruins of Copán, famous for their carved stelae, and to Garifuna and Miskito communities on the Caribbean coast. Baleadas, flour tortillas with beans and cream, are the national street food. Football is followed passionately; a 1969 match helped spark a short war with El Salvador.
  society: >-
    Honduras has struggled with some of the world's highest murder rates, driven by gangs and drug trafficking, though they have fallen. Remittances from the US are about a quarter of GDP. Garment factories and coffee are key exports. Former president Juan Orlando Hernández was convicted of drug trafficking in New York in 2024 and pardoned by Trump in 2025.

JAM:
  pop: 2.8
  religion: Christian, mostly Protestant
  system: const-monarchy
  story: shock
  snapshot: >-
    Jamaica spent 2026 rebuilding its western parishes after Hurricane Melissa, among the strongest Atlantic storms on record to make landfall.
  tags: [Hurricane Melissa recovery, Reggae, Sprinting, Commonwealth realm]
  culture: >-
    Jamaica gave the world ska, rocksteady, reggae and dancehall, and Bob Marley remains one of the most recognised people on Earth. Rastafari, born in 1930s Jamaica, spread globally through music. Its sprinters, from Usain Bolt to Shelly-Ann Fraser-Pryce, dominate world athletics. Patois is spoken by nearly everyone, alongside English.
  society: >-
    Tourism, remittances and bauxite drive the economy. Jamaica has cut its debt dramatically over the past decade. Violent crime, much of it linked to gangs and politics in Kingston's garrison communities, has long been among the world's highest, though murders fell sharply in 2024 and 2025.

MEX:
  pop: 132
  religion: Catholic about 78%, evangelical about 10%
  system: presidential
  story: war
  snapshot: >-
    Mexican forces killed the boss of the Jalisco cartel in 2026, but a US indictment of a sitting governor from Sheinbaum's own party showed the pressure only growing.
  tags: [Cartel war, USMCA, World Cup co-host, First woman president, Morena dominance]
  culture: >-
    Mexico's culture draws on Aztec, Maya and other Indigenous civilisations and on Spanish colonial heritage. Día de Muertos, mariachi, lucha libre and a cuisine on UNESCO's heritage list are global icons. Frida Kahlo and Diego Rivera's murals defined modern Mexican art, and its filmmakers, like Guillermo del Toro and Alfonso Cuarón, lead Hollywood.
  society: >-
    Mexico is the United States' largest trading partner, and its factories are deeply woven into North American supply chains. Cartels control territory, extort businesses and drive a homicide rate that has topped 30,000 a year. More than 100,000 people are officially missing. Morena's dominance and a judicial overhaul have raised concerns about checks and balances.

NIC:
  pop: 7.0
  religion: Catholic about 45%, evangelical about 35%
  system: presidential
  system_note: In practice a one-family dictatorship.
  story: unrest
  snapshot: >-
    Daniel Ortega and his wife Rosario Murillo now rule as co-presidents, preparing an open family succession as rumours about his health swirl.
  tags: [Co-presidency, Repression, Mass exile, Sandinista history]
  culture: >-
    Nicaragua calls itself the land of poets, and Rubén Darío, father of Spanish-language modernism, is a national hero. Its Caribbean coast is home to Miskito, Creole and Garifuna communities with their own languages and autonomy. The Masaya volcano, Granada's colonial streets and surf beaches draw visitors.
  society: >-
    Since 2018 protests in which some 300 people died, the government has closed thousands of NGOs, seized universities, expelled priests and stripped hundreds of critics of citizenship. Hundreds of thousands have emigrated. The economy relies on remittances, gold, coffee and trade with the US under a free trade agreement.

PAN:
  pop: 4.6
  religion: Catholic about 60%, evangelical about 25%
  system: presidential
  story: shock
  snapshot: >-
    Under pressure from Trump, Panama's Supreme Court voided Hong Kong's CK Hutchison's contracts for the canal's two main ports, and the state took them over with Maersk as temporary operator.
  tags: [Panama Canal, Trump pressure, Logistics hub, Dollarised]
  culture: >-
    The canal shapes Panamanian identity; the 1999 handover from the US is a national milestone. Indigenous Guna people of the San Blas islands make the colourful mola textiles. Panama City's old quarter, Casco Viejo, sits across the bay from a skyline of banking towers. Rubén Blades made salsa a vehicle for political storytelling.
  society: >-
    The canal, banking, logistics and a large free trade zone make Panama one of Latin America's richest countries per head, but inequality is high. In 2023 mass protests forced the closure of a giant copper mine. Droughts have cut canal traffic, prompting plans for a new reservoir.

PRY:
  pop: 7.0
  religion: Catholic about 85%
  system: presidential
  snapshot: >-
    A landlocked farm economy run by the conservative Colorado Party almost continuously since 1947, now led by Santiago Peña, a close Trump and Milei ally.
  tags: [Colorado Party dominance, Guaraní language, Soy and beef, Taiwan ally]
  culture: >-
    Paraguay is the only country in the Americas where most people speak an Indigenous language, Guaraní, which is official alongside Spanish. Tereré, cold yerba mate, is drunk everywhere. The harp and the polka paraguaya are central to its music. The Jesuit missions of the 17th and 18th centuries left UNESCO-listed ruins.
  society: >-
    Paraguay is a top exporter of soy and beef, and the Itaipú and Yacyretá dams produce more electricity than it uses. Land is very unequally distributed. It is one of the few countries still recognising Taiwan instead of China. Smuggling and money laundering in the tri-border area with Brazil and Argentina are a concern.
  baseline: >-
    Santiago Peña, a former IMF economist, was elected in 2023 with the backing of former president
    Horacio Cartes, who has been sanctioned by the US for corruption. Peña has aligned closely with
    Washington, Israel and Argentina's Javier Milei. In 2026 he campaigned hard for the Colorado
    Party ahead of nationwide municipal elections, a test of the party's grip after decades in
    power.
  leaders: {state: "President Santiago Peña, since 2023", gov: "The president heads the government"}
  power: >-
    A presidential republic. The president is directly elected for a single five-year term; Congress
    has a Senate and a Chamber of Deputies, both dominated by the Colorado Party.
  story: election
  sources:
    - {label: "Última Hora: Peña joins the municipal campaign", url: "https://www.ultimahora.com/pena-entra-en-campana-municipal-para-asegurarse-de-que-todos-los-municipios-sean-de-la-anr"}

PER:
  pop: 34.6
  religion: Catholic about 70%, evangelical about 15%
  system: presidential
  system_note: Congress has unusually strong power to remove presidents.
  story: election
  snapshot: >-
    Keiko Fujimori won the presidency on her fourth attempt in 2026, after a decade in which Congress removed or forced out president after president.
  tags: [Political instability, Machu Picchu, Copper and gold, Gastronomy]
  culture: >-
    Peru was the heart of the Inca empire, and Quechua and Aymara are still widely spoken. Machu Picchu and Cusco draw visitors from around the world. Lima is a world food capital, with ceviche and a Japanese-Peruvian fusion called Nikkei. Mario Vargas Llosa, who died in 2025, won the Nobel Prize in Literature.
  society: >-
    Peru has had seven presidents since 2016, several of them jailed. Mining of copper, gold and silver drives the economy, and the central bank has kept inflation low despite the chaos. Informal work dominates. Deadly protests after the ouster of Pedro Castillo in 2022 exposed deep divides between Lima and the southern Andes.

KNA:
  pop: 0.047
  religion: Christian, mostly Anglican and Methodist
  system: const-monarchy
  snapshot: >-
    The smallest country in the Americas, a two-island federation financed largely by selling citizenship to foreign investors.
  tags: [Smallest state in the Americas, Citizenship by investment, Commonwealth realm, Former sugar colony]
  culture: >-
    St Kitts was the first British colony in the Caribbean, and Brimstone Hill Fortress is UNESCO-listed. Its carnival, called Sugar Mas, runs from late November into January. Nevis, the sister island, was the birthplace of Alexander Hamilton. Masquerade troupes and string bands keep older traditions alive.
  society: >-
    The sugar industry closed in 2005, and tourism and citizenship sales now dominate. The programme has faced US and EU scrutiny over security risks. Nevis has its own assembly and the constitutional right to secede, which it narrowly failed to use in a 1998 vote.
  baseline: >-
    Terrance Drew, a doctor, led the St Kitts and Nevis Labour Party to victory in 2022.
  leaders: {state: "King Charles III, represented by a governor-general", gov: "Prime Minister Terrance Drew, since 2022"}
  power: >-
    A federal parliamentary democracy and Commonwealth realm. The prime minister leads the majority
    in the National Assembly; Nevis has its own assembly and premier.
  story: steady

LCA:
  pop: 0.18
  religion: Catholic about 60%, Protestant
  system: const-monarchy
  snapshot: >-
    A volcanic island of the Pitons, governed by Philip J. Pierre's Labour Party, re-elected in December 2025.
  tags: [The Pitons, Two Nobel laureates, Tourism, Commonwealth realm]
  culture: >-
    Saint Lucia has produced two Nobel laureates, the economist Arthur Lewis and the poet Derek Walcott, more per head than any other country. Kwéyòl, a French-based creole, is widely spoken alongside English, reflecting the island's 14 changes of hands between France and Britain. Friday night street parties in Gros Islet are a weekly ritual.
  society: >-
    Tourism dominates, with the twin Pitons volcanic spires as the island's emblem. Bananas were once the main export. Violent crime has risen, worrying an economy dependent on visitors.
  baseline: >-
    Philip J. Pierre's Saint Lucia Labour Party won a second term in the December 2025 election.
  leaders: {state: "King Charles III, represented by a governor-general", gov: "Prime Minister Philip J. Pierre, since 2021"}
  power: >-
    A parliamentary democracy and Commonwealth realm. The prime minister leads the majority in the
    17-seat House of Assembly.
  story: steady

VCT:
  pop: 0.10
  religion: Christian, mostly Protestant
  system: const-monarchy
  snapshot: >-
    Voters ended Ralph Gonsalves's 24 years in power in November 2025, handing the opposition NDP a landslide and making Godwin Friday prime minister.
  tags: [Change of government, Grenadines, Hurricane Beryl, Commonwealth realm]
  culture: >-
    The islands mix African, Garifuna, Carib, Portuguese and Indian heritage. Vincy Mas, held in midsummer, is the main carnival. The Garifuna people trace their origins to St Vincent, from which the British deported them in 1797, and their national hero, Chief Joseph Chatoyer, is honoured every March.
  society: >-
    Agriculture, especially bananas and arrowroot, and tourism in the Grenadines like Bequia and Mustique drive the economy. The La Soufrière volcano erupted in 2021, and Hurricane Beryl in 2024 wrecked Union Island.
  baseline: >-
    In November 2025 the New Democratic Party, led by Godwin Friday, won a large majority, ending the Unity Labour Party government of Ralph Gonsalves, one of the world's longest-serving elected leaders.
  leaders: {state: "King Charles III, represented by a governor-general", gov: "Prime Minister Godwin Friday, since November 2025"}
  power: >-
    A parliamentary democracy and Commonwealth realm. The prime minister leads the majority among
    the 15 elected members of the House of Assembly, which also has appointed senators.
  story: steady
  sources:
    - {label: "One News St Vincent: Friday sworn in", url: "https://onenewsstvincent.com/2025/11/29/dr-godwin-friday-sworn-in-as-prime-minister/"}

SUR:
  pop: 0.64
  religion: Hindu about 22%, Protestant about 23%, Catholic about 22%, Muslim about 14%
  system: presidential
  system_note: The president is elected by parliament.
  snapshot: >-
    Suriname's first woman president, Jennifer Geerlings-Simons, took office in 2025 as the country prepares for an offshore oil boom.
  tags: [First woman president, Coming oil boom, Multi-ethnic, Rainforest]
  culture: >-
    Suriname is one of the world's most ethnically diverse countries, with Hindustani, Creole, Maroon, Javanese, Indigenous, Chinese and Dutch communities. Dutch is official, but Sranan Tongo is the common street language. A mosque and synagogue stand side by side in Paramaribo, whose wooden colonial centre is UNESCO-listed.
  society: >-
    More than 90 percent of the country is covered in rainforest. Gold and oil drive exports, and TotalEnergies' offshore field is due to start producing in 2028. The country went through a debt default and high inflation earlier this decade.
  baseline: >-
    Jennifer Geerlings-Simons, a doctor and long-time speaker of parliament from the National
    Democratic Party founded by the late dictator Dési Bouterse, was elected president by parliament
    in July 2025 after her party narrowly won the May election. Production from TotalEnergies'
    offshore field is due in 2028, and her government is preparing for a sudden flood of revenue in
    one of South America's poorer countries.
  leaders: {state: "President Jennifer Geerlings-Simons, since July 2025", gov: "The president heads the government"}
  power: >-
    An executive presidency chosen by parliament: the 51-seat National Assembly elects the
    president, who heads the government with a vice-president.
  story: steady
  sources:
    - {label: "Americas Quarterly: preparing for an oil boom", url: "https://www.americasquarterly.org/article/surinames-president-prepares-for-an-oil-boom/"}

TTO:
  pop: 1.5
  religion: Christian about 55%, Hindu about 18%, Muslim about 5%
  system: parliamentary
  snapshot: >-
    The Caribbean's energy powerhouse, under a state of emergency over gang violence since March
    2026, led by a prime minister closely aligned with Washington on Venezuela.
  tags: [Oil and gas, Carnival, Steelpan, Gang violence]
  culture: >-
    Trinidad's Carnival is one of the world's great festivals, with calypso, soca and masquerade bands. The steelpan, made from oil drums in the 1930s, is the national instrument. Indo-Trinidadians, descended from indentured labourers, have made chutney music, Diwali and Phagwah part of national life. Cricket and Brian Lara are sources of pride.
  society: >-
    Oil, gas and petrochemicals have made the country relatively wealthy, though output is declining. Gang violence has driven murders to record highs, prompting states of emergency. Politics largely splits between the Afro-Trinidadian-backed PNM and the Indo-Trinidadian-backed UNC.
  baseline: >-
    Kamla Persad-Bissessar's United National Congress won the April 2025 election, returning her to
    the job she held from 2010 to 2015. She has aligned closely with the Trump administration on
    Venezuela, though she said Trinidad took no part in the January 2026 raid that seized Maduro. In
    March 2026 her government declared a new state of emergency over persistent violent crime and
    later extended it.
  leaders: {state: "President Christine Kangaloo", gov: "Prime Minister Kamla Persad-Bissessar, since May 2025"}
  power: >-
    A parliamentary republic. The prime minister leads the majority in the 41-seat House of
    Representatives; the president is elected by parliament and largely ceremonial. Tobago has its
    own House of Assembly.
  story: unrest
  sources:
    - {label: "Al Jazeera: state of emergency extended", url: "https://www.aljazeera.com/news/2026/3/14/trinidad-and-tobago-extends-state-of-emergency-for-another-three-months"}
    - {label: "Gleaner: not part of the US operation", url: "https://jamaica-gleaner.com/article/news/20260103/pm-says-trinidad-not-part-us-military-operation-against-venezuela"}

USA:
  pop: 347
  religion: Protestant about 40%, Catholic about 20%, no religion about 28%
  system: presidential
  story: election
  snapshot: >-
    Trump's approval has sunk below 40 percent ahead of the 3 November midterms, after a year of tariffs, an Iran war and a military raid that seized Venezuela's president.
  tags: [Midterms 2026, Trump second term, Tariffs, Iran war, Polarisation]
  culture: >-
    American culture is the world's most widely exported, from Hollywood and hip-hop to the NFL, NBA and fast food. Its universities and tech companies attract talent worldwide. The country is shaped by waves of immigration, from Europe, Africa through slavery, Latin America and Asia, and by a strong religious tradition, especially evangelical Protestantism in the South.
  society: >-
    The US is the world's largest economy and military power. Politics is sharply polarised between Republicans and Democrats, and between cities and rural areas. Healthcare is the most expensive in the world, gun violence is high, and debates over immigration, abortion and the limits of presidential power dominate. The 250th anniversary of independence falls on 4 July 2026.

URY:
  pop: 3.4
  religion: Catholic about 40%, no religion about 40%
  system: presidential
  snapshot: >-
    One of the world's most stable democracies, where centre-left Yamandú Orsi took office in 2025 in a smooth handover typical of Uruguayan politics.
  tags: [Stable democracy, Secular society, Legal cannabis, Football and mate]
  culture: >-
    Uruguay is Latin America's most secular country; the state renamed Christmas "Family Day" a century ago. Mate is carried everywhere in a thermos. Candombe drumming, with African roots, fills Montevideo's streets during carnival, the longest in the world. Football heroics, including two World Cup wins, are central to national identity.
  society: >-
    Uruguay has the lowest poverty and inequality in Latin America, a large middle class and one of the highest shares of renewable electricity anywhere. It was the first country to legalise cannabis, in 2013, and was early on same-sex marriage. Rising crime linked to drug trafficking is the main public worry.
  baseline: >-
    Yamandú Orsi of the left-wing Frente Amplio, a protégé of former president José Mujica, won the
    November 2024 runoff and took office in March 2025. Mujica died in May 2025. By August 2026, one
    pollster found 57 percent of Uruguayans disapproved of Orsi's government.
  leaders: {state: "President Yamandú Orsi, since March 2025", gov: "The president heads the government"}
  power: >-
    A presidential republic. The president is directly elected for five years with no immediate re-
    election; the General Assembly has a Senate and a Chamber of Representatives. Its parties are
    among the most institutionalised in Latin America.
  story: steady
  sources:
    - {label: "MercoPress: disapproval climbs to 57 percent", url: "https://en.mercopress.com/2026/08/13/disapproval-of-orsi-s-government-climbs-to-57-in-the-third-quarter-opcion-finds"}

VEN:
  pop: 28.5
  religion: Catholic about 70%, evangelical about 17%
  system: presidential
  system_note: Formally a presidential republic; the PSUV still controls state institutions.
  story: war
  snapshot: >-
    A US raid in January seized Nicolás Maduro and flew him to New York, but his vice president took over and Washington chose to deal with her rather than the opposition.
  tags: [Post-Maduro, US intervention, Oil reserves, Mass emigration, Baseball]
  culture: >-
    Venezuela holds the world's largest proven oil reserves, which shaped everything from its 20th-century boom to its collapse. Baseball is the national sport, and the Venezuelan team won the 2026 World Baseball Classic. Joropo music, played with harp and cuatro, and arepas are national staples. Its beauty pageant winners are national celebrities.
  society: >-
    Under Hugo Chávez and Maduro, oil revenue funded social programmes until mismanagement and US sanctions caused one of the worst economic collapses outside wartime. Nearly eight million people, a quarter of the population, have left. Hyperinflation peaked in 2018. Opposition leader María Corina Machado won the 2025 Nobel Peace Prize.
