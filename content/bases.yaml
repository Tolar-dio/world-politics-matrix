  - id: nevatim-airbase
    name: "Nevatim Airbase"
    kind: air
    country: ISR
    operators: ["Israeli Air Force"]
    lat: 31.2083
    lng: 35.0123
    tier: important
    why: "Home of Israel's F-35I Adir stealth fighters, the jets that lead long-range strikes on Iran. That makes it Iran's top military target in Israel."
    assets: "F-35I Adir squadrons; transport and tanker aircraft."
    year: "Iran's IRGC claimed strikes on Nevatim and Tel Nof on 8 June 2026; no impact was confirmed. Nevatim was also hit in Iran's 2024 missile barrages."
    sources:
      - {label: "Wikipedia: Nevatim Airbase", url: "https://en.wikipedia.org/wiki/Nevatim_Airbase"}
      - {label: "Wikipedia: 2026 Iranian strikes on Israel", url: "https://en.wikipedia.org/wiki/2026_Iranian_strikes_on_Israel"}

  - id: isfahan-nuclear-technology-center
    name: "Isfahan Nuclear Technology Center"
    kind: nuclear
    country: IRN
    operators: ["Atomic Energy Organization of Iran"]
    lat: 32.6525
    lng: 51.6747
    tier: important
    why: "Iran's uranium conversion and fuel fabrication hub, plus a tunnel complex where enriched material is believed to have been stored. Conversion is the step that turns yellowcake into feed for centrifuges, so without Isfahan the enrichment chain breaks. Point is Isfahan city; the center lies southeast of the city."
    assets: "Uranium Conversion Facility; Fuel Plate Fabrication Plant; research reactors; underground tunnel complex."
    year: "Hit by Israel and the US in June 2025. In 2026 the tunnel complex was largely untouched, but its portals stayed backfilled with dirt as of May 2026, and a nearby Isfahan air base and ammunition depot were bombed on 30 March 2026."
