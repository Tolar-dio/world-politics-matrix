# Global military bases and flashpoints catalogue, current to 27 October 2026.
# Coordinates: Wikidata (Wikipedia/GeoHack store) unless noted; OSM cross-checks where Wikidata was off.
bases:
  - id: al-udeid-air-base
    name: "Al Udeid Air Base"
    kind: air
    country: QAT
    operators: ["US Air Force", "Qatar Emiri Air Force", "Royal Air Force"]
    lat: 25.1173
    lng: 51.3150
    tier: critical
    why: "The largest US base in the Middle East and the forward headquarters of US Central Command, home to the Combined Air Operations Center that runs the air war across the region. If you want to know how America fights from the Gulf, this is the nerve center. Its size and symbolism make it Iran's favorite target."
    assets: "About 10,000 personnel (2026); CENTCOM forward HQ and Combined Air Operations Center; 379th Air Expeditionary Wing with KC-135 tankers, ISR and airlift; RAF detachment."
    year: "Hit by an Iranian ballistic missile around 3 March 2026 with no casualties reported. On 2 March Qatari F-15s shot down two Iranian Su-24s reportedly heading for the base and Ras Laffan. Also hit in Iran's June 2025 retaliation for US strikes on its nuclear sites. The Pentagon is reportedly weighing whether some Gulf bases are still viable."
    sources:
      - {label: "Wikipedia: Al Udeid Air Base", url: "https://en.wikipedia.org/wiki/Al_Udeid_Air_Base"}
      - {label: "CSMonitor: After Iran war damage, US may close some Middle East bases for good", url: "https://www.csmonitor.com/USA/Military/2026/0929/iran-war-middle-east-military-bases"}
      - {label: "Wikipedia: 2026 Iranian strikes on Qatar", url: "https://en.wikipedia.org/wiki/2026_Iranian_strikes_on_Qatar"}
      - {label: "Wikipedia: 2025 Iranian strikes on Al Udeid Air Base", url: "https://en.wikipedia.org/wiki/2025_Iranian_strikes_on_Al_Udeid_Air_Base"}

  - id: al-dhafra-air-base
    name: "Al Dhafra Air Base"
    kind: air
    country: ARE
    operators: ["US Air Force", "UAE Air Force", "French Air and Space Force"]
    lat: 24.2481
    lng: 54.5475
    tier: critical
    why: "The main US air hub in the UAE, a short hop across the Gulf from Iran and overlooking the approaches to the Strait of Hormuz. It hosts high-value surveillance and tanker aircraft that feed the whole regional air picture, and France keeps its Gulf fighter detachment here."
    assets: "380th Air Expeditionary Wing (ISR, tankers, fighters on rotation); UAE Air Force F-16 Block 60 and Mirage 2000-9; French Air Base 104 Rafale detachment."
    year: "Targeted in Iran's first wave on 28 February 2026; minor structural damage from secondary explosions, and debris killed a civilian near Zayed International Airport. The UAE says it intercepted 537 ballistic missiles, 2,256 drones and 26 cruise missiles by 9 April."
    sources:
      - {label: "Wikipedia: Al Dhafra Air Base", url: "https://en.wikipedia.org/wiki/Al_Dhafra_Air_Base"}
      - {label: "Wikipedia: 2026 Iranian strikes on the United Arab Emirates", url: "https://en.wikipedia.org/wiki/2026_Iranian_strikes_on_the_United_Arab_Emirates"}

  - id: nsa-bahrain
    name: "Naval Support Activity Bahrain (US Fifth Fleet HQ)"
    kind: naval
    country: BHR
    operators: ["US Navy", "Royal Navy", "Royal Bahrain Naval Force"]
    lat: 26.2097
    lng: 50.6097
    tier: critical
    why: "Home of the US Fifth Fleet, which runs naval operations from the Gulf through the Arabian Sea to the Red Sea, and headquarters of the multinational Combined Maritime Forces. It is the reason the US Navy can command inside the Gulf rather than from outside it."
    assets: "HQ US Naval Forces Central Command and Fifth Fleet; Combined Maritime Forces HQ; Mina Salman pier; UK Naval Support Facility nearby."
    year: "Struck by Iranian missiles and drones on 28 February 2026; two US Defense Department employees wounded on 2 March; more attacks in June were mostly intercepted. The Chief of Naval Operations said 'We're not getting back there anytime soon.'"
    sources:
      - {label: "Wikipedia: Naval Support Activity Bahrain", url: "https://en.wikipedia.org/wiki/Naval_Support_Activity_Bahrain"}
      - {label: "Wikipedia: 2026 Iranian strikes on Bahrain", url: "https://en.wikipedia.org/wiki/2026_Iranian_strikes_on_Bahrain"}
      - {label: "CSMonitor: After Iran war damage, US may close some Middle East bases for good", url: "https://www.csmonitor.com/USA/Military/2026/0929/iran-war-middle-east-military-bases"}

  - id: isa-air-base
    name: "Isa Air Base"
    kind: air
    country: BHR
    operators: ["Royal Bahraini Air Force", "US Navy", "US Marine Corps"]
    lat: 25.9183
    lng: 50.5906
    tier: notable
    why: "Bahrain's main military airfield and a staging base for US maritime patrol aircraft that track ships and submarines in the Gulf. It complements the Fifth Fleet headquarters a few kilometers north."
    assets: "Royal Bahraini Air Force F-16s; rotating US Navy P-8A Poseidon detachments and other US aircraft."
    year: "Iran claimed a strike on 3 March 2026; satellite imagery showed several P-8 hangars hit on 30 March."
    sources:
      - {label: "Wikipedia: Isa Air Base", url: "https://en.wikipedia.org/wiki/Isa_Air_Base"}
      - {label: "Wikipedia: 2026 Iranian strikes on Bahrain", url: "https://en.wikipedia.org/wiki/2026_Iranian_strikes_on_Bahrain"}

  - id: camp-arifjan
    name: "Camp Arifjan"
    kind: logistics
    country: KWT
    operators: ["US Army", "Kuwait Armed Forces"]
    lat: 28.8780
    lng: 48.1579
    tier: important
    why: "The US Army's main command and logistics hub in the Middle East, holding prepositioned equipment so armored units can fly in and pick up their gear. Any US ground campaign in the region runs through here."
    assets: "Forward HQ of US Army Central (ARCENT); Army Prepositioned Stocks; sustainment and logistics units."
    year: "Kuwait is one of eight countries where a Pentagon Inspector General report says Iranian strikes damaged US base buildings in 2026; open-source compilations did not single out Arifjan itself."
    sources:
      - {label: "Wikipedia: Camp Arifjan", url: "https://en.wikipedia.org/wiki/Camp_Arifjan"}
      - {label: "CSMonitor: After Iran war damage, US may close some Middle East bases for good", url: "https://www.csmonitor.com/USA/Military/2026/0929/iran-war-middle-east-military-bases"}

  - id: ali-al-salem-air-base
    name: "Ali Al Salem Air Base"
    kind: air
    country: KWT
    operators: ["US Air Force", "Kuwait Air Force", "Italian Air Force", "Canadian Armed Forces"]
    lat: 29.3467
    lng: 47.5206
    tier: important
    why: "Nicknamed 'The Rock', it is the main US airlift hub moving troops and cargo into Iraq, Syria and the Gulf, and a coalition base for Italian and Canadian forces. It shows how much of the coalition's logistics depends on a handful of airfields within missile range of Iran."
    assets: "386th Air Expeditionary Wing (airlift and ISR); Italian air task force with MQ-9 Reapers and Eurofighter Typhoons; Canadian contingent at Camp Canada."
    year: "Hit repeatedly in 2026: drones on 28 February, missiles damaging Canadian bunkers on 2 March, an Italian MQ-9 destroyed and two Italian Typhoons damaged on 15 March, and a 6 April drone strike that reportedly injured 15 Americans."
    sources:
      - {label: "Wikipedia: Ali Al Salem Air Base", url: "https://en.wikipedia.org/wiki/Ali_Al_Salem_Air_Base"}
      - {label: "Wikipedia: 2026 Iranian strikes on Kuwait", url: "https://en.wikipedia.org/wiki/2026_Iranian_strikes_on_Kuwait"}

  - id: camp-buehring
    name: "Camp Buehring"
    kind: army
    country: KWT
    operators: ["US Army"]
    lat: 29.6963
    lng: 47.4248
    tier: notable
    why: "Desert staging and training camp near the Iraqi border where rotating US Army brigades and aviation units prepare before moving forward in the region."
    assets: "Rotational US Army brigade and aviation elements; ranges and staging areas."
    year: "Hit by an Iranian drone on 1 March 2026; later reporting said an Iranian F-5 fighter got through the defenses and carried out a bombing run, a rare manned-aircraft attack on a US base."
    sources:
      - {label: "Wikipedia: Camp Buehring", url: "https://en.wikipedia.org/wiki/Camp_Buehring"}
      - {label: "Wikipedia: 2026 Iranian strikes on Kuwait", url: "https://en.wikipedia.org/wiki/2026_Iranian_strikes_on_Kuwait"}

  - id: prince-sultan-air-base
    name: "Prince Sultan Air Base"
    kind: air
    country: SAU
    operators: ["US Air Force", "Royal Saudi Air Force"]
    lat: 24.0625
    lng: 47.5803
    tier: critical
    why: "Deep in the Saudi interior south of Riyadh, it sits farther from Iran than the coastal Gulf hubs and became the main home for the tankers and airborne radar planes that keep a big air campaign running. Lose those support aircraft and the fighters cannot reach their targets."
    assets: "378th Air Expeditionary Wing; rotating US fighters; KC-135 tankers; E-3 Sentry AWACS; Royal Saudi Air Force units."
    year: "Iranian missiles damaged five US tankers in early March 2026, and a late-March strike destroyed or damaged an E-3 Sentry and at least one KC-135 on the ground. US officials said 29 service members were wounded in a single week; one US soldier died after an Iranian missile attack on a US base in Saudi Arabia."
    sources:
      - {label: "Wikipedia: Prince Sultan Air Base", url: "https://en.wikipedia.org/wiki/Prince_Sultan_Air_Base"}
      - {label: "Wikipedia: 2026 Iranian strikes on Saudi Arabia", url: "https://en.wikipedia.org/wiki/2026_Iranian_strikes_on_Saudi_Arabia"}

  - id: muwaffaq-salti-air-base
    name: "Muwaffaq Salti Air Base (Azraq)"
    kind: air
    country: JOR
    operators: ["Royal Jordanian Air Force", "US Air Force"]
    lat: 31.8336
    lng: 36.7831
    tier: important
    why: "Jordan's Azraq air base has become one of the most important US fighter bases in the Levant, sitting under the flight path of Iranian missiles and drones heading for Israel. It is the obvious fallback if the US thins out its Gulf bases."
    assets: "Royal Jordanian Air Force F-16s; rotating US fighter squadrons and drones; coalition aircraft."
    year: "Jordan took 204 Iranian missiles and drones in two waves on 7 and 14 March 2026, most intercepted. US troops leaving al-Tanf in Syria moved to Jordan in February 2026, and shifting more US infrastructure to Jordan is under discussion."
    sources:
      - {label: "Wikipedia: Muwaffaq Salti Air Base", url: "https://en.wikipedia.org/wiki/Muwaffaq_Salti_Air_Base"}
      - {label: "Wikipedia: 2026 Iranian strikes on Arab countries", url: "https://en.wikipedia.org/wiki/2026_Iranian_strikes_on_Arab_countries"}
      - {label: "Wikipedia: Al-Tanf", url: "https://en.wikipedia.org/wiki/Al-Tanf"}
      - {label: "CSMonitor: After Iran war damage, US may close some Middle East bases for good", url: "https://www.csmonitor.com/USA/Military/2026/0929/iran-war-middle-east-military-bases"}

  - id: port-of-duqm
    name: "Port of Duqm"
    kind: naval
    country: OMN
    operators: ["Royal Navy of Oman", "US Navy (access agreement)", "Royal Navy (UK logistics base)"]
    lat: 19.6686
    lng: 57.7000
    tier: important
    why: "A deep-water port and dry dock on Oman's Arabian Sea coast, outside the Strait of Hormuz. Ships can be repaired and resupplied here without running the strait, which makes it a hedge when Hormuz is closed."
    assets: "Large dry dock and naval berths; US access arrangements with Oman; UK Joint Logistics Support Base able to support carriers and submarines."
    year: "Hit by Iranian drone strikes from 1 March 2026 because US forces use it."
    sources:
      - {label: "Wikipedia: Duqm Port", url: "https://en.wikipedia.org/wiki/Duqm_Port"}
      - {label: "Wikipedia: 2026 Iranian strikes on Arab countries", url: "https://en.wikipedia.org/wiki/2026_Iranian_strikes_on_Arab_countries"}

  - id: port-of-salalah
    name: "Port of Salalah"
    kind: logistics
    country: OMN
    operators: ["Salalah Port Services", "US Navy (access agreement)"]
    lat: 16.9435
    lng: 54.0116
    tier: notable
    why: "Southern Omani port on the Arabian Sea used for US Navy logistics, far from Hormuz and on the approach to the Gulf of Aden and Bab el-Mandeb."
    assets: "Container and bulk terminals; fuel storage; logistics calls by US and allied ships."
    year: "Hit by Iranian drones from 1 March 2026, including a fuel tank on 11 March."
    sources:
      - {label: "Wikipedia: Port of Salalah", url: "https://en.wikipedia.org/wiki/Port_of_Salalah"}
      - {label: "Wikipedia: 2026 Iranian strikes on Arab countries", url: "https://en.wikipedia.org/wiki/2026_Iranian_strikes_on_Arab_countries"}

  - id: ras-laffan
    name: "Ras Laffan Industrial City (LNG)"
    kind: logistics
    country: QAT
    operators: ["QatarEnergy"]
    lat: 25.9094
    lng: 51.5531
    tier: critical
    why: "The world's largest LNG export complex, supplying a large share of global liquefied gas to Europe and Asia. It is not a military base, but it is exactly the kind of strategic target that turns a Gulf war into a global energy crisis."
    assets: "LNG liquefaction trains, gas processing (including Barzan), export berths."
    year: "QatarEnergy halted all gas production on 2 March 2026 and declared force majeure. An 18 March Iranian strike knocked out about 17% of LNG export capacity, which Qatar's energy minister said could take 3 to 5 years to repair. A 21 June explosion during restart at Barzan killed at least 13 workers."
    sources:
      - {label: "Wikipedia: Ras Laffan Industrial City", url: "https://en.wikipedia.org/wiki/Ras_Laffan_Industrial_City"}
      - {label: "Wikipedia: 2026 Iranian strikes on Qatar", url: "https://en.wikipedia.org/wiki/2026_Iranian_strikes_on_Qatar"}

  - id: abqaiq
    name: "Abqaiq oil processing facility"
    kind: logistics
    country: SAU
    operators: ["Saudi Aramco"]
    lat: 25.9350
    lng: 49.6661
    tier: important
    why: "The largest crude oil stabilization plant in the world, processing most of Saudi Arabia's crude before export. The 2019 drone and missile attack here briefly knocked out about half of Saudi output and proved how fragile Gulf energy is to cheap precision weapons."
    assets: "Crude processing and stabilization plant; pipeline hub feeding Ras Tanura and the East-West pipeline."
    year: "No confirmed hit on Abqaiq in 2026 in the sources reviewed, but the nearby Ras Tanura refinery was struck by drones on 4 March 2026 and briefly shut, and the Shaybah field was repeatedly targeted."
    sources:
      - {label: "Wikipedia: Abqaiq", url: "https://en.wikipedia.org/wiki/Abqaiq"}
      - {label: "Wikipedia: Abqaiq-Khurais attack", url: "https://en.wikipedia.org/wiki/Abqaiq–Khurais_attack"}
      - {label: "Wikipedia: 2026 Iranian strikes on Saudi Arabia", url: "https://en.wikipedia.org/wiki/2026_Iranian_strikes_on_Saudi_Arabia"}

  - id: kharg-island
    name: "Kharg Island"
    kind: logistics
    country: IRN
    operators: ["National Iranian Oil Company", "IRGC", "Iranian Navy"]
    lat: 29.2450
    lng: 50.3100
    tier: critical
    why: "Iran's main crude export terminal, handling the large majority of its oil exports. Whoever controls or threatens Kharg holds Iran's economy hostage, which is why seizing it has been debated in Washington."
    assets: "Crude loading terminals and storage; IRGC and naval facilities, air defenses, mine and missile storage (per CENTCOM)."
    year: "On 13 March 2026 the US Air Force bombed more than 90 military targets on the island, including mine and missile storage, while deliberately sparing oil infrastructure. Tankers kept loading afterward; a ground seizure was considered but not ordered."
    sources:
      - {label: "Wikipedia: Kharg Island", url: "https://en.wikipedia.org/wiki/Kharg_Island"}
      - {label: "Wikipedia: 2026 Kharg Island raid", url: "https://en.wikipedia.org/wiki/2026_Kharg_Island_raid"}

  - id: bandar-abbas
    name: "Bandar Abbas naval complex"
    kind: naval
    country: IRN
    operators: ["Islamic Republic of Iran Navy", "IRGC Navy"]
    lat: 27.1864
    lng: 56.2808
    tier: critical
    why: "Iran's main naval base sits right on the Strait of Hormuz, the launch point for the fast attack craft, mines, submarines and anti-ship missiles that let Iran threaten a fifth of the world's oil. Point is city center; naval facilities line the waterfront."
    assets: "Iranian Navy HQ for the Gulf; Kilo-class and midget submarines; IRGC fast attack craft; coastal anti-ship missiles."
    year: "Iran's navy was hammered in the 2026 war: US figures cite 130 to 155 Iranian vessels struck or destroyed, the frigate IRIS Dena was sunk by USS Charlotte around 4 March, and Israel said it killed IRGC Navy commander Alireza Tangsiri. Damage at Bandar Abbas itself was not individually confirmed in the sources reviewed."
    sources:
      - {label: "Wikipedia: Bandar Abbas", url: "https://en.wikipedia.org/wiki/Bandar_Abbas"}
      - {label: "Wikipedia: 2026 Iran war", url: "https://en.wikipedia.org/wiki/2026_Iran_war"}

  - id: chabahar-port
    name: "Chabahar Port (Shahid Beheshti)"
    kind: logistics
    country: IRN
    operators: ["Ports and Maritime Organization of Iran", "India Ports Global"]
    lat: 25.3025
    lng: 60.6008
    tier: notable
    why: "Iran's only ocean port outside the Gulf, developed with India as a route to Afghanistan and Central Asia that bypasses Pakistan. It sits about 170 km from China-backed Gwadar, making the Makran coast a quiet India-China rivalry."
    assets: "Container and bulk terminals operated in part by India Ports Global."
    year: ""
    sources:
      - {label: "Wikipedia: Chabahar Port", url: "https://en.wikipedia.org/wiki/Chabahar_Port"}

  - id: fordow
    name: "Fordow Fuel Enrichment Plant"
    kind: nuclear
    country: IRN
    operators: ["Atomic Energy Organization of Iran"]
    lat: 34.8856
    lng: 50.9967
    tier: critical
    why: "Iran's enrichment plant buried deep inside a mountain near Qom, built to survive airstrikes. It was the reason the US built and used the 30,000-pound GBU-57 bunker buster, and its status is the best single gauge of whether Iran can rebuild a path to weapons-grade uranium."
    assets: "Underground centrifuge halls (largely destroyed 2025); above-ground support area; air defenses."
    year: "Largely destroyed by US B-2 strikes in June 2025; all four tunnel entrances were still buried as of mid-May 2026. The support area was hit between 18 and 30 March 2026, and Iran has added earthen chicanes on access roads. No sign of reconstruction of the underground plant as of mid-2026."
    sources:
      - {label: "Wikipedia: Fordow Uranium Enrichment Plant", url: "https://en.wikipedia.org/wiki/Fordow_Uranium_Enrichment_Plant"}
      - {label: "ISIS: Comprehensive Imagery Report on Nuclear Enrichment Related Sites, Post-April Ceasefire", url: "https://isis-online.org/isis-reports/comprehensive-imagery-report-on-nuclear-enrichment-related-sites-post-april-ceasefire"}
      - {label: "Wikipedia: 2025 United States strikes on Iranian nuclear sites", url: "https://en.wikipedia.org/wiki/2025_United_States_strikes_on_Iranian_nuclear_sites"}

  - id: natanz
    name: "Natanz Nuclear Facility"
    kind: nuclear
    country: IRN
    operators: ["Atomic Energy Organization of Iran"]
    lat: 33.7250
    lng: 51.7250
    tier: critical
    why: "Iran's main enrichment site, with a huge underground fuel enrichment plant and a pilot plant. Next door, the tunneling at Pickaxe Mountain is watched as a possible next-generation hardened site."
    assets: "Underground Fuel Enrichment Plant; Pilot Fuel Enrichment Plant; power and support infrastructure; nearby Pickaxe Mountain tunnel complex."
    year: "Struck on 2 and 21 March 2026 with bunker busters after June 2025 strikes; as of late May 2026 the underground plant was inaccessible, primary and backup power destroyed, and no sign of renewed enrichment. Pickaxe Mountain was not attacked and construction continues."
    sources:
      - {label: "Wikipedia: Natanz Nuclear Facility", url: "https://en.wikipedia.org/wiki/Natanz_Nuclear_Facility"}
      - {label: "ISIS: Comprehensive Imagery Report on Nuclear Enrichment Related Sites, Post-April Ceasefire", url: "https://isis-online.org/isis-reports/comprehensive-imagery-report-on-nuclear-enrichment-related-sites-post-april-ceasefire"}
      - {label: "Wikipedia: 2026 Iran war", url: "https://en.wikipedia.org/wiki/2026_Iran_war"}

  - id: strait-of-hormuz
    name: "Strait of Hormuz"
    kind: chokepoint
    country: IRN
    operators: ["IRGC Navy", "Islamic Republic of Iran Navy", "Royal Navy of Oman", "US Navy"]
    lat: 26.6000
    lng: 56.5000
    tier: critical
    why: "The narrow exit from the Persian Gulf between Iran and Oman's Musandam peninsula, through which roughly a fifth of the world's oil and a large share of its LNG normally pass. Closing it is Iran's ultimate lever, and in 2026 it pulled it."
    assets: "Shipping lanes in Omani waters; Iranian islands, coastal missiles, mines and fast boats on the north shore."
    year: "Iran blocked the strait in early March 2026 and later claimed sovereignty and demanded transit fees; the US imposed a counter-blockade of Iranian ports on 12-13 April. A June deal briefly lifted both blockades but collapsed on 8 July. Lloyd's List counted just 104 non-Iranian transits in the week of 5-11 October and at least 28 attacks in October, the worst month since the war began."
    sources:
      - {label: "Wikipedia: Strait of Hormuz", url: "https://en.wikipedia.org/wiki/Strait_of_Hormuz"}
      - {label: "Wikipedia: 2026 Iran war", url: "https://en.wikipedia.org/wiki/2026_Iran_war"}
      - {label: "Lloyd's List Intelligence: Strait of Hormuz Brief, 22 October 2026", url: "https://www.lloydslistintelligence.com/resources/blog/strait-of-hormuz-brief-22-october-2026"}

  - id: bab-el-mandeb
    name: "Bab el-Mandeb Strait"
    kind: chokepoint
    country: YEM
    operators: ["Houthis (Ansar Allah)", "Yemeni government forces", "Djibouti", "EU Operation Aspides", "Combined Maritime Forces"]
    lat: 12.5833
    lng: 43.3333
    tier: critical
    why: "The southern gate of the Red Sea, about 26 km wide between Yemen and Djibouti, through which all Suez traffic must pass. The Houthis have shown that a militia with drones and missiles can reroute global shipping around Africa."
    assets: "Perim (Mayun) island splits the strait; Houthi anti-ship missiles and drones on the Yemeni coast; Western and Chinese naval bases in nearby Djibouti."
    year: "The Houthis joined the Iran war on 28 March 2026, declared a blockade of Saudi shipping through the strait on 20 July, captured Mocha on 10 September and reached Dhubab on the strait opposite Perim on 11 September. Traffic held near normal (26 commodity ships on 10 September) but the threat level is the highest in years."
    sources:
      - {label: "Wikipedia: Bab-el-Mandeb", url: "https://en.wikipedia.org/wiki/Bab-el-Mandeb"}
      - {label: "Container News: Houthis reach Bab el-Mandeb after seizing Mocha port", url: "https://container-news.com/houthis-reach-bab-el-mandeb-after-seizing-mocha-port/"}
      - {label: "Wikipedia: 2026 Iran war", url: "https://en.wikipedia.org/wiki/2026_Iran_war"}

  - id: suez-canal
    name: "Suez Canal"
    kind: chokepoint
    country: EGY
    operators: ["Suez Canal Authority", "Egyptian Armed Forces"]
    lat: 30.7050
    lng: 32.3442
    tier: critical
    why: "The shortcut between the Mediterranean and the Indian Ocean that saves ships roughly two weeks versus sailing around Africa. Its value depends on the Bab el-Mandeb at the other end of the Red Sea staying open, which is why Houthi attacks hit Egypt's canal revenue so hard."
    assets: "193 km canal; Egyptian Navy and army forces along the canal zone."
    year: "Traffic depends on the Red Sea; the Houthi advance to the Bab el-Mandeb in September 2026 renewed the threat to Suez-bound shipping."
    sources:
      - {label: "Wikipedia: Suez Canal", url: "https://en.wikipedia.org/wiki/Suez_Canal"}
      - {label: "Container News: Houthis reach Bab el-Mandeb after seizing Mocha port", url: "https://container-news.com/houthis-reach-bab-el-mandeb-after-seizing-mocha-port/"}

  - id: dimona
    name: "Shimon Peres Negev Nuclear Research Center (Dimona)"
    kind: nuclear
    country: ISR
    operators: ["Israel Atomic Energy Commission"]
    lat: 31.0036
    lng: 35.1467
    tier: critical
    why: "The heart of Israel's undeclared nuclear weapons program, with a heavy-water reactor and plutonium reprocessing according to open-source assessments. Iran has repeatedly tried to hit it, which makes it a flashpoint in its own right."
    assets: "Research reactor and associated facilities; heavily defended by Arrow, David's Sling and Iron Dome."
    year: "On 21 March 2026 Iran fired missiles at the center; they hit residential areas of Dimona town about 20 km away, injuring at least 47 people."
    sources:
      - {label: "Wikipedia: Shimon Peres Negev Nuclear Research Center", url: "https://en.wikipedia.org/wiki/Shimon_Peres_Negev_Nuclear_Research_Center"}
