# In its own voice: what a country's leaders say, what its own press leads with, and how outsiders see it.
# Every item is dated and linked. Quotes must be exact, inside quotation marks; anything else is a
# close paraphrase and must read as one. Keep 1 to 3 items per list, newest first; the daily
# rotation adds and replaces items. See UPDATING.md ("Voices").
#
# ISO3:
#   leader: [{date: YYYY-MM-DD, who: "Name, role", text: "...", source: "Outlet", url: "..."}]
#   press:  [... local outlets, summarised and translated]
#   abroad: [... foreign outlets]

