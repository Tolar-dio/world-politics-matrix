      - {name: "Sittwe enclave", lat: 20.1462, lng: 92.8983, radius_km: 20, note: "State capital held by junta, encircled by AA; Ponnagyun and Pauktaw shelled."}
      - {name: "Kyaukphyu enclave and Danyawaddy naval base", lat: 19.43, lng: 93.65, radius_km: 35, note: "Chinese pipeline terminus and SEZ; junta holds town, AA attacks naval base since Jan 2026."}
      - {name: "Manaung Island", lat: 18.84, lng: 93.73, radius_km: 20, note: "Junta-held island encircled by AA."}
      - {name: "Bago-Magway frontier (AA expansion)", lat: 19.30, lng: 94.85, radius_km: 110, note: "AA-led attacks on Pandaung weapons factories and Ngape air defence base."}
      - {name: "Bhamo siege", lat: 24.2667, lng: 97.2333, radius_km: 25, note: "KIA siege since Dec 2024; junta resupplied by river flotilla."}
      - {name: "KIA-held Kachin (Laiza, Chipwi, Tsawlaw, Sumprabum)", lat: 25.40, lng: 97.75, radius_km: 130, note: "KIA heartland incl. rare-earth areas; junta counteroffensive aims at Khaunglanhpu and Tsawlaw."}
