      - {label: "Wikipedia: 2026 in Pakistan", url: "https://en.wikipedia.org/wiki/2026_in_Pakistan"}
      - {label: "Wikipedia: 2026 Kabul hospital airstrike", url: "https://en.wikipedia.org/wiki/2026_Kabul_hospital_airstrike"}
