  - id: pakistan-afghanistan-war
    name: "Pakistan-Afghanistan war (Pakistan vs Afghan Taliban)"
    type: interstate
    intensity: high
    status: active
    started: "2026-02-21 (current phase; first round of fighting 9-19 Oct 2025)"
    countries: [PAK, AFG]
    sides:
      - name: "Pakistan"
        members: ["Pakistan Army", "Pakistan Air Force", "Frontier Corps"]
        backers: ["China (diplomatic backing for Pakistan's counterterrorism stance; also mediator)"]
        leaders: ["Shehbaz Sharif (Prime Minister)", "Field Marshal Asim Munir (army chief)", "Khawaja Asif (Defence Minister)", "Air Chief Marshal Zaheer Ahmad Babar (PAF)", "Ishaq Dar (Deputy PM and Foreign Minister)"]
        strength: "No figure retrieved for forces committed."
      - name: "Afghan Taliban government (Islamic Emirate)"
        members: ["Islamic Emirate army corps (201 Khalid ibn Walid Corps, 205 Corps)", "Border forces", "Tehrik-i-Taliban Pakistan (TTP) and allied factions, which Pakistan says operate from Afghan soil"]
        backers: []
        leaders: ["Hibatullah Akhundzada (Supreme Leader)", "Mullah Muhammad Yaqoob (Defence Minister)", "Fasihuddin Fitrat (Army Chief)", "Zabihullah Mujahid (spokesman)", "Noor Wali Mehsud (TTP leader)"]
        strength: "TTP estimated at 4,000 to 6,000 fighters (US Lead Inspector General, Jan-Mar 2026, cited by Pakistan); no figure retrieved for Taliban army forces on the border."
    summary: "Pakistan and the Taliban government it once backed have fought two rounds of open warfare since October 2025, culminating in Pakistan declaring 'open war' in February 2026 and bombing Kabul, Kandahar and Bagram. After a spring lull, Pakistani air strikes resumed on 21 September 2026 following a deadly militant assault on a police compound in Kohat, and no ceasefire was in place in late October."
    background: "Pakistan accuses the Taliban of sheltering the Pakistani Taliban (TTP) and other groups behind a surge of attacks in Khyber Pakhtunkhwa and Balochistan; the Taliban deny this and call militancy Pakistan's internal problem. Relations collapsed in October 2025 when explosions in Kabul, believed to be a Pakistani strike aimed at TTP leaders, triggered Taliban retaliation along the border and a week of fighting that Qatar and Turkey halted with a Doha ceasefire on 19 October 2025.\n\nFollow-up talks in Istanbul failed in late October and November 2025, Pakistan closed the Torkham and Chaman crossings indefinitely and accelerated deportations of Afghans (over one million deported or pressured out by October 2025). This matters because the two economies are deeply linked: Afghan transit trade through Pakistan has collapsed to a trickle, and each round of fighting displaces tens of thousands of people on both sides of the Durand Line."
    year: "Late 2025: the Doha ceasefire nominally held but talks broke down on 8 November; after a suicide bombing in Islamabad on 11 November, Defence Minister Khawaja Asif declared a 'state of war'. Saudi mediation failed on 3 December.\n\nFebruary to March 2026: after an ISKP suicide bombing of a Shia mosque in Islamabad on 6 February killed 31 and attacks in Bajaur and Bannu, Pakistan struck seven sites in Nangarhar, Paktika and Khost on 21-22 February. The Taliban answered on 26 February with a 'retaliatory operation' against Pakistani border posts from Chitral to Kurram. Pakistan then launched Operation Ghazab lil Haq, bombing Kabul (an ammunition depot near Darulaman), Kandahar, Paktia and Nangarhar, and Asif declared 'open war'. Strikes widened to Jalalabad airport, Bagram, Panjshir, Kapisa, Badakhshan, Herat and Kandahar's 205 Corps. Pakistan claimed to seize about 32 square kilometres of Afghan territory south of Zhob. On 16 March a strike on Kabul's Omid addiction treatment hospital killed between 143 and 408 people depending on the source. A five-day Eid pause began on 18 March at the request of Saudi Arabia, Qatar and Turkey, and China hosted talks in Urumqi around 1 April.\n\nApril to October 2026: lower-level fighting continued (Pakistan struck eastern Afghanistan on 28 June after an attack on the Sindh Rangers headquarters in Karachi), followed by about three months of relative calm. After a 20-hour assault on a police compound in Kohat (claimed by Ittehad ul Mujahideen Pakistan) and a shootout in Hangu, Pakistani jets struck eastern Afghanistan on 21 September, hit 10 sites in Kandahar, Paktia and Khost on 24 September in response to an alleged eight-drone attack, and struck Kunar and Helmand on 30 September. Border clashes followed at Gulistan (25 September) and the Taliban accused Pakistan of sending fighters into Nuristan's Kamdesh district in early October."
    updated: '2026-10-28'
    situation: "As of late October 2026 there is no ceasefire and no active negotiation track. Pakistan says it will keep striking 'terrorist sanctuaries' until the Taliban take verifiable action against the TTP and BLA, and in late September hosted Afghan anti-Taliban opposition figures in Islamabad. The Taliban deny harbouring militants and promise retaliation. The border crossings remain closed. China, Turkey, Qatar and Saudi Arabia are all trying to mediate."
    technical:
      - "Operation names: Pakistan's Operation Khyber Storm (Oct 2025) and Operation Ghazab lil Haq (from about 26 Feb 2026); the Taliban's 26 Feb 2026 'retaliatory operation' was directed by Mullah Yaqoob and Fasihuddin Fitrat (Wikipedia)."
      - "Strategic targets struck Feb-Mar 2026: Kabul ammunition depot near Darulaman, Pul-e-Charkhi, Kandahar airport area, Laghman 201 Corps, Kandahar 205 Corps and an air brigade, Jalalabad airport, Bagram airfield, and on 14 Mar five Kandahar sites including the GDI and Akhundzada's special forces unit (Pakistani claims, Wikipedia)."
      - "Kabul hospital strike (16 Mar 2026): Sky News analysis of Pakistani footage found at least four buildings hit by guided aerial bombs; Pakistan says it targeted ammunition and drone storage (Wikipedia)."
      - "Ground action: Pakistan claims it seized about 32 square km (the 'Ghudwana enclave') south of Zhob around 3 Mar 2026; the Taliban claimed capture of a South Waziristan post on 15 Mar, which Pakistan called propaganda (Wikipedia)."
      - "Drones: Taliban-launched small drones claimed against Kohat, Nowshera, Abbottabad, Jamrud and near Islamabad; Pakistan imposed a nationwide drone ban around 27 Feb 2026 and said quadcopters were downed in the Garsal (Mohmand) sector (Wikipedia; Bol News)."
      - "On 23 Sep 2026 Pakistan said eight Afghan drones were neutralised before reaching Kohat or Torkham; its 24 Sep strikes hit 10 sites described as drone launch and storage locations (AP)."
      - "PAF imagery from the Sep-Oct 2026 strikes shows an F-16B; Pakistan also released drone-strike footage of Kunar targets (Long War Journal)."
      - "Pakistan's claims of Taliban killed rose from 274 (27 Feb) to 684 (15 Mar); infobox total 796 killed and 1,043+ injured against 13 Pakistani soldiers killed. Afghan claims of Pakistani soldiers killed reached 307 to 327; Kabul officially admitted 28 of its own dead by 3 Mar. Neither side's figures are verified (Wikipedia; Reuters)."
      - "Afghan forces claimed to shoot down Pakistani surveillance drones on 4, 5, 8 and 15 Mar 2026; an Afghan claim to have downed a Pakistani jet on 28 Feb proved false (Wikipedia)."
      - "Trade war: Torkham and Chaman closed through 2026; Afghan transit containers fell from 42,959 in 2025 to 1,592 in 2026; Pakistan lost at least $1 billion in exports to Afghanistan (Wikipedia)."
      - "Pakistan alleges Kandahar governor Mullah Shireen hosted a meeting of BLA, AQIS and Hafiz Gul Bahadur Group leaders with Indian help; his office denies it (Long War Journal)."
    casualties: "Feb-Mar 2026: UNAMA counted 56 Afghan civilians killed and 129 injured from 26 Feb to 5 Mar; Kabul hospital strike 143 (UN figure reported by Reuters) to 269 (UNAMA) to 408 (Taliban) killed. UNAMA says cross-border violence killed or injured more than 1,100 Afghan civilians from January to early October 2026, and the 30 Sep strikes killed 10 civilians, mostly children. Military losses are claimed in the hundreds by each side but unverified. Oct 2025 round: UNAMA 37 Afghan civilians killed, 425 injured."
    displaced: "About 115,000 displaced in Afghanistan and 3,000 in Pakistan (UNHCR, about 5 Mar 2026); over one million Afghans deported or pressured out of Pakistan by Oct 2025."
    zones:
      - {name: "Kabul", lat: 34.5281, lng: 69.1723, radius_km: 25, note: "Pakistani strikes on depots and the Omid hospital (16 Mar 2026)."}
      - {name: "Kandahar", lat: 31.6133, lng: 65.7101, radius_km: 35, note: "Seat of Taliban leadership; 205 Corps and GDI sites struck Mar 2026; Sep 2026 strikes."}
      - {name: "Bagram", lat: 34.9461, lng: 69.2650, radius_km: 15, note: "Airfield struck 1 Mar 2026."}
      - {name: "Khyber-Torkham-Nangarhar front", lat: 34.15, lng: 70.85, radius_km: 70, note: "Torkham, Tirah, Shahkot and Zakhakhel clashes; Nangarhar strikes."}
      - {name: "Mohmand-Bajaur-Kunar front", lat: 34.75, lng: 71.25, radius_km: 60, note: "Garsal sector fighting Feb 2026; Kunar strikes Sep 2026."}
      - {name: "Kurram-Paktia front", lat: 33.70, lng: 69.95, radius_km: 60, note: "Dand Aw Patan clashes; Paktia strikes."}
      - {name: "North Waziristan-Khost-Paktika", lat: 33.05, lng: 69.90, radius_km: 70, note: "Strikes on Khost and Paktika; TTP sanctuaries alleged."}
      - {name: "Zhob-Paktika salient", lat: 31.35, lng: 69.35, radius_km: 50, note: "Pakistan claims seizure of 32 sq km 'Ghudwana enclave' (approximate)."}
      - {name: "Chaman-Spin Boldak-Gulistan", lat: 30.85, lng: 66.40, radius_km: 50, note: "Border crossing closed; Gulistan clash 25 Sep 2026."}
      - {name: "Chitral-Nuristan", lat: 35.60, lng: 71.30, radius_km: 60, note: "Chitral sector clashes; Kamdesh fighting Oct 2026 per Taliban."}
    timeline:
      - {date: "2025-11-08", event: "Istanbul talks collapse; ceasefire nominally holds."}
      - {date: "2025-11-11", event: "Suicide bombing in Islamabad; Khawaja Asif declares a 'state of war'."}
      - {date: "2025-12-03", event: "Saudi mediation attempt fails."}
      - {date: "2026-02-06", event: "ISKP bombing of a Shia mosque in Islamabad kills 31."}
      - {date: "2026-02-22", event: "Pakistani strikes in Nangarhar, Paktika and Khost; UN says 13 civilians killed."}
      - {date: "2026-02-26", event: "Taliban retaliatory attacks on border posts; Pakistan launches Operation Ghazab lil Haq."}
      - {date: "2026-02-27", event: "Pakistan bombs Kabul, Kandahar and Paktia; Asif declares 'open war'."}
      - {date: "2026-03-01", event: "Strikes on Kabul and Bagram airfield."}
