# Asia-Pacific conflicts (South, Central, South-East, East Asia), state as of 27 Oct 2026.
# Coordinates are approximate gazetteer positions; zones are approximate circles.
conflicts:
  - id: myanmar-civil-war
    name: "Myanmar civil war"
    type: civil-war
    intensity: high
    status: active
    started: "2021-02-01 (coup; current phase is the junta counteroffensive under a post-election government, 2025-2026)"
    countries: [MMR]
    sides:
      - name: "Myanmar military (Tatmadaw) and post-election government"
        members: ["Myanmar Army", "Myanmar Air Force", "Myanmar Navy (river flotillas, naval gunfire)", "Regime-backed local militias", "Newly recruited conscripts (per AA sources)"]
        backers: ["Russia (five-year military cooperation agreement signed 3 Feb 2026)", "China (political ties; brokered ceasefires that took northern ethnic armies out of the fight)"]
        leaders: ["Min Aung Hlaing (President from 3 Apr 2026; commander-in-chief until 30 Mar 2026)", "Ye Win Oo (Commander-in-Chief from 30 Mar 2026)", "Nyo Saw (First Vice-President)"]
        strength: "No reliable public troop figure retrieved; stable control estimated at 72 to 220 of 330 townships (Wikipedia compilation, 2025-26), but holds most major cities."
      - name: "Arakan Army (AA)"
        members: ["Arakan Army", "AA-led resistance forces in Bago, Magway and Ayeyarwady regions"]
        backers: ["No state backer publicly acknowledged"]
        leaders: ["Khaing Thu Kha (spokesperson)"]
        strength: "No independent figure retrieved; controls 14 of 17 Rakhine townships plus Paletwa in Chin State (DMG/BNI, Oct 2025; DVB, Feb 2026)."
      - name: "Kachin Independence Army (KIA) and allied PDFs"
        members: ["Kachin Independence Army", "Allied People's Defence Force units"]
        backers: []
        leaders: ["Naw Bu (KIA spokesperson)"]
        strength: "No independent figure retrieved."
      - name: "NUG, People's Defence Forces and allied ethnic organisations"
        members: ["National Unity Government and People's Defence Forces", "Karen National Union / KNLA", "Karenni National Progressive Party", "Chin National Front", "Kachin Independence Organisation (political wing of KIA)"]
        backers: []
        leaders: ["Steering Council for the Emergence of a Federal Democratic Union (SCEF, formed 30 Mar 2026 by CRPH, NUG, KIO, KNU, KNPP, CNF)"]
        strength: "No reliable figure; ACLED counts more than 1,200 active armed groups in Myanmar (NYT/ACLED, Jun 2026)."
      - name: "Northern ethnic armies under China-brokered ceasefires"
        members: ["Myanmar National Democratic Alliance Army (MNDAA)", "Ta'ang National Liberation Army (TNLA)"]
        backers: ["China (mediator and source of pressure)"]
        leaders: []
        strength: "Out of the anti-junta coalition after Beijing-brokered ceasefires; MNDAA withdrew from Lashio and TNLA from Mogok and Mongmit."
    summary: "Five years after the 2021 coup, Myanmar's war has swung back toward the military on several fronts. With China having pushed the strongest northern ethnic armies into ceasefires, the junta, now presented as an elected government under President Min Aung Hlaing, is using air power, drones and river and sea lift to relieve besieged garrisons and retake towns, while the Arakan Army still holds most of Rakhine State."
    background: "The military seized power on 1 February 2021 and crushed street protests, which pushed opponents into armed resistance alongside long-established ethnic armies. In late 2023 a northern alliance (MNDAA, TNLA, AA) launched Operation 1027 and over the following year resistance forces captured dozens of towns, including the Northeastern Command at Lashio, and the AA took most of Rakhine. By 1 December 2025 anti-junta forces had captured 96 towns, 15 of them district-level or higher.\n\nThe tide turned in 2025. China, worried about its border trade, pipelines and the Kyaukphyu port project, pressured the MNDAA to hand back Lashio and the TNLA to withdraw from Mogok and Mongmit. The junta dissolved its State Administration Council on 31 July 2025, ran a three-phase election from December 2025 to January 2026 that observers called neither free nor fair, and installed Min Aung Hlaing as president in April 2026. This matters because the 'civilian' label is meant to win back foreign engagement (the United States opened direct talks in October 2026) without changing who holds military power."
    year: "Late 2025: the junta followed up its recapture of Kyaukme in northern Shan with offensives elsewhere, while the AA, which had pressed to within about 7 miles of Kyaukphyu, fell back to about 13 miles from the town under combined army, navy and air attack (DMG/BNI). The KNLA captured the Thai border trade town of Mawtaung in Tanintharyi on 14 November 2025. A December 2025 air strike on a hospital in Rakhine killed at least 30 people (Reuters). Voting took place on 28 December, 11 January and 25 January, with KIA-held Kachin townships excluded.\n\nJanuary to April 2026: the KIA resumed attacks on Bhamo on 14 January after a two-week pause and reportedly took Transport Battalion 933 east of the town, while the junta prepared a counteroffensive in Khaunglanhpu and Tsawlaw. The AA attacked the Danyawaddy naval base near Kyaukphyu and on 28 January seized the Point 666 outpost in Pandaung, Bago Region, which guards four military weapons factories. Air strikes killed at least 21 at Hteelin near Bhamo (22 January), 17 at Yoengu in Ponnagyun (24 February), 25 at a trading post in Mindon (1 March) and about 116 AA-held prisoners of war at a prison in Ann Township (8 March). The junta retook Tagaung, the last NUG-held town in Mandalay Region, on 13 March. Parliament convened on 16 March, Ye Win Oo became commander-in-chief on 30 March and Min Aung Hlaing was elected president on 3 April. The same day opposition bodies formed the SCEF to coordinate a federal alternative.\n\nMay to October 2026: under Ye Win Oo the junta retook at least five towns by late May, including Mawtaung on 19 May after a 15-day, three-column counteroffensive that sent 4,000 people fleeing into the hills and toward Thailand. A blast at an explosives store in Namhkam killed more than 46 people on 31 May. Amnesties freed thousands, ex-president Win Myint was released and Aung San Suu Kyi's sentence was commuted to house arrest. On 28 September an air strike on Kyauktaw town in Rakhine killed 50 and wounded at least 58, the deadliest in the state since the December hospital bombing. On 8 October the United States began direct negotiations with the military government."
    situation: "As of late October 2026 the military holds the centre, the main cities and the Bago-Mandalay corridor and is on the offensive against isolated resistance-held towns, with the dry season (November to April) about to open the best campaigning months. The AA controls almost all of Rakhine except Sittwe, Kyaukphyu and Manaung and is fighting in neighbouring Bago and Magway. The KIA's siege of Bhamo, now nearly two years old, is a grinding stalemate. The northern Shan front is largely quiet under Chinese-brokered ceasefires. Civilian deaths from air strikes remain the war's signature harm."
    technical:
      - "Command change: Ye Win Oo succeeded Min Aung Hlaing as Commander-in-Chief on 30 Mar 2026; the junta retook at least five towns in the following two months (Wikipedia; Khaosod English)."
      - "Riverine lift at Bhamo: about 20 vessels sailed up the Ayeyarwady in two convoys (17 and 22 Jul 2025) and a Navy fleet arrived 1 Aug 2025 with troops, artillery and drones; the junta then regained Artillery Battalion 366 and half of Bhamo airport on 10 Aug 2025 (BNI/KNG; DVB)."
      - "KIA withdrew from Tank Battalion 5014 and LIB 236 on 11 Sep 2025 but took an outpost guarding Infantry Battalion 47 on 29 Sep 2025 and positions on a two-mile stretch of the Bhamo-Momauk road (DVB)."
      - "KIA renewed attacks on Bhamo on 14 Jan 2026 and reportedly captured Transport Battalion 933 about 8 km east of the town; the Air Force answered with retaliatory strikes; IB 46 sent 200+ troops to Khaunglanhpu (DVB, unverified KIA claims)."
      - "Kyaukphyu: junta used combined army, navy and air operations, sea-lifted reinforcements, drone bombing and naval gunfire; AA fell back from about 7 to about 13 miles from town by end-Sep 2025 (DMG via BNI)."
      - "AA has attacked Danyawaddy naval base about 30 km east of Kyaukphyu since Jan 2026; about 400 junta reinforcements reached LID 34 in late Jan 2026 (DVB)."
      - "Defence-industrial targeting: Pandaung (Bago) hosts four DDI (KaPaSa) weapons factories; AA took Point 666 there on 28 Jan 2026 after a three-month siege. Ngape (Magway) hosts DDI 14, reported to make air-defence missiles; AA-led forces have surrounded its Natyaykan air defence base since Oct 2025 (DVB)."
      - "Light aviation for strikes: two gyrocopters launched from the Northwest Regional Military Command, escorted by an Mi-35P helicopter firing machine guns, hit a workshop in Ye-U Township on 7 September, killing seven; same-day gyrocopter strikes in Chaung-U Township (BNI, year not stated in article)."
      - "Mawtaung counteroffensive (May 2026): 50-truck convoy staged at Thebyu about 41 km away, then three columns encircled the town backed by artillery and air strikes; state media claimed 200+ clashes in 15 days and at least 24 opposition fighters killed (Khaosod English)."
      - "Air strike lethality 2026: Ann Township prison strike (8 Mar) killed about 116 AA prisoners of war; Kyauktaw strike (28 Sep) killed 50 and wounded 58+ (Wikipedia; Reuters)."
      - "Martial law was imposed on 63 townships on 29 Jul 2025 when the nationwide state of emergency was lifted ahead of the election (DVB)."
      - "China's leverage: MNDAA withdrew from Lashio and TNLA from Mogok and Mongmit; Beijing-brokered ceasefires took two northern armies out of the anti-junta coalition (Wikipedia; Khaosod English). China executed 15 members of the Ming and Bai scam-centre families of Laukkai in Jan-Feb 2026 (Wikipedia)."
      - "Russia: five-year military cooperation agreement signed 3 Feb 2026 (Wikipedia)."
      - "Fragmentation: ACLED counts more than 1,200 active armed groups and rated Myanmar the most extreme conflict of 2025 apart from the Palestinian territories (NYT/ACLED, Jun 2026)."
    casualties: "About 89,200 to 96,000+ killed since 2021 (ACLED, 1 Jan 2026); around 100,000 killed (Reuters, 29 Sep 2026). Notable 2026 air strikes: Hteelin 21+, Yoengu 17+, Mindon 25+, Bago offensive 30+, Ann prison about 116, Kyauktaw 50 (Wikipedia 2026 in Myanmar; Reuters). Military and resistance combat losses are not reliably reported; figures from either side are unverified."
    displaced: "Over 3.5 million displaced (Reuters, 29 Sep 2026); about 299,000 refugees in neighbouring countries (UNHCR, May 2026). At least 4,000 fled Mawtaung in May 2026 (Khaosod English)."
    zones:
