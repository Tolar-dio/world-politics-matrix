      - {date: "2026-04-30", event: "Aung San Suu Kyi's remaining sentence commuted to house arrest."}
      - {date: "2026-05-19", event: "Junta retakes Mawtaung after 15-day counteroffensive."}
      - {date: "2026-05-31", event: "Explosion at explosives store in Namhkam, Shan State, kills 46+."}
