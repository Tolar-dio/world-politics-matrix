  - id: taiwan-strait
    name: "Taiwan Strait military pressure"
    type: border-clash
    intensity: low
    status: frozen
    started: "2022-08-04 (Fourth Taiwan Strait Crisis: large PLA drills began after US Speaker Pelosi's visit)"
    countries: [TWN, CHN]
    sides:
      - name: "People's Republic of China"
        members: ["PLA Eastern Theater Command (ground, navy, air and rocket forces)", "China Coast Guard", "Fishing-vessel formations / maritime militia"]
        backers: []
        leaders: ["Xi Jinping (Chinese leader)", "Shi Yi (Eastern Theater Command spokesman)", "Zhang Xiaogang (Defence Ministry spokesman)"]
        strength: "Justice Mission-2025 peak: 130 aircraft, 14 warships and 8 other official ships in 24 hours (Taiwan MND, 30 Dec 2025); separate Dec 2025 drill involved 90+ ships."
      - name: "Taiwan (Republic of China)"
        members: ["ROC Armed Forces", "Coast Guard Administration"]
        backers: ["United States (arms sales; a package of over $11 billion approved Dec 2025)"]
        leaders: ["Lai Ching-te (President)"]
        strength: "No figure retrieved."
    summary: "No shots have been fired, but China keeps rehearsing a blockade of Taiwan. Its December 2025 'Justice Mission-2025' drill put live-fire zones inside Taiwan's territorial waters for the first time since 2022 and fired 27 rockets toward the island's approaches, and in June 2026 Chinese ships ran the first 'law enforcement patrols' off Taiwan's east coast, which analysts read as a quarantine rehearsal."
    background: "Since August 2022 the PLA has staged a series of large exercises around Taiwan (Joint Sword in 2023 and 2024, Strait Thunder-2025A in April 2025), each one practising blockade of ports such as Keelung and Kaohsiung, joint fire strikes and control of sea and air space, while daily air and naval patrols have eroded the median line. Beijing also uses its coast guard to assert 'law enforcement' around Kinmen and Matsu.\n\nThis matters because each drill brings PLA forces closer to Taiwan with shorter warning, blurring the line between exercise and the opening moves of a real blockade, while disrupting civilian air and sea traffic and testing US and Japanese responses."
    year: "In about 9 to 12 December 2025 China staged a drill with more than 90 ships that appeared aimed at the whole First Island Chain. After the US approved arms sales worth over $11 billion, the Eastern Theater Command launched Justice Mission-2025 on 29-30 December: ground, naval, air and rocket forces simulated blockading Keelung and Kaohsiung, an amphibious assault group of four ships operated east of Taiwan, rocket launchers on Pingtan fired 27 rockets into waters north and southwest of Taiwan, and 857 international flights were affected. Fishing-vessel formations of 2,000+ (25 December) and 1,400+ (8-13 January 2026) boats stretched 466 km in the East China Sea. From 27 February to 13 March 2026 Chinese warplanes almost disappeared from Taiwan's vicinity, a lull some analysts linked to a planned May 2026 Trump-Xi summit; patrols resumed on 14 March. China closed parts of the Yellow and East China seas for 40 days (27 March to 6 May). KMT chair Cheng Li-wun met Xi Jinping in April. From 6 to 10 June PLA Navy and coast guard ships conducted the first 'law enforcement patrols' east of Taiwan, with four large vessels coming within 32 nautical miles of the east coast and hailing civilian ships."
    situation: "As of late October 2026 there is no active fighting; Chinese pressure continues through patrols, coast guard activity and periodic large drills. No named major PLA exercise around Taiwan in 2026 was confirmed in sources retrieved for this research."
    technical:
      - "Justice Mission-2025 day 1 (29 Dec 2025, 3 pm): 14 PLA warships, 14 CCG vessels, a 4-ship amphibious assault strike group southeast of Taiwan, 89 aircraft of which 67 entered Taiwan's response zone (Taiwan MND via Wikipedia)."
      - "24 hours to 6 am on 30 Dec 2025: 130 PLA aircraft, 14 military ships and 8 other Chinese official ships (Taiwan MND via Wikipedia)."
      - "Rockets: 27 rockets fired from Pingtan Island into waters north and southwest of Taiwan, landing near Taiwan's 24 nm line; ETC released video of a PCH-191 launcher; first rocket fire into the strait since 2022; no missiles overflew Taiwan, unlike 2022 (Wikipedia)."
      - "Exercise zones grew from five to seven and extended into Taiwan's territorial waters for the first time since the 2022 drills (Wikipedia)."
      - "First deployment of an amphibious assault ship formation in such a drill, east of the island, practising 'seizing key ports' (China Daily, citing PLA experts)."
      - "CCG announced patrols near Matsu and Wuqiu (Kinmen) during the drill (Wikipedia)."
      - "Civil impact: 100,000+ travellers expected affected, 857 international flights affected and 84 domestic flights cancelled (Wikipedia)."
      - "Strait Thunder-2025A (1-2 Apr 2025): 76 aircraft and 15 warships on day 1; 59 aircraft and 23 warships on day 2 (Wikipedia)."
      - "Fishing-vessel formations: 2,000+ boats on 25 Dec 2025 and 1,400+ on 8-13 Jan 2026, each about 466 km long, in the East China Sea (Wikipedia)."
      - "June 2026 'law enforcement patrols' east of Taiwan: first PLAN participation there; four large vessels within 32 nm of the east coast; Jamestown called it a 'quasi-quarantine' (Wikipedia)."
      - "Air activity pause: no PLA warplanes reported near Taiwan from 27 Feb to 13 Mar 2026 except on 7 Mar (Wikipedia)."
      - "Taiwan lost an F-16V in a training accident off Hualien on 6 Jan 2026 (Wikipedia: 2026 in Taiwan)."
    casualties: "None from hostile action."
    displaced: "Not applicable."
    zones:
      - {name: "Taiwan Strait (median line area)", lat: 24.20, lng: 119.90, radius_km: 100, note: "Daily PLA air and naval patrols; live-fire zones in major drills."}
      - {name: "Pingtan Island launch area", lat: 25.50, lng: 119.78, radius_km: 20, note: "Rocket launchers fired 27 rockets in Dec 2025."}
      - {name: "Keelung approaches (north)", lat: 25.45, lng: 121.80, radius_km: 60, note: "Simulated blockade zone in Justice Mission-2025."}
      - {name: "Kaohsiung approaches (southwest)", lat: 22.30, lng: 119.90, radius_km: 70, note: "Simulated blockade and live-fire area."}
      - {name: "East of Taiwan", lat: 23.50, lng: 122.20, radius_km: 80, note: "Amphibious assault group (Dec 2025) and first 'law enforcement patrols' (Jun 2026)."}
      - {name: "Kinmen", lat: 24.45, lng: 118.38, radius_km: 20, note: "China Coast Guard patrols around Taiwan-held islands."}
      - {name: "Matsu", lat: 26.16, lng: 119.95, radius_km: 20, note: "China Coast Guard patrols announced during drills."}
    timeline:
      - {date: "2025-12-09", event: "Large PLA drill with 90+ ships begins (about 9 to 12 Dec)."}
      - {date: "2025-12-29", event: "Justice Mission-2025 begins; 89 aircraft and 28 ships counted on day 1."}
      - {date: "2025-12-30", event: "27 rockets fired from Pingtan; zones extend into Taiwan's territorial waters."}
      - {date: "2026-01-08", event: "Fishing-vessel formation of 1,400+ boats (to 13 Jan)."}
      - {date: "2026-02-27", event: "PLA warplanes largely vanish from around Taiwan until 13 Mar."}
      - {date: "2026-03-27", event: "40-day airspace closures in Yellow and East China seas begin (to 6 May)."}
      - {date: "2026-06-06", event: "First PLA Navy and coast guard 'law enforcement patrols' east of Taiwan (to 10 Jun)."}
    outlook: "Watch for the next named PLA exercise, typically triggered by US arms sales, transits or speeches by President Lai, and for any move from drills to coast guard 'inspections' of shipping, which would mark a shift from rehearsal to quarantine."
    sources:
      - {label: "Wikipedia: Justice Mission 2025", url: "https://en.wikipedia.org/wiki/Justice_Mission_2025"}
      - {label: "Wikipedia: Fourth Taiwan Strait Crisis", url: "https://en.wikipedia.org/wiki/Fourth_Taiwan_Strait_Crisis"}
      - {label: "China Daily: PLA drills around Taiwan (28 Jan 2026)", url: "https://mobile.chinadaily.com.cn/html5/2026-01/28/content_006_6979269bed50ccabe15211c7.htm"}
      - {label: "Wikipedia: 2026 in Taiwan", url: "https://en.wikipedia.org/wiki/2026_in_Taiwan"}

  - id: korean-peninsula
    name: "Korean peninsula (North Korean missile tests and Russia alliance)"
    type: border-clash
    intensity: low
    status: frozen
    started: "1953-07-27 (armistice); current phase of intensified missile testing and military alliance with Russia since 2024"
    countries: [PRK, KOR]
    sides:
      - name: "North Korea"
        members: ["Korean People's Army", "KPA special operations forces deployed to Russia"]
        backers: ["Russia (mutual defence treaty ratified Nov 2024; military technology and revenue)", "China (Xi Jinping visited Pyongyang Jun 2026)"]
        leaders: ["Kim Jong Un (General Secretary, reappointed 22 Feb 2026; chairman of the State Affairs Commission)", "Kim Yo Jong (department director)", "Pak Thae-song (Premier)"]
        strength: "12,000 to 15,000 troops sent to Russia (Wikipedia compilation of US, South Korean and Ukrainian estimates)."
      - name: "South Korea, United States and Japan"
        members: ["Republic of Korea Armed Forces (Joint Chiefs of Staff)", "US Indo-Pacific Command", "Japan Ministry of Defense (tracking and information-sharing)"]
        backers: []
        leaders: []
        strength: "No figure retrieved."
    summary: "There is no fighting across the DMZ, but North Korea is testing missiles at more than double its 2025 pace, including a new hypersonic-glide variant and missiles flying over 900 km, while its troops and workers support Russia's war against Ukraine. Closer ties with both Moscow and Beijing in 2026 have reduced its isolation."
    background: "The Korean War ended in an armistice in 1953, not a peace treaty. Since 2024 North Korea has declared the South a separate hostile state, signed a mutual defence treaty with Russia and sent troops to help expel Ukrainian forces from Russia's Kursk region, receiving revenue estimated at over $10 billion and access to Russian military technology in return.\n\nThis matters because combat experience, Russian help and frequent testing are improving the North's short-range and hypersonic missiles, which are designed to defeat South Korean, Japanese and US missile defences."
    year: "North Korea tested two hypersonic missiles on 22 October 2025 and a ballistic missile on 7 November 2025. In 2026 it fired several ballistic missiles on 4 January, two on 27 January and about ten from the Sunan area on 14 March. The 9th Party Congress (19-25 February) reappointed Kim Jong Un. It tested the Hwasongpho-11 Ka tactical missile on 8 April, five Hwasongpho-11 Ra on 19 April (reported with cluster munitions), close-range missiles into the Yellow Sea on 25 May, an SRBM on 6 August and a missile from Wonsan on 12 August. Xi Jinping visited Pyongyang on 8 June, the first Xi-Kim meeting in seven years, and a road bridge to Russia opened on 8 September. On 20 September it tested what it called a Hwasong-11Ma-1 variant with a hypersonic glide vehicle warhead. Ukraine transferred two captured North Korean soldiers to South Korea on 23 September. On 3 October a missile flew more than 700 km from the Wonsan area, and on 12 October two missiles were fired from near Pyongyang, one flying over 910 km, after a South Korean hypersonic test. Seoul also reported a DMZ landmine explosion that injured South Korean soldiers in early October."
    situation: "As of late October 2026 the peninsula is tense but without armed clashes. North Korea is in an intensive testing cycle, and South Korea's JCS counted the 3 October launch as the 16th ballistic launch of the year (Japan counted at least 11 launch events with 18+ missiles by 12 October, reflecting different counting methods)."
    technical:
      - "20 Sep 2026: range about 440 km, apogee about 60 km; North Korea said it was a new Hwasong-11Ma-1 variant with a hypersonic glide vehicle warhead (Militarnyi, citing Japan MoD)."
      - "12 Oct 2026: two ballistic missiles from the Pyongyang area (~9:20 am); one flew about 220 km with a 20 km apogee, the other 910+ km with a 70 km apogee, a depressed trajectory consistent with evading defences (Militarnyi; Korea Times)."
      - "3 Oct 2026: one ballistic missile from the Wonsan area (Sangum-ri, Anbyon County per Wikipedia), 700+ km; Kim Yo Jong called it an intermediate-range missile (Daily Pioneer; Wikipedia)."
      - "19 Apr 2026: five Hwasongpho-11 Ra surface-to-surface tactical ballistic missiles; reported with cluster munition warhead (Wikipedia)."
      - "8 Apr 2026: Hwasongpho-11 Ka tactical missile during a week of weapons tests (Wikipedia)."
      - "14 Mar 2026: about 10 ballistic missiles from the Sunan launch site (Wikipedia)."
      - "Testing tempo: Japan counted at least 11 launch events and 18+ missiles in 2026 by 12 Oct, more than double 2025's launches and about triple its missile count (Militarnyi)."
      - "Troops in Russia: 12,000 to 15,000 (about 500 officers, three generals), mostly special operations forces; still present in Kursk border areas in Feb 2026 per Ukraine's DIU (Wikipedia)."
      - "Arms to Russia: shells estimated at 4 million (Open Source Centre, to Apr 2025) to 12 million (CFR, to Jul 2025); 148 Hwasong-11 type missiles by early 2025 (Ukrainian intelligence); about 50 Koksan M-1989 SPGs and 20 M-1991 MRLs (Wikipedia)."
      - "Revenue: over $10 billion from arms sales to Russia mid-2023 to end-2025, against a GDP of about $27 billion (Wikipedia)."
      - "Russia-North Korea road bridge over the Tumen (Rason-Khasan) opened 8 Sep 2026; Sinuiju-Dandong Yalu road bridge inaugurated 14 Oct 2026 (Wikipedia)."
    casualties: "No inter-Korean combat deaths found for the window. South Korean soldiers were injured by a DMZ landmine in early Oct 2026 (Daily Pioneer). North Korean losses in Russia were estimated at 300 killed and 2,700 wounded (South Korea's NIS) to about 1,000 killed (Western officials) as of Jan 2025; no updated figure retrieved."
    displaced: "Not applicable."
    zones:
      - {name: "Pyongyang and Sunan launch area", lat: 39.20, lng: 125.70, radius_km: 30, note: "Launches on 14 Mar and 12 Oct 2026."}
      - {name: "Wonsan-Kalma and Anbyon launch area", lat: 39.10, lng: 127.45, radius_km: 30, note: "Launches on 12 Aug and 3 Oct 2026."}
      - {name: "Demilitarized Zone", lat: 38.20, lng: 127.00, radius_km: 120, note: "Armistice line; landmine incident injured South Korean soldiers in Oct 2026."}
      - {name: "Kursk border region (Russia)", lat: 51.40, lng: 35.20, radius_km: 80, note: "North Korean troops reported still present in Feb 2026."}
    timeline:
      - {date: "2025-10-22", event: "Two hypersonic missiles tested."}
      - {date: "2026-01-04", event: "Several ballistic missiles fired toward the East Sea."}
      - {date: "2026-02-19", event: "9th Party Congress opens (to 25 Feb)."}
      - {date: "2026-03-14", event: "About 10 ballistic missiles fired from Sunan."}
      - {date: "2026-04-19", event: "Five Hwasongpho-11 Ra tactical missiles fired."}
      - {date: "2026-06-08", event: "Xi Jinping visits Pyongyang."}
      - {date: "2026-09-20", event: "Hwasong-11Ma-1 hypersonic glide vehicle variant tested."}
      - {date: "2026-09-23", event: "Ukraine transfers two captured North Korean soldiers to South Korea."}
      - {date: "2026-10-03", event: "Missile from Wonsan area flies 700+ km."}
      - {date: "2026-10-12", event: "Two missiles from near Pyongyang, one 910+ km."}
    outlook: "Watch for an ICBM flight test (none confirmed for 2026 in sources retrieved), a nuclear test, more hypersonic glide tests, and any new deployment to Russia or Ukraine. China's renewed embrace and Russian support reduce the leverage of sanctions."
    sources:
      - {label: "Wikipedia: 2026 in North Korea", url: "https://en.wikipedia.org/wiki/2026_in_North_Korea"}
      - {label: "Wikipedia: List of North Korean missile tests", url: "https://en.wikipedia.org/wiki/List_of_North_Korean_missile_tests"}
