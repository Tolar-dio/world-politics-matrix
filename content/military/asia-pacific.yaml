      - {name: "Northern Shan ceasefire zone", lat: 23.20, lng: 98.00, radius_km: 120, note: "MNDAA and TNLA areas under China-brokered ceasefires; Lashio handed back."}
      - {name: "Karen State and Tanintharyi (KNU/KNLA)", lat: 15.80, lng: 98.40, radius_km: 200, note: "KNLA fronts along Thai border; junta retook Mawtaung in May 2026."}
      - {name: "Karenni (Kayah) State", lat: 19.67, lng: 97.21, radius_km: 60, note: "KNPP-led resistance around Loikaw."}
      - {name: "Chin State", lat: 22.70, lng: 93.60, radius_km: 110, note: "Chin resistance areas; AA holds Paletwa in the south."}
      - {name: "Mandalay north (Tagaung)", lat: 23.50, lng: 96.02, radius_km: 40, note: "Junta retook Tagaung, last NUG-held town in Mandalay Region, 13 Mar 2026."}
    timeline:
      - {date: "2025-11-14", event: "KNU/KNLA captures Mawtaung, a Thai border trade town in Tanintharyi."}
      - {date: "2025-12-28", event: "First phase of junta-run general election."}
