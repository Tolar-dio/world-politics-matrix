  - id: pakistan-insurgencies
    name: "Pakistan's insurgencies (TTP and allies in Khyber Pakhtunkhwa, BLA in Balochistan)"
    type: insurgency
    intensity: high
    status: active
    started: "2026-01-31 (current escalation; both insurgencies are long-running)"
    countries: [PAK]
    sides:
      - name: "Pakistani state"
        members: ["Pakistan Army", "Frontier Corps", "Provincial police and counter-terrorism departments", "Sindh Rangers", "Pakistan Coast Guard"]
        backers: []
        leaders: ["Shehbaz Sharif (Prime Minister)", "Field Marshal Asim Munir (army chief)", "Sarfraz Bugti (Chief Minister of Balochistan)", "Lt. Gen. Ahmed Sharif Chaudhry (ISPR Director General)"]
        strength: "No figure retrieved."
      - name: "Pakistani Taliban (TTP) and allied jihadist factions"
        members: ["Tehrik-i-Taliban Pakistan (TTP)", "Ittehad ul Mujahideen Pakistan (IMP, formed Apr 2025, includes Hafiz Gul Bahadur Group)", "Jamaat-ul-Ahrar"]
        backers: ["Afghan Taliban (safe haven alleged by Pakistan and a US Lead Inspector General report; denied by Kabul)"]
        leaders: ["Noor Wali Mehsud (TTP emir)"]
        strength: "TTP 4,000 to 6,000 fighters (US Lead Inspector General, Jan-Mar 2026, cited by Pakistan)."
      - name: "Baloch separatists"
        members: ["Balochistan Liberation Army (BLA), labelled 'Fitna al-Hindustan' by Pakistan"]
        backers: ["India (alleged by Pakistan; India calls the claims baseless)"]
        leaders: []
        strength: "No reliable figure retrieved."
      - name: "Islamic State Khorasan Province (ISKP)"
        members: ["ISKP"]
        backers: []
        leaders: []
        strength: "No figure retrieved."
    summary: "Pakistan is living through its worst militant violence in about five years: the Pakistani Taliban and allied factions wage a daily campaign of bombings and ambushes in Khyber Pakhtunkhwa, while the Balochistan Liberation Army mounts large coordinated assaults on cities, trains and security posts. The violence is the main driver of Pakistan's war with the Afghan Taliban, whom Islamabad blames for sheltering the TTP."
    background: "The TTP regrouped after the Taliban returned to power in Kabul in 2021 and has since concentrated on police and army targets in the southern districts of Khyber Pakhtunkhwa (Bannu, Lakki Marwat, Dera Ismail Khan, Tank), the former tribal areas (Waziristan, Bajaur, Mohmand, Khyber) and increasingly Punjab and Sindh. New fronts such as Ittehad ul Mujahideen Pakistan, which includes the Hafiz Gul Bahadur Group, allow deniable mass-casualty attacks.\n\nIn Balochistan, Pakistan's largest and poorest province, ethnic Baloch separatists seek greater autonomy and a larger share of resource wealth. The BLA has escalated from roadside attacks to coordinated multi-city assaults, the hijacking and bombing of trains, and attacks on Chinese-linked projects. Pakistan frames both insurgencies as foreign-backed (India, Afghanistan), which both countries deny. This matters because each mass-casualty attack now carries a risk of Pakistani strikes inside Afghanistan."
    year: "Late 2025: a suicide bombing in Islamabad on 11 November prompted Pakistan to declare a 'state of war' on Kabul's sanctuaries.\n\nJanuary to March 2026: the BLA launched coordinated attacks from 31 January on at least 12 locations in Quetta, Gwadar, Mastung and Noshki, torching a police station and attacking a Frontier Corps headquarters; 31 civilians and 17 security personnel died, and officials claimed 133 to 145 militants killed. An ISKP suicide bomber killed at least 31 at a Shia mosque in Islamabad on 6 February. Bombings in Bajaur and Bannu in mid-February helped trigger the February war with Afghanistan, and the TTP leadership ordered attacks in support of the Afghan Taliban.\n\nApril to October 2026: violence spread across both provinces. The BLA ambushed a Coast Guard boat off Gwadar (12 April), a suicide bomber hit a train carrying soldiers in Quetta (24 May, at least 30 dead), and a 4 to 8 July wave of attacks in Balochistan killed 42, 38 of them security personnel. Jamaat-ul-Ahrar attacked the Sindh Rangers headquarters in Karachi on 27 June. A TTP suicide car bomb killed 27 in Tank on 24 July, and a suicide bomber killed at least 14 at an anti-militant rally in Kabal, Swat, on 2 August. Around 18 September a suicide bomber and eight gunmen stormed a police compound in Kohat, starting a 20-hour battle; the attack restarted Pakistan's air war in Afghanistan. CRSS counted 1,415 people killed in Pakistan in July to September alone."
    situation: "As of late October 2026 attacks continue almost daily in Khyber Pakhtunkhwa and frequently in Balochistan, with security forces reporting large militant death tolls in raids (for example eight TTP fighters in Dera Ismail Khan on 4 October). Balochistan remains under months-long restrictions on gatherings and face coverings imposed after the January attacks."
    technical:
      - "CRSS Q3 2026 (Jul-Sep): 385 violent incidents, 1,415 killed, 558 injured, the sharpest rise in nearly five years (Long War Journal)."
      - "BLA 31 Jan 2026 offensive hit at least 12 locations in Quetta, Gwadar, Mastung and Noshki; targets included an FC headquarters and a police station near Quetta; Pakistan said two attacks involved female fighters (Al Jazeera)."
      - "Kohat police compound attack (around 18 Sep 2026): suicide bomber at the compound mosque followed by eight gunmen and a 20-hour gunbattle (AP); LWJ attributes a 31-dead complex suicide attack on 18 Sep to IMP."
      - "Train targeting: BLA claimed the 24 May 2026 suicide bombing of a train carrying military personnel in Quetta (Wikipedia)."
      - "Maritime: BLA ambush on a Pakistan Coast Guard patrol boat in the Arabian Sea near Gwadar, 12 Apr 2026 (Wikipedia)."
      - "Vehicle-borne IEDs: Fateh Khel (Bannu) checkpoint car bomb killed 12 police (10 May 2026); Tank suicide car bomb killed 27 including 15 security personnel (24 Jul 2026) (Wikipedia)."
      - "Drone-borne attack on an FC outpost in Karak (23 Feb 2026) shows militant use of drones (Wikipedia)."
      - "Terminology: Pakistan's government calls the TTP 'Fitna al-Khwarij' and the BLA 'Fitna al-Hindustan' (Reuters; Al Jazeera)."
      - "Afghan Taliban link: Pakistan alleges a meeting of BLA, AQIS and Hafiz Gul Bahadur Group leaders hosted by Kandahar's governor; Kabul denies it (Long War Journal)."
    casualties: "CRSS: 1,415 killed and 558 injured in Jul-Sep 2026 (via Long War Journal). Major 2026 attacks: BLA offensive 31 Jan (31 civilians, 17 security personnel; 133 to 216 militants claimed killed in different tallies), Islamabad mosque 6 Feb (31+), Quetta train 24 May (30+), Balochistan 4-8 Jul (42), Tank 24 Jul (27), Kohat Sep (21 to 31 depending on source). Militant death claims by the military are not independently verified."
    displaced: "No sourced 2026 displacement figure retrieved for Pakistan's internal conflicts."
    zones:
      - {name: "Quetta", lat: 30.1798, lng: 66.975, radius_km: 30, note: "Provincial capital; BLA assaults (Jan 2026) and train bombing (May 2026)."}
      - {name: "Mastung-Noshki-Kharan belt", lat: 29.30, lng: 66.20, radius_km: 120, note: "BLA attacks on police, banks and highways."}
      - {name: "Gwadar and Makran coast", lat: 25.30, lng: 62.80, radius_km: 120, note: "CPEC port city; BLA attacks incl. Coast Guard ambush Apr 2026."}
      - {name: "Chagai mining belt", lat: 29.00, lng: 64.30, radius_km: 120, note: "Attack on mining site killed 9 (23 Apr 2026)."}
      - {name: "Southern Khyber Pakhtunkhwa (Bannu, Lakki Marwat, DI Khan, Tank)", lat: 32.40, lng: 70.60, radius_km: 90, note: "Core TTP battleground; frequent bombings and ambushes."}
      - {name: "Waziristan", lat: 32.60, lng: 69.85, radius_km: 70, note: "Bombings in Wana; Hafiz Gul Bahadur Group area."}
      - {name: "Bajaur-Mohmand", lat: 34.75, lng: 71.50, radius_km: 45, note: "Checkpoint bombings and police ambushes."}
      - {name: "Kohat-Hangu", lat: 33.55, lng: 71.30, radius_km: 40, note: "Kohat police compound siege (Sep 2026)."}
      - {name: "Karachi", lat: 24.8607, lng: 67.0011, radius_km: 30, note: "Jamaat-ul-Ahrar attack on Sindh Rangers HQ (27 Jun 2026)."}
    timeline:
      - {date: "2025-11-11", event: "Suicide bombing in Islamabad."}
      - {date: "2026-01-31", event: "BLA launches coordinated attacks across Balochistan."}
      - {date: "2026-02-06", event: "ISKP bombing of Shia mosque in Islamabad kills 31."}
      - {date: "2026-04-12", event: "BLA ambushes Coast Guard patrol boat near Gwadar."}
      - {date: "2026-05-10", event: "Car bomb at Fateh Khel checkpoint, Bannu, kills 12 police."}
      - {date: "2026-05-24", event: "Suicide bombing of train carrying troops in Quetta kills 30+."}
      - {date: "2026-06-27", event: "Jamaat-ul-Ahrar attacks Sindh Rangers HQ in Karachi."}
      - {date: "2026-07-24", event: "TTP suicide car bomb in Tank kills 27."}
      - {date: "2026-08-02", event: "Suicide bombing at anti-militant rally in Kabal kills 14+."}
      - {date: "2026-09-18", event: "Complex attack on Kohat police compound; 20-hour siege."}
      - {date: "2026-10-04", event: "Security forces kill eight TTP militants in Dera Ismail Khan."}
    outlook: "Expect continued high tempo through winter, with the TTP and IMP focused on police in southern Khyber Pakhtunkhwa and the BLA on spectacular attacks on transport and security hubs. Each mass-casualty attack risks another round of Pakistani strikes in Afghanistan. Watch also for attacks on Chinese nationals and projects, which carry diplomatic weight with Beijing."
    sources:
