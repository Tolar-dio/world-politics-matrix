  - id: thailand-cambodia-border-conflict
    name: "Thailand-Cambodia border conflict"
    type: border-clash
    intensity: medium
    status: fragile-ceasefire
    started: "2025-12-08 (second round of fighting; first round 24-28 Jul 2025)"
    countries: [THA, KHM]
    sides:
      - name: "Thailand"
        members: ["Royal Thai Army (Second Army Region)", "Royal Thai Air Force", "Royal Thai Navy"]
        backers: []
        leaders: ["Anutin Charnvirakul (Prime Minister)"]
        strength: "No figure retrieved."
      - name: "Cambodia"
        members: ["Royal Cambodian Armed Forces", "Border police"]
        backers: []
        leaders: ["Hun Manet (Prime Minister)", "Maly Socheata (Defence Ministry spokeswoman)"]
        strength: "No figure retrieved."
    summary: "A century-old dispute over temples and a colonial-era border turned into two short wars in 2025, in July and again in December, when Thailand used F-16 air strikes and a ground offensive to take hills and temple sites claimed by Cambodia. A ceasefire signed on 27 December 2025 has held as a cold peace, with border crossings closed and occasional shooting incidents."
    background: "Both countries claim several temples and ridgelines along a border mapped by French colonial surveyors; the International Court of Justice awarded Preah Vihear temple to Cambodia in 1962 and clarified the ruling in 2013. Clashes in the Emerald Triangle in May 2025 escalated into five days of war in July 2025 that killed 43 people and displaced about 300,000 before a truce brokered with help from the United States, China and Malaysia.\n\nOn 26 October 2025 the two prime ministers signed the Kuala Lumpur Peace Accord, witnessed by Malaysia's Anwar Ibrahim and US President Donald Trump, covering heavy-weapons withdrawal, ASEAN observers, joint demining, temporary border markers, the release of 18 Cambodian prisoners and a joint task force against scam centres. It matters because the deal tied border peace to US trade arrangements, and its collapse showed how a single landmine can unravel high-level diplomacy."
    year: "On 10 November 2025 a landmine in Sisaket wounded two Thai soldiers (one lost a foot) and Thailand suspended the accord, saying the mine was newly laid; Cambodia said it was old. On 12 November Cambodia said Thai fire killed one civilian and wounded five at Prey Chan village. After a skirmish on 7 December, Thailand resumed ground operations and F-16 strikes on 8 December; Cambodia fired BM-21 rockets toward Buri Ram, and fighting spread around the Ta Muen Thom, Ta Krabey and Preah Vihear areas. On 10 December the Royal Thai Army launched Operation Sattawat and seized several areas inside Cambodia. Cambodia closed all border crossings on 13 December. Despite a ceasefire announcement by President Trump, fighting continued until a new ceasefire on 27 December with a 72-hour monitoring period; Thailand later released the 18 Cambodian soldiers captured in July. Thailand accused Cambodia of flying more than 250 drones into its territory on 29 December.\n\nIn 2026 the truce held, though Thailand accused Cambodia of firing a 40 mm grenade near a Thai patrol in Sisaket on 24 February. The ceasefire was still in effect as of May 2026, amid mistrust and sporadic incidents."
    situation: "As of late October 2026 the front is quiet but militarised. Thai forces hold the temples and hills taken in December 2025 (Ta Krabey, Khana, Ta Muen Thom, Chong An Ma, at least five hills and parts of O Smach and Thmor Da per Wikipedia's compilation), while Cambodia holds parts of the Emerald Triangle, Hill 745 and the Preah Vihear promontory. Border crossings remain largely closed. No sourced fatal clash after the ceasefire was found for 2026."
    technical:
      - "8 Dec 2025: Thai army began 'using aircraft to strike military targets in several areas'; Wikipedia records F-16 strikes on multiple positions inside Cambodia (Ittefaq/AFP; Wikipedia)."
      - "Cambodia fired BM-21 multiple rockets toward Buri Ram province on 8 Dec 2025 (no casualties reported) (Ittefaq/AFP)."
      - "Cambodia said Thai tanks fired on Tamone Thom (Ta Muen Thom) temple and areas near Preah Vihear temple on 8 Dec 2025 (Ittefaq/AFP)."
      - "Operation Sattawat (from 10 Dec 2025): Royal Thai Army ground offensive that seized localities in northern Cambodia (Wikipedia)."
      - "7 Dec 2025 skirmish: Cambodia says Thai troops used small arms, B-40 grenades and 60 mm mortars at Prolean Thmor, Choam Khsant District, Preah Vihear (Wikipedia)."
      - "Mines found by Thai units in Oct 2025: PMN-2, POMZ-2 and MN-79 types (Wikipedia)."
      - "Air defence: RTAF signed a $108 million deal for the Barak MX system in early Dec 2025 (Wikipedia)."
      - "Drones: Thailand alleged 250+ Cambodian drones crossed into Thailand on 29 Dec 2025, a day after the ceasefire (Wikipedia)."
      - "July 2025 round context: Royal Thai Navy task force of four vessels near Ko Kut and Ban Hat Lek (Wikipedia)."
      - "Ceasefire mechanism: 72-hour monitoring period after 27 Dec 2025; the KL accord's interim ASEAN observer team was part of the suspended October deal (Wikipedia)."
    casualties: "July 2025 round: 43 killed (AFP via Ittefaq). December 2025 round: no consolidated, sourced toll retrieved; one Thai soldier killed and four wounded on 8 Dec alone (Thai army via AFP). Wikipedia's whole-conflict infobox carries contested, inconsistently attributed figures (an OSINT estimate of 73 to 160+ Cambodian military and border police killed, a claim of about 505 soldiers killed with 6 to 13 T-55 tanks destroyed, and a separate figure of 42 soldiers killed and 531+ injured) that should be treated as unverified."
    displaced: "About 35,000 evacuated in Thailand by 8 Dec 2025 (Thai Second Army Region via AFP); July 2025 round displaced about 300,000 (AFP). No sourced December 2025 total retrieved."
    zones:
      - {name: "Ta Muen Thom and Ta Krabey temples (Surin-Oddar Meanchey)", lat: 14.35, lng: 103.30, radius_km: 25, note: "Temple complexes taken by Thai forces in Dec 2025."}
      - {name: "Preah Vihear and Phu Makhuea (Sisaket-Preah Vihear)", lat: 14.39, lng: 104.68, radius_km: 25, note: "Preah Vihear temple awarded to Cambodia by ICJ; heavy fighting in both rounds."}
      - {name: "Chong An Ma and Emerald Triangle (Ubon Ratchathani)", lat: 14.38, lng: 105.10, radius_km: 30, note: "Site of May 2025 clash; Thai hold Chong An Ma, Cambodia parts of the Emerald Triangle (approximate)."}
      - {name: "O Smach (Oddar Meanchey)", lat: 14.42, lng: 103.69, radius_km: 20, note: "Border town partially occupied by Thai forces in Dec 2025 (approximate)."}
      - {name: "Ban Nong Chan and Prey Chan (Sa Kaeo-Banteay Meanchey)", lat: 13.84, lng: 102.62, radius_km: 20, note: "Disputed villages; Thai mine clearance and Nov 2025 shooting (approximate)."}
      - {name: "Thmor Da and Trat coast", lat: 12.40, lng: 102.75, radius_km: 40, note: "Thmor Da area partially occupied by Thai forces; Thai naval actions near Ko Kut in July 2025 (approximate)."}
    timeline:
      - {date: "2025-10-26", event: "Kuala Lumpur Peace Accord signed by Anutin and Hun Manet, witnessed by Anwar and Trump."}
      - {date: "2025-11-10", event: "Landmine wounds two Thai soldiers in Sisaket; Thailand suspends the accord."}
      - {date: "2025-11-12", event: "Cambodia says Thai fire kills one civilian at Prey Chan."}
      - {date: "2025-12-08", event: "Thailand resumes ground operations and F-16 strikes; Cambodia fires BM-21 rockets."}
      - {date: "2025-12-10", event: "Royal Thai Army launches Operation Sattawat."}
      - {date: "2025-12-13", event: "Cambodia closes border crossings."}
      - {date: "2025-12-27", event: "New ceasefire with 72-hour monitoring period."}
      - {date: "2025-12-29", event: "Thailand alleges 250+ Cambodian drones crossed its border."}
      - {date: "2026-02-24", event: "Thai army reports Cambodian 40 mm grenade fire near a Sisaket patrol."}
    outlook: "Watch whether the two sides resume joint boundary commission work and demining, whether crossings reopen to trade, and whether Thailand hands back any positions taken in December. A landmine casualty or a shooting at a temple site could again unravel the truce."
    sources:
      - {label: "Wikipedia: 2025 Cambodian-Thai border crisis", url: "https://en.wikipedia.org/wiki/2025_Cambodian%E2%80%93Thai_border_crisis"}
      - {label: "Wikipedia: Cambodia-Thailand relations", url: "https://en.wikipedia.org/wiki/Cambodia%E2%80%93Thailand_relations"}
      - {label: "Wikipedia: Cambodian-Thai border dispute", url: "https://en.wikipedia.org/wiki/Cambodian%E2%80%93Thai_border_dispute"}
      - {label: "Daily Ittefaq/AFP: Thailand launches air strikes against Cambodia (8 Dec 2025)", url: "https://en.ittefaq.com.bd/14514/thailand-launches-air-strikes-against-cambodia-in"}
      - {label: "Adnkronos: Thailand-Cambodia, Bangkok reports border clashes (24 Feb 2026)", url: "https://english.adnkronos.com/2026/02/24/thailand-cambodia-bangkok-reports-border-clashes"}

  - id: south-china-sea-philippines-china
    name: "South China Sea confrontation (Philippines vs China)"
    type: border-clash
    intensity: low
    status: active
    started: "2023-01-01 (current phase of escalating coast guard confrontations; Scarborough standoff dates to 2012)"
    countries: [PHL, CHN]
    sides:
      - name: "Philippines"
        members: ["Philippine Navy", "Philippine Coast Guard", "Bureau of Fisheries and Aquatic Resources (BFAR)", "Armed Forces of the Philippines"]
        backers: ["United States (treaty ally; joint patrols incl. first US Coast Guard cutter near Scarborough, May 2026)"]
        leaders: ["Gibo Teodoro (Defense Secretary)", "Jay Tarriela (Coast Guard spokesperson)"]
        strength: "PCG and BFAR averaged 43 ship-days per month at Scarborough in H1 2026 (AMTI)."
      - name: "China"
        members: ["China Coast Guard", "Maritime militia", "PLA Southern Theater Command", "Research vessels (e.g. Xiang Yang Hong 33)"]
        backers: []
        leaders: ["Wang Yi (Foreign Minister)"]
        strength: "CCG logged 933 ship-days at Scarborough in H1 2026 (156 per month); 6 to 8 militia vessels near-continuously present (AMTI)."
    summary: "China and the Philippines are locked in a non-lethal but physical contest for control of Scarborough Shoal and Second Thomas Shoal, fought with coast guard cutters, water cannon, rammings and boarding confrontations. China's presence at Scarborough hit a record in 2026, and Manila now patrols with US Coast Guard support."
    background: "China took effective control of Scarborough Shoal, about 120 nautical miles from Luzon, after a 2012 standoff, and an international tribunal ruled against its sweeping claims in 2016. At Second Thomas Shoal the Philippines keeps a handful of marines aboard the grounded warship BRP Sierra Madre, and Chinese efforts to block resupply produced violent encounters until a secret provisional arrangement in July 2024.\n\nIn fall 2025 China declared a 'national nature reserve' at Scarborough, which Manila sees as a possible precursor to construction, and installed two buoys there in October 2025. This matters because the US-Philippine Mutual Defense Treaty could be invoked if a Philippine public vessel or service member is attacked, making these low-level clashes a potential trigger for a wider US-China crisis."
    year: "AMTI recorded 933 China Coast Guard ship-days at Scarborough in the first half of 2026, nearly equal to all of 2025 (1,099) and the highest since tracking began in 2019, with CCG ships holding a perimeter about 30 nautical miles out and 112 days of encounters with Philippine vessels. In April 2026 the Philippines accused China of using cyanide around Second Thomas Shoal. On 25 May Philippine authorities found a 6 by 6 metre floating platform inside the Scarborough lagoon, which China called a temporary research facility; it was removed on 17 June. From 26 to 30 May the US cutter Midgett joined Philippine ships for the first US Coast Guard joint patrol near the shoal, and the PLA Southern Theater Command held counter-exercises. On 20 July China Coast Guard personnel struck a Philippine Navy officer with a baton near the Sierra Madre at Second Thomas Shoal, and on 23 July a CCG ship hit a Philippine fisheries vessel with a water cannon at Scarborough while ASEAN foreign ministers met in Manila. In mid-September a CCG vessel struck and damaged the BFAR ship BRP Datu Magat Salamat off Palawan."
    situation: "As of late October 2026 China maintains a near-permanent cordon around Scarborough and continues to contest Philippine resupply at Second Thomas Shoal. There have been injuries and damaged ships but no deaths. Manila is investigating preliminary reports of Chinese structures at Scarborough, and Beijing warns of 'bitter consequences' if Manila acts with outside support."
    technical:
      - "CCG ship-days at Scarborough: 516 (2024), 1,099 (2025), 933 (H1 2026); monthly average 156 in H1 2026 vs 90 in H1 2025; May 2026 peak of 216 (AMTI)."
      - "CCG perimeter roughly 30 nautical miles from the shoal, with some cutters patrolling along or beyond the nine-dash line to intercept Philippine vessels; 6 to 8 maritime militia vessels keep near-continuous presence closer in (AMTI)."
