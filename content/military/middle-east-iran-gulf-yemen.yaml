  - id: yemen-civil-war
    name: "Yemen war (Houthi-Saudi war, Red Sea attacks and southern crisis)"
    type: civil-war
    intensity: high
    status: active
    started: "2026-07-13 (collapse of the 2022 Saudi-Houthi truce; southern STC crisis from 2025-12-02)"
    countries: [YEM, SAU]
    sides:
      - name: "Houthis (Ansar Allah)"
        members: ["Houthi armed forces", "Houthi missile and drone forces", "Houthi naval forces (drone boats, anti-ship missiles)", "Humanitarian Operations Coordination Center (HOCC, shipping notices)"]
        backers: ["Iran (weapons, missile and drone technology)", "Iraqi militias (parallel drone attacks on Saudi oil sites)"]
        leaders: ["Abdul-Malik al-Houthi (leader)", "Mahdi al-Mashat (Supreme Political Council)", "Yahya Saree (military spokesman)"]
        strength: "No reliable 2026 estimate found"
      - name: "Government of Yemen and Saudi-led coalition"
        members: ["Presidential Leadership Council forces", "National (Homeland) Shield Forces", "National Resistance Forces (Tareq Saleh)", "Giants Brigades", "Popular Resistance (Taiz)", "Royal Saudi Air Force and air defence"]
        backers: ["Saudi Arabia (air strikes, funding, troops)", "United States (intelligence and targeting data, no strikes reported)", "Multinational Maritime Defense Alliance (Saudi Arabia, Turkey, Pakistan, Egypt and others, from 30 Jul 2026)", "Greece (air defence unit in Saudi Arabia)"]
        leaders: ["Rashad al-Alimi (PLC chairman)", "Tareq Saleh (National Resistance Forces)", "Mohammed bin Salman (Saudi Crown Prince)"]
        strength: "15,000 Saudi-backed fighters massed on the border in Dec 2025 (Wikipedia, Southern Yemen campaign); no 2026 total found"
      - name: "Southern Transitional Council (until Jan 2026)"
        members: ["Hadrami Elite Forces", "STC Southern Armed Forces"]
        backers: ["United Arab Emirates (withdrew forces 30 Dec 2025)"]
        leaders: ["Aidarus al-Zubaidi (STC president, fled to UAE Jan 2026)"]
        strength: "About 10,000 fighters in the Dec 2025 offensive (Wikipedia, Yemeni civil war)"
    summary: "Yemen's war reignited in 2026 on two levels. In the south, Saudi-backed forces crushed the UAE-backed Southern Transitional Council in January after it seized the east. In the north, the Houthis joined the Iran war in March, broke their 2022 truce with Saudi Arabia in July, blockaded Saudi shipping, hit southern Saudi cities, and seized Yemen's Red Sea coast up to Bab al-Mandeb in September, while the government launched a counter-offensive in October."
    background: "The Houthis have held Sanaa since 2014 and fought a Saudi-led coalition from 2015 until a UN truce in April 2022 that largely held for four years. From late 2023 to October 2025 they attacked 178 ships in the Red Sea (ACLED), then paused after the Gaza ceasefire. In December 2025 the UAE-backed STC seized Hadramawt and al-Mahra; Saudi Arabia struck back, the UAE was expelled and Aden fell to Saudi-backed forces on 7 January 2026.\n\nThe Iran war tied Yemen to the Gulf. With Hormuz shut, Saudi Arabia exported oil through its East-West pipeline to Yanbu on the Red Sea. When the Houthis let an Iranian plane land at Sanaa in July and the government bombed the runway, the Houthis declared war on Saudi shipping. Their September seizure of Mocha, Perim and the Hanish islands puts both shores of Bab al-Mandeb, a chokepoint for Europe-Asia trade, within easy reach."
    year: "Dec 2025: STC offensive takes Seiyun, Tarim, PetroMasila and al-Mahra (2 to 9 Dec); Saudi air strikes on STC positions (26 Dec) and on a weapons shipment at Mukalla (30 Dec); UAE ordered out. Jan 2026: Saudi-backed forces retake Seiyun (3 Jan) and Mukalla (4 Jan) and enter Aden (7 Jan); al-Zubaidi flees; STC dissolution announced 9 Jan. 28 Mar: Houthis fire a ballistic missile at Israel, joining the Iran war. 13 Jul: government strikes on Sanaa airport runway; Houthis fire missiles at Abha, ending the truce. 20 Jul: Houthis ban ships from Saudi ports; Saudi tankers Encelia and Layla attacked. 24 Jul: Saudi strikes on Hodeidah port; Houthi strikes on Aramco at Yanbu and Jizan. 6 to 7 Aug: Houthi missiles and drones kill 58 then 8 soldiers around Marib. August: repeated strikes on Mocha, Marib, Jizan and Najran; tanker Amzan hit off Yanbu (24 Aug). 3 to 11 Sep: Houthi west-coast offensive takes Mocha (10 Sep), the coast to Bab al-Mandeb, Perim, Zuqar and Hanish; 500+ dead in a week (AFP); 82,000 displaced in September (IOM). 8 and 14 Sep: Houthi strikes on Aramco and King Khalid and King Fahd air bases. Early Oct: government 'Dawn of Yemen' offensive gains ground north-west and south of Marib; Houthis besiege Taiz. 18 Oct: 58 recruits reported killed in Houthi attacks."
    situation: "As of late October 2026 Yemen is in full-scale war again. The government's Dawn of Yemen offensive, backed by Saudi air power, is pushing on the Marib fronts (Medghal, Harib, east of Marib) and fighting along several axes around Taiz, which the Houthis besiege. The Houthis hold the whole Red Sea coast to Bab al-Mandeb and Perim Island and keep up missile and drone fire on government areas and southern Saudi Arabia. The Houthi blockade of Saudi ports, declared on 20 July, remains in place. The STC is broken and Aden is under the Saudi-backed government."
    technical:
      - "Houthi missiles listed by Wikipedia: Toufan medium-range ballistic missile (about 1,800 km), Quds-2 cruise missile (about 1,350 km), Soumar-family cruise missiles (about 2,000 km)."
      - "Houthi drones: Samad-3 and Samad-4 (1,800 km+), Wa'id (a Shahed-136 type, 2,500 km) and 7-metre explosive drone boats."
      - "Anti-ship campaign 2023 to 2025: 178 vessels attacked, 4 sunk, 9 sailors killed (ACLED); attacks halted 10 Oct 2025 and resumed against Saudi-linked ships from 20 Jul 2026."
      - "Blockade method: the Houthi HOCC emailed shipping companies on 20 Jul banning loading or unloading at Saudi ports, threatening ships anywhere within reach; seven ships diverted within two days."
      - "Tanker strikes: Encelia hit about 70 nm south-west of Al Shuqaiq (late July) and Amzan about 63 nm west of Yanbu (24 Aug), the latter by what the Houthis called a ballistic missile; both survived."
      - "A double-tap strike on a cargo ship in Bab al-Mandeb killed at least six crew (11 Aug)."
      - "Salvo sizes on the ground: 10+ missiles and 7 one-way attack drones on Marib camps on 7 Aug; 6 ballistic missiles and 4 drones on Marib city on 15 Aug."
      - "West-coast offensive combined missile bombardment, suicide drones, explosive boats and boat-borne landings before a ground push through National Resistance lines; the Houthis claimed 5,400 square km."
      - "Saudi air campaign resumed: the Houthis claimed 121 Saudi strikes in three days and 300+ in five days in early September; Saudi Arabia struck Hodeidah port, Kamaran and Sanaa."
      - "Saudi air defence intercepted missiles aimed at Abha (13 Jul); a Greek air-defence system in Saudi Arabia downed two Houthi ballistic missiles (25 Jul)."
      - "Government claims for Dawn of Yemen (unverified): 1,879 strikes, 950 Houthi fighters 'neutralised' and 380 vehicles destroyed by 13 Oct; 1,292 operations and 430+ Houthi casualties in 24 hours by 16 Oct."
      - "Bab al-Mandeb traffic was about 31 ships a day in May 2026 against about 75 before November 2023."
      - "Saudi oil flows via the Red Sea rose above 7 million barrels a day in June as Hormuz stayed shut, which is why the Houthi coastal grab threatens the main Saudi bypass; Riyadh shut the East-West pipeline on 10 Sep after Iraqi militia attacks."
      - "Southern crisis: Saudi strikes on 30 Dec 2025 hit two ships from Fujairah at Mukalla said to carry STC weapons and armoured vehicles, which triggered the UAE exit."
    casualties: "WHO: 1,282 killed and nearly 5,900 injured in Yemen fighting since August 2026 (as cited by Turkiye Today, 16 Oct 2026). AFP: 500+ dead in the week to 10 Sep. 58 government troops killed on 6 Aug and 58 recruits on 18 Oct in Houthi attacks. The Houthi side is largely uncounted: an analyst counted 332 confirmed Houthi funerals by 13 Sep, while the National Resistance claimed 1,000+ killed. STC reported 80 killed, 130 captured and 500 missing in Jan 2026. All battlefield figures are partisan and unverified."
    displaced: "IOM: more than 82,000 displaced in September 2026 alone, mostly from the west coast (as of 13 Sep); UN envoy: about 44,000 by 10 Sep (Long War Journal). Historic figure: over 3.6 million displaced (UNHCR, 2020)."
    zones:
      - {name: "Marib fronts", lat: 15.4625, lng: 45.3256, radius_km: 50, note: "Government-held oil city; Houthi missile and drone strikes; Dawn of Yemen offensive north-west (Medghal) and south (Harib)"}
      - {name: "Taiz", lat: 13.5795, lng: 44.0209, radius_km: 30, note: "City besieged by Houthis; fighting at al-Dhabab, Jabal Han, Sabir and al-Misrakh"}
      - {name: "Red Sea coast (Mocha to Bab al-Mandeb)", lat: 13.0, lng: 43.35, radius_km: 60, note: "Seized by Houthis 10 to 11 Sep 2026 from the National Resistance"}
      - {name: "Bab al-Mandeb and Perim Island", lat: 12.66, lng: 43.417, radius_km: 25, note: "Houthis took Perim Island 11 Sep; chokepoint for Red Sea shipping"}
      - {name: "Hodeidah and Kamaran", lat: 14.7978, lng: 42.9545, radius_km: 40, note: "Houthi port; Saudi strikes 24 Jul and October"}
      - {name: "Sanaa", lat: 15.3694, lng: 44.191, radius_km: 25, note: "Houthi capital; airport runway struck 13 Jul; coalition strikes 9 Oct"}
      - {name: "Al-Jawf and al-Dhale fronts", lat: 16.0, lng: 45.0, radius_km: 80, note: "Fighting resumed in August 2026 (approximate area)"}
      - {name: "Southern Saudi Arabia (Jizan, Abha, Khamis Mushait, Najran)", lat: 17.6, lng: 43.2, radius_km: 150, note: "Houthi missile and drone strikes on airports, air bases and Aramco sites since July 2026"}
      - {name: "Red Sea shipping lane off Yanbu", lat: 24.0, lng: 37.3, radius_km: 120, note: "Houthi attacks on Saudi tankers enforcing their declared blockade"}
      - {name: "Hadramawt and Seiyun", lat: 15.9431, lng: 48.7879, radius_km: 100, note: "STC offensive Dec 2025 and Saudi-backed recapture Jan 2026"}
      - {name: "Aden", lat: 12.7855, lng: 45.0187, radius_km: 25, note: "STC capital until government forces entered on 7 Jan 2026"}
    frontline:
      - name: "Houthi-government contact line (schematic: joins named front points from reporting, not a surveyed line)"
