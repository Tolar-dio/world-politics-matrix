  - id: epic-fury-opening-strikes
    name: "Opening strikes of Operation Epic Fury and Operation Roaring Lion"
    conflict: iran-war-2026
    tier: major
    start: "2026-02-28"
    end: "2026-03-01"
    place: "Tehran and sites across Iran"
    lat: 35.6892
    lng: 51.389
    sides: ["US CENTCOM (B-2 bombers, Lincoln and Ford carrier air wings, Tomahawk-armed destroyers) and Israeli Air Force", "Iranian leadership, IRGC, air defences, missile and naval forces"]
    outcome: "Supreme Leader Ali Khamenei and other senior officials killed; more than 1,000 targets struck in 24 hours; local air superiority declared."
    forces: "Hundreds of US fighters, dozens of tankers, B-2s on 37-hour round trips from the US; Israeli Air Force struck about 500 targets with 1,200+ bombs in 24 hours."
    losses: "Iranian leadership decapitated (Khamenei killed); 4 US troops killed when a ballistic missile hit a command post; 3 US F-15Es lost to Kuwaiti friendly fire, crews safe (Pentagon briefing; Wikipedia)."
