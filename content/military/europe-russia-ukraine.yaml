  - 'Ukraine: 53rd, 54th, 63rd Mechanized, 81st Airmobile, 117th and 120th Territorial Defence Brigades'
  outcome: Ongoing, slow Russian gains then stalemate. Russian units reached about 10 km from the twin cities by late July 2026 and fought for the Rai-Oleksandrivka heights; by October attacks near Kryva Luka and Malynivka were not advancing.
  forces: Start date approximates the mid-March 2026 opening of Russia's spring offensive on the fortress belt; coordinates are an approximate centre east of Sloviansk. A Russian tank assault on the southern approaches failed on 22 July 2026. KAB-1500 glide bombs hit the Sloviansk chemical plant on 31 July.
  losses: Not reliably reported.
  significance: The northeast was Russia's most successful sector in 2026, but the Donets canal, dense fortifications and Ukraine's Vivaldi counteroffensive make an assault on the cities unlikely in 2026.
