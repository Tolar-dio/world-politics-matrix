- id: battle-of-siversk
  name: Battle of Siversk
  conflict: russia-ukraine-war
  tier: mid
  start: '2025-09-01'
  end: '2025-12-23'
  place: Siversk, Donetsk Oblast, Ukraine
  lat: 48.8631
  lng: 38.0972
  sides:
  - 'Russia: Southern Group of Forces (3rd Combined Arms Army)'
  - 'Ukraine: Siversk garrison'
  outcome: Russian victory. Gerasimov claimed the town on 11 December 2025; ISW judged it taken by 21 December; Ukraine confirmed withdrawal on 23 December.
  forces: Start date approximates the September to October 2025 approach. Russian forces closed in from north, east and south through the Serebriansky forest, putting the Lyman road under fire control.
  losses: Not reliably reported.
  significance: Ended a front that had held since 2022 and gave Russia a staging base 31 km east of Sloviansk for its 2026 push on the fortress belt.
