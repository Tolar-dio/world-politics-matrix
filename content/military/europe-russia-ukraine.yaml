  losses: Zelensky claimed 9,550 Russians killed and 6,600 wounded by 12 August 2026 (unverified). Ukrainian losses not published.
  significance: Ukraine's first monthly net territorial gain since the 2024 Kursk incursion and its largest gains since 2023; it largely halted Russia's spring-summer offensive in the south and forced Moscow to divert elite naval infantry.
  sources:
