- id: battle-of-kupiansk-2025-26
  name: Battle of Kupiansk (2025-2026)
  conflict: russia-ukraine-war
  tier: major
  start: '2025-11-20'
  end: '2026-02-16'
  place: Kupiansk, Kharkiv Oblast, Ukraine
  lat: 49.7106
  lng: 37.6156
  sides:
  - 'Russia: Western Group of Forces infiltration units'
  - 'Ukraine: Kupiansk garrison incl. Khartiia Brigade (National Guard) clearing forces'
  outcome: Ukrainian victory. The Russian Defence Ministry claimed full capture on 20 November 2025; Zelensky visited the city on 12 December 2025 to disprove it; Ukraine raised its flag over city hall in early January 2026 and by 16 February only a few dozen Russians remained in one quarter, supplied by air drops.
  forces: Start date is the Russian capture claim; Russian troops had partially occupied the city since early October 2025. ISW put Russian strength in the city at about 100 to 200 troops in mid-December 2025 and Ukraine about 50 by late January 2026, supplied by drone. Russia had used a gas pipeline to infiltrate.
  losses: Not reliably reported.
  significance: A rare reversal of a Russian capture claim, it exposed false reporting by Russian generals and kept the Oskil River line in Ukrainian hands.
  sources:
  - label: 'Euromaidan Press: Ukraine reports confident control over Kupiansk (16 Feb 2026)'
    url: https://euromaidanpress.com/2026/02/16/ukraine-reports-confident-control-over-kupiansk-with-just-dozens-of-russian-troops-left-in-one-quarter/
