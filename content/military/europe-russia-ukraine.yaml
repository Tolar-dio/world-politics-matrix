    url: https://en.wikipedia.org/wiki/Timeline_of_the_Russo-Ukrainian_war_(1_January_2026_%E2%80%93_present)
- id: fall-of-myrnohrad
  name: Encirclement and fall of Myrnohrad
  conflict: russia-ukraine-war
  tier: mid
  start: '2025-10-14'
  end: '2026-01-28'
  place: Myrnohrad, Donetsk Oblast, Ukraine
  lat: 48.2911
  lng: 37.2681
  sides:
  - 'Russia: Central Group of Forces'
  - 'Ukraine: units defending the Pokrovsk-Myrnohrad agglomeration'
  outcome: Russian victory. ISW assessed Russia captured Myrnohrad before 28 January 2026 and Russian command posts moved in.
  forces: Russia claimed Balahan east of the town on 14 October 2025 and pressed the pocket from north and south.
  losses: Not reliably reported.
  significance: Closing the twin-city pocket ended the Pokrovsk battle and freed Russian units to push north toward Dobropillia and Rodynske.
