battles:
- id: fall-of-pokrovsk
  name: Fall of Pokrovsk (final phase of the Pokrovsk offensive)
  conflict: russia-ukraine-war
  tier: major
  start: '2025-10-24'
  end: '2026-01-28'
  place: Pokrovsk, Donetsk Oblast, Ukraine
  lat: 48.2833
  lng: 37.1833
  sides:
  - 'Russia: Central Group of Forces'
  - 'Ukraine: 7th Air Assault Corps and attached brigades'
  outcome: Russian victory. Russia claimed the city on 1 December 2025; no Ukrainian presence after 28 January 2026; ISW confirmed full Russian control in late February 2026.
  forces: Ukraine's 7th Corps estimated about 11,000 Russian troops in the area in late October 2025. Russian infiltration groups of a few hundred worked into the city from the south and west.
  losses: No reliable totals. Ukrainian claims through 2024 and 2025 spoke of hundreds of Russian casualties per day in this direction. Ukrainian losses not published.
  significance: Pokrovsk was a road and rail hub and Ukraine's main coking-coal source. It took Russia about 18 months from the first approach, and ISW noted Russia could not exploit the capture, which helped stall its 2026 advance.
  sources:
  - label: 'Wikipedia: Pokrovsk offensive'
    url: https://en.wikipedia.org/wiki/Battle_of_Pokrovsk
  - label: 'ISW/Critical Threats: Russian Offensive Campaign Assessment, December 15, 2025'
    url: https://www.criticalthreats.org/analysis/russian-offensive-campaign-assessment-december-15-2025
