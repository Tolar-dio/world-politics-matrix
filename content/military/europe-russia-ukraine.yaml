- id: ukrainian-southern-counteroffensive-2026
  name: 2026 Ukrainian counteroffensive (Oleksandrivka front)
  conflict: russia-ukraine-war
  tier: major
  start: '2026-02-11'
  end: ongoing
  place: Oleksandrivka area, junction of Dnipropetrovsk, Donetsk and Zaporizhzhia oblasts, Ukraine
  lat: 47.95
  lng: 36.45
  sides:
  - 'Ukraine: Air Assault Forces (7th Air Assault Corps, 82nd and 95th Air Assault Brigades), 1st Assault Regiment, 425th Skelya Regiment, 225th Assault Regiment, 37th Marine Brigade'
  - 'Russia: 36th and 37th Motor Rifle Brigades, 14th Spetsnaz Brigade; later 120th Naval Infantry Division, 40th Naval Infantry Brigade, 90th Tank Division'
  outcome: Ongoing Ukrainian success. Ukraine claimed 745 km2 and 26 villages by 12 August 2026; Russia retook Berezove, Ternove and Voskresenka; new Ukrainian gains reported at Perebudova, Komar and Fedorivka in October.
