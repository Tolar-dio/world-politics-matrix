- id: huliaipole-offensive
  name: Huliaipole offensive
  conflict: russia-ukraine-war
  tier: major
  start: '2025-09-11'
  end: '2026-02-06'
  place: Huliaipole, Zaporizhzhia Oblast, Ukraine
  lat: 47.65
  lng: 36.267
  sides:
  - 'Russia: 36th and 37th Motor Rifle Brigades (Eastern Group of Forces)'
  - 'Ukraine: 141st Mechanized Brigade, 102nd and 106th Territorial Defence Brigades, 225th Assault Battalion'
  outcome: Russian victory. Russia claimed Huliaipole on 27 December 2025; ISW confirmed its capture in its 6 February 2026 assessment.
  forces: Russia crossed the Yanchur river in late October, took Rivnopillia (Ukraine withdrew 12 November) and entered the town from the north and east in December.
  losses: Ukrainian Southern Defence Forces claimed about 250 Russian soldiers and 50 pieces of equipment destroyed per day in late November 2025 (unverified).
  significance: Huliaipole had been static since 2022 and Ukrainian defences faced south, so the attack from the east threatened to outflank the Zaporizhzhia line and triggered Ukraine's February counteroffensive.
  sources:
  - label: 'Wikipedia: Huliaipole offensive'
    url: https://en.wikipedia.org/wiki/Battle_of_Huliaipole
