    lat: 48.82
    lng: 37.76
    radius_km: 25
    note: Russian 3rd Combined Arms Army attacking toward Rai-Oleksandrivka, Mykolaivka, Kryva Luka and Malynivka; Russians about 9 to 10 km from the twin cities.
