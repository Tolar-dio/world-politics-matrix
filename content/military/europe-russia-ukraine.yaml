  outcome: Energiya plant at Yelets (Iskander power cells) reportedly hit by Storm Shadow; Proton-Electrotex microchip workshops in Oryol damaged; VSMPO-AVISMA titanium plant in Berezniki (about 1,580 km) struck; Voronezh aircraft and synthetic-rubber plants hit.
  forces: Storm Shadow cruise missiles and long-range drones.
  losses: Industrial damage; casualties not reported.
  significance: Shows Ukraine targeting the electronics and materials Russia needs for missiles and aircraft, not just oil.
