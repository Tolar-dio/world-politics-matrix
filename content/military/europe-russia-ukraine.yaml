- id: battle-of-kostiantynivka
  name: Battle of Kostiantynivka
  conflict: russia-ukraine-war
  tier: major
  start: '2025-10-25'
  end: ongoing
  place: Kostiantynivka, Donetsk Oblast, Ukraine
  lat: 48.533
  lng: 37.717
  sides:
  - 'Russia: 8th Combined Arms Army incl. 70th Motor Rifle Division, 4th and 72nd Motor Rifle Brigades, Rubikon Center'
  - 'Ukraine: 24th, 28th, 93rd and 129th Mechanized Brigades, 425th Skelya Regiment'
  outcome: Ongoing and contested. Russia claimed capture on 3 July 2026; in late October Ukraine still holds positions on the southern outskirts and in the west while Russian groups infiltrate the north.
  forces: Russian infiltration from the southeast and southwest reached the zinc plant (March 2026) and metallurgical plant and Kryvyi Torets river (June); Ukrainian commanders counted up to 250 Russians inside the city in June and 145 in July.
  losses: 'Zelensky claimed on 23 August 2026 that 70 to 80% of Russia''s 267,000 losses in 2026 were in this direction (unverified). Civilians: about 2,500 remained in April 2026.'
  significance: The southern gate to the Donetsk fortress belt and the war's main meat-grinder of 2026; a premature Russian victory claim that still has not come true a year in.
  sources:
