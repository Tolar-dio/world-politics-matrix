  timeline:
  - date: '2025-10-24'
    event: At least 250 Russian troops reported fighting inside Pokrovsk.
  - date: '2025-10-25'
    event: Battle of Kostiantynivka begins with Russian infiltration from the southeast.
  - date: '2025-11-12'
    event: Ukraine withdraws from Rivnopillia, opening the northern approach to Huliaipole; Russia announces its Unmanned Systems Forces are formed.
  - date: '2025-12-01'
    event: Russia claims capture of Pokrovsk; Ukraine denies it.
  - date: '2025-12-15'
    event: 'Berlin talks: US, Ukraine and Europe agree on a ''NATO-like'' security guarantee in principle; territory unresolved.'
  - date: '2025-12-23'
    event: Ukrainian General Staff confirms withdrawal from Siversk.
  - date: '2025-12-27'
    event: Russia claims Huliaipole; ISW confirms its capture in February 2026.
  - date: '2026-01-24'
    event: First US-Ukraine-Russia trilateral talks in Abu Dhabi end their second day without agreements; Russia insists on the 'Anchorage formula'.
  - date: '2026-01-28'
    event: Last evidence of Ukrainian troops in Pokrovsk; Myrnohrad assessed captured by this date.
  - date: '2026-01-30'
    event: Kremlin confirms it agreed to Trump's personal request not to strike Kyiv until 1 February.
  - date: '2026-02-11'
    event: Ukrainian counteroffensive opens on the Oleksandrivka front after Starlink cuts off Russian terminals.
  - date: '2026-02-16'
    event: Ukraine reports 'confident control' of Kupiansk, with a few dozen Russians left in one quarter.
  - date: '2026-03-15'
    event: Russian spring offensive against the Donetsk fortress belt opens (mid-March); March becomes Russia's costliest month at about 35,000 casualties.
  - date: '2026-05-09'
    event: Three-day Victory Day ceasefire (9 to 11 May) reduces but does not halt fighting.
  - date: '2026-07-03'
    event: Russian Defence Ministry claims full capture of Kostiantynivka; Ukraine rejects the claim the next day.
  - date: '2026-08-12'
    event: Zelensky says the southern counteroffensive has retaken 745 km2.
  - date: '2026-09-05'
    event: US envoys Witkoff and Kushner meet Putin in Moscow, then Zelensky in Kyiv on 6 September; no breakthrough.
  - date: '2026-09-15'
    event: Ukraine's 3rd Army Corps confirms Operation Vivaldi north of Lyman.
  - date: '2026-10-16'
    event: Putin rejects territorial concessions; ISW assesses Russia net lost 122 km2 since 1 September.
  - date: '2026-10-25'
    event: Ukrainian forces reportedly retake Perebudova, Komar and Fedorivka southeast of Oleksandrivka; Russian infiltrators reach central Dobropillia.
  - date: '2026-10-27'
    event: "Oleshky humanitarian ceasefire takes effect until 1 November; Putin restates territorial and NATO demands in a call with Finland's Stubb and Norway's Store; ISW confirms no advances by either side."
  outlook: Watch Kostiantynivka and Dobropillia, the two places where Russia still has momentum, and whether Russian troops get within artillery-free range of Kramatorsk. Watch whether the Oleksandrivka counteroffensive reaches the Velyka Novosilka road junction that feeds Russia's push on Orikhiv. Winter will test Russia's recruitment, which is already below its losses, and Ukraine's dwindling Patriot interceptors as energy strikes intensify. The 10 November Abu Dhabi talks are the next diplomatic marker, but Moscow still demands territory it does not hold and rejects a ceasefire.
