# Levant and Iraq conflicts, state as of 27 October 2026.
# Coordinates: town-centre gazetteer values (Wikipedia/GeoNames), ~1 km accuracy; zones are approximate circles.
# Control lines are hand-built approximations from the named places in the cited sources, not surveyed lines.
conflicts:
  - id: israel-hamas-gaza
    name: "Israel-Hamas war in Gaza (ceasefire phase)"
    type: insurgency
    intensity: high
    status: fragile-ceasefire
    started: "2025-10-10 (ceasefire phase of the war that began 2023-10-07)"
    countries: [PSE, ISR]
    sides:
      - name: "Israel"
        members: ["Israel Defense Forces (Southern Command)", "Israel Security Agency (Shin Bet)", "Israeli-backed anti-Hamas groups east of the Yellow Line: Popular Forces, Counter-Terrorism Strike Force, Shuja'iyya Popular Defense Forces"]
        backers: ["United States (arms, diplomatic cover, CENTCOM Civil-Military Coordination Center in Kiryat Gat)"]
        leaders: ["Benjamin Netanyahu (Prime Minister)", "Israel Katz (Defense Minister)", "Eyal Zamir (Chief of the General Staff)"]
        strength: "Holds roughly 60-64% of the Strip behind the Yellow Line (Reuters late Apr 2026 at least 64%; Al Jazeera Oct 2026 about 60%); no unit-level order of battle published."
      - name: "Hamas and allied factions"
        members: ["Izz ad-Din al-Qassam Brigades (incl. Nukhba units)", "Hamas internal security", "Palestinian Islamic Jihad (al-Quds Brigades)", "PFLP armed wing"]
        backers: ["Iran (historic funding and arms)", "Qatar, Egypt, Turkey (mediators, political channels)"]
        leaders: ["Khalil al-Hayya (senior Hamas leader and negotiator)", "Ali al-Amoudi (head of Hamas political bureau in Gaza from Jul 2026)", "Qassam Brigades command vacant since 26 May 2026 (Izz al-Din al-Haddad killed 15 May, successor Mohammed Odeh killed 26 May)"]
        strength: "No reliable 2026 fighter count retrieved; Israeli estimate (LWJ, Jul 2026) is that Hamas controls about 40% of Gaza, and Israeli officials say it is rebuilding (LWJ, Oct 2026)."
      - name: "Board of Peace and International Stabilization Force (not yet deployed)"
        members: ["Board of Peace (chair Donald Trump; High Representative Nickolay Mladenov)", "National Committee for the Administration of Gaza (NCAG, based in Cairo)", "ISF pledges: Indonesia, Morocco, Kazakhstan, Albania, Kosovo, Uganda"]
        backers: ["UN Security Council Resolution 2803 (17 Nov 2025)", "US Central Command (ISF headquarters role)"]
        leaders: ["Donald Trump (Board of Peace chair)", "Nickolay Mladenov (High Representative for Gaza)", "Ali Shaath (NCAG Chief Commissioner)"]
        strength: "Planned 20,000 soldiers and 12,000 police; Israel approved an initial up-to-200-troop entry on 26 Jul 2026; a 500-strong Moroccan and Kosovar contingent is planned for rotating 150-troop deployments; none deployed as of Oct 2026 (Al Jazeera, LWJ)."
    summary: "A US-brokered ceasefire has stopped full-scale war in Gaza since 10 October 2025 and returned all hostages, but Israel holds a growing share of the Strip behind the 'Yellow Line' and conducts near-daily strikes. Phase two, which trades Hamas disarmament for further Israeli withdrawal and an international force, is deadlocked."
    background: "The war began with the Hamas-led attack on Israel on 7 October 2023 and the Israeli offensive that followed, which by October 2025 had killed tens of thousands and destroyed most of Gaza's buildings. Trump's 20-point plan produced a phase-one deal signed on 9 October 2025: a ceasefire, release of the remaining hostages in exchange for Palestinian prisoners, aid, and an Israeli pullback to a demarcation called the Yellow Line, which left about 53% of the Strip under Israeli control.\n\nThe UN Security Council endorsed the plan in Resolution 2803 on 17 November 2025, creating a Board of Peace as a transitional authority and authorising a temporary International Stabilization Force. The plan assumes Hamas disarms and the IDF steps back further as the ISF deploys. Neither has happened, so the interim line has become the de facto map of Gaza."
    year: "The ceasefire was tested within days. On 19 October 2025 Israeli strikes killed at least 45 after two soldiers died in Rafah, and on 28-29 October strikes killed at least 104, including 66 or more women and children, after another soldier's death. Strikes continued through November (33 killed on 19 November, at least 24 on 22 November). The last hostage body was recovered on 26 January 2026. Israel began building berms along the Yellow Line in December 2025, and BBC Verify found markers in Gaza City's Tuffah district moved about 295 metres west.\n\nPhase two was declared on 14 January 2026 with the creation of a Palestinian technocratic committee (NCAG) under Ali Shaath, and the Board of Peace charter was ratified at Davos that month. The Rafah crossing reopened on 2 February. A February summit in Washington raised $7 billion in pledges against an estimated $70 billion need. The Board's March disarmament plan was rejected by Hamas, and Israel said it would not move without disarmament. By late April Reuters judged Israel controlled at least 64% of the Strip, and in May Netanyahu said Israel held 60% and ordered the army to reach 70%.\n\nIn July Hamas announced it was dissolving its government, Morocco became the first country to sign an ISF participation agreement (16 July) and Israel's cabinet approved an initial ISF entry of up to 200 troops (26 July). On 31 July the Board announced Hamas had accepted a 15-point roadmap, but a 3 August Board statement said no withdrawal beyond the Yellow Line until weapons and tunnels are decommissioned, and Netanyahu rejected the document on 9 August. In September the Board unveiled a $2.4 billion recovery plan at the UN, a war-damaged building in Gaza City collapsed killing at least 20 (16 September), and UNRWA put deaths since the ceasefire at 1,394 (24 September). In October Israel reportedly blocked construction of an ISF base, while the IDF listed 31 'violations' in the first half of the month, most of them its own strikes on named militants."
    situation: "As of late October 2026 Israel controls roughly 60-64% of Gaza and nearly all of Gaza's roughly 2 million people live west of the Yellow Line in tents and ruins. The ISF has not deployed and the NCAG has not been allowed into Gaza. Israel strikes Hamas, PIJ and PFLP operatives several times a week and fires on anyone crossing the line. Hamas still runs services in its zone and has not handed over weapons. Aid runs at about 227 trucks a day against a 600-truck target. Israeli elections on 27 October 2026 are seen by Board of Peace officials as the gate for any movement."
    technical:
      - "Yellow Line: about 45 km long, partly marked by yellow concrete blocks, with earth berms since Dec 2025; AP imagery found more than 23 km of berms by 21 Jul 2026 (Wikipedia: Yellow Line)."
      - "Israeli control grew from about 53% (Oct 2025) to at least 64% (Reuters, late Apr 2026); a planned 'Orange Line' would add about 11% of Gaza; May 2026 directive to reach 70% (Wikipedia: Yellow Line)."
      - "Israel treats ground beyond the line as a free-fire zone; Gaza Health Ministry counted 77 killed near the line by Jan 2026, 62 of them after crossing (Wikipedia: Yellow Line)."
      - "IDF Chief of Staff Eyal Zamir called the Yellow Line a 'new border line' on 8 Dec 2025 (Wikipedia: Yellow Line)."
      - "BBC Verify: at least seven blocks in Tuffah moved about 295 m deeper into Gaza between 27 Nov and 25 Dec 2025 (Wikipedia: Yellow Line)."
      - "Strike pattern since the ceasefire: precision drone and air strikes on named operatives, e.g. Hamas Nukhba members in Gaza City and Khan Younis, PFLP cell in Khan Younis (11 Oct 2026), alleged weapons smugglers (15 Oct 2026) (LWJ, 15 Oct 2026)."
      - "IDF reported 31 Hamas, PIJ and PFLP 'violations' between 1 and 15 Oct 2026, nearly all answered by lethal strikes (LWJ, 15 Oct 2026)."
      - "Tunnels: IDF continues demolishing tunnels inside its zone, e.g. a tunnel several hundred metres long in northern Gaza (Jul 2026); the Board of Peace requires decommissioning of light weapons, heavy weapons and tunnels before Israeli withdrawal (LWJ Jul 2026; Al Jazeera 4 Aug 2026)."
      - "ISF design: 20,000 troops plus 12,000 police under CENTCOM; logistics hub 'Endurance' near the Gaza border since Jun 2026; planned 100 x 100 m forward outpost on a former GHF site blocked by Israel in Oct 2026 (Al Jazeera 10 Oct 2026; LWJ Jul and Oct 2026)."
      - "Civil-Military Coordination Center set up by CENTCOM under Adm. Brad Cooper, announced 21 Oct 2025 (Wikipedia: Gaza Strip under Resolution 2803)."
      - "Israeli-backed anti-Hamas groups operate east of the line: Popular Forces, Counter-Terrorism Strike Force, Shuja'iyya Popular Defense Forces (Wikipedia: Yellow Line)."
      - "Hamas finance dispute: COGAT alleged levies of 10,000 shekels per truck and 30% of sales; commercial imports from Israel halted for two days in mid-Oct 2026 while Egyptian goods continued (LWJ, 15 Oct 2026)."
      - "Israeli military losses since the ceasefire: 7 soldiers killed (Wikipedia: Gaza peace plan)."
      - "Decapitation continued under the ceasefire: Qassam Brigades chief Izz al-Din al-Haddad killed 15 May 2026 and successor Mohammed Odeh killed 26 May 2026; the post is listed as vacant since (Wikipedia: Gaza Strip under Hamas)."
      - "Within days of the ceasefire Hamas crushed rival armed groups west of the line; by 21 Oct 2025 the IDF assessed it had restored control down to municipal level (Haaretz via Wikipedia: Gaza Strip under Hamas)."
      - "Anti-Hamas groups named in reporting: Popular Forces, Popular Army - Northern Forces, Counter-Terrorism Strike Force, Shuja'iyya Popular Defense Forces (Wikipedia: Gaza Strip under Hamas)."
      - "Rafah crossing closed 14 Oct 2025 and reopened 2 Feb 2026; most agricultural land and the Egypt border are inside the Israeli-held zone (Wikipedia: Gaza peace plan; Wikipedia: Yellow Line)."
    casualties: "Gaza Health Ministry figures via UNRWA: 1,394 Palestinians killed between the 10 Oct 2025 ceasefire and 24 Sep 2026, and 73,914 since 7 Oct 2023 (Security Council Report, Oct 2026). Al Jazeera on 10 Oct 2026 cited more than 1,400 since the ceasefire and more than 74,000 overall, with thousands more missing under rubble. The ministry does not separate combatants from civilians; Israel says most strike victims since the ceasefire are militants, while UN agencies and the ministry say many are civilians, including people approaching the Yellow Line. Israel reports 7 soldiers killed since the ceasefire (Wikipedia: Gaza peace plan)."
    displaced: "Nearly all of Gaza's roughly 2 million residents are crowded west of the Yellow Line, most in tent camps; 94% need shelter assistance and 90% face frequent water disruption (Security Council Report, Oct 2026). About 1.4 million are projected to face acute hunger until at least December 2026 (IPC via Al Jazeera, 10 Oct 2026). Each westward move of the line displaces more people (Al Jazeera, 10 Oct 2026)."
    zones:
      - {name: "Gaza City (Hamas-held west of line)", lat: 31.5017, lng: 34.4668, radius_km: 5, note: "Largest population concentration; frequent Israeli strikes on operatives; building collapse killed 20+ on 16 Sep 2026."}
      - {name: "Shuja'iyya and Tuffah (Yellow Line edge)", lat: 31.5050, lng: 34.4830, radius_km: 3, note: "Line markers moved about 295 m west here in late 2025; repeated shootings of people crossing."}
      - {name: "Beit Hanoun and Beit Lahia (Israeli-held north)", lat: 31.5420, lng: 34.5150, radius_km: 4, note: "Inside Israeli zone; depopulated, tunnel demolitions."}
      - {name: "Central camps: Nuseirat, Bureij, Maghazi, Deir al-Balah", lat: 31.4300, lng: 34.3800, radius_km: 6, note: "Densely packed displacement area west of the line; residents report blocks advancing in Jul 2026."}
      - {name: "Khan Younis and al-Mawasi", lat: 31.3460, lng: 34.3060, radius_km: 6, note: "Eastern Khan Younis in Israeli zone; Mawasi tent camps west of it; frequent strikes."}
      - {name: "Rafah (Israeli-held)", lat: 31.2969, lng: 34.2436, radius_km: 6, note: "Entire city inside Israeli zone; Popular Forces area; Rafah crossing reopened 2 Feb 2026; proposed ISF and weapons-handover sites in Israeli-held south."}
    frontline:
      - name: "Yellow Line (approximate, Israeli-held side to the east and south)"
        as_of: "2026-07-28"
        points: [[31.5650, 34.4650], [31.5480, 34.4800], [31.5300, 34.4980], [31.5120, 34.4920], [31.4950, 34.4800], [31.4750, 34.4600], [31.4550, 34.4350], [31.4380, 34.4130], [31.4180, 34.3920], [31.3980, 34.3700], [31.3720, 34.3480], [31.3480, 34.3300], [31.3300, 34.3100], [31.3180, 34.2850], [31.3150, 34.2600], [31.3220, 34.2380], [31.3280, 34.2250]]
        source: "https://en.wikipedia.org/wiki/Yellow_Line_(Gaza)"
    timeline:
      - {date: "2025-10-10", event: "Phase-one ceasefire takes effect; IDF pulls back to the Yellow Line (about 53% of Gaza)."}
      - {date: "2025-10-13", event: "All 20 living hostages released; Palestinian prisoners freed."}
      - {date: "2025-10-19", event: "Israeli strikes kill at least 45 after two soldiers die in Rafah."}
      - {date: "2025-10-28", event: "Israeli strikes over two days kill at least 104 after a soldier's death in Rafah."}
      - {date: "2025-11-17", event: "UN Security Council adopts Resolution 2803 endorsing the Board of Peace and ISF."}
      - {date: "2025-12-08", event: "IDF chief Zamir calls the Yellow Line a 'new border line'; berm construction under way."}
      - {date: "2026-01-14", event: "US declares phase two; NCAG formed under Ali Shaath."}
      - {date: "2026-01-26", event: "IDF recovers the last hostage body in Gaza."}
      - {date: "2026-02-02", event: "Rafah crossing reopens."}
      - {date: "2026-05-15", event: "Netanyahu says Israel holds 60% of Gaza and orders the IDF to reach 70% (date approximate, May 2026)."}
      - {date: "2026-05-15", event: "Israel kills Qassam Brigades chief Izz al-Din al-Haddad; successor Mohammed Odeh killed 26 May."}
      - {date: "2026-07-06", event: "Hamas announces resignation of its civil administration (military wing excluded)."}
      - {date: "2026-07-26", event: "Israeli cabinet approves initial ISF entry of up to 200 troops."}
      - {date: "2026-07-31", event: "Board of Peace says Hamas accepted a 15-point roadmap; Israel later rejects it (9 Aug)."}
      - {date: "2026-09-16", event: "War-damaged building collapses in Gaza City, killing at least 20."}
      - {date: "2026-10-14", event: "Report that Israel blocked construction of a Board of Peace/ISF base in Gaza."}
    outlook: "Watch the government formed after Israel's 27 October 2026 election, whether the first ISF contingent (Morocco, Kosovo) actually enters, whether any Hamas weapons handover starts at the US-surveyed sites in the Israeli-held south, and whether the Yellow Line moves toward the 70% target. A collapse of the sequencing deal could mean renewed large-scale operations; progress would show up first as ISF boots on the ground and NCAG staff entering Gaza."
    sources:
      - {label: "Wikipedia: Yellow Line (Gaza)", url: "https://en.wikipedia.org/wiki/Yellow_Line_(Gaza)"}
      - {label: "Wikipedia: Gaza peace plan", url: "https://en.wikipedia.org/wiki/Gaza_peace_plan"}
      - {label: "Wikipedia: Gaza Strip under Resolution 2803", url: "https://en.wikipedia.org/wiki/Gaza_Strip_under_Resolution_2803"}
      - {label: "Wikipedia: Gaza Strip under Hamas", url: "https://en.wikipedia.org/wiki/Gaza_Strip_under_Hamas"}
      - {label: "Al Jazeera: What has Trump's Board of Peace achieved in a year since Gaza 'ceasefire'? (10 Oct 2026)", url: "https://www.aljazeera.com/news/2026/10/10/what-has-trumps-board-of-peace-achieved-in-a-year-since-gaza"}
      - {label: "Al Jazeera: Board of Peace says no Israeli withdrawal from Gaza before Hamas disarms (4 Aug 2026)", url: "https://www.aljazeera.com/news/2026/8/4/board-of-peace-says-no-israeli-withdrawal-from-gaza-before-hamas-disarms"}
