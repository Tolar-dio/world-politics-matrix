  - id: west-bank-violence
    name: "West Bank: settler violence and Israeli military operations"
    type: insurgency
    intensity: medium
    status: active
    started: "2023-10-07 (current escalation)"
    countries: [PSE, ISR]
    sides:
      - name: "Israeli forces and settlers"
        members: ["IDF Central Command", "Israel Border Police", "Shin Bet", "Armed settler groups and outpost youth"]
        backers: ["Israeli government ministers backing settlement expansion (e.g. Finance Minister Bezalel Smotrich)"]
        leaders: ["Benjamin Netanyahu (Prime Minister)", "Bezalel Smotrich (Finance Minister, also responsible for settlement civil administration)", "Israel Katz (Defense Minister)"]
        strength: "Not quantified in retrieved sources."
      - name: "Palestinian armed groups and communities"
        members: ["Local armed cells in northern camps (Jenin, Tulkarm, Nur Shams)", "Hamas and PIJ cells", "Palestinian Authority security forces (not party to fighting with Israel, but a political actor)"]
        backers: []
        leaders: ["Mahmoud Abbas (PA President)"]
        strength: "Not quantified in retrieved sources."
    summary: "Settler attacks on Palestinians hit a record 1,835 in 2025 and were running faster still in 2026, while Israel accelerates settlement approvals including the E1 project east of Jerusalem. Deaths are lower than in 2024 but violence and land loss are more widespread."
    background: "Violence in the occupied West Bank surged after 7 October 2023, with large Israeli raids on armed groups in the northern refugee camps and a sharp rise in settler attacks on Palestinian villages and herding communities. In January 2025 the IDF launched an extended operation in the Jenin, Tulkarm and Nur Shams camps that displaced tens of thousands.\n\nThe second Netanyahu-Smotrich era has also brought structural changes: new settlements, legalised outposts, and the E1 plan that would link Ma'ale Adumim to Jerusalem and, critics say, cut the West Bank in two. This matters because it shapes whether any Palestinian state remains geographically possible."
    year: "UN agencies recorded a record month of settler attacks in October 2025, and OCHA counted 1,835 incidents for the whole of 2025. In January-April 2026 attacks averaged about 190 a month, displacing nearly 700 Palestinians from nine communities. By 20 July 2026, 18 Palestinians had been killed in settler-related incidents that year. Late July brought a cluster of violence in which eight Palestinians and two Israelis were killed in a few days. Between 13 June and 18 September 2026 the UN counted 32 Palestinians killed, including nine children.\n\nOn the political track, E1 tenders for 1,234 housing units were published on 18 August 2026, about 4,570 settlement units were advanced in Area C and 3,515 in East Jerusalem in the reporting period, and Smotrich announced new settlements. Canada, France and the UK banned settlement goods on 8 September, and Israel retaliated by ordering the UK consulate in East Jerusalem closed. Israel continues to withhold tax revenue from the Palestinian Authority."
    situation: "As of mid-September 2026 OCHA had logged more than 1,600 settler attacks with casualties or damage in 2026, about 6.7 a day versus 5 a day in 2025. E1 tender awards are frozen until after the 27 October election by an Attorney-General ruling. The PA is in a deep fiscal crisis."
    technical:
      - "OCHA: 1,835 settler attacks in 2025; more than 1,600 in 2026 by 14 Sep (6.7/day vs 5/day) (UN News Jul 2026; Security Council Report Oct 2026)."
      - "OHCHR projected more than 2,000 settler attacks in 2026 at the Jan-Apr rate of about 190/month (UN News, 29 Jul 2026)."
      - "Of 18 Palestinians killed in settler-related incidents in 2026 by 20 Jul: 12 by settlers, 3 by Israeli forces, 3 disputed (UN News, 29 Jul 2026)."
      - "E1: 3,401 approved units on about 12 sq km between East Jerusalem and Ma'ale Adumim; tenders for 1,234 published 18 Aug 2026, bid deadline 19 Oct, no award before 27 Oct election (Security Council Report)."
      - "Settlement planning in the period: about 4,570 units in Area C and 3,515 in East Jerusalem (Security Council Report)."
      - "8 Sep 2026: Canada, France, UK ban settlement-goods imports; nine more states join a joint statement; Israel orders UK consulate in East Jerusalem closed (Security Council Report)."
      - "Israeli forces entered an UNRWA training centre in East Jerusalem for a second time on 28 Jul 2026 (UN News)."
    casualties: "UN: 32 Palestinians killed, including 9 children, between 13 Jun and 18 Sep 2026 (Security Council Report, Oct 2026); 18 killed in settler-related incidents in 2026 as of 20 Jul (UN News, 29 Jul 2026). A full Oct 2025-Oct 2026 total was not retrieved. Israeli deaths include two killed in late July 2026 (UN News)."
    displaced: "Nearly 700 Palestinians displaced from nine communities by settler attacks in Jan-Apr 2026 (OHCHR via UN News, 29 Jul 2026). Displacement from the northern camps since Jan 2025 not re-verified for 2026."
    zones:
      - {name: "Jenin camp", lat: 32.4610, lng: 35.2880, radius_km: 4, note: "IDF extended operation in northern camps since Jan 2025; residents displaced."}
      - {name: "Tulkarm and Nur Shams camps", lat: 32.3100, lng: 35.0450, radius_km: 5, note: "Northern camps under prolonged IDF presence."}
      - {name: "Ramallah-Nablus hill villages (Sinjil, Turmus Ayya, al-Mughayyir)", lat: 32.0200, lng: 35.2900, radius_km: 8, note: "Dense cluster of settler attacks and land seizures."}
      - {name: "Masafer Yatta and south Hebron Hills", lat: 31.4000, lng: 35.1700, radius_km: 10, note: "Herding communities displaced by settler attacks and demolitions."}
      - {name: "E1 corridor", lat: 31.7900, lng: 35.2800, radius_km: 5, note: "3,401-unit E1 settlement plan; 1,234 units tendered Aug 2026."}
      - {name: "Jordan Valley (Jiftlik)", lat: 32.1400, lng: 35.4900, radius_km: 12, note: "Demolitions for lack of permits; herding community pressure."}
    timeline:
      - {date: "2025-10-31", event: "UN reports October 2025 as a record month for settler attacks."}
      - {date: "2026-04-30", event: "Jan-Apr 2026 settler attacks average about 190 a month; nearly 700 displaced."}
      - {date: "2026-07-28", event: "UN Security Council briefing on surge in killings; eight Palestinians and two Israelis killed in preceding days."}
      - {date: "2026-08-18", event: "Tenders published for 1,234 E1 housing units."}
      - {date: "2026-09-08", event: "Canada, France, UK ban settlement goods; Israel orders UK East Jerusalem consulate closed."}
      - {date: "2026-09-14", event: "OCHA count passes 1,600 settler attacks for 2026."}
    outlook: "Watch whether the post-election government awards the E1 tenders, any formal annexation steps (opposed publicly by the US), the PA's fiscal collapse and security-force cohesion, and whether settler violence keeps rising toward the projected 2,000-plus incidents for 2026."
    sources:
      - {label: "Security Council Report: October 2026 Monthly Forecast, Middle East including the Palestinian Question", url: "https://www.securitycouncilreport.org/monthly-forecast/2026-10/the-middle-east-including-the-palestinian-question-26.php"}
      - {label: "UN News: West Bank violence (29 Jul 2026)", url: "https://news.un.org/en/story/2026/07/1168045"}
      - {label: "L'Orient Today: Israeli settler attacks in West Bank reached record level in October, UN agency says", url: "https://today.lorientlejour.com/article/1484235/israeli-settler-attacks-in-west-bank-reached-record-level-in-october-according-to-un-agency.html"}

  - id: israel-hezbollah-lebanon
    name: "Israel-Hezbollah war in Lebanon (2026)"
    type: interstate
    intensity: high
    status: fragile-ceasefire
    started: "2026-03-02"
    countries: [LBN, ISR]
    sides:
      - name: "Israel"
        members: ["IDF Northern Command", "36th Division", "91st Division", "146th Division", "162nd Division", "98th Division", "Golani Brigade", "401st Armored Brigade", "55th Reserve Paratroopers Brigade", "Bislamach Brigade", "Commando Brigade", "Yahalom engineering unit", "Israeli Air Force"]
        backers: ["United States (arms, mediation)"]
        leaders: ["Benjamin Netanyahu (Prime Minister)", "Israel Katz (Defense Minister)", "Eyal Zamir (Chief of the General Staff)"]
        strength: "Five divisions committed at peak in spring 2026 (Al Jazeera via Wikipedia); by Oct 2026 Northern Command was reducing brigade combat teams in a winterised 'forward defense' posture (LWJ, 7 Oct 2026)."
      - name: "Hezbollah"
        members: ["Islamic Resistance (military wing)", "Radwan Force", "Badr Unit (Nabatieh/Litani sector)"]
        backers: ["Iran (IRGC Quds Force advisers, funding, arms)"]
        leaders: ["Naim Qassem (Secretary-General)"]
        strength: "No reliable post-war 2026 estimate retrieved. Older pre-2024 estimates: 40,000-120,000 rockets, thousands of ATGMs, 20,000 full-time fighters plus 20,000 reservists (Janes 2017) or about 45,000 (Israeli assessment 2018) (Wikipedia: Hezbollah armed strength); these predate heavy losses in 2024 and 2026. In 2026 it fired up to about 2,000 rockets and drones into Israel and fielded ATGMs and fibre-optic FPV drones (Wikipedia: 2026 Lebanon war)."
      - name: "Lebanese state (not a belligerent against Israel)"
        members: ["Lebanese Armed Forces (LAF)", "Internal Security Forces", "State Security"]
        backers: ["United States (military aid tied to disarmament milestones)", "France, Saudi Arabia, Qatar"]
        leaders: ["Joseph Aoun (President)", "Simon Karam (negotiator in talks with Israel)"]
        strength: "LAF claimed 'operational control' in three pilot zones by Sep 2026 and listed 1,818 weapons and ammunition items seized (LWJ, Sep 2026)."
    summary: "Hezbollah reopened fire on 2 March 2026 after the US-Israeli war on Iran began, and Israel answered with its deepest invasion of Lebanon in a generation, crossing the Litani and taking Beaufort. Since a 19 June ceasefire Israel holds a 570-600 sq km 'security zone' behind its own Yellow Line, while a US-brokered Israel-Lebanon framework asks the Lebanese army to disarm Hezbollah zone by zone."
    background: "Israel and Hezbollah fought from October 2023 in support of Gaza, escalating in September-November 2024 with the pager attacks, the killing of Hassan Nasrallah and an Israeli ground invasion, ended by a November 2024 ceasefire. Israel kept five hilltop positions and struck Lebanon almost daily, killing 331 people (at least 127 civilians) by November 2025, and assassinated Hezbollah's chief of staff Haytham Ali Tabatabai in Beirut in November 2025.\n\nWhen the US and Israel struck Iran on 28 February 2026 and killed Ali Khamenei, Hezbollah entered the war on 2 March. Lebanon's government, which had already declared a state monopoly on arms and sent the army south of the Litani, banned Hezbollah's military activities and opened the first direct talks with Israel since 1983. The war matters because it decides whether Hezbollah survives as an armed force and whether southern Lebanon becomes a long-term Israeli-held buffer."
    year: "From 2 March Israel struck Beirut's southern suburbs (Dahiyeh), the Bekaa and the south, killing intelligence chief Hussain Makled, Quds Force officers at a Beirut hotel (8 March) and dozens in Nabi Chit (7 March). Ground forces entered border towns from 3 March and launched a full ground operation on 16 March; Defense Minister Katz announced demolition of border villages and control up to the Litani on 24 March. Five divisions fought for Khiam and Bint Jbeil, which the 98th Division encircled by 13 April. On 8 April, hours after the US-Iran ceasefire, 'Operation Eternal Darkness' hit more than 100 targets in ten minutes, killing at least 357.\n\nA US truce took effect on 16-17 April, but Israel kept its positions and declared a Yellow Line around 55 villages. Fighting continued under the truce: the IDF crossed the Litani in early May, was repelled at Haddatha (19-21 May) and captured Zawtar al-Sharqiyah, Yohmor and Beaufort Castle (27-31 May), then ordered evacuation of everything south of the Zahrani. Hezbollah introduced fibre-optic FPV drones and killed four 401st Brigade soldiers near Kfar Tebnit. After the 1 June mutual cessation, a 19 June truce mediated by the US, Qatar and Iran, and the 26 June Israel-Lebanon framework, large-scale combat ended. Fighting moved underground: the IDF took and demolished the Ali al-Taher ridge complex (3-11 September) and cleared Mansouri (28 September). The Lebanese death toll since 2 March reached 4,387 by 11 October."
    situation: "As of October 2026 Israel holds a security zone of roughly 570-600 sq km up to its Yellow Line, about 12 km deep in places and anchored on Beaufort, with winterised positions and plans for a fallback 'Gray Line' on ridges. The IDF says it will stay 'for years' and keeps striking Hezbollah; about 10 Hezbollah fighters were killed trying to cross the line during one brigade's rotation. The LAF is deploying in Nabatieh and pilot zones and seizing arms caches but does not confront Hezbollah directly. Hezbollah says it will cooperate on a state 'monopoly of arms' but will not give up its arsenal while Israel occupies Lebanese land. More than one million people were displaced and Israel bars return to the zone."
    technical:
      - "Israeli divisions engaged: 36th, 91st, 146th, 162nd and 98th (98th from 7 Apr 2026); five divisions at peak (Wikipedia: 2026 Lebanon war)."
      - "Israeli-declared Yellow Line (18 Apr 2026) encloses 55 towns and villages, including parts of Marjayoun District north of the Litani and the Shebaa area; occupied area about 570-600 sq km (Wikipedia)."
      - "Evacuation orders covered about 2,000 sq km south of the Zahrani River, plus Dahiyeh (Wikipedia: Israeli occupation of Southern Lebanon)."
      - "Operation Eternal Darkness, 8 Apr 2026: more than 100 targets in southern Lebanon, Beirut and the Bekaa in ten minutes; at least 357 killed (Wikipedia)."
      - "Bridges: Qasmiyeh bridge over the Litani destroyed 22 Mar; Dallafa bridge hit 23 Mar; last link south of the Litani cut 15-16 Apr (Wikipedia)."
      - "Hezbollah fired up to about 2,000 rockets and drones; UNIFIL tracked 210+ missiles by 5 Mar (Wikipedia)."
      - "Hezbollah ATGM use from 4 Mar; a Puma engineering vehicle and a D9 bulldozer hit on 8 Mar, two soldiers killed (Wikipedia)."
      - "Fibre-optic FPV drones from late Apr 2026, which radio-frequency jamming cannot stop; largest coordinated drone attack 12 May in three waves on one target; a drone near Kfar Tebnit killed four 401st Brigade soldiers including a lieutenant-colonel (Wikipedia; Timeline of the 2026 Lebanon war)."
      - "Ali al-Taher ridge: IDF says it destroyed more than 2 km of tunnels of the Badr Unit command complex; wider Ali al-Taher-Beaufort network had eight routes totalling 5.4 km; 1,100+ tonnes of explosives; USGS recorded a M4.1 event (LWJ, 11 Sep 2026)."
      - "Brigade clearing tallies: 55th Reserve Paratroopers destroyed 600+ Hezbollah sites and eight underground routes; Golani 900+ sites over seven months (LWJ, 7 Oct 2026)."
      - "Hezbollah tunnel at Majdal Zoun about 200 m long (LWJ, Jul 2026)."
      - "Senior Hezbollah losses: Makled (intel, 2 Mar), Radwan commander Abu Khalil Barji (c. 22-23 Mar), Southern Front commander Hajj Yusuf Ismail Hashem (1 Apr), Radwan senior commander Ahmed Ghaleb Balout (6 May) (Wikipedia)."
      - "UNIFIL: three Indonesian peacekeepers killed 29-30 Mar and two French soldiers killed (18 and 22 Apr) (Wikipedia)."
      - "June 26 framework: 14 points plus Security Annex; pilot zones (clear, third-party verify, LAF maintain, rebuild); 24/7 military coordination mechanism; Israeli withdrawal phased and conditions-based; US aid tied to milestones (LWJ, 13 Jul 2026)."
      - "LAF seizures in pilot zones: 1,818 weapons and ammunition items, about 86% light ammunition (LWJ, Sep 2026)."
      - "IDF death toll in Lebanon reached 37 by about early May 2026 (Timeline of the 2026 Lebanon war); a later total was not retrieved."
    casualties: "Lebanese Health Ministry: 4,387 killed and 12,424 wounded from 2 Mar to 11 Oct 2026; 8,954 killed since 8 Oct 2023 (LBCI, 11 Oct 2026). The ministry does not distinguish fighters from civilians; Israel claims large numbers of Hezbollah fighters among the dead (e.g. 100+ in Bint Jbeil alone). The toll rose only from 4,383 (10 Sep) to 4,387 (11 Oct) despite reported deadly strikes, so recent reporting may lag. Israeli losses: at least 37 soldiers killed in Lebanon by early May 2026, plus civilians in the north (Wikipedia timeline); overall Israeli war figures for the Iran war period are 40 soldiers and 31 civilians killed (Wikipedia: 2026 Iran war). Five UN peacekeepers killed (Wikipedia)."
    displaced: "More than 1.2 million Lebanese displaced, over 20% of the population (Wikipedia: Israeli occupation of Southern Lebanon (2026)); Israel bars return to the security zone, and Katz said on 24 Jun 2026 that '200,000 residents will not return'."
    zones:
      - {name: "Bint Jbeil", lat: 33.1194, lng: 35.4331, radius_km: 5, note: "Battle Apr 2026; about 90% of urban area destroyed or badly damaged; inside Israeli zone."}
      - {name: "Khiam and Marjayoun", lat: 33.3200, lng: 35.6100, radius_km: 6, note: "Battle Mar-May 2026; Khiam occupied and depopulated; detention centre demolished."}
      - {name: "Beaufort Ridge and Ali al-Taher", lat: 33.3400, lng: 35.5200, radius_km: 5, note: "Key IDF anchor north of the Litani; Ali al-Taher tunnel complex demolished Sep 2026."}
      - {name: "Nabatieh", lat: 33.3780, lng: 35.4840, radius_km: 6, note: "Repeated strikes; LAF deployment from Sep 2026; Kfar Rumman strike killed 12 in Sep 2026."}
      - {name: "Western sector: Naqoura, Bayada, Majdal Zoun, Mansouri", lat: 33.1700, lng: 35.2200, radius_km: 8, note: "IDF advance along the coast; Mansouri clearing completed 28 Sep 2026; 200 m tunnel at Majdal Zoun."}
      - {name: "Dahiyeh (Beirut southern suburbs)", lat: 33.8540, lng: 35.5080, radius_km: 3, note: "Hezbollah command and Al-Manar hit Mar-May 2026; off-limits under 1 Jun understanding."}
      - {name: "Baalbek and northern Bekaa", lat: 34.0060, lng: 36.2040, radius_km: 15, note: "Strikes on command centres and depots, including Feb 2026 and throughout the war."}
      - {name: "Shebaa area", lat: 33.3500, lng: 35.7300, radius_km: 6, note: "Included in Israel's Yellow Line zone."}
    frontline:
      - name: "Israeli Yellow Line in southern Lebanon (approximate northern edge of occupied zone)"
        as_of: "2026-10-07"
        points: [[33.2050, 35.1950], [33.1800, 35.2400], [33.1650, 35.2750], [33.1600, 35.3300], [33.1550, 35.3900], [33.1500, 35.4300], [33.1800, 35.4700], [33.2300, 35.5000], [33.2800, 35.5100], [33.3200, 35.5100], [33.3400, 35.5300], [33.3450, 35.5650], [33.3550, 35.6100], [33.3650, 35.6700], [33.3700, 35.7200], [33.3600, 35.7600]]
        source: "https://www.longwarjournal.org/archives/2026/10/idf-shifts-southern-lebanon-forces-toward-forward-defense-posture-as-troops-prepare-for-winter.php"
    timeline:
      - {date: "2025-11-23", event: "Israel kills Hezbollah chief of staff Haytham Ali Tabatabai in Beirut (Nov 2025)."}
      - {date: "2026-01-08", event: "LAF says phase one of disarmament south of the Litani is complete."}
      - {date: "2026-02-28", event: "US and Israel launch war on Iran; Khamenei killed."}
      - {date: "2026-03-02", event: "Hezbollah fires on northern Israel; Israel strikes Beirut, Bekaa and the south; Lebanon bans Hezbollah military activity."}
      - {date: "2026-03-16", event: "IDF begins ground operation to create a 'forward defense area'."}
      - {date: "2026-03-24", event: "Katz announces demolition of border villages and control up to the Litani."}
      - {date: "2026-04-08", event: "Operation Eternal Darkness: 100+ targets in ten minutes, at least 357 killed."}
