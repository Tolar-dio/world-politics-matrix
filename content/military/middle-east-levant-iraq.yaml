  - id: iraq-militias-us-isis
    name: "Iraq: Iran-aligned militias vs US and neighbours, plus ISIS remnants"
    type: air-missile-campaign
    intensity: medium
    status: fragile-ceasefire
    started: "2026-02-28"
    countries: [IRQ]
    sides:
      - name: "Iran-aligned militias (Islamic Resistance in Iraq)"
        members: ["Kataib Hezbollah", "Harakat Hezbollah al-Nujaba", "Kataib Sayyid al-Shuhada", "Asaib Ahl al-Haq", "Kataib Imam Ali", "Ansar Allah al-Awfiya (PMF 19th Brigade)", "Ashab al-Kahf", "Saraya Awliya al-Dam"]
        backers: ["Iran (IRGC Quds Force: drones, rockets, funding)"]
        leaders: ["Ahmad al-Hamidawi (Kataib Hezbollah)", "Akram al-Kaabi (Nujaba)", "Hadi al-Amiri (Badr, PMF political figure)"]
        strength: "No numeric estimate retrieved; claimed 290+ attacks on US forces in the region by 13 Mar 2026 (LWJ) and, with Iran, 966 drones and missiles at Kurdistan by 2 Aug 2026 (Rudaw via LWJ)."
      - name: "United States and partners"
        members: ["US forces in Iraq and Kurdistan (withdrawn 30 Sep 2026)", "US Embassy Baghdad security", "French and coalition troops in Kurdistan", "Saudi Air Force (July 2026 strikes)"]
        backers: []
        leaders: ["Adm. Brad Cooper (CENTCOM commander)"]
        strength: "US forces left Iraq on 30 Sep 2026; Patriot batteries near Erbil moved out by late Jul 2026 (LWJ, Aug and Oct 2026)."
      - name: "Iraqi state and Kurdistan Region"
        members: ["Iraqi Security Forces", "Popular Mobilization Forces (formally state, largely militia-led)", "Kurdish Peshmerga"]
        backers: ["United States (economic partnership)", "Iran (political ties)"]
        leaders: ["Ali al-Zaidi (Prime Minister)"]
        strength: "Not quantified in retrieved sources."
      - name: "Islamic State remnants"
        members: ["ISIS cells in Anbar desert, Kirkuk, Salah ad-Din, Diyala"]
        backers: []
        leaders: []
        strength: "About 3,000 fighters across Syria and Iraq combined (UN, via EUAA)."
    summary: "During the 2026 US-Israeli war on Iran, Iraqi militias fired hundreds of drones and rockets at US sites, the Kurdistan Region and Gulf neighbours, and US strikes killed scores of PMF fighters and senior commanders. US troops left Iraq on 30 September 2026, and Prime Minister Ali al-Zaidi is trying to disarm the militias by mid-2027, with Kataib Hezbollah and Nujaba refusing."
    background: "Iraq's Iran-aligned militias, many of them inside the state-funded Popular Mobilization Forces, attacked US forces repeatedly after October 2023, and the US designated several as terrorist groups. A 2024 US-Iraq agreement set the end of the coalition mission in federal Iraq for September 2025 and in Kurdistan for September 2026. Elections in November 2025 were followed by a fight over the premiership in which Trump publicly opposed Nouri al-Maliki (Jan 2026).\n\nWhen the US and Israel attacked Iran on 28 February 2026, Iraq became a secondary front. The fight matters because it tests whether the Iraqi state can control groups that answer to Tehran, and because militia attacks reached Kuwait, Saudi Arabia and Jordan."
    year: "From 28 February militias under the Islamic Resistance in Iraq banner launched daily drone and rocket attacks: up to 47 claimed in a day (17 March), strikes on the US embassy in Baghdad (14-18 March), Victory Base near the airport, Erbil airport and the Harir base, oil fields (Sarsang, Majnoon) and refineries, a UN office in Sulaymaniyah and a base where a French soldier was killed (13 March). Iran itself struck Erbil airport and the US consulate. The US hit back across Iraq: by 12 March the PMF counted 32 strikes, including a raid on the 19th Brigade at al-Qaim and Akashat in which the PMF reported 99 dead and 43 missing, and a Baghdad strike that killed Kataib Hezbollah spokesman Abu Ali al-Askari. Kataib Hezbollah paused attacks on the embassy on 18-19 March and kidnapped an American journalist in Baghdad on 31 March.\n\nAfter the 8 April US-Iran ceasefire, Iraq's new government under Ali al-Zaidi pushed to put militia weapons under state control, and several factions said in June they would hand over arms. The US designated seven militia commanders (17 April) and offered rewards for KH, KSS and Ansar Allah al-Awfiya leaders. Attacks did not stop entirely: militias struck Saudi Arabia in July, prompting US and Saudi air strikes in Iraq, and Kurdistan had absorbed 966 drones and missiles by 2 August. US forces left Iraq on 30 September."
    situation: "As of October 2026 there are no US troops in Iraq. Five factions (Saraya al-Salam, Kataib Sayyid al-Shuhada, Asaib Ahl al-Haq, Kataib Imam Ali, Ansar Allah al-Awfiya) have reportedly agreed to disarm, while Kataib Hezbollah, Nujaba, Ashab al-Kahf and Saraya Awliya al-Dam refuse. Kuwait, Jordan and Syria have warned of direct retaliation for attacks from Iraqi soil. ISIS remains a low-level insurgency in the Anbar desert and the disputed northern belt, targeted by Iraqi F-16 strikes."
    technical:
      - "Claimed militia tempo: 290+ attacks on US forces in the region by 13 Mar 2026; daily claims of 37 (10 Mar), 27 (14 Mar), 24 (15 Mar), up to 47 (17 Mar) (LWJ; EPIC ISHM)."
      - "Weapons: mainly one-way attack drones, plus rockets; unmanned explosive boats attacked two tankers in Iraqi waters on 12 Mar (attributed to Iran by Reuters) (EPIC ISHM)."
      - "Kurdistan absorbed about 340 drones and rockets by 17 Mar and 966 drones and missiles by 2 Aug 2026; 32 killed, about 150 injured (EPIC ISHM; Rudaw via LWJ)."
      - "Energy targets: Sarsang field (5 Mar, HKN halted output), Basra contractor sites (6 Mar), Majnoon field (12 and 16 Mar), Lanaz refinery near Erbil (14 Mar) (EPIC ISHM)."
      - "US strike campaign: 32 strikes on PMF HQs in seven provinces by 12 Mar; later shift to leadership targeting; strikes in Jurf al-Nasr, Fallujah, Kirkuk, Nineveh Plain, Salah ad-Din and Baghdad (Arasat, Jadriyah) (LWJ; EPIC ISHM)."
      - "Al-Qaim/Akashat strikes on PMF 19th Brigade, 12 Mar: PMF reported 99 killed, 43 missing, 123 wounded; security sources said at least 20 killed (LWJ; EPIC ISHM)."
      - "PMF losses: 60+ killed and 100+ wounded by 19 Mar (al-Amiri); 80 killed in April and 20 in July 2026 (Wikipedia: 2026 Iran war)."
      - "A US strike on Habbaniya base killed seven Iraqi army personnel (Wikipedia: 2026 Iran war)."
      - "Iraqi army 66th and 76th brigades replaced PMF Brigades 30 and 50 in northeastern Nineveh on 5 Mar to stop launches at Kurdistan (EPIC ISHM)."
      - "Iraq's judiciary ordered courts to apply the 2005 Anti-Terrorism Law to illegal drone makers and users (24 Jun 2026) (EPIC ISHM 18-25 Jun)."
      - "US drawdown: Patriot batteries near Erbil airport moved by late Jul 2026; all US forces out by 30 Sep 2026 (LWJ)."
      - "US pressure tools: 7 commanders designated 17 Apr; rewards for KH, KSS, Ansar Allah al-Awfiya leaders (1 May); $10m reward for Nujaba's Akram al-Kaabi (LWJ)."
      - "ISIS: Iraqi F-16 strikes on hideouts in the Anbar desert (21 Jun 2026); an Iraqi commander killed by ISIS after airstrikes (mid-Oct 2026 report) (EPIC ISHM; LWJ)."
      - "Turkey-PKK: no 2026 Turkish combat operations in Iraqi Kurdistan were found in retrieved sources; the PKK announced its dissolution in 2025 and Ankara's ties with Baghdad in 2026 focus on oil and water (EPIC ISHM 18-25 Jun 2026)."
    casualties: "No single total. PMF: at least 60 killed by 19 Mar (al-Amiri), 80 in April, 20 in July 2026 (EPIC ISHM; Wikipedia: 2026 Iran war); the PMF's own claim of 99 killed at al-Qaim on 12 Mar is disputed. Kurdistan Region: 32 killed, about 150 injured by 2 Aug 2026 (Rudaw via LWJ). One French soldier killed (13 Mar). Seven Iraqi soldiers killed at Habbaniya. Iranian Kurdish opposition groups PJAK and PDKI reported 10 fighters killed. Estimated total in the low hundreds."
    displaced: "No significant new displacement reported in retrieved sources; foreign oil staff evacuated from Basra sites in Mar 2026 (EPIC ISHM)."
    zones:
      - {name: "Baghdad (US Embassy, Victory Base, militia HQs)", lat: 33.3000, lng: 44.3700, radius_km: 15, note: "Drone strikes on the embassy Mar 2026; US strikes killed KH commanders in Arasat and Jadriyah."}
      - {name: "Erbil (airport, ex-US consulate and bases)", lat: 36.2370, lng: 43.9630, radius_km: 15, note: "Main target of Iranian and militia drones; US left by 30 Sep 2026."}
      - {name: "Harir base", lat: 36.5350, lng: 44.3510, radius_km: 6, note: "Repeatedly targeted by militia drones."}
      - {name: "Sulaymaniyah", lat: 35.5570, lng: 45.4350, radius_km: 12, note: "UN office and Peshmerga base hit; Iranian Kurdish groups targeted."}
      - {name: "Al-Qaim and Akashat (Anbar)", lat: 34.1000, lng: 40.9000, radius_km: 40, note: "US strikes on PMF 19th, 18th and 45th Brigades along the Syrian border."}
      - {name: "Jurf al-Nasr (Babil)", lat: 32.8600, lng: 44.1500, radius_km: 10, note: "Kataib Hezbollah stronghold struck repeatedly in Mar 2026."}
      - {name: "Kirkuk", lat: 35.4680, lng: 44.3920, radius_km: 15, note: "PMF bases struck; projectile hit Kirkuk air base 17 Mar."}
      - {name: "Basra oil fields (Majnoon)", lat: 31.1000, lng: 47.5500, radius_km: 25, note: "Drone attacks on fields and contractor sites Mar 2026."}
      - {name: "Anbar desert (ISIS)", lat: 33.4000, lng: 41.5000, radius_km: 80, note: "ISIS hideouts struck by Iraqi F-16s."}
    timeline:
      - {date: "2026-01-28", event: "Trump urges Iraq to reject Maliki as prime minister."}
      - {date: "2026-02-28", event: "US-Israeli war on Iran begins; Iraqi militias join with drone attacks."}
      - {date: "2026-03-12", event: "US strikes on PMF 19th Brigade at al-Qaim/Akashat; PMF reports 99 killed."}
      - {date: "2026-03-13", event: "Drone kills a French soldier at a Kurdistan base."}
      - {date: "2026-03-14", event: "Drone hits US Embassy Baghdad; KH spokesman Abu Ali al-Askari killed in a Baghdad strike."}
      - {date: "2026-03-19", event: "Kataib Hezbollah announces conditional pause in attacks on the embassy."}
      - {date: "2026-03-31", event: "Kataib Hezbollah kidnaps American journalist Shelly Kittleson in Baghdad."}
      - {date: "2026-04-08", event: "US-Iran ceasefire begins."}
      - {date: "2026-04-17", event: "US designates seven militia commanders."}
      - {date: "2026-06-03", event: "Several militias say they accept state control of weapons."}
      - {date: "2026-08-02", event: "Rudaw tally: 966 drones and missiles at Kurdistan since 28 Feb."}
      - {date: "2026-09-30", event: "US forces leave Iraq."}
      - {date: "2026-10-04", event: "Nujaba leader filmed trampling a US flag; disarmament holdouts named."}
    outlook: "Watch whether KH and Nujaba accept disarmament before Zaidi's mid-2027 deadline, renewed militia strikes on Gulf states or Kurdistan if the US-Iran track collapses, ISIS activity in the vacuum left by the US departure, and the fate of thousands of ISIS detainees transferred from Syria."
    sources:
      - {label: "EPIC: Iraq Security and Humanitarian Monitor, 5-19 Mar 2026", url: "https://enablingpeace.org/ishm534/"}
      - {label: "EPIC: Iraq Security and Humanitarian Monitor, 18-25 Jun 2026", url: "https://enablingpeace.org/ishm548/"}
      - {label: "FDD's Long War Journal: Dozens of airstrikes target Iran-backed militias across Iraq (13 Mar 2026)", url: "https://www.longwarjournal.org/archives/2026/03/dozens-of-airstrikes-target-iran-backed-militias-across-iraq.php"}
      - {label: "FDD's Long War Journal: Strikes continue hitting Iran-backed Iraqi militias, Kataib Hezbollah declares temporary US embassy ceasefire (20 Mar 2026)", url: "https://www.longwarjournal.org/archives/2026/03/strikes-continue-hitting-iran-backed-iraqi-militias-kataib-hezbollah-declares-temporary-us-embassy-ceasefire.php"}
      - {label: "FDD's Long War Journal: Iraq pressured by regional countries to rein in Iran-backed militias (4 Aug 2026)", url: "https://www.longwarjournal.org/archives/2026/08/iraq-pressured-by-regional-countries-to-rein-in-iran-backed-militias-as-new-data-on-extent-of-attacks-released.php"}
      - {label: "FDD's Long War Journal: US flag trampling, militia disarmament dispute mark Iraq's post-US withdrawal era (6 Oct 2026)", url: "https://www.longwarjournal.org/archives/2026/10/us-flag-trampling-militia-disarmament-dispute-mark-iraqs-post-us-withdrawal-era.php"}
      - {label: "FDD's Long War Journal: Kataib Hezbollah tag archive", url: "https://www.longwarjournal.org/tags/kataib-hezbollah"}
      - {label: "Wikipedia: 2026 Iran war", url: "https://en.wikipedia.org/wiki/2026_Iran_war"}

