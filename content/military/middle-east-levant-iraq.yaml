      - {date: "2026-04-16", event: "US-brokered 10-day truce; Israel keeps positions."}
      - {date: "2026-04-18", event: "IDF declares Yellow Line zone covering 55 towns and villages."}
      - {date: "2026-05-12", event: "IDF Litani crossing raid ends; Hezbollah's largest drone attack of the war."}
      - {date: "2026-05-31", event: "IDF captures Beaufort Castle, Zawtar al-Sharqiyah and Yohmor."}
      - {date: "2026-06-19", event: "Israel-Hezbollah truce mediated by the US, Qatar and Iran."}
      - {date: "2026-06-26", event: "Israel-Lebanon framework agreement signed; Hezbollah rejects it."}
      - {date: "2026-09-10", event: "IDF demolishes Ali al-Taher ridge tunnel complex; withdraws to Beaufort next day."}
      - {date: "2026-09-30", event: "Golani Brigade leaves southern Lebanon after seven months."}
      - {date: "2026-10-11", event: "Health Ministry toll since 2 Mar reaches 4,387 killed."}
    outlook: "Watch whether Israel formalises the fallback 'Gray Line', whether the LAF moves from seizing caches to dismantling Hezbollah infrastructure north of the Litani (the step Hezbollah warns could mean civil war), whether displaced residents are ever allowed back to the 55 villages, and whether the US-Iran track holds, since Hezbollah's restraint has tracked Tehran's. Renewed strikes on Dahiyeh would signal collapse of the 1 June understanding."
