  - id: syria-transition-conflict
    name: "Syrian internal conflicts (government vs SDF, Druze Sweida, Alawite coast, ISIS)"
    type: civil-war
    intensity: high
    status: active
    started: "2024-12-08 (fall of Assad; current phase)"
    countries: [SYR]
    sides:
      - name: "Syrian transitional government"
        members: ["Syrian Arab Army (new, about 20 divisions incl. 60th, 66th, 72nd, 76th, 80th Divisions and 4th Corps)", "Ministry of Interior General Security / Internal Security Forces", "Former SNA factions (Hamza, Suleiman Shah, Sultan Murad, Ahrar al-Sharqiya)", "Allied Arab tribal forces (al-Baggara, al-Uqaydat, Shammar, al-Sanadid)", "Integrated former SDF brigades (Hasakah, Qamishli, Malikiya, Kobani)"]
        backers: ["Turkey (security partnership)", "United States (diplomatic backing; counter-ISIS intelligence, training and funding after its April 2026 exit)"]
        leaders: ["Ahmed al-Sharaa (President)", "Murhaf Abu Qasra (Defense Minister)"]
        strength: "ISW/CTP counted about 20 active divisions in late 2025, with former HTS commanders in about one-third of command posts (EUAA, Jul 2026); about 3,000 troops deployed in western Sweida in Oct 2026 (The National)."
      - name: "Syrian Democratic Forces (dissolved 25 Aug 2026)"
        members: ["People's Protection Units (YPG)", "Women's Protection Units (YPJ)", "Asayish", "Arab military councils"]
        backers: ["United States (until Jan 2026 policy shift; US left Syria Apr 2026)"]
        leaders: ["Mazloum Abdi (SDF commander)"]
        strength: "About 100,000 SDF and Asayish members per the Kurdish side (Oct 2025, AFP via Iraqi News); lost about 80% of territory by 18 Jan 2026; four brigades integrated into the Defense Ministry in May 2026; formally dissolved 25 Aug 2026."
      - name: "Sweida Druze forces"
        members: ["National Guard (Suwayda)", "Men of Dignity (partly)", "Administrative Council of Jabal Bashan"]
        backers: ["Israel (air strikes, supplies: night vision, sniper rifles, drone training)"]
        leaders: ["Hikmat al-Hijri (Druze spiritual leader)"]
        strength: "Holds Sweida city and 10 surrounding hills (The National, 22 Oct 2026); no numerical estimate retrieved."
      - name: "Islamic State and other jihadist insurgents"
        members: ["Islamic State (ISIS) cells in Deir ez-Zor, Badia, Damascus countryside", "Saraya Ansar al-Sunnah"]
        backers: []
        leaders: ["Abu Hudhayfa al-Ansari (ISIS spokesman)"]
        strength: "About 3,000 ISIS fighters across Syria and Iraq, most in Syria (UN, Feb 2026 via EUAA)."
      - name: "Assad-loyalist and Alawite armed groups"
        members: ["Coastal Shield Brigade", "Men of Light - Saraya al-Jawad"]
        backers: []
        leaders: []
        strength: "Small cells; not quantified (EUAA, Jul 2026)."
    summary: "Damascus crushed the Kurdish-led SDF in a three-week offensive in January 2026, absorbed its forces and saw it formally dissolve in August, and the US then left Syria. The remaining fighting is an armed standoff with Israeli-backed Druze forces around Sweida, a reduced ISIS insurgency, and sectarian violence around the Alawite coast and Homs."
    background: "After Bashar al-Assad fell on 8 December 2024, the HTS-led government of Ahmed al-Sharaa set out to bring every armed group under one army. Two mass atrocities shaped the minorities' distrust: the March 2025 coastal killings of more than 1,400 people, mostly Alawite civilians, and the July 2025 Sweida violence that killed at least 1,700, mostly Druze, which ended when Israeli air strikes forced government forces back.\n\nThe SDF signed a March 2025 integration deal with Damascus but delays and clashes around Aleppo's Kurdish districts and the Tishrin Dam continued. Syria joined the anti-ISIS coalition in November 2025 and al-Sharaa visited the White House, signalling that Washington now backed the central government over its former Kurdish partner."
    year: "Clashes around Aleppo's Sheikh Maqsoud and Ashrafieh districts and near Deir Hafer simmered through late 2025, flaring on 22 December. ISIS struck a US-Syrian meeting in Palmyra in December, killing two US soldiers and an interpreter, and a bomb in a Homs Alawite mosque killed eight on 26 December. On 6 January 2026 government forces attacked Sheikh Maqsoud, forcing the SDF out by 10 January. From 13 January the army pushed east: Deir Hafer and Maskanah fell, Arab tribes rose against the SDF, and on 18 January the government took Tabqa, its dam and airbase and the Deir ez-Zor oil fields while tribal fighters entered Raqqa. Within days the army reached al-Shaddadah, al-Hol and the Iraqi border, and besieged Kobani. Ceasefires on 18, 20 and 30 January ended the fighting; the US airlifted several thousand ISIS detainees to Iraq.\n\nThrough spring the SDF's institutions were folded into the state: four brigades joined the Defense Ministry in May, Abdi declared integration complete on 20 August and the SDF dissolved on 25 August. The US handed over its last base on 16 April. ISIS declared a 'new phase' against Damascus on 21 February, but its attack rate fell after April. In Sweida, low-level shelling, drone strikes and infiltration attempts continued all year, Jordan bombed Druze-held drug sites (December 2025 and May 2026), Israel struck government positions at Izraa (20 March), and the National Guard split internally in June."
    situation: "As of late October 2026 the government controls almost all of Syria except the Druze-held Sweida pocket and Israel's occupation zone in the southwest. Damascus has quietly reinforced western Sweida to about 3,000 troops as Israel flies equipment and personnel into the province, raising fears of a Druze offensive or a new government push. ISIS cells keep up small attacks around Damascus, Daraa, Hama and the eastern desert, and Syrian security forces raid cells (e.g. Rankous). Highway closures by armed groups near Sweida continue."
    technical:
      - "Jan 2026 offensive units: 60th, 66th, 72nd, 76th and 80th Divisions plus General Security; 72nd Division previously fought Kurdish forces in Turkish-backed operations (Wikipedia: 2026 northeastern Syria offensive)."
      - "Key captures on 18 Jan 2026: Tabqa city, Euphrates (Tabqa) Dam, Tabqa Airbase, al-Omar and Conoco gas fields; Raqqa taken by tribal forces then army (Wikipedia)."
      - "SDF destroyed Euphrates bridges east of Aleppo (13 Jan) and closed crossings; government declared territory west of the Euphrates a closed military zone (Wikipedia)."
      - "Al-Shaddadah prison: SDF claimed 1,500 ISIS escapees; US official said about 200, many recaptured; CJTF-OIR struck government-aligned tribal fighters near al-Hol from 20 Jan (Wikipedia)."
      - "18 Jan 14-point deal: Raqqa and Deir ez-Zor handed to Damascus; oil, gas, border crossings and ISIS camps to government control; non-Syrian PKK cadres expelled; Kobani demilitarised (Wikipedia)."
      - "SDF integration: Hasakah, Qamishli and Malikiya brigades forming a northeast division, plus a Kobani brigade, integrated into the MoD in May 2026 (EUAA citing Enab Baladi)."
      - "US exit: last major base, Qasrak in the far northeast, handed over 16 Apr 2026; US continues partner-led counter-ISIS work with the Interior Ministry and seeks $130m for local forces (Al-Monitor; CSIS)."
      - "ISIS: 129 attacks Jun-Nov 2025, mostly IEDs, ambushes and assassinations in Deir ez-Zor; about 3,000 fighters across Syria and Iraq; SOHR counted 31 government forces killed mid-Feb to mid-May 2026 (EUAA)."
      - "Sweida fronts: Tal Hadid, Walgha, Mansoura, al-Majdal, al-Mazraa, Rimat Hazem, Umm al-Zaytoun, Ara, Khirbet Samar; weapons include 23 mm cannons, mortars and armed drones on both sides (Wikipedia: Southern Syria conflict)."
      - "Israel airlifts equipment by helicopter into Sweida over the Yarmouk basin and Daraa; Israeli supplies to the National Guard include communications gear, night-vision systems and sniper rifles (The National, 22 Oct 2026)."
      - "Jordan's 'Operation Jordanian Deterrence' (2 May 2026) struck Shahba, al-Kafr, Arman and al-Anat, officially against drug traffickers (Wikipedia: Southern Syria conflict)."
      - "Coastal insurgents: Coastal Shield Brigade; Men of Light - Saraya al-Jawad, whose leader was killed by security forces in Feb 2026 (EUAA)."
    casualties: "SNHR: 3,666 civilians killed in Syria in 2025 and 268 in Jan-Mar 2026 (EUAA, Jul 2026). January 2026 offensive: about 1,000 combatants and 152 civilians killed by 18 Jan per Wikipedia's infobox (marked citation needed, treat as rough). Earlier reference events: more than 1,400 killed on the coast in Mar 2025 and at least 1,700 in Sweida in Jul 2025 (UN HRC via EUAA). No ACLED 12-month total was retrieved."
    displaced: "IOM: 134,803 people displaced toward Hasakah by 21 Jan 2026 during the SDF offensive; SDF said 35,000 Aleppo households uprooted; over 13,000 displaced from Raqqa by 18 Jan (Wikipedia: 2026 northeastern Syria offensive). Al-Hol camp handed to the government on 20 Jan; UNHCR announced its closure on 23 Feb 2026 (EUAA)."
    zones:
      - {name: "Aleppo Sheikh Maqsoud and Ashrafieh", lat: 36.2270, lng: 37.1600, radius_km: 3, note: "Kurdish districts besieged Oct-Dec 2025, taken by government Jan 2026."}
      - {name: "Tabqa and Euphrates Dam", lat: 35.8500, lng: 38.5500, radius_km: 10, note: "Captured 18 Jan 2026 with airbase and dam."}
      - {name: "Raqqa", lat: 35.9500, lng: 39.0090, radius_km: 8, note: "Tribal uprising and army entry 18 Jan 2026."}
      - {name: "Kobani", lat: 36.8910, lng: 38.3540, radius_km: 8, note: "Besieged Jan 2026; to be demilitarised; SDF brigade integrated."}
      - {name: "Hasakah-Qamishli Kurdish zone", lat: 36.8000, lng: 41.0000, radius_km: 40, note: "Interior Ministry deployment under 30 Jan deal; former SDF heartland."}
      - {name: "Sweida pocket", lat: 32.7090, lng: 36.5670, radius_km: 15, note: "Druze National Guard holds city and 10 hills; about 3,000 government troops on western front (Oct 2026)."}
      - {name: "Western Sweida front (al-Majdal, Walgha, Tal Hadid)", lat: 32.7600, lng: 36.4800, radius_km: 10, note: "Recurring mortar, drone and infiltration clashes."}
      - {name: "Alawite coast (Latakia, Jableh, Tartus)", lat: 35.3600, lng: 35.9300, radius_km: 30, note: "Insurgent cells and reprisal violence; arbitrary arrests reported."}
      - {name: "Homs", lat: 34.7310, lng: 36.7090, radius_km: 8, note: "Sectarian attacks incl. 26 Dec 2025 Alawite mosque bombing."}
      - {name: "Central desert (Palmyra-Badia)", lat: 34.5510, lng: 38.2700, radius_km: 60, note: "ISIS remnants; Dec 2025 Palmyra attack on US personnel."}
      - {name: "Deir ez-Zor countryside", lat: 35.3360, lng: 40.1400, radius_km: 40, note: "Main ISIS attack area; oil fields taken by government Jan 2026."}
    timeline:
      - {date: "2025-11-11", event: "Syria joins the US-led anti-ISIS coalition (Nov 2025)."}
      - {date: "2025-12-13", event: "ISIS-linked attack in Palmyra kills two US soldiers and an interpreter."}
      - {date: "2025-12-26", event: "Bombing of an Alawite mosque in Homs kills eight."}
      - {date: "2026-01-06", event: "Government offensive on Sheikh Maqsoud, Aleppo; SDF withdraws 10 Jan."}
      - {date: "2026-01-18", event: "Government takes Tabqa, the Euphrates Dam and Deir ez-Zor oil fields; 14-point ceasefire."}
      - {date: "2026-01-30", event: "Comprehensive government-SDF integration agreement."}
      - {date: "2026-02-21", event: "ISIS announces a 'new phase' against the government."}
      - {date: "2026-04-16", event: "US hands over its last base (Qasrak), ending its ground presence."}
      - {date: "2026-05-02", event: "Jordan strikes Druze-held towns in Sweida; four SDF brigades join MoD around this time."}
      - {date: "2026-08-25", event: "SDF formally dissolves after integration declared complete on 20 Aug."}
      - {date: "2026-10-22", event: "Reports of 3,000 government troops in western Sweida and Israeli equipment airlifted into the province."}
    outlook: "Sweida is the flashpoint: a government push or a Druze offensive could draw Israeli strikes as in July 2025. Watch also how the former SDF brigades behave inside the army, whether ISIS exploits the US absence in the east, and sectarian incidents on the coast and in Homs."
