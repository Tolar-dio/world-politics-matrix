  - id: colombia-armed-conflict
    name: "Colombia's armed conflict (ELN, FARC dissidents, Clan del Golfo)"
    type: insurgency
    intensity: medium
    status: active
    started: "2025-01-16 (ELN offensive in Catatumbo; government offensive from 2026-08-07)"
    countries: [COL, VEN]
    sides:
      - name: "Colombian state"
        members:
          - "National Army"
          - "Colombian Aerospace Force (air strikes)"
          - "National Navy and Marines"
          - "National Police"
        backers:
          - "United States (intelligence and counter-narcotics cooperation; Colombia joined the US-led 'Shield of the Americas' in Aug 2026)"
        leaders:
          - "Abelardo de la Espriella (President from 7 Aug 2026)"
          - "Jorge Mora López (Defence Minister)"
          - "Gustavo Petro (President until 7 Aug 2026)"
        strength: "Not given in the sources consulted"
      - name: "National Liberation Army (ELN)"
        members:
          - "Northeastern War Front (Catatumbo)"
          - "Darío Ramírez Castro War Front (sur de Bolívar)"
        backers: []
        leaders:
          - "'Antonio García' (commander-in-chief)"
        strength: "Not given in the sources consulted"
      - name: "FARC dissident factions"
        members:
          - "Estado Mayor Central (EMC) of 'Iván Mordisco', including the Carlos Patiño structure in Cauca"
          - "Estado Mayor de los Bloques y Frente (EMBF) of 'Calarcá', including Front 33 in Catatumbo and the Isaías Carvajal structure in Guaviare"
          - "28th Front (Meta, Guaviare and Vichada border area)"
        backers: []
        leaders:
          - "Néstor Gregorio Vera Fernández 'Iván Mordisco' (EMC)"
          - "Alexander Díaz Mendoza 'Calarcá Córdoba' (EMBF)"
        strength: "Not given separately; Fundación Ideas para la Paz counts nearly 29,000 members of all organized armed groups combined (MercoPress, Aug 2026)"
      - name: "Clan del Golfo (Ejército Gaitanista de Colombia, EGC)"
        members:
          - "EGC blocs centred on Urabá, Antioquia, Córdoba and Sucre"
        backers: []
        leaders:
          - "Jobanis de Jesús Ávila 'Chiquito Malo' (top leader)"
        strength: "About 7,000 (InSight Crime, Aug 2025, cited by Wikipedia); more than 10,000 (MercoPress, Aug 2026)"
    summary: "Colombia's government is fighting several armed groups at once: the ELN guerrilla, rival FARC dissident factions and the Clan del Golfo trafficking army. Since taking office on 7 August 2026, President Abelardo de la Espriella has abandoned negotiations in favour of air strikes and a pledge to capture or kill ten group leaders within 90 days. In Catatumbo, on the Venezuelan border, an ELN war against FARC dissidents has displaced more than 80,000 people since January 2025."
    background: "The 2016 peace deal with the FARC left gaps that the ELN, FARC dissidents who rejected or abandoned the deal, and the Clan del Golfo moved to fill, competing for coca, mining and smuggling routes. President Gustavo Petro (2022 to 2026) pursued 'Total Peace' talks with most groups, with limited results. In January 2025 the ELN launched an offensive against FARC dissident Front 33 in Catatumbo, killing at least 80 people in the first days and causing one of Colombia's largest displacement crises in decades.\n\nThe US designated the Clan del Golfo a terrorist organization in December 2025, linking Colombia's conflict to Washington's wider 'narco-terrorism' campaign. The 2026 election became a referendum on security: de la Espriella, a hard-line right-wing lawyer, narrowly beat leftist senator Iván Cepeda in the 21 June runoff, 49.66 percent to 48.70 percent."
    year: "Under Petro, the military continued selective bombing. A strike in Calamar, Guaviare, in November 2025 killed 20 members of Mordisco's faction, seven of them forcibly recruited minors, prompting military and disciplinary inquiries. In January 2026, 26 bodies, four of them minors, were recovered in El Retorno, Guaviare, after fighting between the Mordisco and Calarcá factions. The ELN pressed its war in Catatumbo, using explosive drones and mines; by July 2026 local authorities counted more than 200 dead and more than 80,000 displaced.\n\nDe la Espriella took office in Cali on 7 August 2026 and declared dialogue 'completely exhausted'. In his first weekend, troops and the air force killed a 28th Front commander and three others near the Meta, Guaviare and Vichada border, and five Carlos Patiño fighters in El Tambo, Cauca, while a vehicle bomb exploded near Santander de Quilichao. On 11 August the first bombing of his term hit El Sinaí in San Calixto, Catatumbo, killing two alleged ELN members and injuring three civilians. The ELN answered with a roughly 80 kg car bomb at the Los Patios police station on 31 August (one civilian killed, eleven injured) and an explosive-drone attack on the El Trapiche military base in early September that killed an army captain and two soldiers. In mid-September the army reported killing five ELN fighters in Morales, sur de Bolívar."
    situation: "As of late October 2026 the government's offensive is in its third month, with air strikes and ground raids against ELN, FARC dissident and Clan del Golfo leaders, and the 90-day target of ten leaders due in early November. The ELN is fighting back with car bombs and drones in Norte de Santander, and Catatumbo remains contested between the ELN and Front 33. Analysts at the International Crisis Group warn that removing leaders tends to splinter groups and raise violence in the short term."
    technical:
      - "Air power: Petro's government carried out 25 bombings; de la Espriella's first, on 11 Aug 2026 at El Sinaí (San Calixto), killed 2 alleged ELN members and injured at least 3 civilians, with 1.5 t of explosives seized (Primicias)."
      - "Decapitation plan: target of capturing or killing 10 armed-group leaders in the first 90 days, including Mordisco, Calarcá, Chiquito Malo and Catatumbo commanders, who were given a one-month ultimatum (MercoPress)."
      - "Opening raids, 9 Aug 2026: joint military intelligence and air force operation killed 28th Front commander alias 'Ruso' or 'Alemán' and three others near the Meta, Guaviare and Vichada border; at least 5 Carlos Patiño members killed in El Tambo, Cauca."
      - "ELN explosive drones: early Sep 2026 attack on the Cantón Militar El Trapiche, Catatumbo, with 'unmanned aircraft fitted with explosive devices' killed a captain and two soldiers (NTN24)."
      - "ELN car bomb: about 80 kg of explosives in a stolen vehicle outside the Los Patios police station, 31 Aug 2026; 1 civilian killed and 11 injured, one officer lost part of a leg (AFP via Sharjah24)."
      - "Sur de Bolívar raid, Sep 2026: 5 ELN of the Darío Ramírez Castro War Front killed in Morales; government says this degraded ELN drone capability; it also tied the commander to a Dec 2025 attack in Aguachica that it says killed 7 soldiers and wounded 30 (Publimetro)."
      - "Child recruitment: 7 minors among 20 dead in the Nov 2025 Guaviare bombing (Medicina Legal via Vanguardia) and 4 minors among 26 dead in Jan 2026 inter-dissident fighting in El Retorno (Publimetro)."
      - "Catatumbo methods: explosive drones, anti-personnel mines and forced recruitment, with nearly 1,000 students unable to return to school (Noticias RCN, Jul 2026)."
      - "Armed group size: nearly 29,000 members of organized armed groups and at least 14 zones of active dispute (Fundación Ideas para la Paz via MercoPress)."
      - "Clan del Golfo designated a Foreign Terrorist Organization by the US on 16 Dec 2025."
      - "Policy shift: de la Espriella supports aerial coca fumigation with US aircraft and joined the US-led 'Shield of the Americas' alliance (Wikipedia; NTN24)."
    casualties: "Catatumbo, 16 Jan 2025 to Jul 2026: more than 200 killed, including 167 civilians, 12 minors, 4 social leaders and 6 peace signatories (Unified Command Post figures via Noticias RCN, 16 Jul 2026). Guaviare: 20 killed including 7 minors in a Nov 2025 bombing (Vanguardia); 26 killed including 4 minors in Jan 2026 dissident infighting (Publimetro). De la Espriella offensive, Aug to Sep 2026: at least 16 armed-group members reported killed in the operations listed here, and at least 3 soldiers and 1 civilian killed in ELN attacks (MercoPress, Primicias, NTN24, Sharjah24, Publimetro). No consolidated national conflict death toll for the last 12 months was found; the true total is likely much higher than these partial figures."
    displaced: "More than 80,000 displaced in Catatumbo since Jan 2025 (Unified Command Post via Noticias RCN, 16 Jul 2026); new displacement of 293 families reported in Catatumbo in early June 2026 (El Universal headline)."
    zones:
      - {name: "Catatumbo (Norte de Santander)", lat: 8.6000, lng: -73.0000, radius_km: 60, note: "ELN versus FARC dissident Front 33 since Jan 2025; drones, mines, mass displacement; first air strike of the de la Espriella era."}
      - {name: "Cúcuta metropolitan area", lat: 7.8939, lng: -72.5078, radius_km: 20, note: "ELN car bomb at Los Patios police station (Aug 2026); reception area for Catatumbo displaced."}
      - {name: "Guaviare and Meta", lat: 2.3000, lng: -72.6000, radius_km: 120, note: "Mordisco and Calarcá dissident factions fight each other and the army; site of controversial bombings."}
      - {name: "Northern Cauca", lat: 2.7000, lng: -76.6000, radius_km: 70, note: "Mordisco's Carlos Patiño and other EMC structures; car bombs and army offensives."}
      - {name: "Sur de Bolívar", lat: 8.2760, lng: -73.8680, radius_km: 50, note: "ELN Darío Ramírez Castro front; army raids in Sep 2026."}
      - {name: "Urabá and Córdoba", lat: 7.9000, lng: -76.4000, radius_km: 100, note: "Heartland of the Clan del Golfo (EGC)."}
    timeline:
      - {date: "2025-01-16", event: "ELN launches offensive against FARC dissidents in Catatumbo, killing at least 80 in the first days."}
      - {date: "2025-11-10", event: "Military bombing in Calamar, Guaviare, kills 20 Mordisco dissidents, including 7 minors (date given as 10 or 11 Nov)."}
      - {date: "2025-12-16", event: "US designates the Clan del Golfo a Foreign Terrorist Organization."}
      - {date: "2026-01-21", event: "Forensic authorities confirm 26 dead, 4 of them minors, from fighting between Mordisco and Calarcá factions in El Retorno, Guaviare."}
      - {date: "2026-06-21", event: "Abelardo de la Espriella wins the presidential runoff with 49.66 percent."}
      - {date: "2026-08-07", event: "De la Espriella inaugurated in Cali; launches offensive and ends negotiations."}
      - {date: "2026-08-09", event: "First raids kill a 28th Front commander and 3 others near Meta, Guaviare and Vichada, and 5 dissidents in El Tambo, Cauca."}
      - {date: "2026-08-11", event: "First air strike of the new government hits El Sinaí, San Calixto, in Catatumbo."}
      - {date: "2026-08-31", event: "ELN car bomb at the Los Patios police station kills 1 and injures 11."}
      - {date: "2026-09-04", event: "ELN explosive-drone attack on the El Trapiche military base in Catatumbo kills 3 soldiers (approximate date)."}
      - {date: "2026-09-15", event: "Government reports 5 ELN fighters killed in Morales, sur de Bolívar."}
    outlook: "Watch the 90-day mark in early November 2026 for whether any of the named leaders are killed or captured, and whether killings fragment the groups as Crisis Group warns. Expect more ELN drone and car-bomb attacks on bases and police stations in Norte de Santander and Arauca, more civilian-harm controversy from air strikes, and possible US involvement in strikes on Colombian soil now that Bogotá and Washington are closely aligned."
    sources:
