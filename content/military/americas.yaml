conflicts:
  - id: us-caribbean-narco-campaign
    name: "US campaign against Venezuela and 'narco-terrorist' groups (Operation Southern Spear)"
    type: air-missile-campaign
    intensity: medium
    status: active
    started: "2025-09-02 (first lethal strike on a boat in the Caribbean)"
    countries: [USA, VEN, CUB, TTO, COL, ECU]
    sides:
      - name: "United States"
        members:
          - "US Southern Command and Joint Task Force Southern Spear (headquarters at Naval Station Mayport, Florida)"
          - "US Navy: USS Gerald R. Ford carrier strike group (Caribbean, Nov 2025 to Feb 2026), USS Iwo Jima amphibious group with the 22nd Marine Expeditionary Unit"
          - "US Air Force, Marine Corps and Air National Guard aircraft (F-22, F-35A/C, F/A-18E/F, EA-18G, B-1B, B-52, AC-130J, P-8A)"
          - "1st Special Forces Operational Detachment-Delta (Delta Force) and 160th Special Operations Aviation Regiment"
          - "CIA, FBI Hostage Rescue Team, DEA, US Coast Guard"
        backers:
          - "Dominican Republic (access to San Isidro air base and Las Americas airport from 26 Nov 2025)"
          - "Trinidad and Tobago (radar site and airport access)"
          - "El Salvador (hosted AC-130J, P-8A and C-40 aircraft)"
        leaders:
          - "Donald Trump (President)"
          - "Pete Hegseth (Secretary of Defense, styled Secretary of War)"
          - "Gen. Dan Caine (Chairman of the Joint Chiefs of Staff)"
        strength: "About 15,000 personnel at the peak of the build-up, with a carrier, 6 destroyers, a cruiser, 3 amphibious ships and a nuclear submarine (Wikipedia, Operation Southern Spear, accessed Oct 2026)"
      - name: "Maduro government (until 3 Jan 2026)"
        members:
          - "Bolivarian National Armed Forces (FANB)"
          - "Cuban military and intelligence personnel guarding Maduro"
        backers:
          - "Cuba (security personnel)"
        leaders:
          - "Nicolás Maduro (President, captured 3 Jan 2026)"
          - "Vladimir Padrino López (Defence Minister)"
          - "Diosdado Cabello (Interior Minister)"
        strength: "Not estimated in the sources consulted"
      - name: "Targeted trafficking networks"
        members:
          - "Crews of alleged drug boats and semi-submersibles in the Caribbean and eastern Pacific"
          - "Tren de Aragua"
          - "Cartel de los Soles (designated a terrorist organization by the US in Nov 2025)"
        backers: []
        leaders:
          - "'Niño Guerrero' (Tren de Aragua leader, killed in a US strike in June 2026)"
        strength: "Unknown; strikes typically kill two to six people per boat"
    summary: "Since September 2025 the United States has waged a lethal air and naval campaign against small boats it says carry drugs for designated 'narco-terrorist' groups, killing about 238 people in 79 strikes by early October 2026, according to InSight Crime. On 3 January 2026 a raid on Caracas captured Nicolás Maduro, and the acting government that replaced him now cooperates with Washington. The boat strikes continue, mostly in the eastern Pacific."
    background: "In 2025 the Trump administration began treating Latin American drug trafficking groups as terrorist organizations and military targets. On 2 October 2025 it told Congress that the US was in a 'non-international armed conflict' with designated cartels, whose members it called 'unlawful combatants', and that drug smuggling amounted to an 'armed attack' on the US. Congress has passed no authorization for this use of force, and former government lawyers and rights groups say the strikes amount to extrajudicial killings, while the White House says it acts within the law of armed conflict. This matters because it is the legal basis for every strike in the campaign, and it is being tested in lawsuits and an Inspector General review.\n\nAt the same time the US assembled its largest naval force in the Caribbean in decades, aimed at the government of Nicolás Maduro, which Washington accused of running the 'Cartel de los Soles'. The USS Gerald R. Ford carrier group arrived in mid-November 2025, F-35s and electronic-warfare jets moved to Puerto Rico, and access deals were struck with the Dominican Republic, Trinidad and Tobago and El Salvador."
    year: "The campaign began with a strike off Venezuela on 2 September 2025 that killed 11 people; the administration later confirmed a follow-up strike that killed two survivors. From late October 2025 the strikes spread to the eastern Pacific, which became the main theatre. In December 2025 the US designated the Clan del Golfo a terrorist organization, declared fentanyl a weapon of mass destruction, began seizing oil tankers and announced its first strike on land, a CIA drone attack on a Venezuelan port with no reported casualties.\n\nOn 3 January 2026, Operation Absolute Resolve sent more than 150 aircraft from 20 bases against air defences and military sites around Caracas while Delta Force, flown in by 160th SOAR helicopters, seized Maduro and his wife Cilia Flores at Fuerte Tiuna. They were flown via the USS Iwo Jima to New York, where they pleaded not guilty to narco-terrorism charges. Cuba said 32 of its personnel died; Venezuela's defence minister counted 47 Venezuelan military dead; US officials estimated about 75 deaths in total. Seven US troops were wounded and none killed.\n\nVice President Delcy Rodríguez became acting president, restored relations with Washington (embassy reopened 30 March), opened the oil sector and released hundreds of political prisoners under an amnesty law. The Ford left for the Middle East in February 2026. In June 2026 a US strike, coordinated with Venezuelan intelligence, killed Tren de Aragua leader 'Niño Guerrero'. Boat strikes continued through the year: the death toll reached at least 199 by late May 2026 and 238 in 79 strikes by 5 October 2026, when a Caribbean strike killed four people."
    situation: "As of late October 2026 the boat strikes continue at a lower tempo than their late-2025 peak, with two deadly strikes and seven non-lethal ones in September 2026 and a lethal Caribbean strike on 4 October. Venezuela is no longer an adversary: the interim government of Delcy Rodríguez shares intelligence with the US, and she promised elections at the UN in September 2026 but set no date. Maduro awaits trial in New York. The large naval build-up has ended, but the legal claim of an armed conflict with cartels remains in force and is now applied across the region, including joint strikes in Ecuador."
    technical:
      - "Legal basis: 2 Oct 2025 notice to Congress declaring a 'non-international armed conflict' with designated cartels; no Authorization for Use of Military Force covers the strikes (CBS News; Al Jazeera)."
      - "Strike count: 79 strikes and 238 dead by 5 Oct 2026 per InSight Crime (includes non-lethal strikes); AP-based count of 70 strikes and at least 235 dead the same day (AIR)."
      - "At least 22 people survived an initial strike but were hit again or died at sea; only three survivors are known to have been rescued, two from a semi-submersible in Oct 2025 and one handed to Costa Rica in Mar 2026 (CBS via Airwars)."
      - "First strike, 2 Sep 2025, off Sucre state, Venezuela: 11 killed, including two survivors killed in a follow-on 'double tap' strike reported by the Washington Post and confirmed by the administration."
      - "Peak naval force: Gerald R. Ford carrier strike group, 6 destroyers, 1 cruiser, 1 amphibious assault ship, 2 amphibious transport docks, 1 national security cutter, 1 nuclear attack submarine, about 15,000 personnel (Wikipedia, Operation Southern Spear)."
      - "Air assets: AC-130J gunship, P-8A Poseidon and C-40 in El Salvador from mid-Oct 2025; B-52 flights near the Venezuelan coast on 20 Nov 2025; EA-18G Growlers and F-35s in Puerto Rico from Dec 2025; F-35As seen at Roosevelt Roads after the raid."
      - "Surveillance: Saildrone uncrewed surface vessels and a radar installed in Trinidad and Tobago in late Nov 2025; RQ-170 Sentinel stealth drone supported the Maduro raid."
      - "Absolute Resolve timing: execute order 22:46 EST on 2 Jan; assault force at Maduro's compound 01:01 EST (02:01 Caracas); force over water with captives 03:29 EST (DefenseScoop)."
      - "Absolute Resolve package: more than 150 aircraft from 20 land and sea bases, including F-22A, F-35A/C, F/A-18E/F, EA-18G, E-2D, B-1B, MH-47G and MH-60M DAP helicopters, plus Space Command and Cyber Command effects; reportedly the first US operational use of one-way attack drones."
      - "Targets on 3 Jan 2026: La Carlota air base, Fuerte Tiuna, Higuerote airport (a Buk-M2E surface-to-air missile system destroyed), La Guaira port (at least five warehouses destroyed) and telecom antennas; Venezuela blamed AGM-154 glide bombs for damage to the IVIC research institute."
      - "One US helicopter was hit by ground fire during the raid but stayed flyable; 7 US personnel were wounded by gunfire and shrapnel."
      - "Designations: Cartel de los Soles terrorist designation (Nov 2025); Clan del Golfo Foreign Terrorist Organization (16 Dec 2025); fentanyl declared a weapon of mass destruction (15 Dec 2025)."
      - "Ten oil tankers boarded or seized by mid-2026 as part of the pressure campaign (Wikipedia, Operation Southern Spear)."
      - "Cost: at least 4.7 billion US dollars from Aug 2025 to Mar 2026 (Costs of War Project, cited by Wikipedia)."
      - "USS Gerald R. Ford left the Caribbean for Operation Epic Fury against Iran in Feb 2026 and returned to Norfolk on 16 May 2026 after a 326-day deployment, the longest since Vietnam (TWZ; Stars and Stripes)."
    casualties: "Boat strikes: 238 killed in 79 strikes, 2 Sep 2025 to 5 Oct 2026 (InSight Crime, 5 Oct 2026); AP-based tally at least 235 in 70 strikes (AIR, 5 Oct 2026). Maduro raid, 3 Jan 2026: 32 Cuban personnel (Cuban government); 47 Venezuelan military (Defence Minister Padrino López, 16 Jan 2026) or 42 to 43 (independent monitors, 6 to 7 Jan); at least 2 civilians; about 75 total per US government assessments reported by the Washington Post (6 Jan 2026); Interior Minister Cabello claimed 100, unverified. US: 7 wounded, no combat deaths; one non-combat death during Southern Spear. Figures for the boat strikes rest mostly on US statements, and the identities of most of the dead are unknown."
    displaced: "No significant displacement attributed to the campaign in the sources consulted."
    zones:
      - {name: "Southern Caribbean strike area (off Venezuela and Trinidad)", lat: 12.0, lng: -65.5, radius_km: 400, note: "Where the campaign began in Sep 2025 and where strikes resumed in Sep to Oct 2026; positions are rarely disclosed, so the area is approximate."}
      - {name: "Eastern Pacific strike area", lat: 6.0, lng: -84.0, radius_km: 700, note: "Main theatre since late Oct 2025, on cocaine routes from Colombia and Ecuador toward Central America and Mexico; approximate."}
      - {name: "Caracas", lat: 10.4806, lng: -66.9036, radius_km: 25, note: "Target of Operation Absolute Resolve on 3 Jan 2026, including Fuerte Tiuna and La Carlota air base."}
      - {name: "Puerto Rico staging area (Roosevelt Roads)", lat: 18.2450, lng: -65.6434, radius_km: 40, note: "Forward base for F-35s, EA-18G Growlers, tankers and rescue aircraft from Dec 2025."}
    timeline:
      - {date: "2025-09-02", event: "First US strike on an alleged drug boat off Venezuela kills 11, including two survivors hit by a follow-on strike."}
      - {date: "2025-10-02", event: "Administration notifies Congress of a 'non-international armed conflict' with designated cartels."}
      - {date: "2025-11-04", event: "USS Gerald R. Ford leaves the Mediterranean for US Southern Command; it reaches the Caribbean in mid-November."}
      - {date: "2025-11-26", event: "Dominican Republic authorizes US access to San Isidro air base and Las Americas airport."}
      - {date: "2025-12-16", event: "US designates the Clan del Golfo a Foreign Terrorist Organization, a day after declaring fentanyl a weapon of mass destruction."}
      - {date: "2025-12-26", event: "US announces its first land strike, a CIA drone attack on a Venezuelan port, with no reported casualties."}
      - {date: "2026-01-03", event: "Operation Absolute Resolve: Maduro and Cilia Flores captured in Caracas and flown to New York."}
      - {date: "2026-01-05", event: "Delcy Rodríguez sworn in as acting president; Maduro pleads not guilty in New York."}
      - {date: "2026-03-05", event: "US and Venezuela restore diplomatic relations; the US embassy reopens on 30 March."}
      - {date: "2026-05-16", event: "USS Gerald R. Ford returns to Norfolk after 326 days, having left the Caribbean for the Iran campaign in February."}
      - {date: "2026-05-28", event: "AP reports the boat-strike death toll has reached at least 199."}
      - {date: "2026-06-12", event: "Trump announces a US strike in Venezuela, coordinated with Venezuelan intelligence, that killed Tren de Aragua leader 'Niño Guerrero'."}
      - {date: "2026-09-23", event: "Rodríguez promises elections at the UN General Assembly but gives no date."}
      - {date: "2026-10-04", event: "Strike on a boat in the Caribbean kills four, bringing the toll to about 238 in 79 strikes."}
    outlook: "Watch whether strikes keep their current tempo now that the Venezuelan government cooperates, whether courts or Congress constrain the 'armed conflict' legal theory, and whether the model of joint strikes with partner governments, already used in Ecuador and Venezuela, extends to Colombia under President de la Espriella. Maduro's trial and any Venezuelan election timetable will shape whether US forces return to a larger posture."
    sources:
      - {label: "InSight Crime: Mapping Out US Alleged Drug Boat Strikes (updated 5 Oct 2026)", url: "https://insightcrime.org/news/mapping-out-us-alleged-drug-boat-strikes/"}
      - {label: "AIR/newsonair: US military strike on suspected drug smuggling boat kills four in Caribbean Sea (5 Oct 2026)", url: "https://newsonair.gov.in/us-military-strike-on-suspected-drug-smuggling-boat-kills-four-in-caribbean-sea/"}
      - {label: "CBS News via Airwars: boat strike toll reaches 199 (May 2026)", url: "https://airwars.org/?p=467654"}
      - {label: "AP via Telemundo Nebraska: Recent survivors of US boat strikes haven't been found, bringing overall death toll to 199", url: "https://este.telemundonebraska.com/story/287049767/recent-survivors-of-us-boat-strikes-havent-been-found-bringing-overall-death-toll-to-199"}
      - {label: "CBS News: Trump administration tells Congress the US is in armed conflict with drug cartels (2 Oct 2025)", url: "https://www.cbsnews.com/amp/news/trump-tells-congress-armed-conflict-drug-cartels-venezuela-boat-strikes"}
      - {label: "Al Jazeera: Trump memo says US in non-international armed conflict with cartels", url: "https://www.aljazeera.com/news/2025/10/2/trump-memo-says-us-in-non-international-armed-conflict-with-cartels"}
      - {label: "Wikipedia: Operation Southern Spear", url: "https://en.wikipedia.org/wiki/Operation_Southern_Spear"}
      - {label: "Wikipedia: 2026 United States strikes in Venezuela", url: "https://en.wikipedia.org/wiki/2026_United_States_strikes_in_Venezuela"}
      - {label: "DefenseScoop: Operation Absolute Resolve details from Gen. Caine (3 Jan 2026)", url: "https://defensescoop.com/2026/01/03/us-military-operation-venezuela-absolute-resolve-details-gen-caine/"}
      - {label: "Espreso Global: 75 killed in US military raid that captured Maduro (citing Washington Post)", url: "https://global.espreso.tv/military-news-75-killed-in-us-military-raid-that-captured-venezuelan-leader-maduro"}
      - {label: "USNI News: USS Gerald R. Ford leaves Mediterranean bound for US Southern Command", url: "https://news.usni.org/2025/11/04/uss-gerald-r-ford-leaves-mediterranean-bound-for-u-s-southern-command"}
      - {label: "Stars and Stripes: Gerald R. Ford and Operation Epic Fury (30 Apr 2026)", url: "https://www.stripes.com/branches/navy/2026-04-30/gerald-r-ford-epic-fury-newport-news-21533354.html"}
      - {label: "TWZ: Where are the carriers as of May 17, 2026", url: "https://www.twz.com/sea/where-are-the-carriers-as-of-may-17-2026-ford-is-finally-home"}
      - {label: "The Week: Venezuela, Niño Guerrero killed in US strike (13 Jun 2026)", url: "https://www.theweek.in/news/world/2026/06/13/venezuela-nino-guerrero-killed-us-strike.html"}
      - {label: "Al Jazeera: Venezuela's Delcy Rodríguez promises elections at UN, gives no date (24 Sep 2026)", url: "https://www.aljazeera.com/news/2026/9/24/venezuelas-delcy-rodriguez-promises-elections-at-un-gives-no-date"}
  - id: mexico-cartel-war
    name: "Mexico's cartel war (CJNG succession fight and Sinaloa Cartel civil war)"
    type: criminal
    intensity: high
    status: active
    started: "2024-09-09 (start of the Sinaloa Cartel civil war; CJNG succession crisis from 2026-02-22)"
    countries: [MEX, USA]
    sides:
      - name: "Mexican state"
        members:
          - "Secretariat of National Defense (SEDENA): Mexican Army, including the Joint Special Operations Command (FEC), Special Forces and the Brigada de Fusileros Paracaidistas"
          - "Mexican Air Force"
          - "National Guard (under SEDENA command)"
          - "Mexican Navy (SEMAR)"
          - "Security Ministry (SSPC) under Omar García Harfuch; state police forces"
        backers:
          - "United States (intelligence and planning support through Joint Interagency Task Force-Counter Cartel)"
        leaders:
          - "Claudia Sheinbaum (President)"
          - "Gen. Ricardo Trevilla Trejo (Secretary of National Defense)"
          - "Omar García Harfuch (Secretary of Security)"
        strength: "National Guard about 120,000 personnel (Wikipedia, National Guard (Mexico)); 200 elite troops sent to Sinaloa in late 2025 and a reported 1,600 more in Jan 2026 (Expansión Política, Feb 2026)"
      - name: "Cártel de Jalisco Nueva Generación (CJNG)"
        members:
          - "CJNG regional cells in Jalisco, Michoacán, Guanajuato, Colima, Zacatecas and beyond"
        backers: []
        leaders:
          - "Nemesio Oseguera Cervantes 'El Mencho' (leader, killed 22 Feb 2026)"
          - "Juan Carlos Valencia González 'El Pelón' (reported successor, per WSJ and El País, Mar to Apr 2026)"
          - "Audias Flores Silva 'El Jardinero' (contender, captured 27 Apr 2026)"
        strength: "Not reliably estimated; operates in more than 60 countries and, per a 2024 DEA report, all 50 US states (LRB, Mar 2026)"
      - name: "Sinaloa Cartel: Los Chapitos"
        members:
          - "Faction led by the sons of Joaquín 'El Chapo' Guzmán"
        backers: []
        leaders:
          - "Iván Archivaldo Guzmán (faction leader)"
        strength: "Not estimated in the sources consulted"
      - name: "Sinaloa Cartel: Los Mayos (Mayitos)"
        members:
          - "Faction loyal to Ismael 'El Mayo' Zambada, who is jailed in the US"
        backers: []
        leaders:
          - "Ismael Zambada Sicairos 'El Mayito Flaco' (faction leader)"
        strength: "Not estimated in the sources consulted"
      - name: "Local armed groups in Michoacán"
        members:
          - "Groups resisting CJNG in Tierra Caliente (Tepalcatepec, Coalcomán, Apatzingán)"
        backers: []
        leaders: []
        strength: "Not estimated in the sources consulted"
    summary: "Mexico's war against and among drug cartels entered a new phase when the army killed CJNG leader 'El Mencho' on 22 February 2026, setting off about 250 to 280 burning roadblocks across some 20 states. In Sinaloa, the civil war between Los Chapitos and Los Mayos passed two years in September 2026 with about 3,724 murders and about 4,000 people disappeared. Official national homicide figures have nonetheless fallen by roughly half since 2024."
    background: "Mexico has fought organized crime with the armed forces since 2006, and the National Guard created in 2019 was placed under the Defense Ministry by a 2022 reform. Two developments define the current phase. First, in July 2024 Sinaloa Cartel co-founder Ismael 'El Mayo' Zambada was taken to the US, and on 9 September 2024 open war broke out between his faction (Los Mayos) and Los Chapitos, the sons of 'El Chapo' Guzmán, turning Culiacán into a battlefield. Second, the US designated the CJNG and Sinaloa Cartel as terrorist organizations in 2025 and threatened unilateral strikes, which President Sheinbaum has rejected. Since then Mexico has tried to show results on its own terms: transfers of jailed bosses to the US, more troops in hot spots and, in 2026, a raid that killed the country's most wanted man with US intelligence help.\n\nThese dynamics matter beyond Mexico because the CJNG holds the largest share of the US fentanyl and methamphetamine markets, and because the question of whether US forces strike inside Mexico is one of the most consequential security issues in the hemisphere."
    year: "In late 2025 the Sinaloa war ground on, with 1,654 homicides in the state in 2025 against 993 in 2024. In Michoacán, CJNG fought local groups for Tierra Caliente using drone-dropped explosives and buried mines; SEDENA says it has found 625 such devices since November 2025. In January 2026 ten workers from a Canadian mining company disappeared near Concordia, Sinaloa; five bodies were later identified, and the security secretary said they were mistaken for Mayos members.\n\nOn 22 February 2026, Army special forces and paratroopers backed by helicopters raided a gated estate in Tapalpa, Jalisco, using US intelligence. El Mencho was badly wounded and died en route to Mexico City. CJNG responded with about 250 roadblocks of burning vehicles, a car bomb in San Juan de los Lagos that killed an army captain, attacks on National Guard bases and a prison break near Puerto Vallarta. At least 25 National Guard members were killed in the following days; one account puts police and Guard deaths at 50 or more. Most roadblocks were cleared within 48 hours. His stepson 'El Pelón' was reported as the new leader by April, and rival contender 'El Jardinero' was captured on 27 April.\n\nThrough mid-2026 the government reported steep falls in homicides: 42.2 per day in September 2026 against 86.9 in September 2024, the lowest September since 2015. In Sinaloa, however, the war reached its second anniversary on 9 September 2026 with about 3,724 murders, around 4,000 people disappeared and about 7,000 businesses closed."
    situation: "As of late October 2026 Mexico reports its lowest homicide rates in a decade, but the Sinaloa civil war continues at about five killings a day, Sinaloa is the fourth-deadliest state, and Michoacán remains a mined and drone-contested front between CJNG and local groups. The CJNG has not visibly broken apart since El Mencho's death, but its leadership is contested. US pressure for direct action continues; no US strike on Mexican soil was found in the sources consulted."
    technical:
      - "Tapalpa raid, 22 Feb 2026: SEDENA Joint Special Operations Command (FEC), Army Special Forces and the Brigada de Fusileros Paracaidistas, with Air Force and National Guard support; six helicopters pre-positioned, two in direct support; one hit by gunfire and forced down at Sayula (Wikipedia, 2026 Jalisco operation)."
      - "US role: the Joint Interagency Task Force-Counter Cartel (JIATF-CC) provided intelligence, mapped cartel presence and helped plan the Tapalpa raid."
      - "CJNG retaliation: about 250 roadblocks nationwide (Wikipedia) or more than 280 on 24 Feb (LRB), built from hijacked trucks and buses set on fire; about 90 percent cleared by the evening of 23 Feb."
      - "Retaliation weapons: a car bomb in San Juan de los Lagos killed Army Captain Leonel Cardoso Gómez; a vehicle bomb damaged a National Guard base; an armed assault hit the National Guard base at Teocaltiche."
      - "Ixtapa prison (Puerto Vallarta area) assaulted on 22 Feb 2026: 23 inmates freed and a guard killed."
      - "Guanajuato alone recorded more than 70 attacks in 23 municipalities, including arson on Banco del Bienestar branches and Oxxo stores."
      - "Drone warfare: SEDENA logged 16 drone and IED attacks on soldiers from Feb to Oct 2025, mostly in Michoacán; analysts say many go unrecorded (EFE, Feb 2026)."
      - "Mines: SEDENA located 625 'narcominas' and drone-dropped explosives in Michoacán since Nov 2025, linked to the CJNG fight for Tepalcatepec, Coalcomán and Apatzingán (El Imparcial, Jul 2026)."
      - "Seized CJNG 'narconómina' payroll documents list payments to gunmen, lookouts and possibly police; authenticity under investigation by the FGR."
      - "National Guard: about 120,000 personnel, under SEDENA command since a 2022 reform package."
      - "Sinaloa troop surge: 200 elite troops in late 2025, with a reported 1,600 more arriving on 29 Jan 2026 (Expansión Política)."
      - "Homicide data: SESNSP counts 42.2 intentional homicides per day in Sep 2026, down from 86.9 in Sep 2024; seven states (Baja California, Guanajuato, Chihuahua, Sinaloa, Estado de México, Guerrero, Morelos) account for about half (Por Esto, 13 Oct 2026)."
      - "Sinaloa war cost: about 7,000 businesses closed and about 27,000 jobs lost by Sep 2026 (Coparmex Sinaloa via UnoTV)."
    casualties: "Sinaloa civil war: 3,724 intentional homicides in Sinaloa from 9 Sep 2024 to early Sep 2026, about 5.1 per day (UnoTV, citing state security council, prosecutor and Coparmex, 7 Sep 2026); 1,654 in 2025 versus 993 in 2024 (Expansión Política, Feb 2026). Disappeared: about 4,000 in Sinaloa (Coparmex, Sep 2026); 2,320 reported and 1,445 still missing by Feb 2026 (national registry). Post-Mencho wave: at least 25 National Guard killed (Wikipedia, 2026 Jalisco operation); at least 50 police and Guard killed (LRB, Mar 2026); raid itself 7 to 8 CJNG dead and 3 security forces dead (infobox), with unconfirmed reports of higher military losses. National: 42.2 intentional homicides per day in Sep 2026 (SESNSP, preliminary). Homicide counts exclude the disappeared, so the true toll is higher."
    displaced: "Residents have left Sinaloa for Tijuana, Los Cabos, La Paz, Mexico City, Guadalajara and Monterrey, but no total was found (UnoTV, Sep 2026)."
    zones:
      - {name: "Culiacán and central Sinaloa", lat: 24.8091, lng: -107.3940, radius_km: 60, note: "Core battleground of the Chapitos versus Mayos war since Sep 2024; curfews, shootings and disappearances."}
      - {name: "Southern Sinaloa (Concordia and Mazatlán hinterland)", lat: 23.2880, lng: -106.0670, radius_km: 50, note: "Mining-area violence; ten Vizsla Silver workers disappeared in Jan 2026."}
      - {name: "Jalisco: Guadalajara metro and Tapalpa", lat: 20.4500, lng: -103.5500, radius_km: 90, note: "CJNG heartland; site of the El Mencho raid and the worst of the February 2026 roadblocks."}
      - {name: "Michoacán Tierra Caliente", lat: 19.0800, lng: -102.7500, radius_km: 70, note: "CJNG versus local groups around Apatzingán, Tepalcatepec and Coalcomán; drone bombs and buried mines."}
      - {name: "Guanajuato corridor", lat: 20.5235, lng: -100.8157, radius_km: 80, note: "Long the deadliest state; more than 70 attacks after El Mencho's death, though homicides fell sharply in 2026."}
      - {name: "Baja California (Tijuana)", lat: 32.5149, lng: -117.0382, radius_km: 60, note: "State with the largest share of national homicides in Jan to Sep 2026 (8.5 percent)."}
      - {name: "Chihuahua (Ciudad Juárez)", lat: 31.6904, lng: -106.4245, radius_km: 70, note: "Third-highest share of national homicides in Jan to Sep 2026."}
    timeline:
      - {date: "2024-09-09", event: "Open war breaks out between Los Chapitos and Los Mayos in Sinaloa."}
      - {date: "2026-01-23", event: "Ten Vizsla Silver mine workers disappear near Concordia, Sinaloa; five bodies later identified."}
      - {date: "2026-02-22", event: "Army raid in Tapalpa, Jalisco, kills CJNG leader El Mencho; CJNG sets about 250 roadblocks and attacks security forces in multiple states."}
      - {date: "2026-02-24", event: "More than 280 blockades reported across Mexico as violence peaks before subsiding."}
      - {date: "2026-03-18", event: "Wall Street Journal reports El Mencho's stepson Juan Carlos Valencia González has taken over the CJNG."}
      - {date: "2026-04-27", event: "CJNG commander Audias Flores Silva 'El Jardinero' captured."}
      - {date: "2026-09-09", event: "Sinaloa war reaches two years with about 3,724 homicides and around 4,000 disappeared."}
      - {date: "2026-10-13", event: "Government reports 42.2 homicides per day in September 2026, the lowest September since 2015."}
    outlook: "Watch for a CJNG split or an internal purge as the succession settles, and for spillover into Guanajuato, Zacatecas and Colima. In Sinaloa, look for a decisive win by one faction or another high-level arrest. Spread of drone bombs and mines in Michoacán is the main tactical trend. The biggest wildcard is US action: Washington has designated both cartels as terrorist organizations and could push for direct strikes, which Mexico's government rejects."
    sources:
