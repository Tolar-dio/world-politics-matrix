      - {label: "Local10 (AP): ELN claims car bomb attack on police station (2 Sep 2026)", url: "https://www.local10.com/espanol/2026/09/02/guerrilla-eln-se-atribuye-ataque-con-carro-bomba-contra-una-estacion-de-policia-en-colombia/"}
      - {label: "Publimetro: Five ELN members killed in Bolívar (15 Sep 2026)", url: "https://www.publimetro.co/noticias/2026/09/15/de-la-espriella-reporto-fuerte-golpe-al-eln-en-bolivar-cinco-integrantes-murieron-en-combate-con-el-ejercito/"}
      - {label: "Noticias RCN: Catatumbo completes 18 months of war between ELN and dissidents (16 Jul 2026)", url: "https://www.noticiasrcn.com/colombia/catatumbo-18-meses-de-guerra-entre-eln-y-disidencias-1041286"}
      - {label: "El Universal: Crisis en Catatumbo, 293 familias desplazadas (3 Jun 2026)", url: "https://www.eluniversal.com.co/colombia/2026/06/03/crisis-en-catatumbo-293-familias-desplazadas-por-combates-entre-el-eln-y-disidencias-de-las-farc/"}
      - {label: "Vanguardia: Military justice opens inquiry into Guaviare bombing that killed 7 minors (17 Nov 2025)", url: "https://www.vanguardia.com/colombia/2025/11/17/justicia-penal-militar-abre-indagacion-por-bombardeo-en-guaviare-que-dejo-7-menores-muertos/"}
