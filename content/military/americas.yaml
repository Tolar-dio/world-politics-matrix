  - id: haiti-gang-war
    name: "Haiti's gang war (Viv Ansanm versus the state and the Gang Suppression Force)"
    type: criminal
    intensity: high
    status: active
    started: "2024-02-29 (formation of the Viv Ansanm gang coalition)"
    countries: [HTI]
    sides:
      - name: "Haitian state and allied forces"
        members:
          - "Haitian National Police, including a task force using explosive and FPV drones"
          - "Armed Forces of Haiti (FAd'H)"
          - "Vectus Global (US private military company led by Erik Prince, supporting drone operations)"
          - "Gang Suppression Force (UN-authorized, successor to the Kenyan-led Multinational Security Support mission)"
        backers:
          - "United States (funding pledges of about 300 million US dollars and terrorist designation of gangs)"
          - "Canada (funding)"
          - "Chad, Sri Lanka, Bangladesh, Guatemala, El Salvador, Jamaica, Bahamas, Belize (troop and police contributors)"
        leaders:
          - "Maj. Gen. Erdenebat Batsuuri (Mongolia), GSF force commander since Apr 2026"
          - "Brig. E. C. Clarke (Jamaica Defence Force), GSF deputy commander since Jun 2026"
        strength: "GSF authorized at 5,500; about 1,441 non-Chadian personnel listed plus an initial 400 Chadian troops from 1 Apr 2026, with about 1,500 Chadians expected (Wikipedia, Gang Suppression Force, Oct 2026)"
      - name: "Viv Ansanm gang coalition"
        members:
          - "G9 Family and Allies"
          - "G-Pèp"
          - "5 Segonn"
          - "Gran Grif (Artibonite)"
          - "Bel Air gang"
        backers: []
        leaders:
          - "Jimmy 'Barbecue' Chérizier (founder and spokesman)"
          - "Johnson André (5 Segonn)"
          - "Kempes Sanon (Bel Air)"
        strength: "12,000 to 20,000 members, controlling about 80 percent of metropolitan Port-au-Prince (Wikipedia, Viv Ansanm, 2026 estimate)"
      - name: "Self-defence groups"
        members:
          - "Neighbourhood vigilante groups and the 'Bwa Kalé' movement"
        backers: []
        leaders: []
        strength: "Unknown; responsible for about 4 to 6 percent of casualties (BINUH)"
    summary: "Haiti's armed gangs, united since 2024 in the Viv Ansanm coalition, control most of Port-au-Prince and are expanding into the Artibonite and Centre departments. More than 5,915 people were killed in 2025 and over 3,000 in the first half of 2026, many of them in government operations using explosive drones with help from a US private military company. A UN-authorized Gang Suppression Force began deploying in April 2026, and nearly 1.5 million Haitians are displaced."
    background: "Haiti's state has been weakening for years. On 29 February 2024 rival gang federations G9 and G-Pèp joined forces as Viv Ansanm ('Living Together') and went on to take control of most of the capital. A Kenyan-led Multinational Security Support mission, authorized by the UN in 2023, arrived in 2024 but lacked troops, money and equipment.\n\nIn 2025 the government turned to explosive drones operated with the help of Vectus Global, a firm led by Blackwater founder Erik Prince, and the US designated Viv Ansanm a terrorist organization. In late 2025 the UN Security Council (Resolution 2793) replaced the Kenyan mission with a larger Gang Suppression Force of up to 5,500 personnel. These choices matter because they shape who is doing the killing: in some quarters most of the dead were killed in state operations rather than by gangs."
    year: "In the last quarter of 2025 the UN recorded 1,523 killings, bringing 2025 to more than 5,915. Drone use nearly doubled between November 2025 and January 2026; Human Rights Watch counted 1,243 people killed by drones between March 2025 and January 2026, including 17 children. On 14 January 2026 FPV drones destroyed three homes belonging to gang leader Jimmy Chérizier, who survived. In the first quarter of 2026, 1,642 people were killed, more than 69 percent of casualties occurring during security operations. Police retook the Carrefour Aéroport area in February, but gangs struck back in the countryside: on 29 to 31 March they attacked 16 localities around the capital and in Lower Artibonite, killing at least 83, and Gran Grif attacks in Artibonite killed at least 70 more.\n\nThe first 400 Chadian troops of the Gang Suppression Force arrived on 1 April 2026 as Kenyan police withdrew. In the second quarter, 1,408 people were killed; this time gangs caused 55 percent of casualties, with clashes between rival gangs in Cité Soleil and the Plaine du Cul-de-Sac killing 463 people and displacing more than 18,000. Gangs carried out their first raids in Séguin, in the South-East. In September the IOM counted nearly 1.5 million displaced. Sri Lankan and Bangladeshi contingents began arriving in October 2026, and on 18 October gangs destroyed a GSF armoured vehicle with explosives in Croix-des-Bouquets and took four Salvadoran air force technicians hostage."
    situation: "As of late October 2026 Viv Ansanm still controls most of Port-au-Prince and is pushing into Artibonite, Centre and the hills south of the capital, while drone strikes and police operations have contained it in parts of downtown, Delmas and Tabarre. The Gang Suppression Force is still building up toward its 5,500 ceiling and has just suffered its first major ambush. Its initial mandate ran to the end of September 2026 and it has asked for an extension to September 2028; whether and how it was renewed was not confirmed in the sources consulted."
    technical:
      - "Explosive drones: HRW counts 1,243 killed and 738 injured by drone strikes between Mar 2025 and 21 Jan 2026, including 60 civilians (17 children); operations nearly doubled from Nov 2025 to Jan 2026 (Reuters via Chronicle.lu)."
      - "Drone operators: Haitian security forces with support from Vectus Global, a US private military company led by Erik Prince; the UN human rights chief called the strikes disproportionate and likely unlawful in Oct 2025."
      - "FPV drones were used on 14 Jan 2026 to destroy three homes of Viv Ansanm leader Jimmy Chérizier (Wikipedia, Viv Ansanm)."
      - "Share of casualties caused by security operations: over 62 percent in Q4 2025, over 69 percent in Q1 2026, over 40 percent in Q2 2026 (BINUH quarterly reports)."
      - "Drone civilian harm in Q1 2026: 69 civilians among drone victims, including 5 children; two girls aged 7 and 9 badly injured when a drone fell in a courtyard in Martissant (BINUH)."
      - "GSF composition (Oct 2026): Sri Lanka 1,132, Guatemala 150 military police, El Salvador 78 air force personnel, Bangladesh 50, Jamaica 23, Bahamas 6, Belize 2, plus Chad (400 from 1 Apr 2026, about 1,500 expected); Kenyan police withdrawn (Wikipedia, Gang Suppression Force)."
      - "Chadian troops trained in the US before deploying and are based at the Vertières military base of the Haitian army (NTV Kenya/Reuters; Wikipedia)."
      - "GSF ambush, 18 Oct 2026: gangs destroyed an armoured vehicle with explosives in Croix-des-Bouquets and seized four Salvadoran air force technicians."
      - "Viv Ansanm strength: 12,000 to 20,000 members, controlling about 80 percent of metropolitan Port-au-Prince (Wikipedia, 2026 estimate)."
      - "Gang sexual violence: at least 796 rape victims in Q2 2026, 87 percent subjected to gang rape (BINUH)."
      - "Kidnappings: at least 81 in Q2 2026, up from 57 in Q1 (BINUH)."
      - "Police abuses: more than 222 people believed killed in summary executions involving police in 2025 (BINUH Q4 2025)."
      - "Funding gap: the predecessor mission received 85 million US dollars against an estimated annual need of 600 million (Wikipedia, Gang Suppression Force)."
    casualties: "2025: more than 5,915 killed and 2,708 injured (BINUH, 30 Jan 2026). Q1 2026: at least 1,642 killed and 745 injured (BINUH, 8 May 2026). Q2 2026: at least 1,408 killed and 656 injured (BINUH, 25 Aug 2026). That is at least 3,050 killed in the first half of 2026. Drone strikes: 1,243 killed, Mar 2025 to Jan 2026 (Human Rights Watch, 10 Mar 2026). UN figures are minimums based on verified cases."
    displaced: "Nearly 1.5 million internally displaced, about 80 percent outside Port-au-Prince, with the sharpest recent rise in Artibonite (IOM via Reuters, 25 Sep 2026); more than 18,000 fled Cité Soleil and Plaine du Cul-de-Sac clashes in Q2 2026 (BINUH); more than 4,000 displaced by attacks in Kenscoff (IOM via Reuters)."
    zones:
      - {name: "Port-au-Prince metropolitan area", lat: 18.5944, lng: -72.3074, radius_km: 20, note: "About 80 percent under Viv Ansanm control; drone strikes and police operations in downtown, Delmas and Tabarre."}
      - {name: "Cité Soleil and Plaine du Cul-de-Sac", lat: 18.5900, lng: -72.2200, radius_km: 15, note: "Rival gang clashes killed 463 people in Apr to Jun 2026; GSF ambush at Croix-des-Bouquets in Oct 2026."}
      - {name: "Kenscoff and the southern hills", lat: 18.4500, lng: -72.2830, radius_km: 12, note: "Gang push into the hills above the capital; more than 4,000 displaced."}
      - {name: "Artibonite department", lat: 19.1500, lng: -72.5500, radius_km: 50, note: "Gran Grif and allied gangs attack towns and farms; the fastest-growing displacement."}
      - {name: "Centre department (Mirebalais, Saut-d'Eau)", lat: 18.8350, lng: -72.1050, radius_km: 30, note: "Gangs keep a foothold after storming Mirebalais in 2025."}
      - {name: "South-East (Séguin)", lat: 18.3300, lng: -72.2300, radius_km: 15, note: "First armed gang raids recorded in Q2 2026."}
    timeline:
      - {date: "2024-02-29", event: "Rival gang federations G9 and G-Pèp form the Viv Ansanm coalition."}
      - {date: "2026-01-30", event: "UN reports more than 5,915 people killed in Haiti during 2025."}
      - {date: "2026-01-14", event: "FPV drones destroy three homes of gang leader Jimmy Chérizier."}
      - {date: "2026-03-10", event: "Human Rights Watch reports 1,243 people killed by drone strikes since March 2025."}
      - {date: "2026-03-29", event: "Gangs attack 16 localities on the capital's outskirts and in Lower Artibonite over three days, killing at least 83."}
      - {date: "2026-04-01", event: "First 400 Chadian troops of the Gang Suppression Force arrive."}
      - {date: "2026-08-25", event: "UN reports 1,408 killed in Apr to Jun 2026, including 463 in Cité Soleil and Plaine du Cul-de-Sac clashes."}
      - {date: "2026-09-25", event: "IOM reports nearly 1.5 million displaced."}
      - {date: "2026-10-18", event: "Gangs destroy a GSF armoured vehicle in Croix-des-Bouquets and take four Salvadoran airmen hostage."}
    outlook: "Watch whether the GSF reaches strength and moves from defending fixed sites to clearing gang strongholds, the fate of the Salvadoran hostages, the renewal and funding of the GSF mandate, the civilian toll of drone strikes, and further gang expansion into Artibonite, Centre and the South-East."
    sources:
      - {label: "BINUH: Quarterly human rights report Q4 2025 (30 Jan 2026)", url: "https://binuh.unmissions.org/en/node/133847"}
      - {label: "BINUH: Quarterly human rights report Q1 2026 (8 May 2026)", url: "https://binuh.unmissions.org/en/node/135338"}
      - {label: "BINUH: Quarterly human rights report Q2 2026 (25 Aug 2026)", url: "https://binuh.unmissions.org/en/node/136551"}
      - {label: "Reuters via Chronicle.lu: Hundreds killed in Haiti drone strikes including 60 civilians (10 Mar 2026)", url: "https://chronicle.lu/category/international-news/60001-hundreds-killed-in-haiti-drone-strikes-including-60-civilians"}
      - {label: "Reuters via ThePrint: Nearly 1.5 million displaced in Haiti as violence spreads, UN says (25 Sep 2026)", url: "https://theprint.in/world/nearly-1-5-million-displaced-in-haiti-as-violence-spreads-un-says/3053711/"}
      - {label: "Wikipedia: Gang Suppression Force", url: "https://en.wikipedia.org/wiki/Gang_Suppression_Force"}
      - {label: "Wikipedia: Viv Ansanm", url: "https://en.wikipedia.org/wiki/Viv_Ansanm"}
      - {label: "NTV Kenya (Reuters): Chad to gradually replace Kenyan force in Haiti through October (17 Mar 2026)", url: "https://ntvkenya.co.ke/news/chad-to-gradually-replace-kenyan-force-in-haiti-through-october-dominican-republic-says/"}
  - id: brazil-rio-faction-war
    name: "Rio de Janeiro police war against Comando Vermelho"
    type: criminal
    intensity: medium
    status: active
    started: "2025-10-28 (Operation Containment, the deadliest police operation in Brazil's history)"
    countries: [BRA]
    sides:
      - name: "Rio de Janeiro state security forces"
        members:
          - "Military Police, including the Special Operations Battalion (BOPE)"
          - "Civil Police, including its special operations unit (CORE)"
          - "National Public Security Force (armoured vehicles)"
        backers: []
        leaders:
          - "Cláudio Castro (Governor of Rio de Janeiro state)"
          - "Marcelo Menezes Nogueira (Military Police commander)"
        strength: "About 2,500 police committed to Operation Containment (Wikipedia, Operation Containment)"
      - name: "Comando Vermelho (CV)"
        members:
          - "CV-controlled favela complexes in Rio's North Zone and centre"
        backers: []
        leaders:
          - "Edgard Alves de Andrade 'Doca' (main leader, escaped Oct 2025 operation)"
        strength: "Not estimated in the sources consulted"
    summary: "Rio de Janeiro's state police are waging large armed raids on favelas controlled by the Comando Vermelho, Brazil's oldest criminal faction. Operation Containment on 28 October 2025 left between about 121 and 132 dead, the highest toll of any police operation in Brazil's history, and big raids continued in 2026. Supporters see the raids as reclaiming territory; critics, including the UN rights office and President Lula, see massacres."
    background: "The Comando Vermelho controls dozens of favelas in Rio and has spread to other states, financed by drugs, extortion and control of local services. Rio's police have long relied on military-style incursions with armoured vehicles and helicopters, which produce high death tolls and periodic court-imposed limits. The debate matters nationally: the federal government favours a constitutional reform of public security, the US is weighing whether to designate the CV and the PCC as terrorist organizations, and Lula's government is lobbying against that designation."
    year: "On 28 October 2025 about 2,500 police with 32 armoured vehicles, BOPE demolition vehicles and two helicopters moved into the Alemão and Penha complexes and 26 surrounding communities. The CV answered with barricades, drones dropping bombs on special forces teams, and 71 hijacked buses used to block expressways. Residents recovered at least 70 bodies from woods near Penha the next morning. Police counted 117 suspects and 4 officers dead; the public defender counted 132. Police seized 93 rifles and about a tonne of drugs and arrested 133 people, but CV leader 'Doca' escaped and, per Reuters, none of the wanted men were killed.\n\nThe Supreme Court demanded explanations and the Senate opened an inquiry into organized crime. Raids continued: on 18 March 2026, about 150 BOPE officers in Santa Teresa killed at least eight people, including senior CV figure Claudio Augusto dos Santos and a resident taken hostage, and detained 116; a bus was burned in retaliation. In August 2026 another Military Police operation against the CV left four dead and 13 arrested."
    situation: "As of late October 2026 the CV retains its core territories, and Rio's police continue periodic large raids. The October 2025 operation remains under judicial and parliamentary scrutiny, and the question of US terrorist designations for Brazilian factions remains open."
    technical:
      - "Operation Containment force: about 2,500 police, 32 armoured vehicles from the National Public Security Force, 12 BOPE demolition vehicles, 2 helicopters, plus all specialized Civil Police units (Wikipedia)."
      - "CV tactics: burning barricades, drones dropping explosives on BOPE and CORE teams, and 71 hijacked buses blocking Avenida Brasil and the Yellow and Red Lines."
      - "Seizures: 93 rifles, some linked to the armies of Venezuela, Argentina, Peru and Brazil, and about one tonne of drugs."
      - "Police losses: five officers killed (2 BOPE, 3 CORE) and 13 injured per Wikipedia's account; other counts give four police dead."
      - "Of 115 dead identified by police, 108 had proven CV links and 59 had arrest warrants; Reuters found only five of 69 wanted men among those arrested and none among the dead."
      - "Santa Teresa raid, 18 Mar 2026: about 150 BOPE officers with two armoured vehicles; 21 weapons, 105 kg of cocaine and 611 kg of marijuana seized (Última Hora)."
      - "Federal response: at least ten CV leaders moved to federal prisons after Oct 2025; a Senate inquiry into organized crime from Nov 2025."
      - "Public opinion was split from official criticism: an AtlasIntel poll found 87.6 percent of Rio favela residents supported Operation Containment, while President Lula and the UN human rights office condemned it (Wikipedia; Última Hora)."
      - "Regional spillover: Argentina labelled the CV and PCC terrorist groups and raised its border alert, and Paraguay reinforced its border after the operation (Wikipedia)."
    casualties: "Operation Containment, 28 Oct 2025: 117 suspects and 4 police dead per police (Wikipedia infobox), with other counts of 122 (police, later) and 132 (public defender, 128 civilians plus 4 police). Santa Teresa, 18 Mar 2026: at least 8 dead (Última Hora). Aug 2026 operation: 4 dead (Agência Brasil headline). No 12-month statewide total of deaths in police operations was found."
    displaced: "No displacement figures found."
    zones:
      - {name: "Complexo do Alemão and Complexo da Penha", lat: -22.8510, lng: -43.2730, radius_km: 4, note: "CV stronghold in Rio's North Zone; site of Operation Containment."}
      - {name: "Santa Teresa and central Rio favelas", lat: -22.9200, lng: -43.1880, radius_km: 3, note: "BOPE raid of 18 Mar 2026."}
    timeline:
      - {date: "2025-10-28", event: "Operation Containment in the Alemão and Penha complexes leaves about 121 to 132 dead."}
      - {date: "2025-11-04", event: "Senate inquiry into organized crime scheduled to begin."}
      - {date: "2026-03-18", event: "BOPE raid in Santa Teresa kills at least 8, including a senior CV figure."}
    outlook: "Watch for further mega-operations, court rulings on police lethality, and whether the US designates the CV and PCC as terrorist organizations, which would pull Brazil into Washington's regional 'narco-terrorism' framework."
    sources:
      - {label: "Wikipedia: Operation Containment", url: "https://en.wikipedia.org/wiki/Operation_Containment"}
      - {label: "Última Hora: Figura clave del Comando Vermelho muere en operación policial en Río de Janeiro (18 Mar 2026)", url: "https://www.ultimahora.com/figura-clave-del-comando-vermelho-muere-en-operacion-policial-realizado-en-rio-de-janeiro"}
      - {label: "Agência Brasil: PM do RJ prende 13 em ação contra Comando Vermelho; 4 morreram (Aug 2026)", url: "https://agenciabrasil.ebc.com.br/geral/noticia/2026-08/pm-do-rj-prende-13-em-acao-contra-comando-vermelho-4-morreram"}
  - id: guatemala-gang-violence
    name: "Guatemala's confrontation with Barrio 18 and MS-13"
    type: criminal
    intensity: medium
    status: active
    started: "2026-01-17 (Barrio 18 prison riots and coordinated killings of police)"
    countries: [GTM]
    sides:
      - name: "Guatemalan state"
        members:
          - "National Civil Police (PNC)"
          - "Guatemalan Army"
          - "Prison system"
        backers: []
        leaders:
          - "Bernardo Arévalo (President)"
          - "Henry Sáenz (Defence Minister)"
          - "Marco Antonio Villeda (Interior Minister)"
        strength: "Not given in the sources consulted"
      - name: "Street gangs"
        members:
          - "Barrio 18"
          - "Mara Salvatrucha (MS-13)"
        backers: []
        leaders:
          - "Aldo Dupie 'El Lobo' (alleged Barrio 18 leader, in custody)"
        strength: "Not estimated in the sources consulted"
    summary: "In January 2026 Barrio 18 members took 46 hostages in three prisons and killed police officers in and around Guatemala City, prompting a 30-day nationwide state of siege. By late July 2026, 20 police officers had been killed on duty that year, double the total for 2025, half of them in gang attacks."
    background: "Guatemala's Barrio 18 and MS-13 gangs run extortion and contract-killing rackets from inside prisons. The US and Guatemala classify both as terrorist organizations. Prison control is the main flashpoint: earlier escapes of 20 Barrio 18 leaders from prison exposed the state's weakness, and transfers of gang leaders to tighter prisons provoke violent pushback."
    year: "On 17 January 2026 gang members rioted in Renovación I (Escuintla), Fraijanes II and Preventivo prisons, holding 46 people hostage to demand transfers of their leaders to lower-security prisons. Coordinated attacks in the capital and nearby towns killed eight police officers (later reported as 11) and injured ten. On 18 January President Arévalo declared a 30-day nationwide state of siege; police retook Renovación I with armoured vehicles and tear gas in about 15 minutes and freed all hostages. Killings of police continued through the year, reaching 20 by 27 July 2026."
    situation: "As of late October 2026 the army remains deployed in the streets and police remain targets; homicides showed a 'rebound' by mid-2026 according to local media, but no consolidated national figures were found."
    technical:
      - "Prison riots, 17 to 18 Jan 2026: 46 hostages across three prisons; Renovación I retaken in about 15 minutes with armoured vehicles and tear gas; 9 guards freed there, 28 people at Fraijanes II and 9 at Preventivo (El País Cali/AFP)."
      - "State of siege: 30 days, nationwide, suspending rights of assembly and allowing detention without a court order; required congressional ratification."
      - "Police deaths: 20 PNC officers killed on duty by 27 Jul 2026, against 10 in all of 2025; half attributed to gangs (Interior Minister Villeda via EFE)."
      - "Prison escapes: 20 Barrio 18 leaders had escaped prison before the riots; 6 were recaptured and 1 shot dead by mid-January (AFP)."
      - "Alleged Barrio 18 leader Aldo Dupie 'El Lobo' was presented in custody after the attacks; investigators link the police killings to retaliation for the state retaking the prisons (AFP; EFE)."
      - "Defence Minister Henry Sáenz said the army would stay in the streets under the state of siege (AFP)."
    casualties: "At least 8 police killed on 17 to 18 Jan 2026 (AFP), later reported as 11 in the Jan to Feb attacks; 20 police killed by 27 Jul 2026 (EFE via El Nuevo Diario). National homicide totals for 2026 were not found."
    displaced: "No displacement figures found."
    zones:
      - {name: "Guatemala City metropolitan area", lat: 14.6349, lng: -90.5069, radius_km: 25, note: "Gang extortion and killings of police; Fraijanes II and Preventivo prisons."}
      - {name: "Escuintla (Renovación I prison)", lat: 14.3000, lng: -90.7850, radius_km: 10, note: "Maximum-security prison riot in Jan 2026."}
    timeline:
      - {date: "2026-01-17", event: "Barrio 18 riots in three prisons and coordinated attacks kill at least 8 police."}
      - {date: "2026-01-18", event: "President Arévalo declares a 30-day nationwide state of siege."}
      - {date: "2026-07-27", event: "Police deaths in 2026 reach 20, double the 2025 total."}
    outlook: "Watch prison transfers of gang leaders, which have triggered violence before, renewals of emergency measures, and whether Guatemala adopts harsher detention and emergency policies."
    sources:
      - {label: "El País (Cali)/AFP: Guatemala decreta estado de sitio tras asesinato de policías y motines en cárceles (19 Jan 2026)", url: "https://www.elpais.com.co/mundo/guatemala-decreta-estado-de-sitio-tras-asesinato-de-policias-y-motines-en-carceles-1800.html"}
      - {label: "El Nuevo Diario/EFE: Guatemala registra 20 policías asesinados en servicio durante 2026 (27 Jul 2026)", url: "https://elnuevodiario.com.do/guatemala-registra-20-policias-asesinados-en-servicio-durante-2026-en-medio-del-repunte-de-violencia/"}
battles:
  - id: southern-caribbean-boat-strikes
    name: "US strikes on alleged drug boats in the southern Caribbean"
    conflict: us-caribbean-narco-campaign
    tier: major
    start: "2025-09-02"
    end: "ongoing"
    place: "International waters of the southern Caribbean, off Venezuela and Trinidad and Tobago"
    lat: 11.8
    lng: -64.5
    sides: ["United States (Southern Command)", "Crews of alleged drug-smuggling boats"]
    outcome: "Ongoing campaign of lethal strikes; the first strikes of Sep 2025 took place here, and strikes resumed here in Sep to Oct 2026, including one on 4 Oct 2026 that killed four."
    forces: "Ships and aircraft of Joint Task Force Southern Spear; Southcom does not disclose which platform conducts each strike. Position approximate, as Southcom rarely gives locations."
    losses: "First strike on 2 Sep 2025 killed 11, including two survivors hit by a follow-on strike (CBS News; WaPo via CBS/Airwars); 4 killed on 4 Oct 2026 (AIR). Campaign-wide total: 238 killed in 79 strikes by 5 Oct 2026 (InSight Crime)."
    significance: "Opened a new kind of US military campaign, treating drug smuggling as an armed attack and smugglers as combatants, without congressional authorization; its legality is contested in US courts and by rights groups."
    sources:
      - {label: "InSight Crime: Mapping Out US Alleged Drug Boat Strikes", url: "https://insightcrime.org/news/mapping-out-us-alleged-drug-boat-strikes/"}
      - {label: "CBS News: Trump tells Congress US is in armed conflict with drug cartels", url: "https://www.cbsnews.com/amp/news/trump-tells-congress-armed-conflict-drug-cartels-venezuela-boat-strikes"}
      - {label: "AIR/newsonair: US strike kills four in Caribbean Sea (5 Oct 2026)", url: "https://newsonair.gov.in/us-military-strike-on-suspected-drug-smuggling-boat-kills-four-in-caribbean-sea/"}
  - id: eastern-pacific-boat-strikes
    name: "US strikes on alleged drug boats in the eastern Pacific"
    conflict: us-caribbean-narco-campaign
    tier: major
    start: "2025-10-21"
    end: "ongoing"
    place: "International waters of the eastern Pacific, off Colombia, Ecuador and Central America"
    lat: 6.0
    lng: -84.0
    sides: ["United States (Southern Command)", "Crews of alleged drug-smuggling boats and semi-submersibles"]
    outcome: "Ongoing; since late October 2025 most strikes in the campaign have taken place in the eastern Pacific (InSight Crime). Start date approximate."
    forces: "Ships and aircraft of Joint Task Force Southern Spear, with surveillance and maritime patrol aircraft such as the P-8A; individual strike platforms undisclosed. Position approximate."
    losses: "Majority of the 238 killed in 79 strikes by 5 Oct 2026 (InSight Crime); at least 22 people campaign-wide survived an initial strike but were hit again or died at sea; two survivors of a strike on a semi-submersible were repatriated to Ecuador and Colombia in Oct 2025 (CBS via Airwars)."
    significance: "Shifted the campaign from pressure on Venezuela to a region-wide counter-narcotics strike campaign along cocaine routes from Colombia and Ecuador."
    sources:
