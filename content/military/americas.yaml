  - id: ecuador-gang-war
    name: "Ecuador's war on gangs and the Colombia border dispute"
    type: criminal
    intensity: high
    status: active
    started: "2024-01-09 (President Noboa declares an 'internal armed conflict' against criminal groups)"
    countries: [ECU, COL, USA]
    sides:
      - name: "Ecuadorian state"
        members:
          - "Armed Forces of Ecuador (army, navy, air force)"
          - "National Police"
        backers:
          - "United States (intelligence sharing and joint 'lethal kinetic operations' from Mar 2026)"
        leaders:
          - "Daniel Noboa (President)"
        strength: "Not given in the sources consulted"
      - name: "Ecuadorian gangs designated as 'terrorist' groups"
        members:
          - "Los Choneros"
          - "Los Lobos"
          - "Other local gangs in Guayas, Los Ríos, Manabí and El Oro"
        backers: []
        leaders:
          - "Adolfo Macías 'Fito' (Los Choneros, extradited to the US)"
          - "Wilmer Chavarría 'Pipo' (Los Lobos, detained)"
        strength: "Not estimated in the sources consulted"
      - name: "Comandos de la Frontera (CDF)"
        members:
          - "Colombian FARC dissident group operating on both sides of the Putumayo border"
        backers: []
        leaders:
          - "Johnathan Alfredy Tole Collazos 'Mono Tole' (commander linked to the bombed camp)"
        strength: "Not estimated; one bombed camp could hold about 50 fighters (Ecuador Defence Ministry via AP)"
    summary: "Ecuador, once one of South America's safer countries, recorded 8,847 homicides in 2025, its deadliest year, as gangs fought over cocaine export routes through its Pacific ports. Homicides fell 6.4 percent in January to August 2026, mainly in Guayaquil, while violence spread to Machala and dozens of smaller cantons. From March 2026 US forces joined Ecuadorian strikes on Colombian guerrilla-trafficker camps on the border, feeding a tariff war and a war of words with Colombia."
    background: "Ecuador borders Colombia, the world's largest cocaine producer, and its Pacific ports, above all Guayaquil, became major exit points for cocaine. Gangs such as Los Choneros and Los Lobos, the country's two largest, fought for control of prisons, ports and neighbourhoods. In early 2024 President Daniel Noboa declared an 'internal armed conflict' and labelled the gangs terrorists, giving the military a lead role. Despite this, homicides rose to a record in 2025.\n\nThe Colombian border in Sucumbíos and Carchi is home to Colombian armed groups such as the Comandos de la Frontera. Noboa blamed Colombia for not controlling it, which is why the security relationship turned into a trade dispute in 2026."
    year: "Violence peaked in 2025: by 19 December police counted 8,847 homicides, with Guayas province accounting for nearly half, and May the worst month. A state of exception covered Guayas, Los Ríos, Manabí and El Oro from November 2025. In January 2026 Noboa imposed a 30 percent 'security' tariff on Colombian imports, raised to 50 percent from 1 March.\n\nOn 3 March 2026 Ecuadorian aircraft, helicopters, river boats and drones, with US intelligence, bombed a Comandos de la Frontera camp in Santa Rosa, Cascales canton, Sucumbíos. US Southern Command called the operation 'Exterminio Total' a success and the start of Ecuador's 'lethal kinetic operations'; the Pentagon said US forces acted at Ecuador's request. No casualties were disclosed. On 17 March Colombian President Petro accused Ecuador of bombing near the border and said 27 charred bodies had been found; Noboa said Ecuador acted only on its own territory. In April Ecuador recalled its ambassador and raised the tariff to 100 percent, Colombia cut electricity sales, and Petro later walked back his own retaliatory tariffs.\n\nFrom January to August 2026 national homicides fell to 5,676 from 6,067 a year earlier. Guayaquil fell 18 percent and Durán 42 percent, but Machala nearly doubled and 81 cantons saw increases."
    situation: "As of late October 2026 Ecuador is still one of the most violent countries in Latin America, but national homicides are running slightly below 2025 levels. Violence is shifting from Guayaquil toward El Oro, Manabí and smaller towns. Joint operations with the US continue under the 'armed conflict' framework, and relations with Colombia are likely easier under President de la Espriella, though the sources consulted do not confirm current tariff levels."
    technical:
      - "Legal framework: 'internal armed conflict' decree of early 2024 lets the military act against gangs designated as terrorist groups (El Oriente)."
      - "Joint US operation, 3 Mar 2026: Comandos de la Frontera camp (capacity about 50) in Santa Rosa parish, Cascales canton, Sucumbíos, bombed after US intelligence sharing; SOUTHCOM called operation 'Exterminio Total' a success (Primicias)."
      - "Assets used against the camp: helicopters, fixed-wing aircraft, river boats and drones; the Pentagon described the action as 'lethal kinetic operations' at Ecuador's request (AP, 8 Mar 2026)."
      - "A similar joint operation was announced by SOUTHCOM the week before the 6 Mar announcement (AP); Wikipedia dates US forces joining Ecuadorian operations to 6 Mar; sources differ on dates."
      - "States of exception: Guayas, Los Ríos, Manabí and El Oro from early Nov 2025; another decree on 2 Jan 2026 covered 9 provinces and 3 municipalities (El Oriente)."
      - "Leadership decapitation: Los Choneros leader 'Fito' extradited to the US; Los Lobos leader 'Pipo' detained (El Oriente)."
      - "Geography of homicides 2025: Guayas 3,771 of 8,393 through November; Los Ríos 1,167; Manabí 1,162; El Oro 708 (El Oriente)."
      - "Shift in 2026: Guayaquil down 18 percent and Durán down 41.8 percent in Jan to Aug, but Machala up from 207 to 367 and increases in 81 cantons (Primicias)."
      - "Tariff escalation on Colombia: 30 percent (announced Jan 2026), 50 percent (1 Mar), 100 percent (announced 9 Apr, effective 1 May); Colombia suspended cross-border electricity sales (Al Jazeera)."
      - "ACLED expected Ecuador to have Latin America's highest homicide rate for a third straight year in 2025 (El Oriente)."
    casualties: "Homicides: 8,847 in 2025 to 19 Dec (National Police commander Pablo Dávila via El Oriente), against 7,063 in 2024 and 8,248 in 2023; 5,676 in Jan to Aug 2026, down 6.4 percent (Ministry data via Primicias, 22 Sep 2026). Casualties of joint US-Ecuador strikes were not disclosed. Colombia reported 27 charred bodies near the border in Mar 2026, cause and identity unconfirmed (Al Jazeera)."
    displaced: "No national displacement figure found in the sources consulted."
    zones:
      - {name: "Guayaquil and Durán", lat: -2.1710, lng: -79.9000, radius_km: 30, note: "Main cocaine port and the centre of gang warfare; homicides fell in 2026 but remain the highest in absolute terms."}
      - {name: "Los Ríos province", lat: -1.4000, lng: -79.5000, radius_km: 60, note: "Inland transit province with over 1,100 homicides in 2025."}
      - {name: "Manabí coast (Manta, Portoviejo)", lat: -1.0500, lng: -80.4500, radius_km: 70, note: "Fishing ports used for cocaine shipments; about 839 homicides in Jan to Aug 2026."}
      - {name: "El Oro (Machala)", lat: -3.2581, lng: -79.9554, radius_km: 40, note: "Fastest-rising violence in 2026, with Machala homicides up from 207 to 367."}
      - {name: "Esmeraldas", lat: 0.9682, lng: -79.6517, radius_km: 50, note: "Northern coastal province near Colombia; 228 homicides in Jan to Aug 2026."}
      - {name: "Sucumbíos and the Colombian border", lat: 0.1500, lng: -77.2000, radius_km: 60, note: "Comandos de la Frontera camps; joint Ecuador-US air strikes from Mar 2026."}
    timeline:
      - {date: "2024-01-09", event: "Noboa declares an 'internal armed conflict' against gangs designated as terrorists."}
      - {date: "2025-12-19", event: "Police count 8,847 homicides for 2025 so far, a national record."}
      - {date: "2026-03-01", event: "Ecuador's tariff on Colombian goods rises to 50 percent."}
      - {date: "2026-03-03", event: "Ecuador, with US intelligence and support, bombs a Comandos de la Frontera camp in Sucumbíos ('Exterminio Total')."}
      - {date: "2026-03-17", event: "Petro accuses Ecuador of bombing near the border and reports 27 charred bodies."}
      - {date: "2026-04-08", event: "Ecuador recalls its ambassador from Colombia."}
      - {date: "2026-04-09", event: "Ecuador raises the tariff on Colombian goods to 100 percent from 1 May; Colombia suspends electricity sales."}
      - {date: "2026-09-22", event: "Data show homicides down 6.4 percent in Jan to Aug 2026, with sharp falls in Guayaquil and Durán but rises in Machala."}
    outlook: "Watch whether the decline in Guayaquil holds or simply displaces violence to El Oro, Manabí and Esmeraldas, whether joint US strikes expand from the border to coastal gang targets, and whether Ecuador and de la Espriella's Colombia formally end the tariff war and coordinate on the border."
    sources:
      - {label: "El Oriente: Ecuador cierra 2025 como su año más violento", url: "https://www.eloriente.com/articulo/ecuador-cierra-2025-como-su-ano-mas-violento-golpeado-por-el-avance-del-crimen-organizado/54779"}
      - {label: "Primicias: Reducción de homicidios en Guayaquil y Durán (22 Sep 2026)", url: "https://www.primicias.ec/seguridad/reduccion-homicidios-guayaquil-duran-tasa-ecuador-ciudades-133110/"}
