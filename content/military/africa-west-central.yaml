    lat: 9.5
    lng: 8.9
    radius_km: 70
    note: Record violence in April 2026; Jos North, Kwatas and Kawel attacks.
  - name: Benue (Otukpo, Guma, Makurdi)
    lat: 7.5
    lng: 8.3
    radius_km: 90
    note: Village raids and highway kidnappings; Otukpo attacks July 2026.
  - name: Southern Kaduna (Kauru, Kajuru)
    lat: 10.0
    lng: 8.2
    radius_km: 60
    note: Naridon attack (30 killed) July 2026; church abductions.
  timeline:
  - date: '2025-12-16'
    event: Attack on a Plateau mining site kills at least 12.
  - date: '2026-03-13'
    event: Ambush on security forces at Kanam, Plateau kills about 20.
  - date: '2026-03-29'
    event: 30 killed in an attack in Jos North.
  - date: '2026-04-09'
    event: At least 20 killed in Kwatas ward, Bokkos; April becomes Plateau's most violent month on record.
  - date: '2026-06-21'
    event: At least 20 killed at Kawel, Bokkos.
  - date: '2026-07-27'
    event: At least 30 killed at Naridon, Kauru, Kaduna.
  outlook: Watch the dry-season migration period (roughly November to April), when clashes typically rise, the growth of state militias, and how US religious-freedom pressure shapes Abuja's response.
