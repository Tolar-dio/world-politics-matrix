  - name: Sokoto-Kebbi border belt (Lakurawa, ISSP)
    lat: 13.0
    lng: 4.6
    radius_km: 120
    note: Lakurawa camps; US strikes 25 Dec 2025; ISSP attacks in Shanga and Illela LGAs in 2026; Sokoto's record violence.
