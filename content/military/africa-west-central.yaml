    note: Mass kidnapping, highway IEDs, Tungan Dutse massacre (Feb 2026), Tumfa air strike (May 2026).
  - name: Katsina frontier
    lat: 12.6
    lng: 7.4
    radius_km: 90
    note: Bandit raids in Faskari and Jibia; residents protested rising attacks in Sept 2026.
  - name: Kainji-Borgu forests (Niger and Kwara states)
    lat: 9.9
    lng: 4.2
    radius_km: 110
    note: Overlap of JNIM, JAS cell, Lakurawa and Mahmuda; Woro massacre; Kasuwan-Daji and Borgu village attacks; Papiri abduction.
  - name: Northern Kaduna (Kajuru, Kauru)
    lat: 10.3
    lng: 7.9
    radius_km: 60
    note: Church attacks and mass abductions (Kurmin Wali, Jan 2026).
  timeline:
  - date: '2025-10-28'
    event: JNIM claims its first attack in Nigeria (Nuku, Kwara).
  - date: '2025-11-21'
    event: 303 students and 12 teachers abducted from St Mary's, Papiri, Niger state.
  - date: '2025-12-21'
    event: Remaining St Mary's students and teachers freed.
  - date: '2025-12-25'
    event: US strikes IS-linked targets in Sokoto state.
  - date: '2026-01-18'
    event: About 177 worshippers abducted from three churches at Kurmin Wali, Kaduna.
  - date: '2026-02-03'
    event: Woro and Nuku massacre in Kwara begins (162 to 200+ killed).
  - date: '2026-02-19'
    event: Lakurawa raids in Kebbi (34 killed); 50+ killed at Tungan Dutse, Zamfara.
  - date: '2026-03-24'
    event: ISSP attack near Giro Masa, Kebbi kills 10 soldiers.
  - date: '2026-05-10'
    event: Air strike at Tumfa, Zamfara kills at least 72 civilians.
  - date: '2026-05-16'
    event: ISSP attack near Rumji Dan Tudu, Sokoto kills 7 soldiers.
  - date: '2026-08-22'
    event: Lakurawa and Mahmuda clash around Dikera and Binzi, Niger state.
  outlook: Watch whether Lakurawa and ISSP keep expanding along the Niger border, whether JNIM deepens its presence in Kainji-Borgu, whether US strikes resume, and further mass school kidnappings. Peace deals with bandit leaders have repeatedly broken down.
