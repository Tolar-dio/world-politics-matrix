      - {label: "Critical Threats: Africa File (27 Aug 2026)", url: "https://www.criticalthreats.org/analysis/ethiopia-tplf-fano-libya-lna-mali-fla-algeria-morocco-togo-congo-russia-africa-file-august-27-2026"}

  - id: ethiopia-eritrea-standoff
    name: "Ethiopia-Eritrea confrontation (Assab and Tigray)"
    type: interstate
    intensity: low
    status: active
    started: "2026-10-01 (diplomatic rupture; Eritrean troops reported in Tigray on 2026-10-07)"
    countries: [ETH, ERI]
    sides:
      - name: "Ethiopia"
        members: ["Ethiopian National Defense Force (ENDF)"]
        backers: []
        leaders: ["Abiy Ahmed (Prime Minister)", "Gedion Timothewos (Foreign Minister)", "Birhanu Jula (ENDF Chief of Staff)"]
        strength: "Not public."
      - name: "Eritrea"
        members: ["Eritrean Defence Forces"]
        backers: ["Egypt (diplomatic alignment through the El Alamein declaration; port agreements for Assab, Massawa and Marsa Fatima)"]
        leaders: ["Isaias Afwerki (President)", "Yemane Gebremeskel (Information Minister)"]
        strength: "Not public; an Ethiopian official alleged one mechanized and three infantry divisions entered Tigray, which CTP could not corroborate."
    summary: "Ethiopia and Eritrea broke diplomatic relations on 1 October 2026 amid Ethiopia's war in Tigray. Eritrean troops were reported briefly near Adigrat and hit by Ethiopian drones, and Eritrea says Ethiopia is building a pretext to seize the Red Sea port of Assab."
    background: "Ethiopia lost its coastline when Eritrea became independent in 1993, and the two fought a border war in 1998 to 2000. They allied against the TPLF in 2020 to 2022, but Eritrea was left out of the Pretoria agreement. Since 2023 Abiy Ahmed has called Red Sea access an existential 'natural right', which Asmara reads as a threat to Assab.\n\nEgypt, which opposes Ethiopia's Nile dam, has built a bloc with Eritrea, Somalia and Sudan. That matters because a Tigray war on Eritrea's border can now trigger an interstate war with regional backers on both sides."
    year: "In August 2026 Eritrean officers appeared in Tigray and Eritrea reportedly moved tanks and artillery into southern Tigray. On 25 September Ethiopia's army chief accused Eritrea of financing the TPLF. On 1 October Ethiopia expelled ten Eritrean diplomats and closed its embassy, and Eritrea cut ties, calling it a declaration of war. On 4 October Egypt, Eritrea, Somalia and Sudan issued the El Alamein declaration, and Egyptian officials told Reuters the four would coordinate militarily if the conflict threatened their borders. On 7 October Eritrean forces were reported moving south of Adigrat; an Ethiopian drone destroyed a truck there, Ethiopia told the UN Security Council it faced an 'all-out invasion', and by 8 October the Eritrean forces had pulled back north."
    situation: "As of late October 2026 there is no declared war, but no diplomatic channel either. Ethiopian forces now sit on the border at Zalambessa after taking Adigrat, Adwa and Axum, while Eritrean forces have entrenched north of Zalambessa and around Badme and some remain on the Ethiopian side (AFP, 18 Oct). Unverified reports describe an ENDF clash with Eritrean forces near Bure on 11 October and a federal buildup at Bure, Bododa and Elidar on the A1 road toward Assab. On 10 October Eritrea asked the UN Security Council for Chapter VII measures against Ethiopia, and Abiy has again pledged direct sea access."
    technical:
      - "CTP and ISW geolocated media of suspected Eritrean forces on the Adigrat to Idaga Hamus road and a destroyed truck from an Ethiopian drone strike (7 to 8 Oct 2026)."
      - "CTP satellite review found no large-scale Eritrean buildup and assessed an advisory, logistics and light-infantry role rather than an invasion."
      - "Djibouti handled 96.71% of Ethiopia's maritime cargo in the fiscal year to July 2026 and Berbera 2.74%, which is why Assab matters to Addis Ababa."
      - "Egypt signed port and maritime agreements from Dec 2025 to Jul 2026 covering Doraleh (Djibouti) and Assab, Massawa and Marsa Fatima (Eritrea)."
      - "After the El Alamein summit (4 Oct 2026), Egyptian officials told Reuters that Egypt, Eritrea, Somalia and Sudan agreed to coordinate military and intelligence efforts if the conflict threatens their borders."
      - "Ethiopian drones struck suspected Eritrean forces near Adigrat on 7 and 10 Oct 2026; Eritrea then entrenched north of Zalambessa and around Badme (CTP, AFP)."
      - "Unverified reports on 12 Oct 2026 described a federal buildup at Bure, Bododa and Elidar on the A1 highway, the direct road from Ethiopia to Assab (CTP)."
      - "Escalating legal framing: Ethiopia's foreign minister invoked the right of self-defence in a 7 Oct letter to the UN Security Council; Eritrea asked the Council on 10 Oct for Chapter VII measures, which can include sanctions or force."
    casualties: "No confirmed interstate casualties; one Ethiopian drone strike on a suspected Eritrean vehicle was geolocated."
    displaced: "Not applicable separately; see the Tigray war entry."
    zones:
      - {name: "Assab", lat: 13.01, lng: 42.74, radius_km: 40, note: "Eritrean Red Sea port at the centre of Ethiopia's sea-access demands."}
      - {name: "Adigrat and Zalambessa border area", lat: 14.4, lng: 39.43, radius_km: 40, note: "Where Eritrean troops were reported on 7 Oct 2026."}
      - {name: "Northern Afar border (approx)", lat: 13.9, lng: 40.6, radius_km: 70, note: "Reported Eritrean deployments near the Afar border and ARDUF activity toward Dalol."}
      - {name: "Bure front on the A1 to Assab (approx)", lat: 12.75, lng: 41.8, radius_km: 40, note: "Unverified reports of a federal troop and heavy-weapons buildup at Bure, Bododa and Elidar and a clash near Bure on 11 Oct 2026."}
      - {name: "Badme (approx)", lat: 14.72, lng: 37.8, radius_km: 25, note: "Disputed town from the 1998 to 2000 war; Eritrean forces reported entrenched around it in Oct 2026."}
    timeline:
      - {date: "2026-09-25", event: "ENDF chief Birhanu Jula accuses Eritrea of financing the TPLF."}
      - {date: "2026-10-01", event: "Ethiopia expels ten Eritrean diplomats; Eritrea severs ties."}
      - {date: "2026-10-04", event: "El Alamein declaration by Egypt, Eritrea, Somalia and Sudan."}
      - {date: "2026-10-05", event: "Abiy, reappointed prime minister, pledges direct sea access."}
      - {date: "2026-10-07", event: "Eritrean troops reported near Adigrat; Ethiopia tells the UN Security Council of an 'all-out invasion'."}
      - {date: "2026-10-08", event: "Eritrean forces reported withdrawing north of Adigrat."}
      - {date: "2026-10-10", event: "Eritrea tells the UN Security Council that Ethiopia's actions amount to a declaration of war and asks for Chapter VII measures."}
      - {date: "2026-10-11", event: "Unverified reports of an ENDF clash with Eritrean forces near Bure and a federal buildup on the A1 toward Assab."}
      - {date: "2026-10-12", event: "Eritrean forces withdraw through Zalambessa as federal forces reach the border."}
    outlook: "The key signals are any federal assault on the Adwa and Adigrat area, Eritrean mobilization along the border or toward Afar, Ethiopian moves near Assab, and whether Egypt turns its coordination pledge into military support."
    sources:
      - {label: "Critical Threats: Ethiopia War Security Review (9 Oct 2026)", url: "https://www.criticalthreats.org/print/brf_6ac94ee9d6e71"}
      - {label: "Critical Threats: Africa File (8 Oct 2026)", url: "https://www.criticalthreats.org/analysis/Ethiopia-eritrea-tigray-tplf-egypt-somalia-sudan-saf-mali-fla-jnim"}
      - {label: "Critical Threats: Africa File special edition on Eritrean-Ethiopian war risk (Mar 2025)", url: "https://www.criticalthreats.org/analysis/africa-file-special-edition-tigray-threatens-to-spark-the-next-eritrean-ethiopian-war-and-plunge-the-horn-of-africa-into-crisis"}
      - {label: "IndraStra: Tigray's war and Ethiopia's Red Sea gamble (9 Oct 2026)", url: "https://www.indrastra.com/2026/10/tigrays-war-and-ethiopias-red-sea.html"}
      - {label: "Critical Threats: Ethiopia War Security Review (13 Oct 2026)", url: "https://www.criticalthreats.org/print/brf_6aceabd6a3cfa"}
      - {label: "Kuwait Times / AFP: In Tigray, Ethiopians welcome departure of Eritrean troops (18 Oct 2026)", url: "https://kuwaittimes.com/article/51864/world/in-tigray-ethiopians-welcome-departure-of-eritrean-troops/"}

  - id: somalia-al-shabaab
    name: "Somalia: al-Shabaab insurgency and political crisis"
    type: insurgency
    intensity: high
    status: active
    started: "2025-02-01 (approximate; al-Shabaab offensive in central Somalia and federal political breakdown)"
    countries: [SOM]
    sides:
      - name: "Federal Government of Somalia and partners"
        members: ["Somali National Army", "AUSSOM (Uganda, Ethiopia, Djibouti, Kenya, Egypt)", "Clan militias (macawisley)", "US Africa Command (air strikes)"]
        backers: ["United States (air strikes, special forces; aid suspended to the federal government in Jan 2026)", "Turkey (training, drones)", "Egypt (troops, helicopters and aircraft in AUSSOM from early 2026)", "Saudi Arabia (military cooperation agreement, Feb 2026)"]
        leaders: ["Hassan Sheikh Mohamud (President; mandate expired 15 May 2026 and is disputed)"]
        strength: "AUSSOM agreed strength 11,900 (Uganda 4,500, Ethiopia 2,500, Djibouti 1,520, Kenya 1,410, Egypt 1,091), per Wikipedia."
      - name: "Al-Shabaab"
        members: ["Harakat al-Shabaab al-Mujahideen (al-Qaeda affiliate)"]
        backers: ["Houthis (reported weapons smuggling via Eritrea and Sudan, per CTP)"]
        leaders: []
        strength: "No current figure found in the sources reviewed."
    summary: "Al-Shabaab, al-Qaeda's Somali affiliate, has retaken ground in central and southern Somalia while the federal government is consumed by disputes with member states and the opposition over the president's expired term. US commanders have publicly tied al-Shabaab's gains to those political fights."
    background: "Al-Shabaab has fought Somali governments and African Union forces since 2006 and still controls much of the rural south and centre, taxing trade and running courts. A government offensive in 2022 and 2023 pushed it out of parts of Hiraan and Middle Shabelle, but it regained ground from early 2025.\n\nThe federal model is under strain: Puntland and Jubaland refuse to recognize federal authority, the opposition Somali Future Council rejects the president's plan for direct elections, and Israel's recognition of Somaliland in December 2025 added a new dispute. That matters because troops and attention diverted to political fights are not fighting al-Shabaab."
    year: "Al-Shabaab attacked Godka Jilicow prison in Mogadishu on 4 October 2025. On 26 December Israel recognized Somaliland. In January 2026 the US suspended assistance to the federal government over alleged food aid theft, and Somalia revoked its agreements with the UAE. In March South West State cut ties with Mogadishu, and federal forces took Baidoa on 30 March and installed a transitional administration; loyalist militias later attacked Baidoa and Buurhakaba. Talks with the opposition collapsed on 15 May as the president's term expired, and Puntland declared federal mandates over. On 3 and 4 June government forces fought armed supporters of opposition leaders, including former prime minister Hassan Ali Khaire and former president Sheikh Sharif, in Mogadishu's Howlwadaag district ahead of an anti-government rally, with mortar fire and deaths reported by the UN. On 1 July the US said it would end all funding for the UN Support Office in Somalia, the roughly $500 million a year logistics system behind AUSSOM, by 31 December 2026. In late July AFRICOM's commander warned that political disputes had let al-Shabaab retake cleared areas, and on 2 August al-Shabaab seized Teedaan in eastern Hiiraan after a nearly 24-hour battle, taking control of a road linking Hiiraan with Galgaduud and Middle Shabelle. The US kept up a record air campaign: about 125 strikes in 2025 and 68 by late June 2026. Piracy resurged from April, with at least eight hijackings."
    situation: "As of October 2026 al-Shabaab holds most of the rural Juba valley and contests Middle and Lower Shabelle and Hiraan, where it took Teedaan in August. The federal government faces a legitimacy dispute, armed standoffs with South West loyalists and the opposition, and an AUSSOM mission that ACLED says faces 'imminent operational collapse' in 2027 unless the US funding cut is replaced. Somalia has aligned with Egypt and Eritrea in the El Alamein bloc while also offering Ethiopia port access."
    technical:
      - "AUSSOM replaced ATMIS on 1 Jan 2025 under UN Security Council Resolution 2767; Uganda is the largest contributor with about 4,500 troops along the corridor into Mogadishu."
      - "Egypt deployed troops plus attack and utility helicopters and light fixed-wing aircraft in early 2026."
      - "US posture: AFRICOM denied a withdrawal was under consideration (late July 2026), and US special operations signed a deal with Puntland on 2 Aug 2026 to expand the Bosaso base for counterterrorism and maritime security."
      - "Houthi weapons smuggling to al-Shabaab and ISIS-Somalia via Eritrea and Sudan has been reported (CTP)."
      - "Piracy resurgence from April 2026: at least eight vessels hijacked, versus one from 2014 to 2022."
      - "Federal forces took Baidoa on 30 Mar 2026 without reported casualties, but loyalists of ousted South West leader Abdiaziz Laftagareen later attacked Baidoa and Buurhakaba."
      - "US air campaign: about 125 AFRICOM strikes in 2025, double the previous record of 63 in 2019, after a directive from Defense Secretary Pete Hegseth gave commanders more authority; 68 strikes in 2026 by 22 June (Stars and Stripes). New America's monthly tally for 2026: January 26, February 16, March 7, April 12, May 2."
      - "Turkish air support: Somalia's defence ministry said joint Somali-Turkish strikes killed 35 al-Shabaab fighters at hideouts and weapons stores in Lower Shabelle (30 Jun 2026; claim unverified)."
      - "Funding cliff: the US will end support for the UN Support Office in Somalia (about $500 million a year) by 31 Dec 2026; ACLED expects al-Shabaab to exploit the 2026 to 2027 transition and threaten Mogadishu and Kismayo."
      - "Teedaan (2 Aug 2026): al-Shabaab claimed weapons, vehicles and equipment after government forces and clan militias withdrew; it then dug trenches in the village."
      - "Opposition leaders accuse the president of using internationally trained counter-al-Shabaab units against them in Mogadishu (June 2026)."
    casualties: "No reliable 12-month total was found in the sources reviewed. The 'high' label reflects the long-running scale of the insurgency, record US and Somali air strikes and continuing ground battles, and should be checked against ACLED data."
    displaced: "No current figure found in the sources reviewed."
    zones:
      - {name: "Mogadishu", lat: 2.05, lng: 45.32, radius_km: 20, note: "Capital; al-Shabaab attacks and June 2026 clashes between government and opposition forces."}
      - {name: "Middle Shabelle and Hiraan (approx)", lat: 3.7, lng: 45.6, radius_km: 120, note: "Contested belt where al-Shabaab regained ground from 2025."}
      - {name: "Lower Shabelle (approx)", lat: 1.9, lng: 44.6, radius_km: 90, note: "Contested farming belt west of Mogadishu, including Merca."}
      - {name: "Juba valley (approx)", lat: 0.8, lng: 42.6, radius_km: 150, note: "Al-Shabaab heartland around Jilib and Jamaame."}
      - {name: "Baidoa / South West State", lat: 3.12, lng: 43.65, radius_km: 50, note: "Seized by federal forces on 30 Mar 2026."}
      - {name: "Somaliland", lat: 9.56, lng: 44.06, radius_km: 150, note: "Recognized by Israel on 26 Dec 2025; Mogadishu and the El Alamein bloc reject this."}
    timeline:
      - {date: "2025-10-04", event: "Al-Shabaab attacks Godka Jilicow prison in Mogadishu."}
      - {date: "2025-12-26", event: "Israel recognizes Somaliland."}
      - {date: "2026-01-07", event: "US suspends assistance to the federal government."}
      - {date: "2026-01-12", event: "Somalia revokes all bilateral agreements with the UAE."}
      - {date: "2026-03-17", event: "South West State cuts ties with Mogadishu."}
      - {date: "2026-03-30", event: "Federal forces take Baidoa."}
      - {date: "2026-05-15", event: "Talks with the Somali Future Council collapse as the president's term expires."}
      - {date: "2026-06-03", event: "Two days of fighting in Mogadishu between government forces and armed supporters of opposition leaders."}
      - {date: "2026-07-01", event: "US announces it will end funding for the UN Support Office in Somalia by year-end."}
      - {date: "2026-08-02", event: "Al-Shabaab seizes Teedaan in eastern Hiiraan; US and Puntland sign agreement to expand the Bosaso base."}
      - {date: "2026-10-04", event: "Somalia joins the El Alamein declaration with Egypt, Eritrea and Sudan."}
    outlook: "Watch whether the government and opposition agree an election path, whether AUSSOM funding survives into 2027, and whether al-Shabaab presses toward Mogadishu's outskirts while federal forces are split."
    sources:
      - {label: "Critical Threats: Africa File (6 Aug 2026)", url: "https://www.criticalthreats.org/analysis/ethiopia-tplf-drc-fdlr-rwanda-red-sea-saudi-houthi-somalia-fgs-us-aussom-africa-file-august-6-2026"}
      - {label: "Wikipedia: 2026 in Somalia", url: "https://en.wikipedia.org/wiki/2026_in_Somalia"}
      - {label: "Wikipedia: 2025 in Somalia", url: "https://en.wikipedia.org/wiki/2025_in_Somalia"}
      - {label: "Wikipedia: Somali Civil War (2009 to present)", url: "https://en.wikipedia.org/wiki/Somali_Civil_War_(2009%E2%80%93present)"}
      - {label: "Wikipedia: African Union Support and Stabilization Mission in Somalia", url: "https://en.wikipedia.org/wiki/African_Union_Support_and_Stabilization_Mission_in_Somalia"}
      - {label: "Critical Threats: Africa File (8 Oct 2026)", url: "https://www.criticalthreats.org/analysis/Ethiopia-eritrea-tigray-tplf-egypt-somalia-sudan-saf-mali-fla-jnim"}
      - {label: "Stars and Stripes: AFRICOM Somalia air strikes (22 Jun 2026)", url: "https://www.stripes.com/theaters/africa/2026-06-22/africom-somalia-air-strikes-22042447.html"}
      - {label: "New America: AFRICOM confirms 63 strikes in Somalia in 2026 (29 May 2026)", url: "https://www.newamerica.org/insights/africom-confirms-63-strikes-in-somalia-in-2026/"}
      - {label: "ACLED: What does the US funding exit from UNSOS mean for Somalia's stability? (20 Jul 2026)", url: "https://acleddata.com/expert-comment/what-does-us-funding-exit-unsos-mean-somalias-stability"}
      - {label: "Arab News / AFP: Somalia's Al-Shabab seize strategic town (3 Aug 2026)", url: "https://www.arabnews.com/node/2653276/world"}
