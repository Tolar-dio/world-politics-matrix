  - id: south-sudan-civil-conflict
    name: "South Sudan conflict (government vs SPLA-IO)"
    type: civil-war
    intensity: high
    status: active
    started: "2025-03-04 (White Army capture of the Nasir garrison; Riek Machar detained later that month)"
    countries: [SSD, UGA, SDN]
    sides:
      - name: "Government of South Sudan"
        members: ["South Sudan People's Defence Forces (SSPDF)", "Allied militias including Johnson Olony's forces", "Uganda People's Defence Force (UPDF) contingent"]
        backers: ["Uganda (troops and support to joint air strikes, per the UN Commission on Human Rights in South Sudan)"]
        leaders: ["Salva Kiir (President)", "Santino Deng Wol (SSPDF chief, reappointed May 2026)", "Johnson Olony (militia commander)"]
        strength: "No reliable public figure found."
      - name: "SPLM/A-IO and allied Nuer forces"
        members: ["SPLA-IO", "Nuer White Army", "Kit-Gwang faction (Simon Gatwech Dual)", "Defectors from the SSOA (about 1,000 under Brig. Gen. Much Banang, Jan 2026)"]
        backers: []
        leaders: ["Riek Machar (SPLM-IO chairman, suspended first vice president, detained and on trial)", "Simon Gatwech Dual (Kit-Gwang faction)", "Pal Mai Deng (SPLM-IO spokesperson)"]
        strength: "No reliable public figure found."
    summary: "South Sudan's 2018 peace deal has collapsed into renewed war between President Salva Kiir's forces, backed by Ugandan troops, and the SPLA-IO loyal to detained former vice president Riek Machar. Fighting is fiercest in Nuer areas of Jonglei and Upper Nile, where government air strikes have hit civilians, and the country is heading into elections set for 22 December 2026."
    background: "South Sudan's 2013 to 2018 civil war, which pitted Kiir's mostly Dinka government against Machar's mostly Nuer SPLM-IO, ended in a power-sharing deal that was never fully implemented. In March 2025 the Nuer White Army overran the army garrison at Nasir in Upper Nile, and Machar was placed under arrest. Uganda deployed troops to back Kiir.\n\nMachar and seven co-accused went on trial on 22 September 2025 for treason, murder, crimes against humanity and terrorism over the Nasir attack. The SPLA-IO framed its military campaign as a response to the trial, which matters because it turned an elite dispute into a war over Nuer areas."
    year: "On 23 December 2025 the SPLA-IO took Waat, the Nyirol County headquarters in Jonglei, and within ten days had captured Pathai and Yuai, effectively ending government presence in Nyirol, Uror and Akobo counties. About 1,000 SSOA soldiers defected to it, and the Kit-Gwang faction claimed Pajut and declared the 2025 peace deal void. A government air strike on Lankien on 29 December killed at least 11 civilians, and a drone attack hit the MSF hospital there on 3 February 2026.\n\nOn 24 January militia commander Johnson Olony told his men to 'spare no one', drawing condemnation from the UN and Human Rights Watch. The next day the SSPDF launched Operation Enduring Peace, and by 3 February it said it had retaken all northern Jonglei bases. The SSPDF took Akobo in March after ordering UN and aid staff out; the SPLA-IO retook it on 13 to 14 April. Violence spread: an attack in Abiemnom (Ruweng) killed at least 169 on 1 March, rebels took Walgak on 5 July after killing 44 soldiers, and two Ethiopian UN peacekeepers were killed near Pajut on 24 August.\n\nPolitically, prosecutors closed their case against Machar in April 2026, the UN Security Council cut UNMISS from 17,000 to 12,000 personnel, and on 21 September Kiir dissolved the transitional government ahead of the December election. Sudan's war spilled over at Heglig and Abyei, where a drone strike on Amiet market killed 153 on 19 October."
    situation: "As of late October 2026 the SSPDF holds most towns in Jonglei but the SPLA-IO and White Army hold Akobo and much of the Lou Nuer countryside and keep raiding garrisons such as Walgak. Clashes continue in Upper Nile (Maiwut, Longechuk) and Central Equatoria. Machar's trial has not produced a verdict in available reporting. The transitional government has been dissolved and elections are scheduled for 22 December 2026, with no agreement from the opposition."
    technical:
      - "The UN Commission on Human Rights in South Sudan found that Ugandan forces helped carry out joint aerial bombardments of civilian areas, mainly Nuer communities in opposition-held territory."
      - "Government air power is used against opposition towns: an air strike on Lankien killed at least 11 civilians (29 Dec 2025) and a drone attack hit the MSF hospital there (3 Feb 2026)."
      - "The SSPDF has used evacuation orders before offensives, including an order for UN and aid staff to leave Akobo within 72 hours (6 Mar 2026), restricting humanitarian access."
      - "Operation Enduring Peace (from 25 Jan 2026) retook Yuai, Pajut, Pathai, Motot and Pieri; the SPLA-IO called its withdrawals tactical."
      - "Defections shape the balance: about 1,000 SSOA soldiers joined the SPLA-IO (3 Jan 2026), and the Kit-Gwang faction abandoned its 2025 deal with the government."
      - "Machar trial: 14 prosecution witnesses (seven in camera), signals recordings and digital forensic evidence; presiding judge James Alala Deng. Prosecutors allege SPLA-IO and White Army forces killed 257 SSPDF soldiers, including commander David Majur Dak, and destroyed or seized about $58 million of equipment at Nasir in March 2025. The court was in its 68th session in April 2026 with no verdict date given."
      - "UNMISS was cut from 17,000 to 12,000 personnel by the UN Security Council on 30 Apr 2026, reducing protection capacity just as fighting spread."
      - "Sudan spillover: South Sudanese troops secure the Heglig oilfield under a Kiir-Burhan-Hemedti arrangement (Dec 2025), and Abyei has been hit by drone strikes."
    casualties: "No comprehensive 2026 total was found. ACLED counted at least 200 dead, including 40 civilians, in Jonglei by late January 2026. Major incidents include at least 169 killed in Abiemnom (1 Mar 2026), 44 soldiers killed at Walgak (5 Jul 2026), 70 killed in a gold-mine clash at Jebel Iraq (29 Mar 2026), 49 killed in a cattle raid in Warrap (29 Aug 2026) and 153 killed in the Amiet market strike in Abyei (19 Oct 2026). The 'high' intensity label is an estimate based on these incidents."
    displaced: "More than 280,000 displaced by the Jonglei fighting by late January 2026, with cholera in camps in Duk County and about 450,000 children at risk of malnutrition (figures cited on Wikipedia). About 8,000 displaced by the Amiet strike in Abyei (Reuters via Rio Times)."
    zones:
      - {name: "Lou Nuer heartland, Jonglei (approx)", lat: 7.9, lng: 32.0, radius_km: 100, note: "Waat, Lankien, Yuai, Pajut and Akobo; main battleground of the Dec 2025 to Apr 2026 offensives."}
      - {name: "Upper Nile (Nasir, Ulang, Maiwut)", lat: 8.6, lng: 33.2, radius_km: 90, note: "White Army and SPLA-IO stronghold where the March 2025 Nasir attack started the current war."}
      - {name: "Juba", lat: 4.86, lng: 31.57, radius_km: 20, note: "Seat of government and of the Machar trial."}
      - {name: "Central Equatoria (approx)", lat: 3.9, lng: 30.9, radius_km: 90, note: "SPLA-IO seized Panyume on 20 Jan 2026; continuing clashes."}
      - {name: "Ruweng and Abyei border (approx)", lat: 9.65, lng: 28.8, radius_km: 70, note: "Abiemnom massacre (1 Mar 2026) and Sudan war spillover at Heglig and Amiet."}
    timeline:
      - {date: "2025-09-22", event: "Riek Machar and seven co-accused first appear in court in Juba."}
      - {date: "2025-12-23", event: "SPLA-IO captures Waat, starting the Jonglei offensive."}
      - {date: "2025-12-29", event: "Government air strike on Lankien kills at least 11 civilians."}
      - {date: "2026-01-02", event: "SPLA-IO captures Yuai."}
      - {date: "2026-01-16", event: "Kit-Gwang faction claims Pajut and declares the 2025 deal void."}
      - {date: "2026-01-24", event: "Johnson Olony tells his forces to 'spare no one'."}
      - {date: "2026-01-25", event: "SSPDF launches Operation Enduring Peace."}
      - {date: "2026-02-03", event: "SSPDF says it has retaken all northern Jonglei bases; drone attack hits the MSF hospital in Lankien."}
      - {date: "2026-03-01", event: "At least 169 killed in an attack on Abiemnom, Ruweng."}
      - {date: "2026-03-14", event: "SSPDF controls Akobo."}
      - {date: "2026-04-14", event: "SPLA-IO retakes Akobo."}
      - {date: "2026-04-24", event: "Prosecution closes its case in the Machar trial."}
      - {date: "2026-04-30", event: "UN Security Council cuts UNMISS from 17,000 to 12,000 personnel."}
      - {date: "2026-07-05", event: "Rebels seize Walgak, Jonglei after killing 44 soldiers."}
      - {date: "2026-08-24", event: "Two Ethiopian UN peacekeepers killed in an ambush near Pajut."}
      - {date: "2026-09-21", event: "Kiir dissolves the transitional government ahead of the December election."}
      - {date: "2026-10-19", event: "Drone strike on Amiet market in Abyei kills 153 per local officials."}
    outlook: "Watch the run-up to the 22 December 2026 election, any verdict in the Machar trial, the dry-season campaign that usually begins in November in Jonglei and Upper Nile, and the reduced UNMISS footprint. Spillover from Sudan at Heglig and Abyei could pull Juba further into its neighbour's war."
