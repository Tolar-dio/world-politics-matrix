      - {label: "Critical Threats: Africa File (6 Aug 2026)", url: "https://www.criticalthreats.org/analysis/ethiopia-tplf-drc-fdlr-rwanda-red-sea-saudi-houthi-somalia-fgs-us-aussom-africa-file-august-6-2026"}
      - {label: "Critical Threats: Africa File (27 Aug 2026)", url: "https://www.criticalthreats.org/analysis/ethiopia-tplf-fano-libya-lna-mali-fla-algeria-morocco-togo-congo-russia-africa-file-august-27-2026"}
