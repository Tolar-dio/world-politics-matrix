  - id: somalia-isis-puntland
    name: "ISIS-Somalia in Puntland"
    type: insurgency
    intensity: low
    status: active
    started: "2024-12-01 (approximate; Puntland's Operation Hilaac in the Cal Miskaad mountains)"
    countries: [SOM]
    sides:
      - name: "Puntland and partners"
        members: ["Puntland security forces", "US forces (air strikes; Bosaso base)"]
        backers: ["United States (air strikes and basing; base expansion deal 2 Aug 2026)"]
        leaders: ["Said Abdullahi Deni (Puntland President)"]
        strength: "Not public."
      - name: "Islamic State Somalia Province"
        members: ["ISIS-Somalia (about half foreign fighters by 2024, Ethiopians the largest group)"]
        backers: []
        leaders: ["Abdirahman Fahiye Isse Mohamud (emir since 2023)", "Abdul Qadir Mumin (founder)"]
        strength: "600 to 700 in 2024 (UN Security Council), falling to an estimated 100 to 200 by mid-2025 (Wikipedia infobox)."
    summary: "The Islamic State's Somali branch, based in the Cal Miskaad mountains of Puntland's Bari region, was cut down by Puntland's Operation Hilaac in 2025 with heavy US air support but still holds mountain villages."
    background: "ISIS-Somalia formed in 2015 when Abdul Qadir Mumin broke from al-Shabaab. It grew into a financial hub for the Islamic State's African branches. Puntland launched Operation Hilaac around the turn of 2025 and captured numerous bases.\n\nIt matters beyond its size because it moves money and foreign fighters for the wider Islamic State network, and because Puntland's campaign is a key reason the US is expanding its Bosaso base."
    year: "Puntland forces removed the group from around Bosaso in 2025 but it still controls villages in the nearby mountains. In August 2026 the US and Puntland agreed to expand the US base in Bosaso. CTP reports Houthi weapons smuggling reaching ISIS-Somalia."
    situation: "As of late 2026 ISIS-Somalia is much reduced, holding villages in the Cal Miskaad range, with Puntland and US forces continuing operations."
    technical:
      - "Strength fell from 600 to 700 (UN, 2024) to an estimated 100 to 200 (mid-2025)."
      - "About half of members were foreign by 2024, with Ethiopians the largest single nationality, plus Sudanese, Yemenis, Egyptians and Djiboutians (Wikipedia, citing UN and press reporting)."
      - "Puntland's Operation Hilaac captured numerous ISIS bases in the Bari mountains by 11 Jan 2025; the group was pushed out of the Bosaso area during 2025 but kept mountain villages."
      - "Houthi weapons smuggling to ISIS-Somalia via Eritrea and Sudan has been reported (CTP, Aug 2026)."
      - "Financing: protection money in Bosaso, illegal gold mining in Cal Miskaad under investigation, and earlier cryptocurrency transfers to ISKP of about $25,000 a month (UN, 2023)."
      - "US basing at Bosaso is being expanded under a 2 Aug 2026 agreement with Puntland."
      - "US strikes continue: AFRICOM struck ISIS-Somalia in the Golis Mountains about 75 km southeast of Bosaso on 6 May 2026; strikes reported on 22 Apr (Cal Miskaad) and 21 May (near Qandala) were denied by AFRICOM, a reminder that several countries fly strikes in Somalia (New America)."
    casualties: "No reliable figures for the review period."
    displaced: "No figure found."
    zones:
      - {name: "Cal Miskaad mountains (approx)", lat: 10.7, lng: 49.6, radius_km: 60, note: "ISIS-Somalia's remaining mountain villages in Bari region."}
      - {name: "Bosaso", lat: 11.28, lng: 49.18, radius_km: 15, note: "Puntland's port and US base."}
    timeline:
      - {date: "2025-01-11", event: "Puntland reports capture of numerous ISIS bases in Operation Hilaac."}
      - {date: "2026-08-02", event: "US and Puntland sign agreement to expand the Bosaso base."}
    outlook: "Watch whether ISIS-Somalia rebuilds through foreign recruits and smuggling, and how US basing at Bosaso evolves."
    sources:
      - {label: "Wikipedia: Islamic State Somalia Province", url: "https://en.wikipedia.org/wiki/Islamic_State_%E2%80%93_Somalia_Province"}
      - {label: "New America: AFRICOM confirms 63 strikes in Somalia in 2026 (29 May 2026)", url: "https://www.newamerica.org/insights/africom-confirms-63-strikes-in-somalia-in-2026/"}
      - {label: "Critical Threats: Africa File (6 Aug 2026)", url: "https://www.criticalthreats.org/analysis/ethiopia-tplf-drc-fdlr-rwanda-red-sea-saudi-houthi-somalia-fgs-us-aussom-africa-file-august-6-2026"}

  - id: libya-militia-conflict
    name: "Libya: western militia clashes and east-west rivalry"
    type: civil-war
    intensity: low
    status: active
    started: "2025-05-12 (approximate; Tripoli clashes after the killing of SSA leader al-Kikli, followed by Zawiya fighting in 2026)"
    countries: [LBY]
    sides:
      - name: "Western armed groups (nominally under the Tripoli-based GNU)"
        members: ["Counter Security Threats Agency and First Support Force (Muhammed Bahroun, 'al-Far')", "Shuhada al-Nasr Brigade and Zawiya Petroleum Facilities Guard (Muhammad Kashlaf, 'al-Qasseb')", "Salem al-Latif group and al-Kabwat (103rd Infantry Battalion)", "52nd Infantry Brigade (Mahmoud Bin Rajab)"]
        backers: ["Turkey (long-standing backer of Tripoli authorities)"]
        leaders: ["Abdul Hamid Dbeibah (GNU Prime Minister)"]
        strength: "Not public."
      - name: "Libyan National Army (east and south)"
        members: ["Libyan National Army (LNA)", "Subul al-Salam Brigade (Kufra)"]
        backers: ["Russia (Africa Corps presence and high-level ties; Putin met Saddam Haftar on 21 Aug 2026)", "United States (engagement on unification talks)"]
        leaders: ["Khalifa Haftar (LNA commander)", "Saddam Haftar (LNA chief of staff and apparent heir)"]
        strength: "Not public."
    summary: "Libya remains split between the Tripoli-based government and the Haftar family's Libyan National Army. Violence in 2026 has been mostly militia fighting in the west, including a May battle at Zawiya that shut the country's largest working refinery, alongside targeted killings in the east."
    background: "Since the 2020 ceasefire Libya has had rival governments in Tripoli and the east. In the west, armed groups funded by the state compete for territory, smuggling routes and access to oil infrastructure; in the east, Khalifa Haftar's LNA controls Cyrenaica and much of the south and has grown close to Russia.\n\nThis matters for the wider region because southeastern Libya is a reported supply route for Sudan's RSF, and because Russia's position in Libya supports its operations across the Sahel."
    year: "Saif al-Islam Gaddafi was shot dead in Zintan on 3 February 2026. In late February dozens of soldiers were killed on the Niger and Chad borders in an LNA-affiliated operation. On 5 to 10 May rival Zawiya militias fought around the refinery: the security directorate announced a campaign against criminal groups, mortars and artillery hit the refinery and nearby homes, and one side used improvised one-way attack drones on a scale not seen before in Libyan urban fighting. The refinery shut for two days. On 10 and 11 August drones struck the refinery three times in two days, and on 12 August an attack on a substation knocked out over 700 MW. The same day as the first drone attack, the LNA's intelligence chief Fawzi al-Mansouri was killed by a car bomb in Benghazi. On 21 August Putin met Saddam Haftar, and on 25 August the rival governments reached an initial agreement on overhauling the electoral system."
    situation: "As of October 2026 western Libya remains a patchwork of militias, with Zawiya the most volatile flashpoint near Tripoli. US-led unification talks have reportedly considered elevating Saddam Haftar, which the International Crisis Group warned could provoke resistance in the west."
    technical:
      - "Zawiya, May 2026: mortars, artillery and improvised one-way attack drones; aviation kerosene tank No. 501 hit twice and No. 502 by gunfire; GECOL power plant damaged."
      - "Casualties at Zawiya in May: 3 civilians killed and 9 injured (NIHRL); at least 10 militia fighters killed and 20 injured (local sources)."
      - "Al-Qasseb has been under UN, US, EU and UK sanctions since 2018; his tribe, the Awlad Abu Hmeira, has controlled the refinery since 2011."
      - "August 2026: three drone attacks on the Zawiya refinery in two days and a substation attack that took over 700 MW of 1,300 MW offline."
      - "The Haftars brokered releases of a US missionary held by IS Sahel and of two Russian Africa Corps soldiers held by Mali's FLA in August 2026, reportedly including ransom."
      - "Russian footprint: the Africa Corps replaced Wagner in Libya from spring 2024, with estimates of 800 to 1,800 personnel (Wikipedia); daily Russian military flights from Hmeimim in Syria to three Libyan bases began in mid-December 2024 after Assad's fall (CEPA); a University of Texas and NGA Tearline study (June 2026) found improvements at six Libyan air bases since April 2024 that support operations into the Sahel."
      - "Moscow wants a naval base at Tobruk; Haftar had not approved one as of early 2025 (CEPA)."
    casualties: "Low by regional standards; no national total found. Zawiya in May 2026 killed at least 3 civilians and 10 fighters."
    displaced: "No significant new displacement figure found."
    zones:
      - {name: "Tripoli", lat: 32.89, lng: 13.19, radius_km: 25, note: "Seat of the GNU; militia rivalries."}
      - {name: "Zawiya refinery and city", lat: 32.76, lng: 12.72, radius_km: 15, note: "Libya's largest working refinery; May 2026 battle and August drone attacks."}
      - {name: "Benghazi", lat: 32.12, lng: 20.07, radius_km: 30, note: "LNA headquarters; LNA intelligence chief assassinated 10 Aug 2026."}
      - {name: "Kufra and the Sudan-Chad border triangle (approx)", lat: 23.0, lng: 23.5, radius_km: 200, note: "LNA-held southeast; reported RSF logistics route and smuggling corridor."}
    timeline:
      - {date: "2026-02-03", event: "Saif al-Islam Gaddafi shot dead in Zintan."}
      - {date: "2026-05-08", event: "Zawiya security campaign; shelling shuts the refinery."}
      - {date: "2026-08-10", event: "LNA intelligence chief Fawzi al-Mansouri killed by a car bomb in Benghazi; first of three drone attacks on the Zawiya refinery."}
      - {date: "2026-08-21", event: "Putin meets Saddam Haftar in Moscow."}
      - {date: "2026-08-25", event: "Rival governments reach an initial agreement on electoral reform."}
    outlook: "Watch Zawiya and Tripoli militia rivalries, any deal that elevates Saddam Haftar, and Russia's response to US-led unification efforts."
    sources:
      - {label: "Libya Analysis: Heavy fighting in Zawiyya (13 May 2026)", url: "https://libyaanalysis.substack.com/p/13-may-2026-heavy-fighting-between"}
      - {label: "Libya Security Monitor: Zawiyya refinery damaged and closed for two days", url: "https://libyasecuritymonitor.com/zawiyya-refinery-damaged-closed-for-two-days-amid-heavy-fighting/"}
      - {label: "Arab News (Reuters/AFP): Large-scale crackdown on crime in Libyan city (8 May 2026)", url: "https://www.arabnews.com/node/2642827/middle-east"}
      - {label: "Wikipedia: 2026 in Libya", url: "https://en.wikipedia.org/wiki/2026_in_Libya"}
      - {label: "Critical Threats: Africa File (27 Aug 2026)", url: "https://www.criticalthreats.org/analysis/ethiopia-tplf-fano-libya-lna-mali-fla-algeria-morocco-togo-congo-russia-africa-file-august-27-2026"}
      - {label: "Wikipedia: Africa Corps (Russia)", url: "https://en.wikipedia.org/wiki/Africa_Corps_(Russia)"}
      - {label: "CEPA: Putin's empire-building base hunt reaches Libya (Jan 2025)", url: "https://cepa.org/article/putins-empire-building-base-hunt-reaches-libya/"}
      - {label: "UT Austin Intelligence Studies Project: Russian air base infrastructure in Libya (Jun 2026)", url: "https://intelligencestudies.utexas.edu/?p=6779"}
      - {label: "Al Arabiya: Saif al-Islam Gaddafi has been killed (3 Feb 2026)", url: "https://english.alarabiya.net/News/north-africa/2026/02/03/saif-alislam-gaddafi-has-been-killed-gaddafi-family-source-tells-al-arabiya"}

battles:
  - id: fall-of-el-fasher
    name: "Fall of El Fasher"
    conflict: sudan-saf-rsf
    tier: major
    start: "2024-04-13"
    end: "2025-10-27"
    place: "El Fasher, North Darfur, Sudan"
    lat: 13.63
    lng: 25.35
    sides: ["Rapid Support Forces", "SAF 6th Infantry Division and Joint Forces"]
    outcome: "RSF captured the city and the 6th Division HQ on 26 Oct 2025 after an 18-month siege; mass killings followed."
    forces: "SAF 6th Infantry Division with Joint Force units led by Juma'a Hagar, Al-Tijani Duhaib, Abboud Adam Khater and Hamid Jazm; RSF assault units with drone support."
    losses: "At least 3,000 dead in the first days by Sudan War Monitor's preliminary estimate; WHO cited more than 460 killed at the Saudi Maternity Hospital; far higher estimates are disputed. About 36,000 fled from 26 to 29 Oct (IOM)."
    significance: "Gave the RSF all five Darfur state capitals, freed RSF forces for Kordofan, and led a UN mission to cite 'hallmarks of genocide'."
    sources:
      - {label: "Sudan War Monitor: Fall of El Fasher", url: "https://sudanwarmonitor.com/p/fall-of-el-fasher"}
      - {label: "Wikipedia: Siege of El Fasher", url: "https://en.wikipedia.org/wiki/Siege_of_El_Fasher"}

  - id: battles-for-bara
    name: "Battles for Bara"
    conflict: sudan-saf-rsf
    tier: major
    start: "2025-10-25"
    end: "2026-07-27"
    place: "Bara, North Kordofan, Sudan"
    lat: 13.7
    lng: 30.37
    sides: ["SAF, Joint Forces and allied militias", "Rapid Support Forces"]
    outcome: "Changed hands repeatedly: RSF retook it in late Oct 2025 (more than 200 civilians reported killed), SAF briefly re-entered in Nov 2025 and on 5 Mar 2026, RSF returned on 16 Mar, and the SAF seized it with Um Sayala and Gebrat al-Sheikh in late July 2026."
    forces: "SAF and Joint Forces (SLM and JEM Zaghawa units), Sudan Shield Forces, al-Baraa bin Malik; RSF units including 'Unit 449' in 2025."
    losses: "More than 200 killed when the RSF retook Bara in Oct 2025 (Wikipedia timeline); RSF attacks on nearby villages killed at least 58 in mid-2026."
    significance: "Bara controls the northern approach to El Obeid; its capture in July 2026 opened a direct El Obeid to Khartoum road and broke the RSF ring (ACLED)."
    sources:
      - {label: "ACLED: Does the capture of Bara signal a turning point for the SAF?", url: "https://acleddata.com/expert-comment/does-capture-bara-signal-turning-point-saf"}
      - {label: "Wikipedia: Kordofan campaign", url: "https://en.wikipedia.org/wiki/Kordofan_campaign_(2023%E2%80%93present)"}

