  - id: ethiopia-tigray-war
    name: "Tigray war (Ethiopia vs TPLF, 2026)"
    type: civil-war
    intensity: high
    status: active
    started: "2026-01-29 (first major clashes since 2022; full-scale war from about 2026-09-22)"
    countries: [ETH, ERI]
    sides:
      - name: "Federal government and allies"
        members: ["Ethiopian National Defense Force (ENDF)", "Tigray Peace Force (TPF, federally backed ex-TDF fighters)", "Federal police", "Amhara militias (e.g. Tekeze Guard)", "Afar regional forces"]
        backers: ["United Arab Emirates (long-standing political and military partner of Abiy, per CTP)", "Turkey (drone supplier during the 2020 to 2022 war, per CTP)"]
        leaders: ["Abiy Ahmed (Prime Minister, reappointed 5 Oct 2026)", "Birhanu Jula (ENDF Chief of Staff)", "Getachew Reda (former Tigray interim leader, now federal minister and TPF patron)"]
        strength: "The TPF numbers up to several thousand fighters (CTP, Aug 2026); ENDF figures not public."
      - name: "TPLF and the Alliance for Survival"
        members: ["Tigray Defense Forces (TDF) under the TPLF", "Afar Revolutionary Democratic Unity Front (ARDUF)", "Amhara Fano National Movement (AFNM), allied", "Oromo Liberation Army (OLA), allied", "Sidama National Liberation Front (joined 24 Sep 2026)"]
        backers: ["Eritrea (political and financial backing; limited troop presence reported in October 2026; Eritrea denies)", "Sudan and Egypt (accused by Ethiopia's army chief; both deny)"]
        leaders: ["Debretsion Gebremichael (TPLF chairman, reselected regional president May 2026)", "Tadesse Werede (Tigrayan military leader and former interim president)", "Zemene Kassie (AFNM leader, alliance partner)"]
        strength: "About 274,000 Tigrayan fighters registered for demobilisation after 2022, of whom about 63,000 completed it before the process froze (IndraStra citing official data)."
    summary: "The 2022 Pretoria peace deal that ended Ethiopia's Tigray war unravelled in 2026. After months of clashes, a TPLF-led coalition launched offensives in late September; the federal army and an allied Tigrayan militia counterattacked, took Mekelle on 3 October without a fight and advanced to the edge of Adigrat near the Eritrean border."
    background: "The 2020 to 2022 Tigray war killed hundreds of thousands and ended with the Pretoria agreement of 2 November 2022. The TPLF never fully disarmed and split: in March 2025 the faction led by Debretsion Gebremichael ousted the federally appointed interim administration of Getachew Reda, and in May 2025 the election board revoked the TPLF's registration. Several thousand fighters broke away to form the Tigray Peace Force, which Addis Ababa backs.\n\nRelations between Ethiopia and Eritrea, allies during the last war, collapsed over Abiy Ahmed's demand for Red Sea access, and Eritrea moved closer to the TPLF. That realignment matters because it turns a regional insurgency into a possible interstate war."
    year: "Ethiopian drones struck Tigrayan forces for the first time since the war in November 2025. On 29 January 2026 fighting broke out in Tselemti in western Tigray, and Tigrayan forces briefly took Alamata and Korem before pulling back on 1 February. In April Addis Ababa extended the interim administration's mandate; in May the TPLF restored its pre-war regional council and reinstated Debretsion as president, and in June it enacted conscription. Tigray was excluded from the 1 June national election.\n\nOn 1 August the army and Amhara militia fought TPLF units near Humera, with both sides using artillery and drones. Clashes, strikes on Mekelle and AU mediation by Olusegun Obasanjo followed through August. Fano leader Zemene Kassie confirmed a coalition with the TPLF and the OLA, and Eritrea reportedly moved armour into southern Tigray.\n\nAround 22 September the 'Alliance for Survival' attacked into Afar (Abala, Erebti) and down the A2 highway into Amhara (Kobo, Sekota). On 27 September strikes hit the Ethiopian Air Force headquarters at Bishoftu and Kombolcha airport. The army halted the push, retook Sekota and Alamata, then on 3 October entered Mekelle after the TDF withdrew. By 9 October federal forces held Wukro, Hagere Selam, Abiy Addi and Shire and had reached the outskirts of Adigrat. Ethiopia and Eritrea broke relations on 1 October, and Eritrean troops reported near Adigrat on 7 October pulled back after Ethiopian drone strikes.\n\nThe TDF then gave up the north almost without a fight. Federal forces entered Adigrat on the night of 9 to 10 October, Adwa and Enticho on 11 October and Axum on 12 October, and pushed about 23 miles north from Adigrat to the Eritrean border at Zalambessa. Ethiopian drones struck suspected Eritrean and TDF forces near Adigrat again on 10 October. On 12 October former interim president Tadesse Werede and other TPLF dissidents escaped TDF custody near Rama and reached Mekelle. Addis Ababa announced that Tigray will be run by a federal command post and interim administration for six months, followed by elections."
    situation: "As of mid to late October 2026, federal forces and the Tigray Peace Force control Mekelle, southern Tigray, Shire, Axum, Adwa and Adigrat and have reached the Eritrean border at Zalambessa, and were advancing toward Sheraro. Remaining TDF units hold pockets around Cherseber, Debre Damo, Fatsi, Fiya Keshi and Sebeya near the border, some fighters have crossed into Eritrea, and TPLF leaders were last reported in Ahferom district. Eritrean troops have left Adigrat but remain around Zalambessa and Badme (AFP, 18 Oct). Tigray is under a six-month federal interim administration, and residents report collapsed policing and severe hunger. Fano continues to attack federal supply lines in Amhara."
    technical:
      - "Federal advance axes in October 2026: eastern from Afar to Mekelle; southern up the A2 from Alamata; central along the C23 to Hagere Selam and Abiy Addi; northern up the A2 to Wukro, Atsbi and Idaga Hamus; western across the Tekeze toward Shire."
      - "Drones are central: CTP assesses that improved Ethiopian drone capability is one reason the TPLF is weaker than in 2020 to 2022. ENDF strikes hit Adigrat, Adwa, Axum, Shire, Rama, Irob and Mekelle."
      - "Adwa and Sheraro air strikes on the night of 4 to 5 October 2026 killed nine and eight people respectively (Reuters, citing a humanitarian bulletin)."
      - "Strikes on 27 Sep 2026 hit Harar Meda Air Base at Bishoftu, Ethiopian Air Force headquarters about 35 miles southeast of Addis Ababa, killing several soldiers; Kombolcha airport was also hit. No group claimed them."
      - "TPLF one-way attack drones were claimed for the first time during the 1 Aug 2026 Humera fighting (unverified by CTP)."
      - "TPLF 'Army 70' units based in eastern Sudan took part in the Aug 2026 fighting near Humera, according to CTP."
      - "Hagere Selam changed hands four times between 4 and 6 October 2026."
      - "The TPF is Addis Ababa's main ground partner in Tigray and called on TDF fighters to surrender on 5 October."
      - "Fuel is a constraint: Ethiopia imports about 50% of its fuel from Kuwait and 38% from Saudi Arabia, routes disrupted by the Houthi blockade (CTP)."
      - "Intra-coalition friction: clashes between the TPF and the Amhara Raya Zeb militia near Alamata killed more than 20 in early October."
    casualties: "No aggregate count. Specific reports include 9 killed in Adwa and 8 in Sheraro (4 to 5 Oct 2026, Reuters), more than 10 in a drone strike on Alamata market (late Sep, pro-Fano claim) and more than 20 in TPF and Raya Zeb clashes (early Oct). Claims of 500 and 1,000 casualties in the 1 August Humera fighting are unverified. For scale, the 2020 to 2022 Tigray war reportedly killed about 600,000 people (AFP), which is why a return to full war is so feared."
    displaced: "Ethiopia had 1,919,993 IDPs as of 31 Aug 2026 (UNHCR), mostly from earlier conflicts and disasters; new displacement since late September 2026 has not been reliably counted (IndraStra)."
    zones:
      - {name: "Border-district TDF pockets (Ahferom, Rama, Fatsi) (approx)", lat: 14.42, lng: 39.1, radius_km: 45, note: "Where TDF remnants and TPLF leaders fell back after losing Adwa and Adigrat (10 to 11 Oct 2026); some crossed into Eritrea."}
      - {name: "Adwa and Axum", lat: 14.14, lng: 38.8, radius_km: 25, note: "Hit by federal air strikes in early October; entered by federal forces on 11 and 12 Oct 2026."}
      - {name: "Mekelle", lat: 13.5, lng: 39.48, radius_km: 25, note: "Taken by the ENDF and TPF on 3 Oct 2026 without significant resistance; seat of the new federal interim administration."}
      - {name: "Adigrat and Zalambessa", lat: 14.4, lng: 39.43, radius_km: 30, note: "Federal forces entered Adigrat on 10 Oct and reached the Eritrean border at Zalambessa on 12 Oct 2026."}
      - {name: "Southern Tigray / Raya", lat: 12.42, lng: 39.55, radius_km: 40, note: "Alamata and Korem; contested by TPF and Amhara militias."}
      - {name: "Western Tigray / Humera", lat: 14.1, lng: 36.9, radius_km: 70, note: "Amhara-administered and ENDF-held; site of the 1 Aug 2026 fighting."}
      - {name: "Afar front (Abala, Erebti)", lat: 13.5, lng: 40.0, radius_km: 60, note: "ARDUF and TDF offensive in late Sep 2026."}
    timeline:
      - {date: "2026-01-29", event: "Clashes in Tselemti, western Tigray; flights to Tigray suspended."}
      - {date: "2026-01-30", event: "Tigrayan forces take Alamata and Korem."}
      - {date: "2026-02-01", event: "Tigrayan forces withdraw from Tselemti."}
      - {date: "2026-05-05", event: "Restored pre-war Tigray council reselects Debretsion Gebremichael as president."}
      - {date: "2026-08-01", event: "ENDF and TPLF fight near Humera and Shererina."}
      - {date: "2026-08-24", event: "AU envoy Obasanjo meets Debretsion."}
      - {date: "2026-09-22", event: "Alliance for Survival offensive takes Abala in Afar."}
      - {date: "2026-09-27", event: "Strikes hit Bishoftu air base and Kombolcha airport; ENDF retakes Sekota."}
      - {date: "2026-10-01", event: "Ethiopia expels Eritrean diplomats and closes its embassy; Eritrea cuts ties."}
      - {date: "2026-10-03", event: "ENDF and TPF take Mekelle."}
      - {date: "2026-10-07", event: "Eritrean troops reported near Adigrat; Ethiopian drone strike hits an Eritrean truck; ENDF takes Wukro."}
      - {date: "2026-10-08", event: "Federal forces enter Shire."}
      - {date: "2026-10-10", event: "Federal forces and the TPF enter Adigrat without resistance; drone strikes hit suspected Eritrean and TDF forces nearby."}
      - {date: "2026-10-11", event: "Federal forces enter Adwa and Enticho after TDF withdrawal; Getachew Reda announces six months of federal command-post rule."}
      - {date: "2026-10-12", event: "Federal forces take Axum and reach the Eritrean border at Zalambessa; Tadesse Werede escapes TDF custody to Mekelle."}
      - {date: "2026-10-16", event: "Government announces a six-month interim administration for Tigray leading to elections."}
    outlook: "The conventional phase looks largely over, so watch whether the TDF shifts to guerrilla war from the border districts as it did in 2021, whether the federal interim administration and the TPF can restore policing and aid, and whether Eritrea, which still has troops at Zalambessa and Badme, escalates. Tensions between the TPF and Amhara militias over disputed land could break the federal coalition."
    sources:
      - {label: "Critical Threats: Ethiopia War Security Review (29 Sep 2026)", url: "https://www.criticalthreats.org/briefs/ethiopia-war-security-review/ethiopia-war-security-review-september-29-2026"}
      - {label: "Critical Threats: Ethiopia War Security Review (6 Oct 2026)", url: "https://www.criticalthreats.org/briefs/ethiopia-war-security-review/october-6-2026"}
      - {label: "Critical Threats: Ethiopia War Security Review (9 Oct 2026)", url: "https://www.criticalthreats.org/print/brf_6ac94ee9d6e71"}
