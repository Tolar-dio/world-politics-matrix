  - id: ethiopia-oromia-ola
    name: "OLA insurgency in Oromia"
    type: insurgency
    intensity: medium
    status: active
    started: "2018-01-01 (approximate; OLA armed struggle after the split from the OLF)"
    countries: [ETH]
    sides:
      - name: "Federal and Oromia regional government"
        members: ["ENDF", "Oromia regional special and riot police", "Kebele militias"]
        backers: []
        leaders: ["Abiy Ahmed (Prime Minister)"]
        strength: "Not public."
      - name: "Oromo Liberation Army (OLA / OLF-Shane)"
        members: ["OLA zonal commands in Wollega, Shewa, Guji and Arsi"]
        backers: []
        leaders: []
        strength: "No reliable figure found."
    summary: "The Oromo Liberation Army fights a long-running insurgency in Oromia, Ethiopia's most populous region. In 2026 it imposed road closures around the election and joined the TPLF-Fano 'Alliance for Survival', though some OLA factions reportedly work with the government."
    background: "The OLA, which the government calls OLF-Shane, operates mostly in western Oromia (Wollega) and parts of central and southern Oromia. Peace talks with the government have repeatedly failed. Violence in Oromia has included killings of civilians by several armed actors, and the Arsi zone has seen repeated attacks on Orthodox Christian residents since 2023.\n\nThe OLA matters to the wider picture because its participation in the Alliance for Survival makes the 2026 crisis a multi-front challenge to Addis Ababa rather than a single regional rebellion."
    year: "The OLA imposed a road closure from 29 May to 4 June 2026 and fought security forces eight times on election day, mostly in East Wollega. On 31 May an attack in Aseko woreda, Arsi, burned the 101-year-old Teleta St. Gebrael church, and more than 200 Orthodox Christian properties were destroyed in Arsi on election day (ACLED attributes the Arsi attack to OLA/OLF-Shane). In August OLA and Fano factions clashed in Oromia. In September the OLA was named as a member of the Alliance for Survival."
    situation: "As of October 2026 the OLA remains active in Wollega and central Oromia, aligned on paper with the TPLF and Fano, but no major OLA offensive tied to the Tigray war was reported in the sources reviewed."
    technical:
      - "ACLED recorded eight OLA clashes with security forces on 1 June 2026, concentrated in East Wollega."
      - "ACLED records 159 incidents of civilian targeting in Arsi zone since February 2023, over a third aimed at Orthodox Christians."
      - "Road closures are a standard OLA tactic, used from 29 May to 4 June 2026."
    casualties: "No total found for the review period; 'medium' intensity is an estimate."
    displaced: "Included in Ethiopia's national IDP figure (UNHCR, 31 Aug 2026)."
    zones:
      - {name: "Wollega (western Oromia)", lat: 9.1, lng: 36.3, radius_km: 130, note: "Core OLA operating area; election-day clashes in East Wollega."}
      - {name: "Arsi zone (approx)", lat: 7.8, lng: 39.4, radius_km: 70, note: "Attacks on Orthodox Christian communities, including on election day 2026."}
    timeline:
      - {date: "2026-05-29", event: "OLA road closure begins, running to 4 June."}
      - {date: "2026-05-31", event: "Attack in Aseko woreda, Arsi burns a 101-year-old church."}
      - {date: "2026-06-01", event: "Eight OLA clashes on election day."}
    outlook: "Watch whether the OLA opens a real front in support of the TPLF and Fano or continues to fragment, with some factions cooperating with the government."
    sources:
      - {label: "ACLED: Did Ethiopia's elections worsen existing conflicts? (10 Jun 2026)", url: "https://acleddata.com/expert-comment/did-ethiopias-elections-worsen-existing-conflicts"}
