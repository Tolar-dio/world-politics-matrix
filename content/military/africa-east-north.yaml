# East and North Africa armed conflicts, state as of late October 2026.
# Coordinates: decimal degrees, town-level, rounded; entries marked "approx" are locality-level estimates.
# Zones are approximate circles for map display, not precise lines of control.
conflicts:
  - id: sudan-saf-rsf
    name: "Sudan war (SAF vs RSF)"
    type: civil-war
    intensity: high
    status: active
    started: "2023-04-15 (current phase: Kordofan war after the fall of El Fasher on 2025-10-26)"
    countries: [SDN, SSD, TCD]
    sides:
      - name: "Sudanese Armed Forces and allies"
        members: ["Sudanese Armed Forces (SAF)", "Joint Forces of Darfur armed movements (SLM-Minnawi, JEM)", "Sudan Shield Forces (Abu Aqla Keikel)", "Popular Resistance volunteers", "al-Baraa bin Malik Brigade", "Central Reserve Forces"]
        backers: ["Egypt (political support; NYT reported drones flown from an Egyptian Western Desert base against RSF targets since mid-2025)", "Turkey (Bayraktar TB2 package sold by Baykar in 2023)", "Saudi Arabia (political and financial support)", "Qatar (reported delivery of Chinese-made warplanes, 2025)", "Iran (drones, per BBC 2024)", "Russia (weapons and components since mid-2024)", "Eritrea (support on the eastern border)", "Pakistan (Mohafiz-V armoured cars delivered Aug 2026)"]
        leaders: ["Abdel Fattah al-Burhan (SAF commander-in-chief, Sovereignty Council chair)", "Yasser al-Atta (SAF Chief of Staff from 2026)", "Shams El Din Kabashi (deputy commander, oversaw Kordofan operations in 2025)", "Malik Agar (Sovereignty Council deputy)", "Kamil Idris (Prime Minister)", "Minni Minnawi (SLM, Joint Forces)", "Gibril Ibrahim (JEM, Finance Minister)"]
        strength: "SAF stated about 120,000 personnel in April 2023 (Wikipedia infobox); no reliable current figure including allied militias."
      - name: "Rapid Support Forces and Tasis alliance"
        members: ["Rapid Support Forces (RSF)", "SPLM-N (al-Hilu) in South Kordofan and Blue Nile", "Tasis / Sudan Founding Alliance armed factions", "Arab tribal militias in Darfur and Kordofan", "Colombian contractors (alleged 'Desert Wolves' unit)"]
        backers: ["United Arab Emirates (alleged arms, drones, armoured vehicles and logistics via Chad and Puntland; the UAE denies)", "Ethiopia (alleged RSF training camp in Benishangul-Gumuz and drone basing at Asosa, Reuters Feb 2026; not confirmed by Ethiopia)", "Haftar's Libyan National Army (historic logistics through southeastern Libya; denies)", "Kenya (hosted the Tasis charter conference; Kenyan-labelled crates found in an RSF depot per Bellingcat; Kenya denies)"]
        leaders: ["Mohamed Hamdan Dagalo 'Hemedti' (RSF commander, chair of the GPU presidential council)", "Abdul Rahim Dagalo (RSF deputy commander, GPU defence minister)", "Abdelaziz al-Hilu (SPLM-N leader, GPU vice-chair)", "Mohammed Hassan al-Ta'ishi (GPU prime minister)"]
        strength: "Hemedti claimed 450,000 fighters in 2026 (Wikipedia infobox); no independent estimate found."
    summary: "Sudan's army and the paramilitary Rapid Support Forces have fought since April 2023 in what the UN calls the world's largest humanitarian crisis. After the RSF captured El Fasher in October 2025 and completed its hold on Darfur, the war moved into Kordofan, where the army counterattacked from July 2026 and broke the RSF ring around El Obeid. Both sides now rely heavily on drones, which the UN says caused most civilian deaths in 2026."
    background: "The war began on 15 April 2023 when a power struggle between army chief Abdel Fattah al-Burhan and RSF commander Mohamed Hamdan Dagalo (Hemedti) over integrating the RSF into the army turned into fighting in Khartoum. The RSF grew out of the Janjaweed militias that the Bashir government armed in Darfur, and it was formalized in 2013. In March 2025 the army retook the presidential palace and declared Khartoum liberated, and the RSF consolidated in the west.\n\nIn February 2025 the RSF and the SPLM-N faction of Abdelaziz al-Hilu signed a charter in Nairobi for a rival 'Government of Peace and Unity', whose leadership was named in July 2025 with Hemedti as chair and headquarters in Nyala. That split matters because it gives the de facto east/west division of the country a political shape, and because both governments now compete for aid channels, currency and recognition."
    year: "On 26 October 2025 the RSF overran the army's 6th Infantry Division headquarters in El Fasher after an 18-month siege. Senior officers had left two days earlier; many of those left behind were killed while fleeing. Sudan War Monitor estimated at least 3,000 dead in the first days, the WHO cited reports of more than 460 people killed at the Saudi Maternity Hospital, and a UN mission later said the assault bore 'hallmarks of genocide'. The fall gave the RSF all five Darfur state capitals.\n\nThe RSF then pushed east into Kordofan. It retook Bara in late October 2025, overran the army's 22nd Infantry Division at Babanusa on 1 December, and seized the Heglig oilfield on 8 December, after which South Sudanese troops deployed to guard it under a three-way arrangement. A drone strike blamed on the RSF killed at least 116 people, including 43 children, in Kalogi on 4 December. The army answered by breaking the sieges of Dilling (late January 2026) and Kadugli (early February), though the RSF re-encircled Kadugli within weeks. Bara changed hands again in March.\n\nThrough mid-2026 the RSF tried to strangle El Obeid, the army's main base in Kordofan, with ground pressure from Bara, Umm Sumeima and Kazgil and record drone strikes on its power and water systems. It also opened a southeastern front in Blue Nile with the SPLM-N, taking Kurmuk in March, losing it in July and retaking it in August. In late July the army seized Bara, Um Sayala and the RSF depot at Gebrat al-Sheikh, opening a direct road from El Obeid to Khartoum. ACLED called it the start of a 'third phase' of the war. By early October the army had pushed west through Hamrat al-Wiz and Sodari to Al-Mazroub.\n\nThe air war intensified on both sides. The UN counted more than 1,000 civilians killed by drones from January to May 2026 and at least 306 from 1 to 21 October. On 18 October a double-tap strike on a truck in Dibab, West Kordofan killed at least 139, and on 19 October a strike on Amiet market in the disputed Abyei area killed 153 according to local officials. South Sudan blamed the army, which denied involvement."
    updated: '2026-10-28'
    situation: "As of late October 2026 the country is roughly split. The RSF and its allies hold the four southern and western Darfur states, most of North Darfur, most of West Kordofan (Babanusa, En Nahud, Abu Zabad, Al Khuwei) and positions in South Kordofan and Blue Nile. The army holds the Nile valley, the east and centre, Khartoum (where the government returned in January 2026), El Obeid and most of North Kordofan. Kadugli and Dilling remain army-held but under pressure, and Kurmuk in Blue Nile is RSF-held after repeated swaps. No ceasefire is in place; US-led Quad diplomacy has produced a draft humanitarian truce text but no agreement, and drone strikes on markets, power stations and transport are now the main killer of civilians. On 26 and 27 October RSF drones hit at least five power stations and the Al-Markhiyat transformer station, cutting power across Al-Jazira, White Nile, Sennar, Gedaref, Khartoum and parts of the east, while a drone strike on a market in RSF-held Nyala killed at least 21 people according to a hospital medic quoted by AFP."
    technical:
      - "Drone tempo: ACLED counted 44 RSF drone-strike events nationally in June 2026 and 25 in July; Sheikan locality (El Obeid) alone saw 27 drone strikes in June 2026, the most of the war there."
      - "UN figures: more than 1,000 civilians killed by drones January to May 2026, and at least 306 from 1 to 21 October 2026; the UN rights chief says drones now cause most conflict-related civilian deaths."
      - "Double-tap strikes are documented: the 18 Oct 2026 strike in Dibab, West Kordofan hit a transport truck twice (UN 139 dead, Reuters sources 145)."
      - "SAF drones: Baykar sold the SAF about $120M of equipment in 2023, including 6 Bayraktar TB2s, 3 ground control stations and 600 warheads (FDD report). Akinci losses have been claimed over Khuwai (Sep 2025) and Nyala airport (Jan 2026); neither claim is verified."
      - "Egypt: the New York Times (1 Feb 2026) reported drones launched from an air base in Egypt's Western Desert striking RSF targets since mid-2025."
      - "RSF logistics hub: Gebrat al-Sheikh held the RSF's main weapons and drone warehouses in North Kordofan until the SAF seized it in late July 2026 (ACLED)."
      - "Alleged RSF supply routes: UAE cargo flights via Amdjarass in Chad, Bosaso airport in Puntland, southeastern Libya under Haftar's LNA, and a camp in Benishangul-Gumuz, Ethiopia linked to drone infrastructure at Asosa airport (Reuters, Feb 2026). All named governments deny."
      - "Armour: Sudan's Oct 2025 UN submission linked UK-made Cummins engines in Emirati Nimr APCs (Edge Group) to RSF use; Amnesty documented recently made UAE APCs with the RSF in 2024."
      - "Foreign fighters: Colombian contractors reportedly operated RSF drones and artillery and formed a 'Desert Wolves' unit; Colombia says at least 40 Colombians were killed in 2025 airstrikes in Darfur."
      - "Garrisons lost: SAF 6th Infantry Division (El Fasher, 26 Oct 2025) and 22nd Infantry Division (Babanusa, 1 Dec 2025). The 22nd Division commander, Maj. Gen. Abdelmajid al-Haj, was reportedly killed in an ambush while retreating toward Heglig."
      - "Strategic targets struck by RSF drones: Port Sudan fuel depots, port and airport (from May 2025); Khartoum airport, Merowe dam (attack intercepted 5 Jan 2026), Kosti fuel stations, Kenana sugar factory at Rabak, Atbara, Ad-Damazin and power stations at El Obeid and Tendalti."
      - "SAF air and drone strikes on RSF-held towns killed civilians at Ed Daein hospital (70 reported), a wedding in Kutum (58+), Abu Zabad and Nyala; the RSF says strikes on Al Zorg, Hemedti's home town, killed up to 64 civilians on 3 Jan 2026."
      - "Procurement: a reported Pakistan deal for 10 K-8 jets and 200+ drones (Reuters, Jan 2026) was on hold by April 2026 after Saudi objections; about 100 Mohafiz-V armoured cars arrived in August 2026. Qatar reportedly supplied at least six Chinese warplanes in 2025."
      - "ACLED Kordofan data (15 Apr 2023 to 19 Sep 2026): about 2,878 attacks including Abyei and at least 12,314 reported fatalities; of attributed attacks, 46% by the SAF and 32% by the RSF."
      - "RSF cohesion is fraying: intra-RSF fighting in East Darfur (Feb 2026), the defection of commander al-Nour al-Qubba, about 300 fighters defecting at al-Dabbah and 265 from Suleiman Sandal's faction."
      - "Cross-border spillover: an RSF raid on Chad's Birak garrison killed 7 Chadian soldiers (16 Jan 2026); a later strike on Tine, Chad killed 17 and Chad closed its border."
      - "Drone swarms and air defence: during RSF drone waves on 12 to 13 Aug 2026 an army source claimed more than 35 drones downed in one day over Atbara, Al-Damar and El Obeid, then 10 over Omdurman, 3 in River Nile and 5 in South Kordofan the next day (The EastAfrican; unverified)."
      - "Ground mass still matters: the army said it repelled an RSF counterattack on Gebrat al-Sheikh by more than 250 combat vehicles in August 2026."
      - "Ethiopian staging area: a Yale Humanitarian Research Lab alert (28 Aug 2026) found about 100 new light technicals, about 15 APC-type vehicles and 75+ cargo containers at an ENDF base in Asosa, enough for a regiment to brigade-size force of 750 to 1,000; Sudan accuses Ethiopia of enabling UAE support to the RSF in Blue Nile, which Ethiopia and the UAE deny."
      - "Blue Nile garrisons: the SAF 4th Infantry Division holds Ad-Damazin; the RSF and SPLM-N claimed the Bakori and Sorkam bases and Geissan town (Aug to Sep 2026); Joint Force reinforcements reached Ad-Damazin on 1 Sep 2026."
    casualties: "No reliable total exists. ACLED counts at least 59,000 reported deaths over the first three years and says the real toll is almost certainly higher (AP, June 2026). Estimates cited on Wikipedia for total deaths, including hunger and disease, range from 150,000 to 400,000. ACLED records at least 12,314 reported fatalities in Kordofan alone to 19 Sep 2026. The fall of El Fasher killed at least 3,000 by Sudan War Monitor's early estimate, with much higher estimates disputed. The UN says drones killed more than 1,000 civilians from January to May 2026 and at least 306 from 1 to 21 October 2026."
    displaced: "More than 14 million people displaced, including about 4.5 million refugees (UN figures cited on Wikipedia, 6 Jul 2026). About 8.6 million remain internally displaced, down from a peak of 11.6 million in January 2025, and about 5.1 million had returned by August 2026, 2.7 million of them to Khartoum (UN via Al Jazeera, Oct 2026). IOM recorded new displacement in Kordofan rising from 132,000 in February to 219,000 by late June 2026. The IPC confirmed famine in El Fasher (Nov 2025) and parts of the Nuba Mountains (Dec 2025); about 34 million people need aid. A February 2026 IPC update put more than 21 million people in crisis-level hunger or worse (IPC Phase 3+), with acute malnutrition far above famine thresholds in Um Baru (52.9%) and Kernoi (34%) in North Darfur and 4.2 million expected acute malnutrition cases in 2026 (Mercy Corps summary of the IPC). Fighting around Geissan in Blue Nile displaced about 2,500 people in August 2026, some into Ethiopia (IOM)."
    zones:
      - {name: "Darfur (RSF-held)", lat: 13.0, lng: 24.5, radius_km: 420, note: "RSF holds all five Darfur state capitals since El Fasher fell on 26 Oct 2025; SAF and allied drone strikes hit Nyala, Ed Daein, Kutum and Zalingei."}
      - {name: "Nyala (seat of the RSF-led government)", lat: 12.05, lng: 24.88, radius_km: 25, note: "Headquarters of the Government of Peace and Unity; frequent SAF drone target."}
      - {name: "El Fasher and Tawila corridor", lat: 13.63, lng: 25.35, radius_km: 60, note: "Captured by the RSF on 26 Oct 2025; survivors fled about 60 km west to Tawila. IPC confirmed famine here in Nov 2025."}
      - {name: "Tina and Kornoi border pocket (approx)", lat: 15.0, lng: 22.9, radius_km: 70, note: "Remaining SAF and Joint Force positions near the Chad border after El Fasher; RSF raids spilled into Chad."}
      - {name: "El Obeid (SAF bastion)", lat: 13.18, lng: 30.22, radius_km: 35, note: "SAF 5th Infantry Division and airbase; about 500,000 people. RSF ring broken in late July 2026 but drone strikes continue."}
      - {name: "North Kordofan contested belt", lat: 14.0, lng: 29.6, radius_km: 140, note: "Bara, Sodari, Hamrat al-Wiz and Al-Mazroub; SAF advancing west since late July 2026."}
      - {name: "West Kordofan (RSF-held)", lat: 11.8, lng: 28.2, radius_km: 170, note: "Babanusa, En Nahud, Al Khuwei, Abu Zabad and El Fula; RSF rear area and target of SAF drones."}
      - {name: "Nuba Mountains / South Kordofan", lat: 11.4, lng: 29.9, radius_km: 110, note: "SAF holds Kadugli and Dilling under pressure; SPLM-N (al-Hilu) holds Kauda and pockets; famine declared in parts in Dec 2025."}
      - {name: "Heglig oilfield (approx)", lat: 10.0, lng: 29.4, radius_km: 35, note: "Seized by the RSF on 8 Dec 2025, then secured by South Sudanese troops under a three-way arrangement."}
      - {name: "Blue Nile front", lat: 10.9, lng: 34.2, radius_km: 110, note: "Kurmuk, Geissan, Deim Mansour and Ad-Damazin; RSF and SPLM-N offensives reportedly staged from Ethiopia."}
      - {name: "Khartoum", lat: 15.55, lng: 32.53, radius_km: 35, note: "SAF-held since March 2025; government returned in Jan 2026; airport and power stations hit by drones."}
      - {name: "Port Sudan", lat: 19.62, lng: 37.22, radius_km: 20, note: "Wartime seat of government and main port; RSF drone strikes on fuel depots, port and airport since May 2025."}
      - {name: "Abyei", lat: 9.6, lng: 28.44, radius_km: 40, note: "Disputed with South Sudan; Amiet market strike on 19 Oct 2026 killed 153 per local officials."}
    timeline:
      - {date: "2025-10-26", event: "RSF captures the SAF 6th Infantry Division headquarters in El Fasher; mass killings of fleeing civilians and fighters follow."}
      - {date: "2025-11-04", event: "IPC Famine Review Committee finds reasonable evidence of famine in El Fasher."}
      - {date: "2025-11-16", event: "SAF retakes Kazgil and Um Dam Haj Ahmed in North Kordofan."}
      - {date: "2025-12-01", event: "RSF overruns the SAF 22nd Infantry Division in Babanusa after a siege dating to January 2024."}
      - {date: "2025-12-04", event: "Drone strike blamed on the RSF kills at least 116, including 43 children, in Kalogi, South Kordofan."}
      - {date: "2025-12-08", event: "RSF seizes the Heglig oilfield; South Sudanese troops later deploy to secure it."}
      - {date: "2026-01-11", event: "Government announces its return to Khartoum from Port Sudan."}
      - {date: "2026-01-12", event: "RSF drone strike on an army base in Singa kills at least 27 during a meeting of three state governors."}
      - {date: "2026-01-26", event: "SAF announces it has lifted the siege of Dilling."}
      - {date: "2026-02-03", event: "SAF breaks the siege of Kadugli; the same week RSF and SPLM-N seize Deim Mansour near Kurmuk in Blue Nile."}
      - {date: "2026-02-04", event: "US adviser Massad Boulos says the Quad has agreed a truce document acceptable to both sides; fighting continues."}
      - {date: "2026-03-16", event: "RSF reoccupies Bara after the SAF retook it on 5 March."}
      - {date: "2026-03-24", event: "Tasis alliance announces control of Kurmuk, Blue Nile."}
      - {date: "2026-06-30", event: "ACLED reports record drone strikes on El Obeid, encircled from the north, west and south."}
      - {date: "2026-07-27", event: "ACLED reports SAF capture of Bara, Um Sayala and Gebrat al-Sheikh, opening a new El Obeid to Khartoum route."}
      - {date: "2026-08-12", event: "RSF drone waves hit Khartoum, El Obeid, Kadugli, Atbara and Al-Damar; RSF and SPLM-N attack Geissan in Blue Nile."}
      - {date: "2026-08-14", event: "RSF claims full control of Geissan near the Ethiopian border; the army says fighting continues."}
      - {date: "2026-08-22", event: "RSF retakes Kurmuk after the SAF recaptured it in July."}
      - {date: "2026-08-28", event: "Yale HRL reports a military buildup at the Ethiopian army base in Asosa near Blue Nile."}
      - {date: "2026-09-25", event: "SAF regains full control of Sodari in western North Kordofan."}
      - {date: "2026-10-02", event: "SAF recaptures Al-Mazroub."}
      - {date: "2026-10-04", event: "Burhan joins Egypt, Eritrea and Somalia in the El Alamein declaration condemning parallel entities in Sudan."}
      - {date: "2026-10-18", event: "Double-tap drone strike on a truck in Dibab, West Kordofan kills at least 139 (UN)."}
      - {date: "2026-10-19", event: "Drone strike on Amiet market in Abyei kills 153 per local officials; South Sudan blames the SAF, which denies it."}
      - date: '2026-10-26'
        event: "RSF drones knock out power stations in Al-Jazira, Gedaref and White Nile, then the Al-Markhiyat transformer station serving Khartoum on 27 October; a strike on a Nyala market kills at least 21 (AFP)."
    outlook: "Watch whether the SAF pushes from North Kordofan into West Kordofan toward En Nahud and Babanusa before the RSF can regroup, and whether the RSF answers with a renewed push on El Obeid, Kadugli or Blue Nile. The drone war on cities and markets is likely to keep rising. Diplomatically, the Quad and Quintet are pursuing a humanitarian truce and a prisoner exchange, but sticking points include RSF withdrawal from cities, rival aid bodies and oil transit revenue. The Ethiopian war in Tigray adds a new risk: Addis Ababa accuses Sudan of backing the TPLF, while Khartoum accuses Ethiopia of backing the RSF."
