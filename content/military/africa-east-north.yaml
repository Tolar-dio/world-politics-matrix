      - {label: "IndraStra: Tigray's war and Ethiopia's Red Sea gamble (9 Oct 2026)", url: "https://www.indrastra.com/2026/10/tigrays-war-and-ethiopias-red-sea.html"}
      - {label: "Wikipedia: Ethiopia-TPLF clashes (2026 to present)", url: "https://en.wikipedia.org/wiki/Ethiopia-TPLF_clashes_(2026%E2%80%93present)"}
      - {label: "Critical Threats: Ethiopia War Security Review (13 Oct 2026)", url: "https://www.criticalthreats.org/print/brf_6aceabd6a3cfa"}
      - {label: "Al Jazeera: Ethiopian forces enter strategic Tigray town of Adwa (12 Oct 2026)", url: "https://www.aljazeera.com/news/2026/10/12/ethiopian-troops-capture-adwa-without-a-fight-witnesses-say"}
      - {label: "Dawan Africa: Tigray Peace Forces claim control of Adigrat (11 Oct 2026)", url: "https://www.dawan.africa/news/tigray-peace-forces-claim-control-of-adigrat-amid-renewed-fighting"}
