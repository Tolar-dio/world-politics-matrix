# Corrections log. Every time the site fixes something it had published wrong,
# add an entry at the top. See UPDATING.md ("Verification pass").
#
# - date: "2026-11-15"            the day the correction was published
#   where: {type: country, id: BFA}   country | conflict | battle | news | base, with its id
#   what: "One line naming the error"
#   was: "What the site said"
#   now: "What it says now"
#   why: "How the error happened, if known"
#   sources:
#     - {label: "Outlet: headline", url: "https://..."}

corrections:
  - date: "2026-11-21"
    where: {type: country, id: BRA}
    what: "Brazil's profile said Flávio Bolsonaro was still seeking to annul the 25 October runoff result"
    was: "He has petitioned to annul the result, while his Liberal Party has accepted it."
    now: "Bolsonaro first refused to concede, then withdrew his request to annul the vote and said he would lead the opposition."
    why: "The 28 October update did not catch that he had dropped the annulment request on 26 October."
    sources:
      - {label: "El País: Bolsonaro backtracks and says he will serve as Lula's opposition", url: "https://english.elpais.com/international/2026-10-27/bolsonaro-backtracks-and-says-he-will-serve-as-lulas-opposition.html"}

  - date: "2026-11-20"
    where: {type: news, id: ""}
    what: "The 19 November item on the Trump-Xi-Putin meeting in Shenzhen said no joint statement was released"
    was: "No joint statement, arms-cut targets or negotiating timetable was released."
    now: "The three leaders issued a four-point 'Declaration toward Peace' on UN reform, oil supply, the International Criminal Court and a dialogue on nuclear risks, with no arms-cut targets or timetable and no mention of Ukraine or Iran."
    why: "The item was written from early reports before the declaration was published by the White House, the Kremlin and Xinhua."
    sources:
      - {label: "The White House: U.S.-Russia-China Heads of State Declaration toward Peace", url: "https://www.whitehouse.gov/briefings-statements/2026/11/u-s-russia-china-heads-of-state-declaration-toward-peace/"}
      - {label: "Xinhua: Full text: China-Russia-U.S. Heads of State Declaration toward Peace", url: "https://english.news.cn/20261119/c15631ea3f054a278e3a3f592021f0da/c.html"}

  - date: "2026-11-16"
    where: {type: news, id: ""}
    what: "The 10 November item on a ship attacked in UAE waters, and the Iran war and Hormuz conflict texts, said ADNOC confirmed the damaged vessel was its own"
    was: "ADNOC Logistics and Services said one of its vessels was damaged in an attack in UAE territorial waters."
    now: "An Emirati ship was attacked and damaged in UAE territorial waters, and ADNOC Logistics and Services said response efforts were under way, without confirming the ship was its own."
    why: "The source's wording was overstated when summarised; found in today's verification pass."
    sources:
      - {label: "The National: UAE ship attacked and damaged in Arabian Gulf", url: "https://www.thenationalnews.com/business/energy/2026/11/10/uae-ship-attacked-and-damaged-in-arabian-gulf/"}

  - date: "2026-11-16"
    where: {type: conflict, id: yemen-civil-war}
    what: "Yemen conflict said the Houthis held the whole Red Sea coast to Bab al-Mandeb, missing the government's October recapture of Dhubab"
    was: "The Houthis hold the whole Red Sea coast to Bab al-Mandeb and Perim Island."
    now: "The Houthis took the coast in September; government forces retook Dhubab and nearby areas north of the strait in early October, then announced a withdrawal from Dhubab and the Bab al-Mandeb area on 15 November."
    why: "The October counter-offensive on the coast was not reflected when the situation text was rewritten."
    sources:
      - {label: "Times of Israel (AP): Saudi-backed Yemeni forces expel Houthis from areas around key strait", url: "https://www.timesofisrael.com/saudi-backed-yemeni-forces-expel-houthis-from-areas-around-key-strait-officials/amp/"}
      - {label: "The National: Yemen government forces' pullback hands Houthis greater leverage over Bab Al Mandeb", url: "https://www.thenationalnews.com/news/mena/2026/11/15/southern-yemeni-forces-withdraw-from-area-near-bab-al-mandab/"}

  - date: "2026-11-13"
    where: {type: country, id: LAO}
    what: "Laos profile named the wrong prime minister"
    was: "Sonexay Siphandone was still prime minister."
    now: "Saleumxay Kommasith, a former foreign minister, has been prime minister since the National Assembly elected him on 5 October 2026. Sonexay became president of the National Assembly."
    why: "The change of prime minister was missed when the profile was last checked."
    sources:
      - {label: "AP via Yahoo News: Laos names veteran diplomat as new prime minister", url: "https://ca.news.yahoo.com/laos-names-veteran-diplomat-international-150158451.html"}
      - {label: "KPL Lao News Agency: National Assembly elects new prime minister", url: "https://kpl.gov.la/en/detail.aspx?id=107889"}

  - date: "2026-11-04"
    where: {type: news, id: ""}
    what: "News item overstated what Trump said about military aid to Israel"
    was: "Trump said he and Netanyahu had agreed that Washington would end its roughly 4 billion dollars a year in military aid after 2026."
    now: "Trump told Fox News that aid 'gets cut off at the end of the year' but did not say which forms of aid would end or how; Israel did not confirm any deal, and the 2016 agreement and a 2020 law set aid levels to 2028."
    why: "The first version relied on a secondary roundup rather than the interview and wire reports."
    sources:
      - {label: "Fox News: Trump says US annual military aid to Israel ends by close of year", url: "https://www.foxnews.com/politics/trump-says-israel-stop-receiving-4b-us-aid-years-end-can-still-buy-weapons"}
      - {label: "ABC News: Trump says $4 billion in Israel military aid will end this year", url: "https://abcnews.com/Politics/trump-israel-aid-end-year-citing-political-reasons/story?id=137809564"}

